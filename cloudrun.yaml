# 微信云托管 (CloudRun) 部署配置
# Phase 0 spike 配置
# 详细文档: https://developers.weixin.qq.com/miniprogram/dev/wxcloudservice/wxcloudrun/src/

service:
  name: dizical-prod          # 服务名 (云托管控制台显示)
  region: ap-shanghai          # 跟 MySQL 同 region, 减少延迟
  description: "dizical 竹笛课程管理 - CloudRun spike"

# 容器配置
container:
  image: registry.cloudrun.com/dizical-prod:latest   # 镜像 (从 Dockerfile 构建后 push)
  port: 80                                            # uvicorn 监听端口
  cpu: 1                                              # 1 核
  memory: 2                                           # 2 GB 内存 (足够 12 张表 + 67 endpoint)

# 环境变量 (运行时注入, 不进镜像)
env:
  ENV: cloudrun                              # 标记是云端环境
  DATABASE_URL: sqlite:////tmp/dizical.db    # spike 阶段先用 SQLite, 验证跑通; Phase 1 改 MySQL
  JWT_SECRET: "spike-temp-secret-change-in-phase-1"  # 32+ 字符 (Phase 1 用强密钥)
  PYTHONUNBUFFERED: "1"                      # 日志实时输出 (CloudRun 控制台看)

# 扩缩容 (spike 阶段: 最省, Phase 1 再调)
scaling:
  min_instances: 0    # 无流量时缩到 0, 省费用 (spike 阶段够用)
  max_instances: 3    # 防止流量滥用
  target_cpu: 60      # CPU 60% 触发扩容

# 网络
network:
  public_access: true   # web / Mac app 走公网 HTTPS
  wechat_private: true  # 小程序走微信专线 (免鉴权)

# 健康检查 (匹配 Dockerfile 的 HEALTHCHECK)
healthcheck:
  path: /health
  initial_delay_seconds: 10
  period_seconds: 30
  timeout_seconds: 5
  failure_threshold: 3