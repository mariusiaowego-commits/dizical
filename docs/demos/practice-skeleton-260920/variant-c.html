<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>变体 C — 极简一屏 (dizical practice skeleton)</title>
<link rel="stylesheet" href="real-practice.css">
<style>
  body { background: #F8F9FA; }
  .demo-wrap { max-width: 744px; margin: 0 auto; padding: 14px; }
  /* 单行头部: 科目 + 今日分钟 */
  .demo-mini-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 4px; margin-bottom: 10px;
  }
  .demo-mini-pick {
    flex: 1; min-width: 0;
    background: #FFFFFF; border: 2px solid #E0E0E0; border-radius: 12px;
    padding: 10px 14px; cursor: pointer;
    font-size: 15px; color: #555;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .demo-mini-pick.picked { color: #333; font-weight: bold; border-color: #FF6B6B; }
  .demo-mini-today { font-size: 14px; color: #FF6B6B; font-weight: bold; flex-shrink: 0; }

  /* 时间 + 刻度尺 + ±步进 */
  .demo-time-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 14px 0 10px;
  }
  .demo-time-block #timerCard { width: 100%; }
  /* 大按钮 */
  .demo-start-big {
    width: 100%;
    min-height: 56px;
    font-size: 20px;
    margin-top: 8px;
  }
  /* 时长胶囊 */
  .demo-capsules {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin: 10px 0 4px;
  }
  .demo-cap {
    background: #FFFFFF; border: 2px solid #E0E0E0; color: #555;
    border-radius: 999px; padding: 8px 18px; font-size: 15px; cursor: pointer;
    transition: all .15s ease;
  }
  .demo-cap:hover { border-color: #FF6B6B; color: #FF6B6B; }
  .demo-cap.selected { background: #FF6B6B; border-color: #FF6B6B; color: #FFFFFF; }

  /* 参数默认一行小字, 点开展开 */
  .demo-meta-row {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 8px 12px;
    background: #FFFFFF; border: 2px solid #E0E0E0; border-radius: 12px;
    font-size: 14px; color: #555; cursor: pointer;
    margin: 10px 0;
  }
  .demo-meta-row[aria-expanded="true"] { border-color: #FF6B6B; }
  .demo-meta-toggle { color: #FF6B6B; font-weight: bold; }
  .demo-session-collapsed { display: none; }
  .demo-session-expanded { display: block; }

  .demo-start-hint {
    font-size: 13px; color: #7F8C8D; min-height: 18px;
    margin-top: 6px; padding-left: 4px; text-align: center;
  }

  /* 科目区: 默认折叠 */
  .demo-item-collapsed { display: none; }
  .demo-item-expanded { display: block; }

  /* 标签按钮回退 */
  .demo-tag {
    background: #FFFFFF; border: 2px solid #E0E0E0; color: #555;
    border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer;
    transition: all .15s ease;
  }
  .demo-tag:hover { border-color: #FF6B6B; color: #FF6B6B; }
  .demo-tag.selected { background: #FF6B6B; border-color: #FF6B6B; color: #FFFFFF; }

  /* 记录降到底 */
  .demo-records-far { margin-top: 28px; }
</style>
</head>
<body>
<div class="demo-wrap">

  <div class="demo-mini-header">
    <div class="demo-mini-pick" id="demoMiniPick" onclick="demoToggleItemArea()">点这里选科目</div>
    <div class="demo-mini-today">今日 15 分钟</div>
  </div>

  <div class="demo-item-collapsed" id="demoItemWrap">
    <div class="item-section card">
      <h2>选择练习项目</h2>

      <div class="selected-summary" id="selectedSummary">
        <div class="summary-layout">
          <div class="summary-left">
            <div class="sum-tag"><span class="sum-name" id="sumName"></span><span class="sum-id" id="sumId"></span></div>
            <button class="resel-btn" onclick="demoToggleReselect()"><span>重新选择</span></button>
          </div>
          <div class="summary-right">
            <div class="req-highlight-inline" id="reqHighlight"></div>
            <div class="story-text-muted">
              <div class="sum-name" id="sumFullName"></div>
              <div class="sum-req" id="sumReq"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="selection-area expanded" id="selectionArea">
        <div class="item-filter-wrap">
          <input type="text" id="itemFilter" placeholder="搜索..." oninput="demoFilterItems(this.value)">
        </div>
        <div class="item-grid" id="demoItemGrid">
          <button class="item-btn" data-id="1001" data-req="长音 8 拍，气息要稳">长音练习</button>
          <button class="item-btn" data-id="1002" data-req="单吐间隔均匀，速度 80">单吐 tuku</button>
          <button class="item-btn" data-id="1003" data-req="双吐连音，别抢拍">双吐 kuku</button>
          <button class="item-btn" data-id="1004" data-req="第一分句连吐">连音练习</button>
          <button class="item-btn" data-id="1005" data-req="小字一组到二组">音阶上下行</button>
          <button class="item-btn" data-id="1006" data-req="视奏，不许停">视奏</button>
        </div>
      </div>
    </div>
  </div>

  <div class="demo-time-block">
    <div id="timerCard">
      <div class="readout">
        <div class="ac-root" id="ttCounter"></div>
        <div class="readout-sub" id="metaVal">10<small>分钟</small></div>
      </div>
      <div class="ruler-wrap">
        <button class="step-btn minus" id="ttStepMinus" onclick="ttStepMin(-1)" aria-label="减少一分钟">−</button>
        <div class="ruler" id="ruler">
          <div class="ruler-row" id="rulerRow" aria-hidden="true"></div>
          <div class="notes-bubbles" aria-hidden="true"></div>
          <input class="ruler-input" id="rulerInput" type="range" min="1" max="30" step="1" value="10"
                 tabindex="-1" aria-label="练习时长（分钟）">
        </div>
        <button class="step-btn plus" id="ttStepPlus" onclick="ttStepMin(1)" aria-label="增加一分钟">+</button>
      </div>
    </div>
  </div>

  <div class="demo-capsules">
    <button type="button" class="demo-cap" onclick="demoPickDuration(5)">5</button>
    <button type="button" class="demo-cap selected" onclick="demoPickDuration(10)">10</button>
    <button type="button" class="demo-cap" onclick="demoPickDuration(15)">15</button>
    <button type="button" class="demo-cap" onclick="demoPickDuration(20)">20</button>
    <button type="button" class="demo-cap" onclick="demoPickDuration(30)">30</button>
  </div>

  <button class="btn btn-primary demo-start-big" id="startBtn" onclick="demoToggleTimer()">开始</button>
  <button class="btn btn-danger demo-start-big" id="finishEarlyBtn" onclick="demoFinishEarly()" style="display:none">提前结束</button>
  <div class="demo-start-hint" id="demoStartHint"></div>

  <div class="demo-meta-row" id="demoMetaRow" aria-expanded="false" onclick="demoToggleMeta()">
    <span id="demoMetaText">♪ 80 · 长音练习</span>
    <span class="demo-meta-toggle" id="demoMetaToggle">展开</span>
  </div>

  <div class="demo-session-collapsed" id="demoSessionWrap">
    <div class="session-panel" id="sessionPanel">
      <div class="sp-header">本次练习</div>
      <div class="sp-tempo-row-1">
        <div class="sp-tempo-label">速度</div>
        <div class="sp-tempo-note-group" role="group" aria-label="音符">
          <button type="button" class="sp-tempo-note-btn selected" data-note="♪" onclick="demoSetNote('♪')">♪</button>
          <button type="button" class="sp-tempo-note-btn" data-note="♩" onclick="demoSetNote('♩')">♩</button>
        </div>
        <span class="sp-tempo-eq">=</span>
        <div class="bpm-stepper" aria-label="BPM">
          <button type="button" class="bpm-step" onclick="demoStepBpm(-1)" aria-label="减1">−</button>
          <span class="bpm-value" id="demoBpmValue">80</span>
          <button type="button" class="bpm-step" onclick="demoStepBpm(1)" aria-label="加1">+</button>
        </div>
      </div>
      <div class="sp-tempo-row-2">
        <div class="sp-tempo-hint" id="demoTempoHint">♪ = 80</div>
      </div>
      <div class="sp-content-tags" id="demoContentTags">
        <span class="sp-content-tag" onclick="demoPickTag(this, '长音练习')">长音练习</span>
        <span class="sp-content-tag" onclick="demoPickTag(this, '第一分句连吐')">第一分句连吐</span>
        <span class="sp-content-tag" onclick="demoPickTag(this, '音阶')">音阶</span>
      </div>
      <input type="text" class="sp-content-input" id="demoContentInput" maxlength="200"
             placeholder="练什么? 例如: 第一分句连吐" aria-label="本次练习内容">
    </div>
  </div>

  <div class="demo-records-far">
    <div class="card today-records">
      <h3>今日记录</h3>
      <div class="today-summary-bar" id="todaySummaryBar">
      <div class="tsb-main">
        <div class="tsb-label">今日总时长</div>
        <div class="tsb-value"><span id="todayTotalMins">15</span><span class="tsb-unit">分钟</span></div>
      </div>
      <div class="tsb-side">
        <div class="tsb-stat"><span class="tsb-stat-num" id="todayItemCount">2</span><span class="tsb-stat-lbl">科目</span></div>
        <div class="tsb-stat"><span class="tsb-stat-num" id="todaySessionCount">3</span><span class="tsb-stat-lbl">次计时</span></div>
      </div>
    </div>
      <div id="demoRecordsList">
        <div class="record-item">
        <div><div class="item-name">长音练习</div><div class="item-mins">♪ = 80</div></div>
        <span class="item-mins">10 分钟</span>
      </div>
        <div class="record-item">
        <div><div class="item-name">单吐 tuku</div><div class="item-mins">♪ = 90</div></div>
        <span class="item-mins">5 分钟</span>
      </div>
      </div>
    </div>
  </div>

  <div class="practice-footer">「 慢慢来，比较快。 」</div>

</div>

<script src="../vendor/gsap.min.js"></script>
<script src="real-timer-visual.js"></script>
<script src="demo-glue.js"></script>
<script>
  /* variant C 专用: mini 头部展开科目区 / 时长胶囊 / meta 行折叠 */
  function demoToggleItemArea() {
    const wrap = document.getElementById('demoItemWrap');
    if (!wrap) return;
    if (wrap.classList.contains('demo-item-expanded')) {
      wrap.classList.remove('demo-item-expanded');
      wrap.classList.add('demo-item-collapsed');
    } else {
      wrap.classList.remove('demo-item-collapsed');
      wrap.classList.add('demo-item-expanded');
    }
  }

  function demoPickDuration(n) {
    if (typeof ttSetDuration === 'function') ttSetDuration(n);
    document.querySelectorAll('.demo-cap').forEach(b => {
      b.classList.toggle('selected', b.textContent.trim() === String(n));
    });
  }

  function demoToggleMeta() {
    const row = document.getElementById('demoMetaRow');
    const wrap = document.getElementById('demoSessionWrap');
    const tog = document.getElementById('demoMetaToggle');
    if (!row || !wrap) return;
    const expanded = row.getAttribute('aria-expanded') === 'true';
    if (expanded) {
      row.setAttribute('aria-expanded', 'false');
      wrap.classList.remove('demo-session-expanded');
      wrap.classList.add('demo-session-collapsed');
      if (tog) tog.textContent = '展开';
    } else {
      row.setAttribute('aria-expanded', 'true');
      wrap.classList.remove('demo-session-collapsed');
      wrap.classList.add('demo-session-expanded');
      if (tog) tog.textContent = '收起';
    }
  }

  /* 监听科目选中: 更新 mini 头部文字 */
  (function () {
    const orig = window.demoSelectItem;
    window.demoSelectItem = function (btn) {
      if (typeof orig === 'function') orig(btn);
      const pick = document.getElementById('demoMiniPick');
      const wrap = document.getElementById('demoItemWrap');
      const label = btn ? btn.textContent.trim() : '';
      if (pick && label) {
        pick.textContent = label;
        pick.classList.add('picked');
      }
      if (wrap) {
        wrap.classList.remove('demo-item-expanded');
        wrap.classList.add('demo-item-collapsed');
      }
    };
  })();
</script>
</body>
</html>
