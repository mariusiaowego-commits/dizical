<script>
(function () {
  var TIMBRE_KEY = 'dizical.metro.timbre';
  /* 音色表来自 shared/beat-timbres.js（与全卡节拍器共用同一份定义） */
  var TIMBRES = (window.DIZI_TIMBRE_IDS && window.DIZI_TIMBRE_IDS.length)
    ? window.DIZI_TIMBRE_IDS.slice()
    : ['classic', 'wood', 'click', 'cowbell', 'sticks'];
  /* 旧 id 兼容映射：'beep' 是旧竖条卡对电子滴答的写法 */
  var LEGACY = { beep: 'click' };
  var currentTimbre = 'classic';
  var currentBpm = 60;
  var MIN_BPM = 40;
  var MAX_BPM = 200;

  /* 抽屉里的音色按钮由音色表生成，保证与 TIMBRES 永远一致 */
  function buildTimbreButtons() {
    var seg = document.getElementById('timbreSeg');
    if (!seg) return;
    var preview = document.getElementById('btnPreview');
    var list = (window.DIZI_TIMBRE_LIST && window.DIZI_TIMBRE_LIST.length)
      ? window.DIZI_TIMBRE_LIST
      : TIMBRES.map(function (id) { return { id: id, label: id }; });
    list.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'timbre-opt';
      b.setAttribute('data-timbre', t.id);
      b.textContent = t.label;
      if (t.id === currentTimbre) b.classList.add('is-on');
      if (preview) seg.insertBefore(b, preview);
      else seg.appendChild(b);
    });
  }

  function term(bpm) {
    if (bpm <= 60) return '慢板';
    if (bpm <= 88) return '中板';
    if (bpm <= 120) return '小快板';
    if (bpm <= 160) return '快板';
    return '急板';
  }
  function paintTimbre() {
    var label = currentTimbre;
    document.querySelectorAll('#timbreSeg button').forEach(function (b) {
      var on = b.dataset.timbre === currentTimbre;
      b.classList.toggle('is-on', on);
      if (on) label = (b.textContent || '').trim();
    });
    var face = document.getElementById('btnTimbre');
    if (face) face.textContent = label;
  }
  function saveTimbre() {
    try { localStorage.setItem(TIMBRE_KEY, currentTimbre); } catch (e) {}
  }
  function restoreTimbre() {
    var saved = null;
    try { saved = localStorage.getItem(TIMBRE_KEY); } catch (e) {}
    if (saved && LEGACY[saved] && TIMBRES.indexOf(saved) < 0) saved = LEGACY[saved];
    currentTimbre = TIMBRES.indexOf(saved) >= 0 ? saved : 'classic';
    try { localStorage.setItem(TIMBRE_KEY, currentTimbre); } catch (e) {}
    paintTimbre();
    if (window.BeatEngine) BeatEngine.setTimbre(currentTimbre);
  }
  function setTimbre(name) {
    if (TIMBRES.indexOf(name) < 0) return;
    currentTimbre = name;
    paintTimbre();
    saveTimbre();
    if (window.BeatEngine) BeatEngine.setTimbre(name);
  }
  function updateBpmUI(bpm) {
    document.getElementById('bpmFace').textContent = bpm;
    document.getElementById('tempoTerm').textContent = term(bpm);
    var label = document.getElementById('bpmLabel');
    if (label) label.textContent = 'BPM ' + bpm;
    document.querySelectorAll('.preset').forEach(function (chip) {
      chip.classList.toggle('active', Number(chip.dataset.bpm) === bpm);
    });
  }
  function setBpm(val) {
    currentBpm = Math.max(MIN_BPM, Math.min(MAX_BPM, Math.round(val)));
    updateBpmUI(currentBpm);
    if (window.BeatEngine) BeatEngine.setBpm(currentBpm);
  }
  window.setBpm = setBpm;
  function clearLeds() {
    for (var i = 0; i < 4; i++) {
      var el = document.getElementById('led' + i);
      if (el) el.classList.remove('weak-lit', 'accent-lit');
    }
  }
  function paintFromClock(ev) {
    clearLeds();
    if (!ev) return;
    var el = document.getElementById('led' + ev.beat);
    if (el) el.classList.add('weak-lit');
  }
  function toggleMetronome() {
    var starting = !BeatEngine.isPlaying();
    var btn = document.getElementById('mainToggleBtn');
    var text = document.getElementById('toggleText');
    if (starting) {
      BeatEngine.setBpm(currentBpm);
      BeatEngine.setTimbre(currentTimbre);
      BeatEngine.setOnVisual(paintFromClock);
      BeatEngine.start();
      btn.classList.add('running');
      text.textContent = '暂停';
    } else {
      BeatEngine.stop();
      clearLeds();
      btn.classList.remove('running');
      text.textContent = '启动';
    }
  }
  function setSkin(skin) {
    if (skin === 'ink') document.documentElement.dataset.skin = 'ink';
    else delete document.documentElement.dataset.skin;
    document.querySelectorAll('#skinSeg button').forEach(function (b) {
      b.classList.toggle('is-on', (b.dataset.skin || 'light') === (skin === 'ink' ? 'ink' : 'light'));
    });
  }
  function faceCount() {
    return [].filter.call(document.querySelectorAll('.strip .face-setting'), function (el) {
      return el.getClientRects().length > 0;
    }).length;
  }
  function parseCss(cs) {
    var m = String(cs || '').match(/rgba?\(([^)]+)\)/);
    if (!m) return null;
    var p = m[1].split(',').map(function (x) { return parseFloat(x); });
    return { rgb: [p[0], p[1], p[2]], a: p.length > 3 ? p[3] : 1 };
  }
  function relChan(c) {
    c = c / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function lum(rgb) {
    return 0.2126 * relChan(rgb[0]) + 0.7152 * relChan(rgb[1]) + 0.0722 * relChan(rgb[2]);
  }
  function contrast(fg, bg) {
    var L1 = lum(fg), L2 = lum(bg);
    return (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05);
  }
  function bgOf(el) {
    var node = el;
    while (node) {
      var bg = parseCss(getComputedStyle(node).backgroundColor);
      if (bg && bg.a >= 0.98) return bg.rgb;
      node = node.parentElement;
    }
    return [14, 17, 20];
  }
  function fgOf(el) {
    var fg = parseCss(getComputedStyle(el).color);
    var bg = bgOf(el);
    if (!fg) return bg;
    if (fg.a >= 0.99) return fg.rgb;
    var a = fg.a;
    return [
      fg.rgb[0] * a + bg[0] * (1 - a),
      fg.rgb[1] * a + bg[1] * (1 - a),
      fg.rgb[2] * a + bg[2] * (1 - a)
    ];
  }
  function inkMap(text) {
    var m = text.match(/:root\[data-skin="ink"\]\s*\{/);
    if (!m) return {};
    var i = text.indexOf('{', m.index);
    var depth = 0, j = i;
    for (; j < text.length; j++) {
      if (text[j] === '{') depth += 1;
      else if (text[j] === '}') {
        depth -= 1;
        if (depth === 0) break;
      }
    }
    var body = text.slice(i + 1, j).replace(/\/\*[\s\S]*?\*\//g, '');
    var props = {};
    body.split(';').forEach(function (part) {
      var line = part.trim();
      if (line.indexOf('--') !== 0) return;
      var cut = line.indexOf(':');
      if (cut < 0) return;
      props[line.slice(0, cut).trim()] = line.slice(cut + 1).trim();
    });
    return props;
  }

  document.getElementById('skinSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    setSkin(b.dataset.skin);
  });
  function bindStripHold(el, delta) {
    if (!el) return;
    var timer = null, interval = null;
    var holding = false;
    var start = function (e) {
      if (e.button && e.button !== 0) return;
      holding = true;
      e.preventDefault();
      setBpm(currentBpm + delta);
      timer = setTimeout(function () { interval = setInterval(function () { setBpm(currentBpm + delta); }, 120); }, 360);
    };
    var stop = function () { clearTimeout(timer); clearInterval(interval); setTimeout(function () { holding = false; }, 60); };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('click', function () {
      if (!holding) { setBpm(currentBpm + delta); }
    });
  }
  bindStripHold(document.getElementById('stepUpBtn'), 1);
  bindStripHold(document.getElementById('stepDownBtn'), -1);
  document.getElementById('mainToggleBtn').addEventListener('click', toggleMetronome);
  document.getElementById('btnTimbre').addEventListener('click', function () {
    document.getElementById('settingsPop').hidden = false;
  });
  document.getElementById('btnPopClose').addEventListener('click', function () {
    document.getElementById('settingsPop').hidden = true;
  });
  document.getElementById('settingsPop').addEventListener('click', function (e) {
    if (e.target.id === 'settingsPop') e.currentTarget.hidden = true;
  });
  document.getElementById('timbreSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.timbre) return;
    setTimbre(b.dataset.timbre);
  });
  document.getElementById('bpmDown').addEventListener('click', function () { setBpm(currentBpm - 1); });
  document.getElementById('bpmUp').addEventListener('click', function () { setBpm(currentBpm + 1); });
  document.getElementById('btnPreview').addEventListener('click', function () {
    BeatEngine.preview(currentTimbre);
  });

  buildTimbreButtons();
  restoreTimbre();
  updateBpmUI(currentBpm);
  BeatEngine.setOnVisual(paintFromClock);

  if (location.search.indexOf('audit=1') < 0) return;
  var fails = [];
  try { localStorage.removeItem(TIMBRE_KEY); } catch (e) {}
  restoreTimbre();
  if (currentTimbre !== 'classic') fails.push('default timbre ' + currentTimbre);
  var buttons = document.querySelectorAll('#timbreSeg button[data-timbre]');
  if (buttons.length !== TIMBRES.length) fails.push('timbres ' + buttons.length + ' want ' + TIMBRES.length);
  ['nikko', 'clave', 'bell', 'drip', 'shake', 'log'].forEach(function (n) {
    if (TIMBRES.indexOf(n) < 0) fails.push('missing new timbre ' + n);
  });
  var measured = {};
  var classicInfo = null;
  TIMBRES.forEach(function (name) {
    var info = BeatEngine.preview(name);
    measured[name] = info && info.peak;
    if (name === 'classic') classicInfo = info;
    if (!info || info.accent) fails.push(name + ' accent');
  });
  TIMBRES.forEach(function (name) {
    /* 响度下限：所有音色都要明显比旧版（0.16~0.26）响 */
    if (!(measured[name] >= 0.30)) fails.push('timbre too quiet ' + name + ' peak ' + measured[name]);
  });
  var ratioHz = classicInfo && classicInfo.freq ? classicInfo.freq2 / classicInfo.freq : 0;
  if (Math.abs(ratioHz - 2.7) > 0.02) fails.push('classic ratio ' + ratioHz);
  var card = document.getElementById('strip');
  var gauge = document.getElementById('dashGauge');
  var sw = card.getBoundingClientRect().width;
  var sh = card.getBoundingClientRect().height;
  var gw = gauge.getBoundingClientRect().width;
  var ratio = gw ? sw / gw : 0;
  if (Math.abs(ratio - 1 / 3) > 0.01) fails.push('width ratio ' + ratio.toFixed(3) + ' want 0.333±0.01');
  if (!(sh > sw)) fails.push('portrait ' + Math.round(sh) + 'x' + Math.round(sw));
  if (card.scrollWidth > card.clientWidth + 1) fails.push('card overflow');
  var pageOverflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  if (pageOverflow > 1) fails.push('page overflow ' + pageOverflow);
  var pop = document.getElementById('settingsPop');
  if (pop.hidden !== true) fails.push('popup starts open');
  var faceClosed = faceCount();
  if (faceClosed > 5) fails.push('face settings ' + faceClosed);
  document.getElementById('btnTimbre').click();
  var popupOpened = pop.hidden === false;
  if (!popupOpened) fails.push('popup did not open');
  document.getElementById('btnPopClose').click();
  var popupClosed = pop.hidden === true;
  if (!popupClosed) fails.push('popup did not close');
  setSkin('ink');
  BeatEngine.setBpm(120);
  BeatEngine.setTimbre('classic');
  BeatEngine.armSync();
  BeatEngine.start();
  var waits = 0;
  var skipped = [];
  function syncSkipReason() {
    var ctx = null;
    try { ctx = BeatEngine.context(); } catch (e) {
      return 'no AudioContext (' + (e && e.message) + '); beat-light sync cannot be sampled';
    }
    if (!window.AudioContext && !window.webkitAudioContext) {
      return 'no AudioContext constructor; beat-light sync cannot be sampled';
    }
    if (!ctx) return 'AudioContext was not created; beat-light sync cannot be sampled';
    if (ctx.state === 'suspended' || ctx.state === 'closed' || ctx.state === 'interrupted' || !(ctx.currentTime > 0.05)) {
      return 'no audio output: AudioContext ' + ctx.state + ', currentTime ' + ctx.currentTime + '; beat-light sync cannot be sampled';
    }
    return '';
  }
  var poll = setInterval(function () {
    waits += 1;
    var ctxNow = null;
    try { ctxNow = BeatEngine.context(); } catch (e) {}
    var clockDead = !ctxNow || ctxNow.state === 'suspended' || ctxNow.state === 'closed' || !(ctxNow.currentTime > 0.05);
    if (BeatEngine.syncSamples().length >= 4 || waits > 40 || (waits > 8 && clockDead)) {
      clearInterval(poll);
      BeatEngine.stop();
      var samples = BeatEngine.syncSamples().slice(0, 4);
      var accents = samples.filter(function (s) { return s.accent; }).length;
      if (samples.length < 4) {
        var why = samples.length === 0 ? syncSkipReason() : '';
        if (why) skipped.push({ check: 'sync samples', reason: why });
        else fails.push('sync samples ' + samples.length + ' want 4');
      }
      if (accents !== 0) fails.push('accent flags ' + accents);
      var peaks = samples.map(function (s) { return s.peak; });
      var freqs = samples.map(function (s) { return s.freq; });
      if (peaks.length && Math.max.apply(null, peaks) - Math.min.apply(null, peaks) > 0.0001) {
        fails.push('peak span');
      }
      if (freqs.length && Math.max.apply(null, freqs) - Math.min.apply(null, freqs) > 0.01) {
        fails.push('freq span');
      }
      if (document.getElementById('led0').classList.contains('accent-lit')) fails.push('accent-lit');
      document.getElementById('settingsPop').hidden = false;
      var popEl = document.getElementById('settingsPop');
      var menu = popEl.querySelector('.pop-card');
      function scrollDelta(el) {
        return {
          y: el.scrollHeight - el.clientHeight,
          x: el.scrollWidth - el.clientWidth
        };
      }
      var menuScroll = scrollDelta(menu);
      var popScroll = scrollDelta(popEl);
      if (menuScroll.y > 0 || menuScroll.x > 0) fails.push('menu scroll ' + menuScroll.y + '/' + menuScroll.x);
      if (popScroll.y > 0 || popScroll.x > 0) fails.push('pop scroll ' + popScroll.y + '/' + popScroll.x);
      if (document.querySelector('input[type="range"], .bpm-slider')) fails.push('speed slider still present');
      var label = document.getElementById('bpmLabel');
      var arrows = [].slice.call(document.querySelectorAll('#speedRow .bpm-arrow'));
      var labelBox = label.getBoundingClientRect();
      var arrowsRight = arrows.filter(function (el) { return el.getBoundingClientRect().left >= labelBox.right - 1; });
      if (arrows.length !== 2 || arrowsRight.length !== 2) fails.push('bpm arrows ' + arrows.length + ' right ' + arrowsRight.length);
      var bpmText = (label.textContent || '').trim();
      if (!/^BPM \d+$/.test(bpmText)) fails.push('bpm label ' + bpmText);
      var tone = document.querySelector('#timbreSeg .timbre-opt');
      var arrow = arrows[0];
      var toneCs = tone ? getComputedStyle(tone) : null;
      var arrowCs = arrow ? getComputedStyle(arrow) : null;
      var shapeDiffs = [];
      if (toneCs && arrowCs) {
        if (Math.abs(parseFloat(toneCs.height) - parseFloat(arrowCs.height)) > 1) shapeDiffs.push('height');
        if (Math.abs(parseFloat(toneCs.borderRadius) - parseFloat(arrowCs.borderRadius)) > 1) shapeDiffs.push('radius');
        if (toneCs.backgroundColor !== arrowCs.backgroundColor) shapeDiffs.push('background');
      }
      if (shapeDiffs.length < 2) fails.push('speed/timbre shape diffs ' + shapeDiffs.join(','));
      var menuBox = menu.getBoundingClientRect();
      var clipped = false;
      [].forEach.call(menu.querySelectorAll('button, .bpm-label, .note'), function (el) {
        var r = el.getBoundingClientRect();
        if (r.width < 1 || r.height < 1) return;
        if (r.top < menuBox.top - 1 || r.bottom > menuBox.bottom + 1 || r.left < menuBox.left - 1 || r.right > menuBox.right + 1) clipped = true;
      });
      if (clipped) fails.push('menu content clipped');
      if (menuBox.height > 420) fails.push('menu height ' + Math.round(menuBox.height) + ' want <= 420');
      document.getElementById('settingsPop').hidden = true;
      var menuReport = {
        scrollY: menuScroll.y,
        scrollX: menuScroll.x,
        clipped: clipped,
        height: Math.round(menuBox.height),
        arrows: arrowsRight.length,
        label: bpmText,
        shapeDiffs: shapeDiffs
      };
      var contrastRows = [];
      var minContrast = 99;
      [].forEach.call(document.querySelectorAll('.strip *'), function (el) {
        var hasText = [].some.call(el.childNodes, function (n) {
          return n.nodeType === 3 && n.textContent.trim();
        });
        if (!hasText || !el.getClientRects().length) return;
        var rowRatio = Math.round(contrast(fgOf(el), bgOf(el)) * 100) / 100;
        contrastRows.push({ id: el.id || el.className, ratio: rowRatio });
        if (rowRatio < minContrast) minContrast = rowRatio;
        if (rowRatio < 4.5) fails.push('ink contrast ' + (el.id || el.className) + ' ' + rowRatio);
      });
      var mineInk = inkMap(document.querySelector('style').textContent);
      fetch('practice-duration-card-01-v3.html').then(function (r) { return r.text(); }).then(function (html) {
        var d6 = inkMap(html);
        var mismatch = 0;
        Object.keys(d6).forEach(function (k) {
          if (mineInk[k] !== d6[k]) {
            mismatch += 1;
            fails.push('ink token ' + k);
          }
        });
        var res = {
          card: 'metronome-02-strip',
          width: Math.round(sw * 100) / 100,
          height: Math.round(sh * 100) / 100,
          gauge: Math.round(gw * 100) / 100,
          ratio: Math.round(ratio * 1000) / 1000,
          portrait: sh > sw,
          pageOverflow: pageOverflow,
          faceSettings: faceCount(),
          popup: { opened: popupOpened, closed: popupClosed },
          menu: menuReport,
          measuredPeaks: measured,
          accentFlags: accents,
          inkMismatch: mismatch,
          inkContrastMin: minContrast,
          inkContrast: contrastRows,
          skipped: skipped,
          failures: fails,
          verdict: fails.length ? 'ASSERT_FAIL' : 'ASSERT_OK'
        };
        var pre = document.getElementById('audit');
        if (!pre) {
          pre = document.createElement('pre');
          pre.id = 'audit';
          pre.style.cssText = 'position:fixed;left:8px;bottom:8px;max-width:92vw;max-height:46vh;overflow:auto;background:rgba(0,0,0,0.85);color:#00ff00;font:11px/1.4 ui-monospace,monospace;padding:8px;z-index:9;white-space:pre-wrap;';
          document.body.appendChild(pre);
        }
        pre.textContent = res.verdict + '\n' + JSON.stringify(res, null, 2);
      }).catch(function (err) {
        var pre = document.getElementById('audit');
        if (!pre) {
          pre = document.createElement('pre');
          pre.id = 'audit';
          document.body.appendChild(pre);
        }
        pre.textContent = 'ASSERT_FAIL\n' + (err && err.message);
      });
    }
  }, 200);
})();
</script>
</body>
</html>

  .timeline-rail-capsule {
    width: 100%;
    height: 51px; /* 高度提升 1.5 倍 (51px，占卡高约 17%~18%) */
    background: var(--dash-vermilion);
    border-radius: 999px;
    padding: 0 14px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;

  /* 时间标签行：首次练习起点 + 每次练习起点 + 最后一次练习结束点

  .time-ticks-row {
    position: absolute;
    left: 14px; right: 14px;
    bottom: calc(50% + 3.5px);
    width: auto;
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 400;
    color: var(--dash-knob-lo);
    letter-spacing: 0.02em;
    padding: 0;
    line-height: 1;
    margin-bottom: 0;
    height: 10px;

  .time-ticks-row span {
    position: absolute;
    top: 0;
    white-space: nowrap;
    line-height: 1;
  }
  .time-ticks-row span.tick-end {
    transform: translateX(-100%);
  }

  /* 胶囊内的细长线轨：实线练习 / 虚线休息 */
  .rail-track-line {
    position: absolute;
    left: 14px; right: 14px;
    top: calc(50% - 2px);
    width: auto;
    height: 4px;
    display: flex; align-items: center;
  }
  /* 基础虚线轴 (未完/休息段：点划/虚线，包豪斯圆头点划) */
  .rail-baseline-dash {
    position: absolute;
    left: 0; right: 0; top: 0;
    width: 100%;
    height: 4px;
    display: block;
    overflow: visible;
  }
  /* 实线练习段：细白线 (发丝线 2px，圆头) */
  .session-seg-white {
    position: absolute;
    top: 1px;
    height: 2px;
    background: var(--dash-white);
    border-radius: 999px;
    box-shadow: 0 0.5px 1.5px rgba(0, 0, 0, 0.25);
    z-index: 2;
  }

  /* B2: 虚线下方练习时长展示行

  .rail-duration-row {
    position: absolute;
    left: 14px; right: 14px;
    top: calc(50% + 5.5px);
    width: auto;
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 400;
    color: var(--dash-knob-lo);
    letter-spacing: 0.02em;
    padding: 0;
    line-height: 1;
    margin-top: 0;
    height: 10px;
  }
  .rail-duration-text {
    position: absolute;
    left: 6%;
    top: 0;
    white-space: nowrap;
    line-height: 1;
  }

  /* ══════ 底部状态栏：最近练习科目 + 包豪斯双图标 ══════ */

    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px;
    padding-top: 2px;
  }

    font-size: 18px; font-weight: 350;
    color: var(--dash-text);
    letter-spacing: 0.02em;
  }

  .icons-bauhaus-group {
    display: flex; align-items: center;
    gap: 12px;
  }
  .bauhaus-ic {
    display: block;
    width: 22px; height: 22px;
    color: var(--dash-text);
  }

  button:focus-visible {
    outline: 2px solid var(--dash-vermilion);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  /* demo-ver badge */
  .demo-ver{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:11px;letter-spacing:.02em;border:1px solid var(--dash-ink-a16);color:var(--dash-text-soft);
    background:var(--dash-surface-soft)}
  .demo-ver b{color:var(--dash-vermilion-text);font-weight:600}

  <div class="clock-display">

      <!-- 动态由 HOLLOW_DIGITS 生成 -->
    </svg>
    <svg class="superscript-sec-svg" id="secSvg" viewBox="0 0 72 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="43">
      <!-- 动态由 HOLLOW_DIGITS 生成 -->

<script>
(function () {

  // B2: 0-9 完整细体字形字库 (几何高度视觉统一在 y=2~50，总高 48px，笔画 1.8px)
  var HOLLOW_DIGITS = {
    '0': '<rect x="2" y="2" width="28" height="48" rx="10" stroke="currentColor" stroke-width="1.8" /><line x1="8" y1="42" x2="24" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />',

    '3': '<path d="M 4,8 C 7,-0.8 28,-0.8 28,14 C 28,23 18,26 13,26 C 20,26 28,29 28,38 C 28,52.5 7,52.5 3,44" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />',
    '4': '<path d="M 22,2 L 4,34 L 28,34 M 22,2 L 22,50" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />',
    '5': '<path d="M 28,2 L 4,2 L 4,22 C 7,19 16,19 22,22 C 28,25 29,32 28,39 C 27,51 14,51 4,50" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />',
    '6': '<path d="M 24,2 C 12,2 2,14 2,36 A 14 14 0 1 0 16,22 A 14 14 0 0 0 2.8,32" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />',
    '7': '<path d="M 2,2 L 30,2 L 10,50 M 14,26 L 24,26" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />',
    '8': '<rect x="3" y="2" width="26" height="23" rx="8" stroke="currentColor" stroke-width="1.8" /><rect x="2" y="25" width="28" height="25" rx="9" stroke="currentColor" stroke-width="1.8" />',
    '9': '<path d="M 8,50 C 20,50 30,38 30,16 A 14 14 0 1 0 16,30 A 14 14 0 0 0 29.2,20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />',
    ':': '<circle cx="6" cy="18" r="2.2" fill="currentColor" /><circle cx="6" cy="34" r="2.2" fill="currentColor" />'

  function buildHollowString(str) {
    var x = 0;
    var html = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      var glyph = HOLLOW_DIGITS[ch] || '';
      var width = (ch === ':') ? 12 : 32;
      html += '<g transform="translate(' + x + ',0)" data-char="' + ch + '">' + glyph + '</g>';
      x += width + (ch === ':' ? 4 : 5);
    }
    return { html: html, totalWidth: x > 0 ? x - 4 : 0 };
  }

  function renderClock(timeStr) {
    var res = buildHollowString(timeStr);
    clockSvg.setAttribute('viewBox', '0 0 ' + res.totalWidth + ' 52');
    clockSvg.innerHTML = res.html;
  }

  function renderSec(sec) {
    var str = (sec < 10 ? '0' : '') + sec;
    var res = buildHollowString(str);
    secSvg.setAttribute('viewBox', '0 0 ' + res.totalWidth + ' 52');
    secSvg.innerHTML = res.html;
  }

  // D6-1: 时分秒真实联动
  var curHour = 8;
  var curMin = 26;
  var curSec = 43;

  function padZero(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function updateClockDisplay() {
    renderClock(padZero(curHour) + ':' + padZero(curMin));
    renderSec(curSec);
  }

  function tickSecond() {
    curSec++;
    if (curSec >= 60) {
      curSec = 0;
      curMin++;
      if (curMin >= 60) {
        curMin = 0;
        curHour = (curHour + 1) % 24;
      }
    }
    updateClockDisplay();
  }

  // B2: 练习时长格式化与单位切换 (分钟 / 小时)
  function formatPracticeDuration(minutes) {
    if (minutes < 60) {
      return minutes + ' 分钟';
    } else {
      var hours = minutes / 60;
      var hStr = (hours % 1 === 0) ? hours.toFixed(0) : hours.toFixed(1);
      return hStr + ' 小时';
    }
  }
  window.formatPracticeDuration = formatPracticeDuration;

  // 初始渲染
  updateClockDisplay();

  // 时钟秒数实时跳动 (秒 59->00 联动进分，分 59->00 联动进时)
  var clockTimer = setInterval(tickSecond, 1000);

  // 暴露给自检及外部自动化
  window.__cardClockState = {
    getHour: function () { return curHour; },
    getMin: function () { return curMin; },
    getSec: function () { return curSec; },
    setTime: function (h, m, s) {
      curHour = h; curMin = m; curSec = s;
      updateClockDisplay();
    },
    tick: tickSecond
  };

  // 视口与皮肤切换 (真实响应宽度与背景)
  document.getElementById('vpSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    card.style.width = b.dataset.vp + 'px';
    document.querySelectorAll('#vpSeg button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
  });

  document.getElementById('skinSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.skin === 'ink') {
      document.documentElement.setAttribute('data-skin', 'ink');
    } else {
      document.documentElement.removeAttribute('data-skin');
    }
    document.querySelectorAll('#skinSeg button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
  });

  // 初始设为深墨以对齐参考图
  document.documentElement.setAttribute('data-skin', 'ink');

  // ?audit=1 契约自检
  if (location.search.indexOf('audit=1') >= 0) {
    var fails = [];
    var rail = document.getElementById('railCapsule');
    var railH = rail.getBoundingClientRect().height;
    var cardH = card.getBoundingClientRect().height;
    var railRatio = railH / cardH;

    // B1 断言：rail 高度提升 1.5 倍 (34px -> 51px，占卡高约 17%~18%)
    if (Math.abs(railH - 51) > 1.0) {
      fails.push('B1 fail: railHeight want 51px got ' + Math.round(railH) + 'px');
    }

    // 断言 2：白线段数 = 3
    var segs = document.querySelectorAll('.session-seg-white').length;
    if (segs !== 3) fails.push('white segs got ' + segs + ' want 3');

    // 断言 3：右下两枚包豪斯矢量图标齐备，间距严格 12px
    var ics = document.querySelectorAll('.bauhaus-ic');
    if (ics.length !== 2) fails.push('icons count got ' + ics.length + ' want 2');
    var icGroup = document.querySelector('.icons-bauhaus-group');
    var gap = icGroup ? parseFloat(window.getComputedStyle(icGroup).gap) : 0;
    if (Math.abs(gap - 12) > 1.0) fails.push('icon gap got ' + gap + 'px want 12px');

    // 断言 4：无横向溢出
    var noHOverflow = card.scrollWidth <= card.clientWidth;
    if (!noHOverflow) fails.push('horizontal overflow');

    // 断言 5：皮肤切换真实响应 (深墨 vs 浅银 卡面背景色互不相等)
    var origSkin = document.documentElement.getAttribute('data-skin');
    document.documentElement.setAttribute('data-skin', 'ink');
    var inkBg = window.getComputedStyle(card).backgroundColor;
    document.documentElement.removeAttribute('data-skin');
    var lightBg = window.getComputedStyle(card).backgroundColor;
    if (inkBg === lightBg) fails.push('skin switch failed: ink and light background identical (' + inkBg + ')');
    if (origSkin) document.documentElement.setAttribute('data-skin', origSkin);
    else document.documentElement.setAttribute('data-skin', 'ink');

    // 断言 6：三档宽度切换真实响应 (480 / 380 / 340)
    card.style.width = '480px';
    var w480 = Math.round(card.getBoundingClientRect().width);
    card.style.width = '380px';
    var w380 = Math.round(card.getBoundingClientRect().width);
    card.style.width = '340px';
    var w340 = Math.round(card.getBoundingClientRect().width);
    if (!(w480 > w380 && w380 > w340)) {
      fails.push('viewport widths not distinct: ' + w480 + ', ' + w380 + ', ' + w340);
    }
    card.style.width = '380px'; // 恢复默认契约宽

    // D6-1 断言：纯 1px 细虚线（去掉长段，首段 1px，无 >=2px 长段，段与段间隙均匀，段数 >=3）
    var gapLines = document.querySelectorAll('.session-gap-dash');
    var segTypes = (segs > 0 ? 1 : 0) + (gapLines.length > 0 ? 1 : 0);
    var dashStr = gapLines.length > 0 ? gapLines[0].getAttribute('stroke-dasharray') : '';
    var parts = dashStr ? dashStr.split(/[\s,]+/).map(parseFloat).filter(function (n) { return !isNaN(n); }) : [];
    var firstIs1px = parts.length > 0 && Math.abs(parts[0] - 1.0) < 0.1;
    var noLongSeg = parts.every(function (n, idx) { return (idx % 2 === 1) || (n < 2.0); });
    var isUniform = parts.length === 2 || (parts.length >= 4 && parts[1] === parts[3]);
    var segCount = parts.length >= 2 ? Math.floor(100 / (parts[0] + parts[1])) : 0;
    var gapStroke = gapLines.length > 0 ? (gapLines[0].getAttribute('stroke') || '') : '';
    var isWhiteStroke = gapStroke.indexOf('white') >= 0 || gapStroke.indexOf('var(--dash-white)') >= 0;
    if (segTypes < 2 || !firstIs1px || !noLongSeg || !isUniform || segCount < 3 || !isWhiteStroke) {
      fails.push('D6-1 fail: dasharray="' + dashStr + '" (firstIs1px=' + firstIs1px + ', noLongSeg=' + noLongSeg + ', isUniform=' + isUniform + ', segCount=' + segCount + '), stroke="' + gapStroke + '"');
    }

    // D6-1 断言：秒针 59->00 真实驱动分针联动进位 (+1 步)
    var origH = window.__cardClockState.getHour();
    var origM = window.__cardClockState.getMin();
    var origS = window.__cardClockState.getSec();
    window.__cardClockState.setTime(8, 26, 59);
    var preMin = window.__cardClockState.getMin();
    window.__cardClockState.tick();
    var postMin = window.__cardClockState.getMin();
    var postSec = window.__cardClockState.getSec();
    var minStepped = (postMin === preMin + 1) && (postSec === 0);
    // 恢复现场
    window.__cardClockState.setTime(origH, origM, origS);
    if (!minStepped) {
      fails.push('D6-1 fail: clock rollover from 59 to 00 did not advance minute: preMin=' + preMin + ', postMin=' + postMin + ', postSec=' + postSec);
    }

    // B2 断言：10 个数字 SVG 的视觉盒高度极差 ≤1px；数字个数 = 10
    var digitKeys = Object.keys(HOLLOW_DIGITS).filter(function (k) { return k >= '0' && k <= '9'; });
    if (digitKeys.length !== 10) {
      fails.push('B2 fail: digit count got ' + digitKeys.length + ' want 10');
    }
    var testSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    testSvg.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;width:200px;height:200px;';
    document.body.appendChild(testSvg);
    var digitHeights = [];
    digitKeys.forEach(function (k) {
      testSvg.innerHTML = '<g>' + HOLLOW_DIGITS[k] + '</g>';
      var g = testSvg.querySelector('g');
      if (g) {
        var bbox = g.getBBox();
        digitHeights.push(bbox.height);
      }
    });
    var minH = Math.min.apply(null, digitHeights);
    var maxH = Math.max.apply(null, digitHeights);
    var hRange = maxH - minH;
    if (hRange > 1.0) {
      fails.push('B2 fail: 0-9 glyph height spread got ' + hRange.toFixed(2) + 'px (> 1.0px): min=' + minH.toFixed(2) + ' max=' + maxH.toFixed(2));
    }

    // A2-3 断言：6/9 正圆与无搭接
    testSvg.innerHTML = '<path d="M 2,36 A 14 14 0 1 0 16,22 A 14 14 0 0 0 2.8,32" stroke="currentColor" stroke-width="1.8" fill="none" />';
    var b6Loop = testSvg.querySelector('path').getBBox();
    var loop6Ratio = b6Loop.width / b6Loop.height;

    testSvg.innerHTML = '<path d="M 30,16 A 14 14 0 1 0 16,30 A 14 14 0 0 0 29.2,20" stroke="currentColor" stroke-width="1.8" fill="none" />';
    var b9Loop = testSvg.querySelector('path').getBBox();
    var loop9Ratio = b9Loop.width / b9Loop.height;

    document.body.removeChild(testSvg);

    if (Math.abs(loop6Ratio - 1.0) > 0.03) {
      fails.push('A2-3 fail: 6 loop ratio got ' + loop6Ratio.toFixed(3) + ' want 1.0 +-0.03');
    }
    if (Math.abs(loop9Ratio - 1.0) > 0.03) {
      fails.push('A2-3 fail: 9 loop ratio got ' + loop9Ratio.toFixed(3) + ' want 1.0 +-0.03');
    }

    var strokeClearance6 = 2.8 - 2.0; // 0.8px > 0
    var strokeClearance9 = 30.0 - 29.2; // 0.8px > 0
    if (strokeClearance6 <= 0 || strokeClearance9 <= 0) {
      fails.push('A2-3 fail: stroke clearance must be > 0');
    }

    // B3 断言：上标与主数字同为 SVG 几何空心字形
    var secIsSvg = secSvg && secSvg.tagName.toLowerCase() === 'svg';
    var secHasG = secSvg && secSvg.querySelectorAll('g').length > 0;
    if (!secIsSvg || !secHasG) {
      fails.push('B3 fail: sec superscript must be SVG hollow glyph group');
    }

    // B2 断言：练习时长文本展示与单位切换逻辑 (常态 xx 分钟，极限 x.x 小时)
    var durationRowEl = document.getElementById('railDurationRow');
    var durationTextEl = document.getElementById('railDurationText');
    var durationTextContent = durationTextEl ? durationTextEl.textContent.trim() : '';
    if (!durationTextEl || !durationTextContent) {
      fails.push('B2 fail: missing practice duration text in rail capsule');
    }
    var test42 = formatPracticeDuration(42);
    var test90 = formatPracticeDuration(90);
    if (test42 !== '42 分钟') {
      fails.push('B2 fail: formatPracticeDuration(42) want "42 分钟" got "' + test42 + '"');
    }
    if (test90 !== '1.5 小时') {
      fails.push('B2 fail: formatPracticeDuration(90) want "1.5 小时" got "' + test90 + '"');
    }

    // B3 断言（D6-1 改法）：两行到 dash 的【墨迹净距】≥4 且 ≤6px + 字重 400 + 字号 8.5~9px + 不压线/不裁切
    // 墨迹用 canvas 的真实字体度量算（getClientRects 只给行盒，行盒含字身空白，会把净距报大）
    function inkMetrics(el) {
      var cs = getComputedStyle(el);
      var cv = document.createElement('canvas').getContext('2d');
      cv.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      var m = cv.measureText((el.textContent || '').replace(/\s+/g, ''));
      var L = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize);
      var r = el.getBoundingClientRect();
      var halfLead = (L - ((m.fontBoundingBoxAscent || 0) + (m.fontBoundingBoxDescent || 0))) / 2;
      var baseline = r.top + halfLead + (m.fontBoundingBoxAscent || 0);
      return {
        inkTop: baseline - (m.actualBoundingBoxAscent || 0),
        inkBottom: baseline + (m.actualBoundingBoxDescent || 0),
        weight: cs.fontWeight, size: parseFloat(cs.fontSize), font: cv.font
      };
    }
    var ticksRowEl = document.getElementById('timeTicksRow');
    var durRowEl = document.getElementById('railDurationRow');
    var firstTickEl = ticksRowEl.querySelector('span') || ticksRowEl;
    var railLineEl = document.querySelector('.rail-baseline-dash');
    var tRect = ticksRowEl.getBoundingClientRect();
    var lineRect = railLineEl.getBoundingClientRect();
    var ticksToDash = lineRect.top - tRect.bottom;
    // dash 的可见笔画：SVG viewBox 0 0 100 4，线在 y=2、stroke-width 1.6 → 笔画占 1.2..2.8（非缩放描边）
    var paintTop = lineRect.top + 1.2;
    var paintBottom = lineRect.top + 2.8;
    var tm = inkMetrics(firstTickEl);
    var dm = inkMetrics(durationTextEl);
    var ticksInkGap = paintTop - tm.inkBottom;
    var durInkGap = dm.inkTop - paintBottom;
    if (ticksInkGap < 4.0 || ticksInkGap > 6.0) fails.push('B3 fail: 刻度行墨迹净距 want 4..6px got ' + ticksInkGap.toFixed(2) + 'px');
    if (durInkGap < 4.0 || durInkGap > 6.0) fails.push('B3 fail: 时长行墨迹净距 want 4..6px got ' + durInkGap.toFixed(2) + 'px');
    if (tm.weight !== '400') fails.push('B3 fail: 刻度行字重 want 400 got ' + tm.weight);
    if (dm.weight !== '400') fails.push('B3 fail: 时长行字重 want 400 got ' + dm.weight);
    if (tm.size < 8.5 || tm.size > 9.0) fails.push('B3 fail: 刻度行字号 want 8.5~9px got ' + tm.size + 'px');
    if (dm.size < 8.5 || dm.size > 9.0) fails.push('B3 fail: 时长行字号 want 8.5~9px got ' + dm.size + 'px');

    var textRect = durationTextEl ? durationTextEl.getBoundingClientRect() : { top: 0 };
    var textToDash = textRect.top - lineRect.bottom;
    var ticksBoxGap = ticksToDash;
    var durBoxGap = durRowEl.getBoundingClientRect().top - lineRect.bottom;
    if (ticksBoxGap < 1.0) fails.push('B3 fail: 刻度行盒贴死/压线 got ' + ticksBoxGap.toFixed(2) + 'px');
    if (durBoxGap < 1.0) fails.push('B3 fail: 时长行盒贴死/压线 got ' + durBoxGap.toFixed(2) + 'px');
    [ticksRowEl, durRowEl].forEach(function (el) {
      if (el.scrollWidth > el.clientWidth + 1) fails.push('B3 fail: ' + el.id + ' 文字裁切 ' + el.scrollWidth + '>' + el.clientWidth);
    });

    var capsuleRect = rail.getBoundingClientRect();
    var lineCenterY = lineRect.top + lineRect.height / 2;
    var capsuleCenterY = capsuleRect.top + capsuleRect.height / 2;
    var lineCenterDiff = Math.abs(lineCenterY - capsuleCenterY);
    if (lineCenterDiff > 1.0) {
      fails.push('A2-2 fail: rail line center diff got ' + lineCenterDiff.toFixed(2) + 'px (> 1.0px)');
    }

    var tickSpans = Array.from(document.querySelectorAll('#timeTicksRow span'));
    var segEls = Array.from(document.querySelectorAll('.session-seg-white'));
    var tickLabels = tickSpans.map(function (s) { return s.textContent.trim(); });
    var tick0Diff = -1;
    if (tickSpans.length > 0 && segEls.length > 0) {
      var t0Rect = tickSpans[0].getBoundingClientRect();
      var s0Rect = segEls[0].getBoundingClientRect();
      tick0Diff = Math.abs(t0Rect.left - s0Rect.left);
      if (tick0Diff > 1.0) {
        fails.push('A2-1 fail: tick0 left diff got ' + tick0Diff.toFixed(2) + 'px (> 1.0px)');
      }
    } else {
      fails.push('A2-1 fail: missing ticks or segments');
    }

    var wantTickCount = segEls.length + 1;
    if (tickSpans.length !== wantTickCount) {
      fails.push('A2-2 fail: tick count got ' + tickSpans.length + ' want ' + wantTickCount);
    }
    if (tickLabels[0] !== '07:15') {
      fails.push('A2-2 fail: first tick got ' + tickLabels[0] + ' want 07:15');
    }
    if (tickLabels[tickLabels.length - 1] !== '08:45') {
      fails.push('A2-2 fail: last tick got ' + tickLabels[tickLabels.length - 1] + ' want 08:45');
    }

    var isOk = fails.length === 0;
    var out = {
      card: 'card-practice-duration-v3',
      railHeight: Math.round(railH),
      railHeightBefore: 34,
      cardHeight: Math.round(cardH),
      railRatio: Number(railRatio.toFixed(3)),
      railRatioBefore: 0.12,
      ticksToDash: Number(ticksToDash.toFixed(1)),
      textToDash: Number(textToDash.toFixed(1)),
      ticksBoxGap: Number(ticksBoxGap.toFixed(2)),

  ];

  function practiceSeconds() {
    return SESSIONS.reduce(function (s, row) { return s + row.duration_seconds; }, 0);
  }

  /* SIGN_FN 相比昨日：练习秒 − 昨日秒。正 = 多 = 红 +；负 = 少 = 绿 −。 */
  function signedDelta(practiceSec, yesterdaySec) {
    return practiceSec - yesterdaySec;
  }

  function minutesOf(seconds) {
    return Math.round(seconds / 60);
  }

  function groupSubjects() {
    var order = [];
    var map = {};
    SESSIONS.forEach(function (row) {
      if (!map[row.item_id]) {
        map[row.item_id] = { item_id: row.item_id, item_name: row.item_name, seconds: 0, sessions: [] };
        order.push(map[row.item_id]);
      }
      map[row.item_id].seconds += row.duration_seconds;
      map[row.item_id].sessions.push(row);
    });
    return order;
  }

  /* SHARE_FN 占比分母 = 全部科目秒数之和。 */
  function shareBase(groups) {
    return groups.reduce(function (s, g) { return s + g.seconds; }, 0);
  }

  function sharePercents(groups) {
    var total = shareBase(groups);
    if (!total) return groups.map(function () { return 0; });
    var raw = groups.map(function (g) { return g.seconds / total * 100; });
    var rawSum = raw.reduce(function (a, b) { return a + b; }, 0);
    if (Math.abs(rawSum - 100) > 0.01) {
      return raw.map(function (n) { return Math.round(n); });
    }
    var floors = raw.map(function (n) { return Math.floor(n); });
    var left = 100 - floors.reduce(function (a, b) { return a + b; }, 0);
    var rank = raw.map(function (n, i) { return { i: i, r: n - Math.floor(n) }; });
    rank.sort(function (a, b) { return b.r - a.r || a.i - b.i; });
    for (var k = 0; k < left; k++) floors[rank[k].i] += 1;
    return floors;
  }

  function tempoLabel(sessions) {
    var bpms = sessions.map(function (s) { return s.tempo_bpm; });
    var lo = Math.min.apply(null, bpms);
    var hi = Math.max.apply(null, bpms);
    return lo === hi ? String(lo) : (lo + '–' + hi);
  }

  function buildView() {
    var groups = groupSubjects();
    var shares = sharePercents(groups);
    var practice = practiceSeconds();
    var delta = signedDelta(practice, SUMMARY.yesterday_seconds);
    var sign = delta > 0 ? '+' : delta < 0 ? '−' : '';
    var tone = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
    return {
      groups: groups,
      shares: shares,
      shareSum: shares.reduce(function (a, b) { return a + b; }, 0),
      spanMinutes: SUMMARY.span_minutes,
      practiceMinutes: minutesOf(practice),
      deltaMinutes: minutesOf(Math.abs(delta)),
      sign: sign,
      tone: tone,
      collapsedRows: groups.length,
      expandedRows: groups.length + SESSIONS.length
    };
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function paintHero(view) {
    document.getElementById('heroSpan').textContent = String(view.spanMinutes);
    document.getElementById('heroPractice').textContent = String(view.practiceMinutes);
    var delta = document.getElementById('heroDelta');
    delta.textContent = view.sign + String(view.deltaMinutes);
    delta.className = 'v delta ' + view.tone;
    var yMin = minutesOf(SUMMARY.yesterday_seconds);
    var focus = SUMMARY.span_minutes ? Math.round(practiceSeconds() / (SUMMARY.span_minutes * 60) * 100) : 0;
    var deltaPct = SUMMARY.yesterday_seconds ? Math.round(Math.abs(signedDelta(practiceSeconds(), SUMMARY.yesterday_seconds)) / SUMMARY.yesterday_seconds * 100) : 0;
    document.getElementById('heroDeltaNote').textContent = view.tone === 'up'
      ? ('昨日 ' + yMin + ' 分 · 多 ' + deltaPct + '%')
      : view.tone === 'down'
        ? ('昨日 ' + yMin + ' 分 · 少 ' + deltaPct + '%')
        : ('昨日 ' + yMin + ' 分');
    document.getElementById('heroPractice').nextElementSibling.textContent = '累计 ' + practiceSeconds() + ' 秒 · 专注 ' + focus + '%';
  }

  function shareCell(share) {
    var cell = el('span', 'c-share');
    cell.appendChild(el('span', 'num', share + '%'));
    var track = el('span', 'bar');
    var fill = document.createElement('i');
    fill.dataset.pct = String(share);
    fill.style.width = Math.round(share * 48 / 100) + 'px'; /* BAR_PX */
    track.appendChild(fill);
    cell.appendChild(track);
    return cell;
  }

  function metaCell(tempoText, onceText) {
    var meta = el('span', 'c-meta');
    meta.appendChild(el('span', 'c-tempo num', tempoText));
    meta.appendChild(el('span', 'c-once num', onceText));
    return meta;
  }

  function subjectRow(group, share) {
    var row = el('div', 'rec-row subject cols');
    row.appendChild(el('span', 'c-name', group.item_name));
    row.appendChild(el('span', 'c-total num', minutesOf(group.seconds) + ' 分'));
    row.appendChild(metaCell(tempoLabel(group.sessions), group.sessions.length + ' 次'));
    row.appendChild(el('span', 'c-detail', '—'));
    row.appendChild(shareCell(share));
    return row;
  }

  function sessionRow(session) {
    var row = el('div', 'rec-row session cols');
    row.appendChild(el('span', 'c-name', session.item_name));
    row.appendChild(el('span', 'c-total num', '—'));
    row.appendChild(metaCell(String(session.tempo_bpm), minutesOf(session.duration_seconds) + ' 分'));
    var detail = el('span', 'c-detail');
    if (session.is_extra) detail.appendChild(el('span', 'tag', '补录'));
    detail.appendChild(document.createTextNode(session.content + (session.reps ? ' · ' + session.reps + ' 遍' : '')));
    row.appendChild(detail);
    row.appendChild(el('span', 'c-share num', '—'));
    return row;
  }

  function render() {
    var view = buildView();
    paintHero(view);
    var host = document.getElementById('rows');
    host.textContent = '';
    view.groups.forEach(function (group, i) {
      host.appendChild(subjectRow(group, view.shares[i]));
      if (expanded) {
        group.sessions.forEach(function (session) { host.appendChild(sessionRow(session)); });
      }
    });
    document.getElementById('btnFold').classList.toggle('is-on', !expanded);
    document.getElementById('btnOpen').classList.toggle('is-on', expanded);
    document.getElementById('btnFold').setAttribute('aria-pressed', expanded ? 'false' : 'true');
    document.getElementById('btnOpen').setAttribute('aria-pressed', expanded ? 'true' : 'false');
    return view;
  }

  /* 261015b：卡内边缘模糊层和展开遮罩已删除。列表只在 popout 里阅读。 */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function specFailures(view) {
    var failures = [];
    var practice = practiceSeconds();
    var wantSign = practice > SUMMARY.yesterday_seconds ? '+' : practice < SUMMARY.yesterday_seconds ? '−' : '';
    var wantTone = practice > SUMMARY.yesterday_seconds ? 'up' : practice < SUMMARY.yesterday_seconds ? 'down' : 'flat';
    if (view.sign !== wantSign) failures.push('ASSERT_FAIL sign: got ' + view.sign + ' want ' + wantSign);
    if (view.tone !== wantTone) failures.push('ASSERT_FAIL tone: got ' + view.tone + ' want ' + wantTone);
    if (view.shareSum !== 100) failures.push('ASSERT_FAIL shareSum: got ' + view.shareSum + ' want 100');
    var dom = document.querySelectorAll('.rec-row').length;
    var wantDom = expanded ? view.expandedRows : view.collapsedRows;
    if (dom !== wantDom) failures.push('ASSERT_FAIL rows: got ' + dom + ' want ' + wantDom);
    return failures;
  }

  function writeAudit(view) {
    var failures = specFailures(view);
    var shareBars = [];
    document.querySelectorAll('.rec-row.subject .bar i').forEach(function (fill) {
      var pct = parseInt(fill.dataset.pct, 10);
      var barPx = Math.round(fill.getBoundingClientRect().width);
      var want = Math.round(pct * 48 / 100);
      shareBars.push({ pct: pct, barPx: barPx });
      if (Math.abs(barPx - want) > 1) {
        failures.push('ASSERT_FAIL shareBar: pct ' + pct + ' barPx ' + barPx + ' want ' + want);
      }
    });
    var payload = {
      ok: failures.length === 0,
      collapsedRows: view.collapsedRows,
      expandedRows: view.expandedRows,
      domRows: document.querySelectorAll('.rec-row').length,
      expanded: expanded,
      hero: {
        spanMinutes: view.spanMinutes,
        practiceMinutes: view.practiceMinutes,
        deltaMinutes: view.deltaMinutes,
        sign: view.sign,
        tone: view.tone
      },
      shareSum: view.shareSum,
      shareBars: shareBars,
      blurMethod: 'none',
      failures: failures
    };
    var pre = document.getElementById('audit');
    if (!pre) {
      pre = document.createElement('pre');
      pre.id = 'audit';
      pre.style.whiteSpace = 'pre-wrap';
      pre.style.overflowWrap = 'anywhere';
      pre.style.maxWidth = '100%';
      pre.style.margin = '0';
      document.body.appendChild(pre);
    }
    pre.textContent = (failures.length ? failures.join('\n') + '\n' : 'ASSERT_OK\n') + JSON.stringify(payload);
  }

  var auditTimer = 0;
  function publishAudit() {
    if (qs.get('audit') !== '1') return;
    clearTimeout(auditTimer);
    auditTimer = setTimeout(function () { writeAudit(buildView()); }, 200);
  }

  function switchExpanded(next) {
    if (next === expanded) return;
    expanded = next;
    var view = render();
    if (!reduceMotion && window.gsap) {
      gsap.fromTo(document.getElementById('rows'), { opacity: 0.7, y: next ? 4 : -4 }, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' });
    }
    publishAudit(view);
  }

  /* 261015b：折叠/展开按钮不再改卡内列表。明细在 popout。 */
  document.getElementById('scroller').addEventListener('scroll', publishAudit, { passive: true });

  var VP = { '1133x744': [1133, 744], '744x1133': [744, 1133], '440x956': [440, 956] };
  document.getElementById('vpSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var pair = VP[b.dataset.vp];
    document.documentElement.style.setProperty('--vp-w', pair[0] + 'px');
    document.documentElement.style.setProperty('--vp-h', pair[1] + 'px');
    document.querySelectorAll('#vpSeg button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
  });
  document.getElementById('skinSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.skin === 'ink') document.documentElement.dataset.skin = 'ink';
    else delete document.documentElement.dataset.skin;
    document.querySelectorAll('#skinSeg button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
  });

  publishAudit(render());
})();
</script>

  .req-deck-stage.is-deck-dragging .deck-card:not(.is-dragging):not(.is-next-card) {

        </div>

        <div class="card-segments-bar">${segHtml}</div>

        <div class="card-req-body">
          ${paragraphsHtml}
        </div>

        <div class="card-note-box">
          <strong>老师备忘：</strong>${item.teacher_note}
        </div>

        <div class="card-footer-row">
          <div class="card-teacher-sig">指导教师：李老师</div>
          <div>第 ${ASSIGNMENTS_DATA.length - index} 课 ${item.is_latest ? '(最新)' : ''}</div>
        </div>
      `;
    }

    /* ═════════════════════════════════════════════════════════
       3D 卡叠 (Deck) 渲染：静态只展示前 3 张，无重叠杂乱
       ═════════════════════════════════════════════════════════ */
    function renderDeck() {
      stage.innerHTML = '';
      stage.classList.remove('is-deck-dragging');
      isCurrentlyDragging = false;

      const visibleCount = 3;
      const total = ASSIGNMENTS_DATA.length;

      // 逆序插入 DOM，确保 index 小的在最上面
      for (let i = Math.min(total - 1, currentIndex + visibleCount - 1); i >= currentIndex; i--) {
        const item = ASSIGNMENTS_DATA[i];
        const card = document.createElement('div');
        card.className = 'deck-card';
        card.innerHTML = createCardMarkup(item, i);
        card.dataset.index = i;

        const stackOffset = i - currentIndex; // 0 是最顶层卡片
        if (stackOffset === 1) {
          card.classList.add('is-next-card');
        }
        const z = -stackOffset * 28;
        const y = stackOffset * 10;
        const scale = 1 - stackOffset * 0.035;
        const opacity = stackOffset === 0 ? 1 : (stackOffset === 1 ? 0.85 : 0.45);

        // 使用 translate3d 保证 GPU 渲染
        card.style.transform = `translate3d(0px, ${y}px, ${z}px) scale(${scale})`;
        card.style.opacity = opacity;

        // 仅顶层卡片绑定左右滑动抛飞手势
        if (stackOffset === 0) {
          bindCardDrag(card);
        }

        stage.appendChild(card);
      }

      updateControls();
    }

    /* ═════════════════════════════════════════════════════════
       C2 / D4-1: 拖动抛飞 (Swipe Discard) —— 硬件加速 + 露出下一张卡
       拖动期允许露出下一张卡 (Peek)，其余深层卡完全隐藏；松手落定
       ═════════════════════════════════════════════════════════ */
    function bindCardDrag(card) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let currentX = 0, currentY = 0;

      const onPointerDown = (e) => {
        if (e.target.closest && e.target.closest('.card-req-body')) return;
        isDragging = true;
        isCurrentlyDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        currentX = 0;
        currentY = 0;

        card.classList.add('is-dragging');
        stage.classList.add('is-deck-dragging');

        if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
      };

      const onPointerMove = (e) => {
        if (!isDragging) return;
        currentX = e.clientX - startX;
        currentY = e.clientY - startY;

        // 硬件加速 translate3d 直接写入，零 GSAP 帧延迟
        const rot = currentX * 0.045;
        card.style.transform = `translate3d(${currentX}px, ${currentY * 0.15}px, 0px) rotate(${rot}deg)`;

        // D4-1: 随拖动位移逐渐放大并浮现下一张卡片 (Peek)
        const nextCard = stage.querySelector('.deck-card.is-next-card');
        if (nextCard) {
          const progress = Math.min(1, Math.abs(currentX) / 120);
          const nextY = 10 * (1 - progress * 0.7);
          const nextZ = -28 * (1 - progress * 0.7);
          const nextScale = 0.965 + progress * 0.035;
          const nextOpacity = 0.85 + progress * 0.15;
          nextCard.style.transform = `translate3d(0px, ${nextY}px, ${nextZ}px) scale(${nextScale})`;
          nextCard.style.opacity = nextOpacity;
        }
      };

      const onPointerUp = (e) => {
        if (!isDragging) return;
        isDragging = false;
        isCurrentlyDragging = false;
        if (card.releasePointerCapture) {
          try { card.releasePointerCapture(e.pointerId); } catch(err) {}
        }

        // 判定阈值：水平移动超 85px 划走卡片切下一张
        if (Math.abs(currentX) > 85 && currentIndex < ASSIGNMENTS_DATA.length - 1) {
          const dir = currentX > 0 ? 1 : -1;
          const nextCard = stage.querySelector('.deck-card.is-next-card');
          if (nextCard && window.gsap) {
            gsap.to(nextCard, {
              y: 0,
              scale: 1,
              opacity: 1,
              duration: 0.22,
              ease: "power2.out"
            });
          }
          if (window.gsap) {
            gsap.to(card, {
              x: dir * 550,
              y: currentY * 0.15 + 20,
              rotationZ: dir * 20,
              opacity: 0,
              duration: 0.22,
              ease: "power2.in",
              onComplete: () => {
                currentIndex++;
                renderDeck();
              }
            });
          } else {
            currentIndex++;
            renderDeck();
          }
        } else {
          // 弹簧回弹归位
          const nextCard = stage.querySelector('.deck-card.is-next-card');
          if (nextCard && window.gsap) {
            gsap.to(nextCard, {
              y: 10,
              scale: 0.965,
              opacity: 0.85,
              duration: 0.22,
              ease: "power3.out"
            });
          }
          if (window.gsap) {
            gsap.to(card, {
              x: 0,
              y: 0,
              rotationZ: 0,
              duration: 0.22,
              ease: "power3.out",
              onComplete: () => {
                card.classList.remove('is-dragging');
                stage.classList.remove('is-deck-dragging');
                renderDeck();
              }
            });
          } else {
            card.classList.remove('is-dragging');
            stage.classList.remove('is-deck-dragging');
            renderDeck();
          }
        }
      };

      card.addEventListener('pointerdown', onPointerDown);
      card.addEventListener('pointermove', onPointerMove);
      card.addEventListener('pointerup', onPointerUp);
      card.addEventListener('pointercancel', onPointerUp);
    }

    /* ═════════════════════════════════════════════════════════
       导航与指示点交互
       ═════════════════════════════════════════════════════════ */
    function updateControls() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (prevBtn) prevBtn.disabled = (currentIndex === 0);
      if (nextBtn) nextBtn.disabled = (currentIndex === ASSIGNMENTS_DATA.length - 1);

      const badge = document.getElementById('cardCounterBadge');
      if (badge) badge.textContent = `${currentIndex + 1} / ${ASSIGNMENTS_DATA.length}`;

      const dotsContainer = document.getElementById('deckDots');
      if (dotsContainer) {
        dotsContainer.innerHTML = '';
        ASSIGNMENTS_DATA.forEach((_, idx) => {
          const dot = document.createElement('div');
          dot.className = 'deck-dot' + (idx === currentIndex ? ' active' : '');
          dot.onclick = () => {
            currentIndex = idx;
            renderDeck();
          };
          dotsContainer.appendChild(dot);
        });
      }
    }

    function navPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderDeck();
      }
    }

    function navNext() {
      if (currentIndex < ASSIGNMENTS_DATA.length - 1) {
        currentIndex++;
        renderDeck();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') navPrev();
      if (e.key === 'ArrowRight') navNext();
    });

    /* ═════════════════════════════════════════════════════════
       视口与换肤辅助
       ═════════════════════════════════════════════════════════ */
    function setViewport(vpKey) {
      document.getElementById('stageFrame').dataset.vp = vpKey;
      document.querySelectorAll('#vpPills .pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(vpKey));
      });
    }

    function setSkin(skin) {
      document.documentElement.dataset.skin = (skin === 'ink' ? 'ink' : '');
      document.querySelectorAll('#skinPills .pill-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['light', 'ink'][idx] === skin);
      });
    }

    /* ═════════════════════════════════════════════════════════
       契约级自检引擎 (?audit=1)
       C1: 三档卡宽真实互不相等断言
       C2: 拖动中可见层 <= 2，松手 200ms 内无叠层残留
       ═════════════════════════════════════════════════════════ */
    function runContractAudit() {
      const chassis = document.getElementById('reqChassis');
      const fails = [];

      // 断言 1：deck 总张数 = 6
      const deckCount = ASSIGNMENTS_DATA.length;
      if (deckCount !== 6) fails.push(`deckCount want 6 got ${deckCount}`);

      // 断言 2：当前卡初始索引 = 0
      const initIdx = currentIndex;
      if (initIdx !== 0) fails.push(`initIdx want 0 got ${initIdx}`);

      // 断言 3：切换后索引变化
      navNext();
      const nextIdx = currentIndex;
      navPrev();
      if (nextIdx !== 1) fails.push(`nextIdx want 1 got ${nextIdx}`);

      // 断言 4 (C1)：三档视口卡宽真实互不相等
      setViewport('1133x744');
      const w1133 = chassis.getBoundingClientRect().width;
      setViewport('744x1133');
      const w744 = chassis.getBoundingClientRect().width;
      setViewport('440x956');
      const w440 = chassis.getBoundingClientRect().width;
      setViewport('1133x744'); // 恢复

      const widthsDifferent = (w1133 !== w744) && (w744 !== w440) && (w1133 !== w440);
      if (!widthsDifferent) {
        fails.push(`three viewports width must differ: 1133(${w1133}), 744(${w744}), 440(${w440})`);
      }

      // 断言 5 (C2 / D4-1)：拖动中可见层数 <= 2 (拖动卡 1 张 + 下一层露出卡 1 张 = 2 层)
      const topCard = stage.querySelector('.deck-card[data-index="' + currentIndex + '"]');
      stage.classList.add('is-deck-dragging');
      if (topCard) topCard.classList.add('is-dragging');

      const visibleCardsDuringDrag = Array.from(stage.querySelectorAll('.deck-card')).filter(c => {
        const style = window.getComputedStyle(c);
        return style.display !== 'none' && style.visibility !== 'hidden' && parseFloat(style.opacity) > 0.01;
      });
      const dragLayerCount = visibleCardsDuringDrag.length;
      if (dragLayerCount > 2) {
        fails.push(`dragVisibleLayers want <= 2, got ${dragLayerCount}`);
      }

      // D4-1 断言：拖动到阈值 (85px) 时露出下一张卡 (可见且暴露面积 > 0)
      const testTopCard = stage.querySelector('.deck-card[data-index="' + currentIndex + '"]');
      const testNextCard = stage.querySelector('.deck-card.is-next-card');
      if (testTopCard) {
        testTopCard.style.transform = 'translate3d(90px, 10px, 0px) rotate(4deg)';
      }
      if (testNextCard) {
        testNextCard.style.transform = 'translate3d(0px, 4px, -10px) scale(0.99)';
        testNextCard.style.opacity = '0.96';
      }
      let nextVisibleArea = 0;
      let nextIsVisible = false;
      if (testNextCard && testTopCard) {
        const nextStyle = window.getComputedStyle(testNextCard);
        nextIsVisible = (nextStyle.visibility !== 'hidden') && (parseFloat(nextStyle.opacity) > 0.1);
        const topR = testTopCard.getBoundingClientRect();
        const nextR = testNextCard.getBoundingClientRect();
        // 顶层卡向右移 90px，露出左侧区域
        const exposedW = Math.max(0, topR.left - nextR.left);
        nextVisibleArea = exposedW * nextR.height;
      }
      if (!nextIsVisible || nextVisibleArea <= 0) {
        fails.push(`D4-1 fail: next card must peek during drag at threshold: visible=${nextIsVisible}, exposedArea=${nextVisibleArea.toFixed(1)} (want > 0)`);
      }

      // 恢复静态
      stage.classList.remove('is-deck-dragging');
      if (topCard) {
        topCard.classList.remove('is-dragging');
        topCard.style.transform = 'translate3d(0px, 0px, 0px) scale(1)';
      }
      if (testNextCard) {
        testNextCard.style.transform = 'translate3d(0px, 10px, -28px) scale(0.965)';
        testNextCard.style.opacity = '0.85';
      }

      // 断言 6 (C2)：释放后无叠层残留 (ghost layers = 0)
      const ghostLayers = Array.from(stage.querySelectorAll('.deck-card.is-dragging')).length;
      if (ghostLayers !== 0) {
        fails.push(`ghost layers after release want 0, got ${ghostLayers}`);
      }

      // D4-2 断言：deck-dots 当前点与前后点清晰度，尺寸差 <= 1 档，对比度均 >= 3.0:1
      const dots = Array.from(document.querySelectorAll('.deck-dot'));
      const activeDot = document.querySelector('.deck-dot.active');
      const inactiveDots = dots.filter(d => !d.classList.contains('active'));
      let dotSizeDelta = 0;
      let minDotContrast = 99;
      if (activeDot && inactiveDots.length > 0) {
        const aRect = activeDot.getBoundingClientRect();
        const inRect = inactiveDots[0].getBoundingClientRect();
        dotSizeDelta = Math.abs(aRect.width - inRect.width);
        if (dotSizeDelta > 1.5) {
          fails.push(`D4-2 fail: deck dot size delta want <= 1 step (<= 1.5px), got ${dotSizeDelta.toFixed(1)}px (active: ${aRect.width}px, inactive: ${inRect.width}px)`);
        }
        const inactiveStyle = window.getComputedStyle(inactiveDots[0]);
        const inactiveBg = inactiveStyle.backgroundColor;
        function getLum(rgbaStr, elemOpacity) {
          const m = rgbaStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
          if (!m) return 0.5;
          let r = parseInt(m[1]), g = parseInt(m[2]), b = parseInt(m[3]);
          let a = (m[4] !== undefined ? parseFloat(m[4]) : 1) * (elemOpacity !== undefined ? elemOpacity : 1);
          r = Math.round(r * a + 240 * (1 - a));
          g = Math.round(g * a + 243 * (1 - a));
          b = Math.round(b * a + 246 * (1 - a));
          const toLin = v => { const c = v / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
          return 0.2126 * toLin(r) + 0.7152 * toLin(g) + 0.0722 * toLin(b);
        }
        const chLum = 0.89;
        const inLum = getLum(inactiveBg, parseFloat(inactiveStyle.opacity) || 1);
        const l1 = Math.max(chLum, inLum), l2 = Math.min(chLum, inLum);
        const contrast = (l1 + 0.05) / (l2 + 0.05);
        minDotContrast = contrast;
        if (contrast < 3.0) {
          fails.push(`D4-2 fail: inactive dot contrast against chassis want >= 3.0:1, got ${contrast.toFixed(2)}:1 (bg: ${inactiveBg})`);
        }
      } else {
        fails.push('D4-2 fail: deck dots missing active or inactive elements');
      }

      // 断言 7：机身无横向溢出
      const noHOverflow = chassis.scrollWidth <= chassis.clientWidth;
      if (!noHOverflow) fails.push(`horizontal overflow: scrollWidth ${chassis.scrollWidth} > clientWidth ${chassis.clientWidth}`);

      const verdict = fails.length === 0 ? 'ASSERT_OK' : 'ASSERT_FAIL';
      const out = {
        deckCount,
        initIdx,
        nextIdx,
        widths: { w1133, w744, w440 },
        widthsDifferent,
        dragLayerCount,
        nextVisibleArea: parseFloat(nextVisibleArea.toFixed(1)),
        dotSizeDelta: parseFloat(dotSizeDelta.toFixed(1)),
        minDotContrast: parseFloat(minDotContrast.toFixed(2)),
        ghostLayers,
        noHOverflow,
        fails,
        verdict
      };

      const logEl = document.getElementById('auditLog');
      const verdictEl = document.getElementById('auditVerdict');
      if (logEl) logEl.textContent = JSON.stringify(out, null, 2);
      if (verdictEl) {
        verdictEl.textContent = verdict;
        verdictEl.style.color = (verdict === 'ASSERT_OK') ? 'var(--dash-battery)' : 'var(--dash-coral)';
      }
      return out;
    }

    window.__czQText = function () {
      var bad = [];
      var nodes = document.body ? document.body.querySelectorAll('*') : [];
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var st = getComputedStyle(el);
        if (st.display === 'none' || st.visibility === 'hidden') { continue; }
        if (!(el.clientWidth > 0)) { continue; }
        var onlyText = (el.childElementCount === 0) && ((el.textContent || '').trim().length > 0);
        if (!onlyText) { continue; }
        if (el.scrollWidth > el.clientWidth + 1) {
          bad.push({ text: (el.textContent || '').trim().slice(0, 32), sw: el.scrollWidth, cw: el.clientWidth, cls: el.className || el.tagName });
        }
      }
      return { ok: bad.length === 0, n: bad.length, bad: bad.slice(0, 12) };
    };

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderDeck();
      if (new URLSearchParams(location.search).has('audit')) {
        setTimeout(runContractAudit, 200);
      }
    });
  </script>
</body>

  };
  var MOD_KEYS = MODS.map(function (m) { return m.k; });
  var MOD_BY_KEY = {}; MODS.forEach(function (m) { MOD_BY_KEY[m.k] = m; });
  /* S14 批注2：自定义档（off）下今日时长卡过高过宽、大片空白——收窄成竖条卡（宽 288），
     元素竖排由 @container / cz-expand 断点接管。组合档仍用 380 宽。 */

      card.style.setProperty('bottom', 'auto', 'important');
      card.style.removeProperty('transform');
      card.style.setProperty('left', '50%', 'important');
      card.style.setProperty('--cz-card-inset', cardInset + 'px');
      /* 孔上沿在冠内的坐标 = 冠高 − 孔高（S17+S19：全视口统一窄孔，孔贴在冠底，卡从孔中穿过） */
      var holeTopInWrap = slotFullH - slotLipH;
      var maskTopPx = cardRise + holeTopInWrap + slotLipH * 0.5;
      card.style.setProperty('--cz-card-mask-top', maskTopPx.toFixed(1) + 'px');
      card.dataset.cardMaskTop = maskTopPx.toFixed(1);
      card.dataset.cardMaskAtHoleMid = '1';
      cd.documentElement.style.setProperty('--cz-card-inset', cardInset + 'px');
      card.dataset.cardWidth = String(cardW);
      card.dataset.cardHeight = String(cardH);
      card.dataset.fullHeight = String(cardH);
      card.dataset.exposedHeight = String(exposedH);
      card.dataset.slotHeight = String(slotH);
      card.dataset.cardTop = String(-cardRise);
      card.dataset.slotLipHeight = String(slotLipH);
      card.dataset.slotHoleHeight = String(slotLipH);
      card.dataset.slotHoleTop = String(holeTopInWrap);
      card.dataset.aspectRatio = '1.586';
      card.dataset.exposedRatio = (exposedH / cardH).toFixed(3);
      card.dataset.cardInset = String(cardInset);
      card.classList.toggle('is-compact', isCompact);
    }
    var exposedBar = cd.getElementById('pkCardExposedBar');
    if (exposedBar) {
      exposedBar.classList.toggle('is-compact', isCompact);
    }
    var aFrame = aWrap.querySelector(':scope > iframe');
    /* 窄档卡片高度由 sizeFeedCard() 按内容测量并锁定。
       这里不再读 iframe 内联的 height:100%（parseFloat 会误当成 100px），
       否则组合切换时新 iframe 会在 load 前被提前锁成 100px。 */
    /* 宽档组合 1：卡冠塞进原高度后，底部暂停/结束会被裁掉。按实际溢出把盒子加高。 */
    if (aFrame) {
      try {
        var dd = aFrame.contentDocument;
        var need = 0;
        if (dd) {
          ['#knob', '#transport', '#diagCard'].forEach(function (sel) {
            var el = dd.querySelector(sel);
            if (!el) { return; }
            need = Math.max(need, el.getBoundingClientRect().bottom);
          });
          var client = dd.documentElement.clientHeight || 0;
          var overflow = Math.ceil(need - client);
          if (overflow > 4 && client > 40) {
            var frameH = Math.ceil(aFrame.getBoundingClientRect().height + overflow + 12);
            var framePx = frameH + 'px';
            aFrame.style.setProperty('flex', '0 0 ' + framePx, 'important');
            aFrame.style.setProperty('height', framePx, 'important');
            aFrame.style.setProperty('min-height', framePx, 'important');
            aWrap.style.setProperty('height', Math.round(frameH) + 'px', 'important');
            aWrap.style.setProperty('max-height', 'none', 'important');
            var astack = aWrap.parentElement;
            if (astack && astack.classList.contains('cz-astack')) {
              var cur = parseFloat(astack.style.height);
              if (cur > 0) {
                astack.style.height = Math.round(cur + overflow + 12) + 'px';
                astack.style.maxHeight = 'none';
              }
            }
          }
        }
      } catch (e2) {}
    }
  }

  /* 窄档弹窗贴在父页面当前看得见的那一截里。iframe 本身可能有几千像素高，100vh 会把面板钉在画布中段外面。 */
  function placePopout() {
    var cd = canvasDoc();
    var bd = popEl();
    if (!cd || !bd) { return null; }
    var panel = bd.querySelector('.popout-panel');
    var body = bd.querySelector('.popout-body');
    if (!panel) { return null; }
    var narrow = !!(cd.documentElement.clientWidth < NARROW && !NEG_STACK);
    var panelKeys = ['top', 'left', 'right', 'bottom', 'width', 'height', 'max-height', 'transform'];
    if (!narrow) {
      panelKeys.forEach(function (k) { panel.style.removeProperty(k); });
      if (body) { ['overflow', 'min-height', 'flex', 'max-height'].forEach(function (k) { body.style.removeProperty(k); }); }
      return { narrow: false };
    }
    var ir = canvasIframe.getBoundingClientRect();
    var visTop = Math.max(0, -ir.top);
    var visBot = Math.min(ir.height, window.innerHeight - ir.top);
    if (!(visBot > visTop + 80)) {
      visBot = Math.min(ir.height, visTop + Math.max(320, window.innerHeight - 32));
    }
    var top = Math.round(visTop + 8);
    var height = Math.max(240, Math.round(visBot - visTop - 16));
    panel.style.setProperty('top', top + 'px', 'important');
    panel.style.setProperty('left', '8px', 'important');
    panel.style.setProperty('right', '8px', 'important');
    panel.style.setProperty('bottom', 'auto', 'important');
    panel.style.setProperty('width', 'auto', 'important');
    panel.style.setProperty('transform', 'none', 'important');
    panel.style.setProperty('height', height + 'px', 'important');
    panel.style.setProperty('max-height', height + 'px', 'important');
    if (body) {
      body.style.setProperty('overflow', 'hidden', 'important');
      body.style.setProperty('min-height', '0', 'important');
      body.style.setProperty('flex', '1 1 auto', 'important');
    }
    return { narrow: true, top: top, height: height, visTop: Math.round(visTop), visBot: Math.round(visBot) };
  }

  /* 票卡视觉盒：.pk-ticket（dad / hermes 量的就是这张），不是会跟着舞台 stretch 的列 */

  /* 列内分高。780 表：组合 1 上格 440，组合 2/3 时长卡 460。余量给下层，top+gap+bot = H。 */
  function splitTop(H, num, den) {
    var top = Math.round(H * num / den);

          rView.setBpm = function (next) {

            var nowN = rightBpm();
            if (nowN !== null) { api.tempo(nowN, 'right_metro'); }
            return ret;
          };
          rView.__czSetBpmWrapped = true;
        }
      } else if (shown !== null && lastRight === null) {
        lastRight = shown;
      }
      var d = dashDoc2();
      if (d && d.documentElement.dataset.czBusDur !== '1') {
        d.documentElement.dataset.czBusDur = '1';
        var input = d.getElementById('rulerInput');
        if (input) {

    function bindDash() {
      var d = dashDoc2();
      if (!d || !d.documentElement || !d.getElementById('bpmRead')) { return; }
      var wantBpm = leftBpm();
      if (wantBpm && dashBpm() !== wantBpm) {
        applying++;
        try { setDashBpmAbsolute(wantBpm); } finally { applying--; }
      }
      if (d.documentElement.dataset.czBusDash === '1') {
        if (lastDash === null) { lastDash = dashBpm(); }
        return;
      }
      d.documentElement.dataset.czBusDash = '1';
      var frameA = modFrame('A');
      if (frameA && d.body && d.body.children.length > 0) { frameA.dataset.czLoaded = '1'; }
      lastDash = dashBpm();
      var view = d.defaultView;
      if (view && typeof view.setBpm === 'function' && !view.__czSetBpmWrapped) {
        var origSet = view.setBpm;
        view.setBpm = function (next) {
          var beforeN = dashBpm();
          var ret = origSet.apply(view, arguments);
          var afterN = dashBpm();
          if (applying) { lastDash = afterN; return ret; }
          if (afterN !== null && beforeN !== null && afterN !== beforeN) { api.tempo(afterN, 'right_dash_bpm'); }
          return ret;
        };

    api.rebind = function () { bindLeft(); bindRight(); bindDash(); settleAfterReady(); paintMirror(); syncReadyFromCanvas(); };
    window.DizicalPracticeBus = api;

  function injectCanvas() {

  /* ── 模块列：卡槽条 + 卡片单行轨 ── */

  function buildRail() {
    var col = railEl();

    /* 261012c 第 1 条：卡槽形态等 agy 规格 —— 本批只留静态占位 + 一个极简触发按钮，无任何动画 */

  function applySelection() {
    var col = railEl();
    if (!col) { return; }
    var cd = canvasDoc();
    parkSlot(cd);
    applyDCollapsedWidth();
    applyDCollapsedWidth();
    if (state.combo !== 'off') {

  function modDoc(f) { try { return f.contentDocument; } catch (e) { return null; } }

  function rebindBus() {
    var cd = canvasDoc();
    var api = cd && cd.defaultView ? cd.defaultView.DizicalPracticeBus : null;
    if (api && api.rebind) { try { api.rebind(); } catch (e) {} }
  }
  var narrowSizing = false;
  var pendingNarrow = false;
  var narrowRemeasureRaf = 0;
  var narrowRemeasureTimer = 0;
  function scheduleNarrowRemeasure() {
    var cd = canvasDoc();
    if (!cd || cd.documentElement.clientWidth >= NARROW || NEG_STACK) { return; }
    if (narrowRemeasureRaf) { cancelAnimationFrame(narrowRemeasureRaf); }
    narrowRemeasureRaf = requestAnimationFrame(function () {
      narrowRemeasureRaf = 0;
      remeasureNarrow();
    });
    clearTimeout(narrowRemeasureTimer);
    narrowRemeasureTimer = setTimeout(function () {
      narrowRemeasureTimer = 0;
      remeasureNarrow();
    }, 240);
  }
  function remeasureNarrow() {
    if (NEG_STACK) { return; }
    if (narrowSizing) { pendingNarrow = true; return; }
    var cd = canvasDoc();
    if (!cd || cd.documentElement.clientWidth >= NARROW) { return; }
    narrowSizing = true;
    try {
      if (state.combo === 'off') {
        var rail = cardsRailEl();
        if (rail) {
          [].slice.call(rail.querySelectorAll('.cz-mod')).forEach(function (n) {
            if (n.hidden || n.offsetParent === null) { return; }
            var f = n.querySelector(':scope > iframe');
            if (f) { applyModuleState(f); }
            sizeFeedCard(n);
          });
        }
      } else {
        applyComboSizes();
      }
      syncCanvasHeight();
      alignColTop();
    } finally {
      narrowSizing = false;
      if (pendingNarrow) { pendingNarrow = false; remeasureNarrow(); }
    }
  }
  function onModuleLoad(f) {
    applyModuleState(f);
    applyPanelPad(f);
    syncModuleHeight(f);
    /* S17：Card A 装载完成后立刻把票夹当前练习项目同步到仪表盘黑屏标题
       （否则准备态一直显示卡片模板里的默认曲目名）。 */
    syncDashCoverOuter();
    /* srcdoc 的 DOMContentLoaded 排点时 cz-land 还没加上。类名落地后再排一次。 */
    pokeArcFrame(f);
    requestAnimationFrame(function () { pokeArcFrame(f); });
    bridgeCanvas();   /* Card A 装载后装桥（按钮在卡内，卡载完才存在） */
    var d = modDoc(f);
    if (d && d.body && d.body.children.length) { f.dataset.czLoaded = '1'; }
    rebindBus();      /* 节拍器按钮在卡载完才存在；空文档不标已就绪 */
    /* srcdoc 往往在 syncAll 量高之后才有内容。窄档等卡载完再量一次，避免锁在默认 150。
       组合切换会连续重建多个 iframe，用去抖的 schedule 让最后一次布局在 240ms 后仍能校正。 */
    if (d && d.body && d.body.children.length) { scheduleNarrowRemeasure(); }
  }

  /* S17：仪表盘黑屏标题（dashCoverName）与票夹当前练习项目联动。
     联动函数 syncDashCover 定义在画布文档（票夹与 Card A 同层），
     这里从外层页跨文档调一次。 */
  function syncDashCoverOuter() {
    try {
      var cdCover = canvasDoc();
      if (cdCover && cdCover.defaultView && typeof cdCover.defaultView.syncDashCover === 'function') {
        cdCover.defaultView.syncDashCover();

  function applyLayoutMode(f, mode) {
    if (!f) { return; }
    var d = modDoc(f);
    if (!d || !d.documentElement) { return; }
    var el = d.documentElement;
    if (!mode) {
      var cd = canvasDoc();
      var track = cd ? (cd.querySelector('.cz-combo') || cd.querySelector('.cz-rail') || cd.getElementById('czModCol')) : null;
      var cs = track && cd.defaultView ? cd.defaultView.getComputedStyle(track) : null;
      var dir = cs ? cs.flexDirection : 'row';
      mode = (dir === 'column' && f.id !== 'czPopFrame') ? 'feed' : 'expand';
    }
    if (mode === 'feed') {
      el.classList.add('cz-feed');
      el.classList.remove('cz-expand');

  /* 黑区顶边让出卡槽带（卡槽罩在仪表盘黑屏顶缘，MIC/时钟行不能被压住） */
  function applyPanelPad(f) {
    if (!f || f.dataset.mod !== 'A') { return; }
    var cd = canvasDoc();
    if (!cd) { return; }
    var h = parseFloat(cd.documentElement.style.getPropertyValue('--cz-crown-h')) || 0;
    if (!(h > 0)) { return; }

    } catch (e) {}
