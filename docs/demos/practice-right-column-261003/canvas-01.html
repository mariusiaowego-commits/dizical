<!-- ══════════ Grok Session Selector 组件 ══════════ -->
<script>
/* ===== component: PracticeSessionSelector ===== */
(function () {
  var FALLBACK = ['长音练习', '吐音练习', '连吐练习', '换气练习'];
  var seq = 0;

  function parseContentOptions(raw) {
    var list = Array.isArray(raw) ? raw : String(raw == null ? '' : raw).split(/[,，]/);
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var text = String(list[i]).trim();
      if (!text || seen[text]) continue;
      seen[text] = true;
      out.push(text);
    }
    return out;
  }

  function iconPlus() {
    var wrap = document.createElement('span');
    wrap.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>';
    return wrap.firstChild;
  }

  function iconClear() {
    var wrap = document.createElement('span');
    wrap.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>';
    return wrap.firstChild;
  }

  function mount(host, opts) {
    opts = opts || {};
    var id = 'pss' + (++seq);
    var onChange = typeof opts.onChange === 'function' ? opts.onChange : function () {};
    var options = [];
    var usingFallback = false;
    var value = '';
    var open = false;
    var browseAll = true;
    var active = 0;
    var engaged = false;
    var items = [];

    var root = document.createElement('div');
    root.className = 'pss is-empty';

    var anchor = document.createElement('div');
    anchor.className = 'pss-anchor';

    var panel = document.createElement('div');
    panel.className = 'pss-panel';
    panel.id = id + '-panel';
    panel.hidden = true;
    var list = document.createElement('div');
    list.className = 'pss-list';
    list.id = id + '-list';
    list.setAttribute('role', 'listbox');
    var hl = document.createElement('span');
    hl.className = 'pss-hl';
    hl.setAttribute('aria-hidden', 'true');
    list.appendChild(hl);
    var foot = document.createElement('p');
    foot.className = 'pss-foot';
    foot.textContent = '上下键选择，回车确认';
    panel.append(list, foot);

    var bar = document.createElement('div');
    bar.className = 'pss-bar';
    var plus = document.createElement('button');
    plus.type = 'button';
    plus.className = 'pss-plus';
    plus.setAttribute('aria-label', '展开练习内容');
    plus.setAttribute('aria-expanded', 'false');
    plus.setAttribute('aria-controls', list.id);
    plus.appendChild(iconPlus());
    var input = document.createElement('input');
    input.className = 'pss-input';
    input.type = 'text';
    input.maxLength = 200;
    input.placeholder = '选一个或输入本次练习内容';
    input.setAttribute('aria-label', '本次练习内容');
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-controls', list.id);
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.enterKeyHint = 'done';
    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'pss-clear';
    clearBtn.setAttribute('aria-label', '清空本次练习内容');
    clearBtn.hidden = true;
    clearBtn.appendChild(iconClear());
    bar.append(plus, input, clearBtn);
    anchor.append(panel, bar);
    root.append(anchor);
    host.replaceChildren(root);

    function queryText() {
      return browseAll ? '' : input.value.trim();
    }

    function emit(source) {
      onChange(value, {
        source: source,
        fallback: usingFallback,
        optionCount: options.length
      });
    }

    function paint() {
      var has = value.length > 0;
      root.classList.toggle('is-empty', !has);
      root.classList.toggle('is-selected', has);
      root.classList.toggle('is-custom', has && options.indexOf(value) === -1);
      root.classList.toggle('is-fallback', usingFallback);
      root.classList.toggle('is-open', open);
      root.dataset.value = value;
      plus.setAttribute('aria-expanded', open ? 'true' : 'false');
      input.setAttribute('aria-expanded', open ? 'true' : 'false');
      clearBtn.hidden = input.value.trim().length === 0 && !has;
    }

    function selectable() {
      var q = queryText().toLowerCase();
      var shown = options.filter(function (text) {
        return !q || text.toLowerCase().indexOf(q) !== -1;
      });
      var typed = input.value.trim();
      var rows = shown.map(function (text) { return { kind: 'option', text: text }; });
      if (typed && options.indexOf(typed) === -1) rows.push({ kind: 'custom', text: typed });
      return { shown: shown, rows: rows, empty: q && shown.length === 0 };
    }

    function placeHighlight() {
      var buttons = list.querySelectorAll('.pss-row');
      var target = buttons[active];
      if (!target || !engaged) {
        hl.style.opacity = '0';
        input.removeAttribute('aria-activedescendant');
        return;
      }
      hl.style.top = target.offsetTop + 'px';
      hl.style.height = target.offsetHeight + 'px';
      hl.style.opacity = '1';
      input.setAttribute('aria-activedescendant', target.id);
      if (target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
    }

    function render() {
      var pack = selectable();
      items = pack.rows;
      if (active > items.length - 1) active = 0;
      var empty = list.querySelector('.pss-none');
      if (empty) empty.remove();
      var old = list.querySelectorAll('.pss-row');
      for (var i = 0; i < old.length; i++) old[i].remove();
      if (pack.empty) {
        var none = document.createElement('div');
        none.className = 'pss-none';
        none.textContent = '没有符合的标签';
        list.appendChild(none);
      }
      items.forEach(function (item, index) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'pss-row' + (item.kind === 'custom' ? ' pss-row-custom' : '');
        button.id = id + '-opt-' + index;
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', item.text === value ? 'true' : 'false');
        if (item.text === value) button.classList.add('is-current');
        button.textContent = item.kind === 'custom' ? '使用我输入的内容' : item.text;
        button.addEventListener('mousedown', function (event) { event.preventDefault(); });
        button.addEventListener('mouseenter', function () {
          active = index;
          engaged = true;
          placeHighlight();
        });
        button.addEventListener('click', function () { pick(index); });
        list.appendChild(button);
      });
      placeHighlight();
      paint();
    }

    function clampList() {
      list.style.maxHeight = '280px';
      var ticket = host.closest ? host.closest('.pk-ticket') : null;
      var topBound = 8;
      if (ticket) {
        var ticketRect = ticket.getBoundingClientRect();
        topBound = Math.max(8, ticketRect.top + 8);
      }
      var rect = panel.getBoundingClientRect();
      if (rect.top < topBound) {
        var listRect = list.getBoundingClientRect();
        list.style.maxHeight = Math.max(44, Math.floor(listRect.height - (topBound - rect.top))) + 'px';
      }
    }

    function openPanel() {
      if (open) {
        render();
        clampList();
        return;
      }
      open = true;
      panel.hidden = false;
      render();
      clampList();
      paint();
    }

    function closePanel() {
      if (!open) return;
      open = false;
      engaged = false;
      panel.hidden = true;
      input.removeAttribute('aria-activedescendant');
      paint();
    }

    function pick(index) {
      var item = items[index];
      if (!item) return;
      var next = item.text.trim().slice(0, 200);
      if (!next) return;
      var changed = next !== value;
      value = next;
      input.value = next;
      browseAll = false;
      closePanel();
      input.focus({ preventScroll: true });
      if (changed) emit(item.kind === 'custom' ? 'custom' : 'option');
      else paint();
    }

    function commitTyped() {
      var next = input.value.trim().slice(0, 200);
      if (!next) return;
      var kind = options.indexOf(next) === -1 ? 'custom' : 'option';
      var changed = next !== value;
      value = next;
      input.value = next;
      closePanel();
      if (changed) emit(kind);
      else paint();
    }

    function clearAll() {
      var had = value.length > 0;
      value = '';
      input.value = '';
      browseAll = true;
      closePanel();
      paint();
      render();
      if (had) emit('clear');
      input.focus({ preventScroll: true });
    }

    function setOptions(raw) {
      var parsed = parseContentOptions(raw);
      usingFallback = parsed.length === 0;
      options = usingFallback ? FALLBACK.slice() : parsed;
      render();
    }

    function setValue(next) {
      value = String(next == null ? '' : next).trim().slice(0, 200);
      input.value = value;
      browseAll = true;
      paint();
      if (open) render();
    }

    plus.addEventListener('click', function () {
      if (open && browseAll) {
        closePanel();
        return;
      }
      browseAll = true;
      active = 0;
      engaged = false;
      openPanel();
      input.focus({ preventScroll: true });
    });

    input.addEventListener('input', function () {
      browseAll = false;
      active = 0;
      engaged = false;
      openPanel();
    });

    input.addEventListener('keydown', function (event) {
      var composing = event.isComposing || event.keyCode === 229;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (!open) {
          browseAll = input.value.trim().length === 0;
          openPanel();
        }
        if (!items.length) return;
        event.preventDefault();
        engaged = true;
        active = event.key === 'ArrowDown'
          ? (active + 1) % items.length
          : (active - 1 + items.length) % items.length;
        placeHighlight();
        return;
      }
      if (event.key === 'Enter') {
        if (composing) return;
        event.preventDefault();
        if (open && items.length) pick(active);
        else commitTyped();
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        closePanel();
      }
    });

    clearBtn.addEventListener('click', clearAll);
    panel.addEventListener('mouseleave', function () {
      engaged = false;
      placeHighlight();
    });

    function onPointerDown(event) {
      if (!open) return;
      if (root.contains(event.target)) return;
      closePanel();
    }
    function onKeyDown(event) {
      if (event.key === 'Escape' && open) {
        event.preventDefault();
        closePanel();
      }
    }
    document.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('keydown', onKeyDown);

    setOptions(opts.options || []);
    setValue(opts.value || '');

    return {
      element: root,
      anchor: anchor,
      panel: panel,
      list: list,
      input: input,
      plus: plus,
      clearBtn: clearBtn,
      setOptions: setOptions,
      setValue: setValue,
      getValue: function () { return value; },
      open: function () { browseAll = true; active = 0; engaged = false; openPanel(); },
      close: closePanel,
      isOpen: function () { return open; },
      destroy: function () {
        document.removeEventListener('pointerdown', onPointerDown);
        document.removeEventListener('keydown', onKeyDown);
        root.remove();
      }
    };
  }

  window.PracticeSessionSelector = {
    mount: mount,
    parse: parseContentOptions,
    fallback: FALLBACK.slice()
  };
})();
</script>

function renderSessionPills() {
  const container = document.getElementById('pkSessionTags');
  if (!container) return;
  if (!cur) {
    container.innerHTML = '<span class="pk-empty-hint" style="font-size:12px;color:rgba(255,248,240,0.55);padding:10px 4px;display:inline-block;user-select:none;">请先在上方选择练习科目</span>';
    return;
  }
  const rawList = window.PracticeSessionSelector ? PracticeSessionSelector.parse(cur.content_options || '') : [];
  const list = rawList.length ? rawList : (window.PracticeSessionSelector ? PracticeSessionSelector.fallback : ['长音练习', '吐音练习', '连吐练习', '换气练习']);

  const maxDirect = 12;
  const showMore = list.length > maxDirect;
  let displayList;
  if (showMore) {
    displayList = list.slice(0, 5);
    if (content && list.includes(content) && !displayList.includes(content)) {
      displayList[4] = content;
    }
  } else {
    displayList = list.slice();
  }

  container.innerHTML = '';

  displayList.forEach(tag => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pk-session-pill pk-session-tag' + (content === tag ? ' is-active' : '');
    btn.dataset.tag = tag;
    btn.title = tag;
    const txt = document.createElement('span');
    txt.className = 'pk-pill-text';
    txt.textContent = tag;
    btn.appendChild(txt);
    btn.addEventListener('click', () => {
      content = tag;
      if (sessionUI) sessionUI.setValue(tag);
      syncRunMeta();
      syncStartState();
      updatePillSelection();
      userReselecting = false;
      checkAutoDeform();
    });
    container.appendChild(btn);
  });

  if (showMore) {
    const moreBtn = document.createElement('button');
    moreBtn.type = 'button';
    moreBtn.className = 'pk-session-pill pk-session-tag more-pill';
    moreBtn.id = 'pkPillMoreBtn';
    moreBtn.setAttribute('aria-label', '查看更多练习内容选项');
    const txt = document.createElement('span');
    txt.className = 'pk-pill-text';
    txt.textContent = '更多 ▾';
    moreBtn.appendChild(txt);
    moreBtn.addEventListener('click', () => {
      if (sessionUI) sessionUI.open();
    });
    container.appendChild(moreBtn);
  }
}

function updatePillSelection() {
  const container = document.getElementById('pkSessionTags');
  if (!container || !cur) return;
  const currentTags = Array.from(container.querySelectorAll('[data-tag]')).map(b => b.dataset.tag);
  if (content && !currentTags.includes(content)) {

  container.querySelectorAll('.pk-session-pill[data-tag]').forEach(btn => {
    if (btn.dataset.tag === content) {
      btn.classList.add('is-active');

  });
}

/* 渲染科目历史信息模块（逐帧 copy 参考图：左大数字+自然月7列日历点阵，右4行科目真实数据） */
function renderSubjectStats() {
  const stats = (cur && ITEM_STATS[cur.id]) || {
    id: cur ? cur.id : 0,
    name: cur ? cur.name : "未选择科目",
    days: 0,
    sessions: 0,

  };

  const collapsedDaysEl = document.getElementById('pkCollapsedDaysVal');
  if (collapsedDaysEl) collapsedDaysEl.textContent = '累计 ' + (stats.days || 0) + ' 天';

  const minEl = document.getElementById('pkSubjectMinutesVal');
  if (minEl) minEl.textContent = stats.minutes;

  const sessEl = document.getElementById('pkSubjectSessionsVal');
  if (sessEl) sessEl.textContent = stats.sessions;

  const maxEl = document.getElementById('pkSubjectMaxVal');
  if (maxEl) maxEl.textContent = stats.maxMinutes || 0;

  const lastEl = document.getElementById('pkSubjectLastVal');
  if (lastEl) {
    if (stats.daysAgo === '-' || stats.daysAgo === undefined) {
      lastEl.textContent = '暂无记录';
    } else {
      lastEl.textContent = stats.daysAgo + '天前';
      lastEl.title = '最近练习日期: ' + stats.lastDate;
    }
  }

  // 渲染自然月7列日历点阵（当前自然月 2026-09 或切 2026-08 历史自然月）
  renderMonthDotMatrix(stats);
}

function renderMonthDotMatrix(stats) {
  const matrixEl = document.getElementById('pkSubjectDotMatrix');
  const collapsedMatrixEl = document.getElementById('pkCollapsedDotMatrix');
  const monthBadge = document.getElementById('pkSubjectMonthIndicator');
  const collapsedCalMonth = document.getElementById('pkCollapsedCalMonth');
  const toggleBtn = document.getElementById('pkMonthToggleBtn');
  if (!matrixEl) return;

  const datesSet = new Set(stats.practiceDates || []);

  const [yearStr, monthNumStr] = currentDemoMonth.split('-');
  const year = parseInt(yearStr, 10);
  const month = parseInt(monthNumStr, 10);

  // 自然月计算: 周一起算 (0=周一 .. 6=周日)
  const firstDay = new Date(year, month - 1, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const totalDays = new Date(year, month, 0).getDate();

  if (monthBadge) {
    monthBadge.textContent = month + '月';
  }
  if (collapsedCalMonth) {
    collapsedCalMonth.textContent = month + '月打卡';
  }

  if (toggleBtn) {
    if (currentDemoMonth === '2026-09') {
      toggleBtn.textContent = '切8月';
      toggleBtn.title = '当前为9月(最新云端真值)，点击切换至8月查看历史打卡数据';
    } else {
      toggleBtn.textContent = '切9月';
      toggleBtn.title = '当前为8月(历史云端真值)，点击切回9月(当月)';
    }
  }

  function fillGrid(targetEl, dotClassPrefix) {
    if (!targetEl) return;
    targetEl.innerHTML = '';
    // 1. 填充月初空白格 (首日不对齐部分留空不画点)
    for (let e = 0; e < startWeekday; e++) {
      const emptyDot = document.createElement('span');
      emptyDot.className = dotClassPrefix + ' is-empty';
      emptyDot.setAttribute('aria-hidden', 'true');
      targetEl.appendChild(emptyDot);
    }

    // 2. 填充当月日期格子 (1..totalDays)
    for (let d = 1; d <= totalDays; d++) {
      const dayStr = String(d).padStart(2, '0');
      const dateKey = `${yearStr}-${monthNumStr}-${dayStr}`;
      const isActive = datesSet.has(dateKey);

      const dot = document.createElement('span');
      dot.className = dotClassPrefix + (isActive ? ' is-active' : '');
      dot.dataset.date = dateKey;
      dot.title = `${month}月${d}日: ` + (isActive ? '已练习' : '未打卡');
      targetEl.appendChild(dot);
    }

    // 3. 填充月末尾空白格 (补齐为整行)
    const trailingEmpty = (7 - ((startWeekday + totalDays) % 7)) % 7;
    for (let t = 0; t < trailingEmpty; t++) {
      const emptyDot = document.createElement('span');
      emptyDot.className = dotClassPrefix + ' is-empty';
      emptyDot.setAttribute('aria-hidden', 'true');
      targetEl.appendChild(emptyDot);
    }
  }

  fillGrid(matrixEl, 'pk-cal-dot');
  fillGrid(collapsedMatrixEl, 'pk-cal-dot');

  if (matrixEl) {
    const gridW = matrixEl.clientWidth || matrixEl.getBoundingClientRect().width;
    if (gridW > 0) {
      const isWidescreen = window.innerWidth >= 1200 && window.innerHeight >= 850;
      const gap = isWidescreen ? 3.5 : 3;
      const dotSize = Math.floor((gridW - 6 * gap) / 7 * 100) / 100;
      matrixEl.style.setProperty('--cal-dot-size', dotSize + 'px');
    }
  }
}

function toggleDemoMonth(targetMonth) {
  if (targetMonth) {
    currentDemoMonth = targetMonth;
  } else {
    currentDemoMonth = (currentDemoMonth === '2026-09') ? '2026-08' : '2026-09';
  }
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('month', currentDemoMonth);
    window.history.replaceState({}, '', url.toString());
  } catch (e) {}
  renderSubjectStats();
}

function selectItem(id, isArchived) {
  const all = ITEMS.focus.concat(ITEMS.other, ITEMS.archived);
  cur = all.find(i => i.id === id) || cur || all[0];

  checkAutoDeform();

  const fill = document.getElementById('pkCollapsedProgressBarFill');

  const currentElapsed = (typeof elapsed === 'number') ? elapsed : 0;
  const currentDuration = (typeof duration === 'number' && duration > 0) ? duration : 10;
  const mm = String(Math.floor(currentElapsed / 60)).padStart(2, '0');
  const ss = String(currentElapsed % 60).padStart(2, '0');
  const pct = Math.min(100, Math.max(0, (currentElapsed / (currentDuration * 60)) * 100)).toFixed(1);
  if (val) {
    val.textContent = `已练 ${mm}:${ss} / 目标 ${currentDuration} 分`;
  }
  if (fill) {
    fill.style.width = pct + '%';
  }
  const railClock = document.getElementById('pkRailClock');
  if (railClock) railClock.textContent = `${mm}:${ss}`;
  const railRemain = document.getElementById('pkRailRemain');
  if (railRemain) {
    const rem = Math.max(0, currentDuration * 60 - currentElapsed);
    const rmm = String(Math.floor(rem / 60)).padStart(2, '0');
    const rss = String(rem % 60).padStart(2, '0');
    railRemain.textContent = `${rmm}:${rss}`;
  }
  const ring = document.getElementById('pkRailProgressRing');
  if (ring) ring.setAttribute('stroke-dashoffset', String(56.55 * (1 - pct / 100)));
}

function syncStartState() {
  const btn = document.getElementById('pkStartBtn');
  const hasSubject = !!cur;
  const hasContent = !!(content && content.trim().length > 0);
  const ok = hasSubject && hasContent;
  if (btn) btn.disabled = !ok;
  const why = document.getElementById('pkWhy');
  if (why) {
    if (!hasSubject) why.textContent = '请先选择练习科目';
    else if (!hasContent) why.textContent = '请选定或输入本次练习内容';
    else why.textContent = '';
  }
  pushPracticeReady();
}

/* S22（dad 261028）：练习就绪状态 —— 票夹是唯一真源。
   仪表盘的「开始」必须等票夹把「科目 + 本次练习内容 + 时长」都定下来才允许点；
   否则计时器记的是卡片自己的默认值，而不是票夹上选好的那一份。
   正式版对应后端契约：开始练习必须带 subject_id + content + duration_min，
   任一缺失时后端判「不可开始」并回原因，前端据此禁用按钮（demo 用总线模拟）。 */
window.__czPracticeReady = function () {
  const hasSubject = !!cur;
  const hasContent = !!(content && String(content).trim().length > 0);
  const dur = (typeof duration === 'number') ? Math.round(duration) : 0;
  const hasDuration = dur >= 1 && dur <= 30;
  let reason = '';
  if (!hasSubject) reason = '请先在左侧票夹选择练习科目';
  else if (!hasContent) reason = '请先在左侧票夹选择本次练习内容';
  else if (!hasDuration) reason = '请先在左侧票夹设定练习时长';
  return {
    ready: hasSubject && hasContent && hasDuration,
    reason: reason,
    subjectId: cur ? cur.id : null,
    subjectName: cur ? cur.name : null,
    content: content || '',
    durationMin: hasDuration ? dur : null
  };
};

/* 把就绪状态推给仪表盘卡（总线 → A 卡 setPracticeReady） */
function pushPracticeReady() {
  const st = window.__czPracticeReady();
  try {
    const bus = window.DizicalPracticeBus;
    if (bus && typeof bus.ready === 'function') { bus.ready(st.ready, st.reason); }
  } catch (e) {}
  return st;
}

/* 计时走字主循环 */
function pkTick() {
  clearInterval(tickIv);
  tickIv = setInterval(() => {
    if (!timerRunning) return;
    elapsed++;
    if (typeof ttRenderDigits === 'function') ttRenderDigits(elapsed);
    const progress = Math.min(1, elapsed / (duration * 60));
    if (typeof paintRulerRunning === 'function') paintRulerRunning(progress);
    if (typeof revealVine === 'function') revealVine(progress, true);
    if (typeof emitBubbles === 'function') emitBubbles();
    updateCollapsedProgress();

    const left = Math.max(0, duration * 60 - elapsed);
    const leftStr = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    const meta = document.getElementById('metaVal');
    if (meta) meta.innerHTML = '总计 ' + duration + '<small>分钟</small> · 剩余 ' + leftStr;

    if (elapsed >= duration * 60) finish(true);
  }, 1000);
}

/* 当前时间每秒刷新（与生产 serverClock 语义与格式保持严格一致） */
function updateServerClock() {
  const now = new Date();
  const y = now.getFullYear();
  const mo = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const mi = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const pad = document.getElementById('serverClock');
  if (pad) {
    pad.textContent = `${y}-${mo}-${d} ${h}:${mi}:${s}`;
  }
}

function openCardOverlay() {
  const cd = (typeof canvasDoc === 'function' ? canvasDoc() : null) || document;
  let overlay = cd.getElementById('czCardOverlay');
  if (!overlay) return;
  syncRunRailCard();

  const slotStage = cd.getElementById('czTicketStage');
  const popup = overlay.querySelector('.cz-card-popup');
  const backdrop = overlay.querySelector('.cz-card-overlay-backdrop');

  if (slotStage && popup) {
    const r1 = slotStage.getBoundingClientRect();
    overlay.style.display = 'flex';
    overlay.style.pointerEvents = 'auto';

    const r2 = popup.getBoundingClientRect();
    const dx = r1.left - r2.left;
    const dy = r1.top - r2.top;
    const sx = Math.max(0.08, r1.width / (r2.width || 1));
    const sy = Math.max(0.08, r1.height / (r2.height || 1));

    popup.style.transformOrigin = 'top left';
    popup.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
    popup.style.opacity = '0.9';
    if (backdrop) backdrop.style.opacity = '0';

    void popup.offsetWidth;

    const dur = 320;
    popup.style.transition = `transform ${dur}ms cubic-bezier(0.16, 0.84, 0.24, 1), opacity ${dur - 60}ms ease`;
    if (backdrop) backdrop.style.transition = `opacity ${dur - 40}ms ease`;

    popup.style.transform = 'translate(0px, 0px) scale(1, 1)';
    popup.style.opacity = '1';
    if (backdrop) backdrop.style.opacity = '1';
    overlay.classList.add('is-open');

    setTimeout(() => {
      popup.style.transition = '';
      popup.style.transformOrigin = '';
    }, dur + 30);
  } else {
    overlay.style.display = 'flex';
    void overlay.offsetWidth;
    overlay.classList.add('is-open');
  }
}

function closeCardOverlay() {
  const cd = (typeof canvasDoc === 'function' ? canvasDoc() : null) || document;
  let overlay = cd.getElementById('czCardOverlay');
  if (!overlay) return;

  const slotStage = cd.getElementById('czTicketStage');
  const popup = overlay.querySelector('.cz-card-popup');
  const backdrop = overlay.querySelector('.cz-card-overlay-backdrop');

  if (slotStage && popup && !overlay.classList.contains('is-closing')) {
    overlay.classList.add('is-closing');
    overlay.style.pointerEvents = 'none';

    const r1 = slotStage.getBoundingClientRect();
    const r2 = popup.getBoundingClientRect();
    const dx = r1.left - r2.left;
    const dy = r1.top - r2.top;
    const sx = Math.max(0.08, r1.width / (r2.width || 1));
    const sy = Math.max(0.08, r1.height / (r2.height || 1));

    const dur = 260;
    popup.style.transformOrigin = 'top left';
    popup.style.transition = `transform ${dur}ms cubic-bezier(0.55, 0, 0.86, 0.35), opacity ${dur - 40}ms ease`;
    if (backdrop) backdrop.style.transition = `opacity ${dur}ms ease`;

    popup.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
    popup.style.opacity = '0';
    if (backdrop) backdrop.style.opacity = '0';
    overlay.classList.remove('is-open');

    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.style.pointerEvents = '';

      popup.style.transform = '';

      }

/* ══════════════════════════════════════════════════════════
   打卡动效引擎与计时态收拢卡 GSAP Timeline
   1. 点击「检票 · 开始练习」→ 文案先赋，再行动效
   2. 票卡以左边框为轴心，纵向从右向左收窄成 220px 竖向长条卡片 (0.42s, power3.inOut)
   3. 高度完全不变（逐像素一致，禁止 scale，禁止高度变矮）
   4. 展开态元素随宽度收窄先退场（0.00-0.14s），宽度收缩至 ~260px 时（0.22s）切换 class，收拢态元素随后进场（0.22-0.42s）
   5. 反向展开：收拢态元素先退场，展开态元素随宽度展开按节奏进场 (0.42s, power3.inOut)，clearProps 0 残留
   6. 兜底保护：prefers-reduced-motion (≤100ms fade) / typeof gsap === 'undefined'
══════════════════════════════════════════════════════════ */
let runTimeline = null;
let lastPrepHeight = 650;

/* S22-P2：窄条高度 --cz-bar-h 只在变形时算过一次，视口切换/屏幕旋转后会残留上一个
   视口的高度。重算方法：临时撤掉 .stage-bar（此时左栏回到整列宽度，票卡按真实宽度
   排版），量出票卡自然高度后写回。 */
function refreshBarHeight() {
  const stage = document.getElementById('practiceStage');
  if (!stage || !stage.classList.contains('stage-bar')) { return; }
  const card = document.getElementById('pkTicketCard');
  if (!card) { return; }
  const prevH = card.style.height;
  const prevMin = card.style.minHeight;
  card.style.height = '';
  card.style.minHeight = '';
  stage.classList.remove('stage-bar');
  const h = card.offsetHeight;
  stage.classList.add('stage-bar');
  card.style.height = prevH;
  card.style.minHeight = prevMin;
  if (h > 100) {
    lastPrepHeight = h;
    stage.style.setProperty('--cz-bar-h', h + 'px');
  }
}
window.addEventListener('resize', refreshBarHeight);

function morphTicketToBar(callback, instant) {
  if (isBarDeformed) {
    if (typeof callback === 'function') callback();
    return;
  }
  isBarDeformed = true;
  userReselecting = false;
  updateReselectBtnState();

  const stage = document.getElementById('practiceStage');
  const leftCol = document.getElementById('pkLeftCol');
  const ticketCard = document.getElementById('pkTicketCard');

  closeFolio();
  const heroFrame = document.getElementById('pkTicketHeroFrame');
  if (heroFrame) {
    heroFrame.setAttribute('aria-disabled', 'true');
    heroFrame.removeAttribute('title');
    heroFrame.setAttribute('tabindex', '-1');
    heroFrame.style.pointerEvents = 'none';
  }
  const subjectBlock = document.getElementById('pkTicketSubjectBlock');
  if (subjectBlock) {
    subjectBlock.setAttribute('aria-disabled', 'true');
    subjectBlock.removeAttribute('title');
    subjectBlock.setAttribute('tabindex', '-1');
    subjectBlock.style.pointerEvents = 'none';
  }
  const folioBtn = document.getElementById('pkFolioBtn');
  if (folioBtn) {
    folioBtn.setAttribute('aria-disabled', 'true');
    folioBtn.style.pointerEvents = 'none';
  }

  const prepHeight = (ticketCard && ticketCard.offsetHeight > 100) ? ticketCard.offsetHeight : (lastPrepHeight || (window.innerWidth < 600 ? 666 : (window.innerWidth < 1024 ? 743 : 650)));
  lastPrepHeight = prepHeight;
  if (stage) stage.dataset.czPrepHeight = String(prepHeight);
  /* 窄条的最终高度 = 原来票夹高度（竖向长条）；票卡 display:none 后 leftCol 无内容会塌成 0 */
  if (stage) stage.style.setProperty('--cz-bar-h', prepHeight + 'px');
  if (ticketCard) {
    ticketCard.style.height = prepHeight + 'px';
    ticketCard.style.minHeight = '0px';
  }
  if (leftCol) {
    leftCol.style.minHeight = '0px';
  }

  if (runTimeline) {
    runTimeline.kill();
    runTimeline = null;
  }

  const isStacked = window.innerWidth < 1024;
  const isDesktop = window.innerWidth >= 1024;
  const targetColWidth = isStacked ? (leftCol && leftCol.parentElement ? leftCol.parentElement.offsetWidth : 360) : 50;
  const startColWidth = leftCol ? leftCol.offsetWidth : (isDesktop ? 380 : 360);
  /* 桌面态：左栏高度钉成票夹高度，黑窄条（height:100%）动画全程不忽高忽低 */
  if (leftCol && !isStacked) {
    leftCol.style.height = prepHeight + 'px';
  }

  /* S22：这一步只做「票夹形态 → 黑窄条」，绝不进入计时态。
     stage-running 会把插卡、prep-only 隐藏、run-only 显示、『进行中』标签一起触发，
     用户还没点开始就看到计时态（dad 261027 实测踩到）。几何由独立的 .stage-bar 承载。 */
  if (instant || typeof gsap === 'undefined') {
    if (stage) {
      stage.classList.remove('stage-morphing');
      stage.classList.add('stage-bar');
    }
    if (leftCol) leftCol.style.width = isStacked ? '100%' : targetColWidth + 'px';
    if (ticketCard) {
      ticketCard.style.height = prepHeight + 'px';
      ticketCard.style.minHeight = prepHeight + 'px';
    }
    updateReselectBtnState();
    if (typeof callback === 'function') callback();
    return;
  }

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) {
    if (stage) {
      stage.classList.remove('stage-morphing');
      stage.classList.add('stage-bar');
    }
    if (leftCol) leftCol.style.width = isStacked ? '100%' : targetColWidth + 'px';
    if (ticketCard) {
      ticketCard.style.height = prepHeight + 'px';
      ticketCard.style.minHeight = prepHeight + 'px';
    }
    updateReselectBtnState();
    if (typeof callback === 'function') callback();
    return;
  }

  if (stage) {
    stage.classList.remove('stage-bar');
    stage.classList.add('stage-morphing');
  }

  const prepItems = ticketCard ? ticketCard.querySelectorAll('.prep-only, .prep-only-block') : [];
  const pkRunRail = document.getElementById('pkRunRail') || (leftCol ? leftCol.querySelector('.pk-run-rail') : null);

  runTimeline = gsap.timeline({
    overwrite: 'auto',
    onComplete: () => {
      gsap.set([leftCol, ticketCard, prepItems].filter(Boolean), { clearProps: 'all' });
      if (stage) {
        stage.classList.remove('stage-morphing');
        stage.classList.add('stage-bar');
      }
      if (pkRunRail) { pkRunRail.style.opacity = '1'; }
      if (ticketCard && !isStacked) {
        ticketCard.style.height = prepHeight + 'px';
        ticketCard.style.minHeight = prepHeight + 'px';
      }
      updateReselectBtnState();
      if (typeof callback === 'function') callback();
    }
  });

  if (prepItems.length) {
    runTimeline.to(prepItems, { opacity: 0, y: -4, duration: 0.14, ease: 'power2.in' }, 0);
  }

  if (!isStacked) {
    runTimeline.fromTo(leftCol,
      { width: startColWidth },
      { width: targetColWidth, duration: 0.28, ease: 'power3.inOut' },
      0
    );
    if (ticketCard) {
      ticketCard.style.display = 'flex';
      runTimeline.fromTo(ticketCard,
        { opacity: 1, scale: 1 },
        { opacity: 0, scale: 0.96, duration: 0.26, ease: 'power2.in' },
        0
      );
    }
    if (pkRunRail) {
      runTimeline.fromTo(pkRunRail,
        { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: 'power2.out' },
        0
      );
    }
  } else {
    if (ticketCard) {
      ticketCard.style.display = 'flex';
      ticketCard.style.overflow = 'hidden';
      runTimeline.fromTo(ticketCard,
        { height: prepHeight, minHeight: 0, opacity: 1 },
        { height: 0, minHeight: 0, opacity: 0, duration: 0.28, ease: 'power3.inOut' },
        0
      );
    }
    if (leftCol) {
      leftCol.style.overflow = 'hidden';
      runTimeline.fromTo(leftCol,
        { height: prepHeight, minHeight: 0 },
        { height: 52, minHeight: 0, duration: 0.28, ease: 'power3.inOut' },
        0
      );
    }
    if (pkRunRail) {
      runTimeline.fromTo(pkRunRail,
        { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: 'power2.out' },
        0
      );
    }
  }
}

    if (folioBtn) {
      folioBtn.removeAttribute('aria-disabled');
      folioBtn.style.pointerEvents = '';
    }
    if (ticketCard) {
      ticketCard.style.height = '';
      ticketCard.style.minHeight = '';
      ticketCard.style.opacity = '';
      ticketCard.style.display = '';
      ticketCard.style.pointerEvents = '';
    }
    if (leftCol) {
      leftCol.style.height = '';
      leftCol.style.minHeight = '';
      leftCol.style.width = '';
    }
    const pkRunRail = document.getElementById('pkRunRail') || (leftCol ? leftCol.querySelector('.pk-run-rail') : null);
    if (pkRunRail) {
      pkRunRail.style.opacity = '';
    }
    if (typeof gsap !== 'undefined') {
      gsap.set([leftCol, ticketCard, lockOverlay, insertedHead, runTelemetry, prepItems, runItems, pkRunRail].filter(Boolean), { clearProps: 'all' });
      if (runTelemetry) {
        const teleItems = runTelemetry.querySelectorAll('.pk-tele-block');
        if (teleItems.length) gsap.set(teleItems, { clearProps: 'all' });
      }
    }
    if (lockOverlay) {
      lockOverlay.style.display = 'none';
      lockOverlay.style.opacity = '0';
    }
    updateCollapsedProgress();
    updateReselectBtnState();
    try { if (typeof syncSlotMode === 'function') syncSlotMode(); } catch (e) {}
    if (typeof callback === 'function') callback();
  };

  if (instant || typeof gsap === 'undefined') {
    if (stage) {
      stage.classList.remove('stage-bar');
      stage.classList.remove('stage-morphing');
    }
    resetToPrepClean();
    return;
  }

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) {
    if (stage) {
      stage.classList.remove('stage-bar');
      stage.classList.remove('stage-morphing');
    }
    resetToPrepClean();
    return;
  }

  if (stage) {
    /* 反向变形：先把几何钉成窄条终值再撤 .stage-bar 的 !important 规则，
       否则左栏宽度/票卡高度会先瞬间弹回整列（闪一下），动画再从 50px 追不上。 */
    stage.classList.add('stage-morphing');
    stage.classList.remove('stage-bar');
  }
  if (leftCol) {
    leftCol.style.width = isStacked ? '100%' : '50px';
    leftCol.style.height = isStacked ? '52px' : '';
  }
  if (ticketCard) {
    ticketCard.style.display = 'flex';
    ticketCard.style.overflow = 'hidden';
    ticketCard.style.pointerEvents = 'none';
    ticketCard.style.opacity = '0';
    ticketCard.style.height = isStacked ? '0px' : '';
    ticketCard.style.minHeight = isStacked ? '0px' : '';
    ticketCard.style.width = isStacked ? '100%' : '0px';
  }
  runTimeline = gsap.timeline({
    overwrite: 'auto',
    onComplete: resetToPrepClean
  });

  const pkRunRail = document.getElementById('pkRunRail') || (leftCol ? leftCol.querySelector('.pk-run-rail') : null);

  if (runItems.length) {
    runTimeline.to(runItems, { opacity: 0, y: 6, duration: 0.14, ease: 'power2.in' }, 0);
  }
  if (insertedHead) {
    runTimeline.to(insertedHead, { y: -20, opacity: 0, duration: 0.14, ease: 'power2.in' }, 0);
  }
  if (lockOverlay) {
    runTimeline.to(lockOverlay, { opacity: 0, duration: 0.24, ease: 'power2.inOut' }, 0);
  }

  if (!isStacked) {
    runTimeline.fromTo(leftCol,
      { width: 50 },
      { width: targetColWidth, duration: 0.28, ease: 'power3.inOut' },
      0.18
    );
    if (ticketCard) {
      ticketCard.style.display = 'flex';
      ticketCard.style.overflow = 'hidden';
      ticketCard.style.pointerEvents = 'none';
      ticketCard.style.opacity = '0';
      runTimeline.fromTo(ticketCard,
        { width: 0 },
        { width: targetColWidth, duration: 0.28, ease: 'power3.inOut' },
        0.18
      );
      runTimeline.fromTo(ticketCard,
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: 'power1.out' },
        0.23
      );
    }
    if (pkRunRail) {
      runTimeline.fromTo(pkRunRail,
        { opacity: 1 },
        { opacity: 0, duration: 0.10, ease: 'linear' },
        0.16
      );
    }
  } else {
    const targetColHeight = lastPrepHeight || (window.innerWidth < 600 ? 666 : (window.innerWidth < 1024 ? 743 : 650));
    if (ticketCard) {
      ticketCard.style.display = 'flex';
      ticketCard.style.overflow = 'hidden';
      ticketCard.style.pointerEvents = 'none';
      ticketCard.style.opacity = '0';
      runTimeline.fromTo(ticketCard,
        { height: 0, minHeight: 0 },
        { height: targetColHeight, minHeight: 0, duration: 0.28, ease: 'power3.inOut' },
        0.18
      );
      runTimeline.fromTo(ticketCard,
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: 'power1.out' },
        0.23
      );
    }
    if (leftCol) {
      runTimeline.fromTo(leftCol,
        { height: 52, minHeight: 0 },
        { height: targetColHeight, minHeight: 0, duration: 0.28, ease: 'power3.inOut' },
        0.18
      );
    }
    if (pkRunRail) {
      runTimeline.fromTo(pkRunRail,
        { opacity: 1 },
        { opacity: 0, duration: 0.10, ease: 'linear' },
        0.16
      );
    }
  }

  if (prepItems.length) {
    runTimeline.fromTo(prepItems,
      { opacity: 0, y: -4 },
      { opacity: 1, y: 0, duration: 0.24, ease: 'power2.out' },
      0.16
    );
  }
}

function enterRun() {
  /* S22（dad 261028）：开始计时的前置条件 = 票夹已选好「科目 + 本次练习内容 + 时长」。
     真源在票夹；**不再自动替用户补选** —— 自动补选会让计时器记下一份用户从没选过的
     科目/内容/时长，正是 dad 这次指出的问题。demo 调试壳 setCanvasStage('run')
     仍会先代选，那是壳的行为，不是产品行为。 */
  const readyState = window.__czPracticeReady();
  if (!readyState.ready) {
    showToast(readyState.reason || '请先在左侧票夹选择科目与本次练习内容');
    pushPracticeReady();
    return;
  }
  pushPracticeReady();
  /* 计时时长以票夹为真源：开始前把票夹的时长推给仪表盘，保证记的是同一份 */
  try {
    const bus = window.DizicalPracticeBus;
    if (bus && typeof bus.duration === 'function') { bus.duration(readyState.durationMin, 'left_ticket'); }
  } catch (e) {}
  started = true;
  timerRunning = true;
  paused = false;
  elapsed = 0;

  syncRunMeta();
  updateReselectBtnState();

  const brand = document.getElementById('pkBrand');
  if (brand) { brand.textContent = '进行中'; brand.classList.add('running'); }
  const mid = document.getElementById('pkMid');
  if (mid) mid.innerHTML = '<b>' + (cur ? cur.name : '') + '</b>';
  const toggle = document.getElementById('pkStateToggle');
  if (toggle) toggle.textContent = '切回准备态';

  const pauseBtn = document.getElementById('pkPauseBtn');
  if (pauseBtn) { pauseBtn.textContent = '暂停'; pauseBtn.classList.remove('paused-on'); }

  /* S22：票夹已经收成窄条（用户选完两栏就变形过了）→ 只需要把计时态补齐，不重播变形。 */
  if (isBarDeformed) {
    const stage = document.getElementById('practiceStage');
    if (stage) {
      stage.classList.remove('stage-prep', 'cz-ticket-exit', 'cz-ticket-enter');
      stage.classList.add('stage-running', 'cz-ticket-live');
    }
    const lockOverlay = document.getElementById('pkTicketLockOverlay');
    if (lockOverlay) { lockOverlay.style.display = 'flex'; lockOverlay.style.opacity = '1'; }
    updateReselectBtnState();
    try { if (typeof syncSlotMode === 'function') syncSlotMode(); } catch (e) {}
    if (typeof ttOnStart === 'function') ttOnStart();
    pkTick();
    return;
  }

  /* 未变形（理论上不该发生：选完两栏就变形了）→ 先变形再补计时态。 */
  morphTicketToBar(() => {
    const stage = document.getElementById('practiceStage');
    if (stage) {
      stage.classList.remove('stage-prep', 'cz-ticket-exit', 'cz-ticket-enter');
      stage.classList.add('stage-running', 'cz-ticket-live');
    }
    const lockOverlay = document.getElementById('pkTicketLockOverlay');
    if (lockOverlay) { lockOverlay.style.display = 'flex'; lockOverlay.style.opacity = '1'; }
    updateReselectBtnState();
    try { if (typeof syncSlotMode === 'function') syncSlotMode(); } catch (e) {}
    if (typeof ttOnStart === 'function') ttOnStart();
    pkTick();
  });
}

function exitRun() {
  started = false;
  timerRunning = false;
  paused = false;
  clearInterval(tickIv);
  tickIv = null;

  closeCardOverlay();

  if (typeof ttOnExit === 'function') ttOnExit();

  const brand = document.getElementById('pkBrand');
  if (brand) { brand.textContent = '练习准备'; brand.classList.remove('running'); }
  const mid = document.getElementById('pkMid');
  if (mid) mid.textContent = '女儿竹笛早课';
  const toggle = document.getElementById('pkStateToggle');
  if (toggle) toggle.textContent = '切到练习态';

  elapsed = 0;
  if (typeof ttRenderDigits === 'function') ttRenderDigits(duration * 60, true);
  if (typeof paintRulerSelect === 'function') paintRulerSelect(duration);

  /* S22：计时结束 → 回到「窄条准备态」（票夹仍是 bar，选择保留）。
     只有点「重新选择」才展开成完整票夹。 */
  userReselecting = false;
  const stageEl = document.getElementById('practiceStage');
  const lockEl = document.getElementById('pkTicketLockOverlay');
  if (stageEl) {
    stageEl.classList.remove('stage-running', 'cz-ticket-live', 'cz-ticket-exit', 'cz-ticket-enter');
    stageEl.classList.add('stage-prep');
    if (isBarDeformed) stageEl.classList.add('stage-bar');
  }
  if (lockEl) { lockEl.style.display = 'none'; lockEl.style.opacity = '0'; }
  updateReselectBtnState();
  try { if (typeof syncSlotMode === 'function') syncSlotMode(); } catch (e) {}
}


function pauseToggle() {
  if (!started) return;
  const pauseBtn = document.getElementById('pkPauseBtn');
  if (timerRunning) {
    timerRunning = false;
    paused = true;
    pauseBtn.textContent = '继续练习';
    pauseBtn.classList.add('paused-on');
    if (typeof ttPauseLabel === 'function') ttPauseLabel(true);
  } else {
    timerRunning = true;
    paused = false;
    pauseBtn.textContent = '暂停';
    pauseBtn.classList.remove('paused-on');
    if (typeof ttPauseLabel === 'function') ttPauseLabel(false);
  }
}

function finish(done) {
  exitRun();
  showToast(done ? '打卡完成 · 练习已结束' : '已提前结束 · 票卡已归位');
}

function openReader() {
  document.getElementById('pkOverlay').classList.add('open');
}
function closeReader() {
  document.getElementById('pkOverlay').classList.remove('open');
}

function openRecordsDrawer() {
  const drawer = document.getElementById('pkRecordsDrawer');
  const overlay = document.getElementById('pkDrawerOverlay');
  if (drawer && overlay) {
    drawer.classList.add('open');
    overlay.classList.add('open');
  }
}
function closeRecordsDrawer() {
  const drawer = document.getElementById('pkRecordsDrawer');
  const overlay = document.getElementById('pkDrawerOverlay');
  if (drawer && overlay) {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
  }
}

/* 初始化与事件绑定 */
(function initV4() {
  // 挂载 Grok Session Selector 组件
  const sessionHost = document.getElementById('pkSessionSlot');
  if (sessionHost && window.PracticeSessionSelector) {
    sessionUI = PracticeSessionSelector.mount(sessionHost, {
      options: PracticeSessionSelector.parse(cur ? (cur.content_options || '') : ''),
      value: content,
      onChange: function(val, meta) {
        content = val;
        syncRunMeta();
        syncStartState();
        updatePillSelection();
        if (content && content.trim()) {
          userReselecting = false;
          checkAutoDeform();
        }
      }
    });
  }

  renderTicket();
  updateReselectBtnState();

  const railReselectBtn = document.getElementById('pkRailReselectBtn');
  if (railReselectBtn) {
    railReselectBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (timerRunning || started) return;
      userReselecting = true;
      expandBarToFolio();
    });
  }

  // 换科目入口：票夹按钮与 hero 块
  document.getElementById('pkFolioBtn').addEventListener('click', () => {
    if (document.getElementById('practiceStage')?.classList.contains('stage-running')) return;
    openFolio();
  });
  const heroFrameEl = document.getElementById('pkTicketHeroFrame');
  if (heroFrameEl) {
    heroFrameEl.addEventListener('click', () => {
      if (document.getElementById('practiceStage')?.classList.contains('stage-running') || heroFrameEl.getAttribute('aria-disabled') === 'true') return;
      openFolio();
    });
    heroFrameEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) {
        if (document.getElementById('practiceStage')?.classList.contains('stage-running') || heroFrameEl.getAttribute('aria-disabled') === 'true') return;
        e.preventDefault();
        openFolio();
      }
    });
  }
  const subjectBlockEl = document.getElementById('pkTicketSubjectBlock');
  if (subjectBlockEl) {
    subjectBlockEl.addEventListener('click', (e) => {
      if (document.getElementById('practiceStage')?.classList.contains('stage-running') || subjectBlockEl.getAttribute('aria-disabled') === 'true') return;
      e.stopPropagation();
      openFolio();
    });
    subjectBlockEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) {
        if (document.getElementById('practiceStage')?.classList.contains('stage-running') || subjectBlockEl.getAttribute('aria-disabled') === 'true') return;
        e.stopPropagation();
        e.preventDefault();
        openFolio();
      }
    });
  }
  document.getElementById('pkCloseFolioBtn').addEventListener('click', closeFolio);
  document.getElementById('pkFolioModal').addEventListener('click', e => {
    if (e.target.id === 'pkFolioModal') closeFolio();
  });

  // 票夹分类
  document.querySelectorAll('#pkFolioModal [data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#pkFolioModal [data-cat]').forEach(x => x.classList.remove('mark'));
      btn.classList.add('mark');
      cat = btn.dataset.cat;
      renderFolioModal();
    });
  });

  // 归档折叠
  const archToggle = document.getElementById('pkToggleArchFolio');
  archToggle.addEventListener('click', () => {
    const list = document.getElementById('pkFolioArchList');
    const open = !list.hidden;
    list.hidden = open;
    archToggle.textContent = open ? '展开已归档曲目 (37) ▾' : '收起已归档曲目 (37) ▴';
  });

  // 音符切换
  document.getElementById('pkTicketNoteBtn').addEventListener('click', () => {
    noteIdx = (noteIdx + 1) % NOTES.length;
    document.getElementById('pkTicketNoteSym').textContent = NOTES[noteIdx].sym;
    document.getElementById('pkTicketNoteCap').textContent = NOTES[noteIdx].cap + ' ▾';
    syncRunMeta();
  });

  // 3.7 长按加速步进引擎（400ms 后起连发，间隔 120ms，每 300ms 递减至 40ms）
  function attachLongPressStepper(btn, onStep) {
    if (!btn) return;
    let holdTimer = null;
    let repeatTimer = null;
    let holdStart = 0;

    function stop() {
      clearTimeout(holdTimer);
      clearTimeout(repeatTimer);
      holdTimer = null;
      repeatTimer = null;
    }

    function scheduleNext() {
      const elapsed = Date.now() - holdStart;
      const decSteps = Math.floor(elapsed / 300);
      const interval = Math.max(40, 120 - decSteps * 25);
      repeatTimer = setTimeout(() => {
        onStep();
        scheduleNext();
      }, interval);
    }

    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      stop();
      onStep();
      holdStart = Date.now();
      holdTimer = setTimeout(() => {
        scheduleNext();
      }, 400);
    });

    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // BPM 增减（长按加速）
  attachLongPressStepper(document.getElementById('pkBpmUp'), () => {
    bpm = Math.min(160, bpm + 1);
    document.getElementById('pkBpmVal').textContent = bpm;
    syncRunMeta();
  });
  attachLongPressStepper(document.getElementById('pkBpmDown'), () => {
    bpm = Math.max(40, bpm - 1);
    document.getElementById('pkBpmVal').textContent = bpm;
    syncRunMeta();
  });

  // 时长增减（长按加速）
  attachLongPressStepper(document.getElementById('pkTicketDurUp'), () => {
    if (typeof ttStepMin === 'function') ttStepMin(1);
  });
  attachLongPressStepper(document.getElementById('pkTicketDurDown'), () => {
    if (typeof ttStepMin === 'function') ttStepMin(-1);
  });
  const durBtn = document.getElementById('pkTicketDurBtn');
  if (durBtn) {
    durBtn.addEventListener('click', () => {
      if (typeof ttStepMin === 'function') ttStepMin(1);
    });
  }

  // 按键绑定
  document.getElementById('pkStartBtn').addEventListener('click', enterRun);
  document.getElementById('pkPauseBtn').addEventListener('click', pauseToggle);
  document.getElementById('pkEarlyBtn').addEventListener('click', () => finish(false));
  document.getElementById('pkStateToggle').addEventListener('click', () => {
    if (started) finish(false); else enterRun();
  });

  // 阅读层
  document.getElementById('pkExpandReqBtn').addEventListener('click', openReader);
  document.getElementById('pkReaderClose').addEventListener('click', closeReader);
  document.getElementById('pkOverlay').addEventListener('click', e => {
    if (e.target.id === 'pkOverlay') closeReader();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeReader(); closeFolio(); closeRecordsDrawer(); }
  });

  // 今日练习记录抽屉绑定（准备态与计时态均常驻可调出）
  document.getElementById('pkRecords').addEventListener('click', openRecordsDrawer);
  const drawerCloseBtn = document.getElementById('pkDrawerClose');
  if (drawerCloseBtn) drawerCloseBtn.addEventListener('click', closeRecordsDrawer);
  const drawerOverlay = document.getElementById('pkDrawerOverlay');
  if (drawerOverlay) drawerOverlay.addEventListener('click', closeRecordsDrawer);

  document.getElementById('pkVideoBtn').addEventListener('click', () => {
    showToast('示范视频：demo 静态演示');
  });

  // 监听刻度尺时长变动同步到票面数字与参数网格
  const origSetDuration = window.ttSetDuration;
  if (typeof origSetDuration === 'function') {
    window.ttSetDuration = function(v, skip) {
      origSetDuration(v, skip);
      const durEl = document.getElementById('pkTicketDurVal');
      if (durEl) durEl.textContent = duration;
      /* S22：窄条 bar 在准备态就常驻显示「剩余 mm:ss」，改时长必须同步，
         否则出现「票面 18 / 窄条 10:00」两个数字（dad 261027 第 3 条）。 */
      if (typeof updateCollapsedProgress === 'function') updateCollapsedProgress();
      /* S22-P1：票面时长任何路径（±按钮 / 长按 / 键盘 / JS 调用）改动后都要回灌仪表盘
         ruler，否则出现「票面 24 / 仪表盘 25」两个数字（agy 复核 P1）。总线回环由
         leftDur() 值比较挡住，不会自激。 */
      try {
        const bus = window.DizicalPracticeBus;
        if (bus && typeof bus.duration === 'function' && !started) {
          bus.duration(duration, 'left_ticket');
        }
      } catch (e) {}
    };
  }

  // 初始化真件计时器
  try {
    if (typeof ttInitTimer === 'function') ttInitTimer();
  } catch (err) {
    console.warn('[timer] 视觉层初始化提示:', err);
  }

  function clearTicketSelection() {
    cur = null;
    content = "";
    userReselecting = false;
    if (sessionUI) {
      sessionUI.setOptions('');
      sessionUI.setValue('');
    }
    if (isBarDeformed) {
      expandBarToFolio(null, true /* instant */);
    }
    renderTicket();
    updateReselectBtnState();
  }
  window.clearTicketSelection = clearTicketSelection;
  window.isTimingRunning = function () { return timerRunning; };
  window.isBarDeformed = function () { return isBarDeformed; };
  window.morphTicketToBar = morphTicketToBar;
  window.expandBarToFolio = expandBarToFolio;
})();
</script>

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--dash-page);
    color: var(--dash-text);
    font-family: var(--font-base);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .page {
    display: flex; flex-direction: column;
    min-height: 100vh; width: 100%;
  }

  /* 顶栏辅助控制器 */
  .chrome {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    background: var(--dash-white);
    border-bottom: 1px solid var(--dash-ink-a12);
    gap: 12px; flex-wrap: wrap;
  }
  .brand { font-size: 13px; font-weight: 750; color: var(--dash-text); letter-spacing: 0.02em; }
  .brand span { color: var(--dash-coral); font-weight: 800; }
  .seg { display: inline-flex; border: 1px solid var(--dash-ink-a16); border-radius: 999px; padding: 2px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--dash-text-soft);
    font-family: inherit; font-size: 12px; font-weight: 650;
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .seg button.is-on { background: var(--dash-text); color: var(--dash-page); }

  .frame {
    flex: 1 1 auto;
    display: flex; justify-content: center; align-items: center;
    padding: 12px;
    width: 100%;
    overflow: auto;
  }

  /* 仪表盘外壳：三档宽度真实响应 + 744 纵向舒展排布 */
  .dash {
    container: dash / inline-size;
    width: min(100%, 420px);
    height: 100%;
    max-height: 720px;
    border-radius: var(--dash-radius);
    background: linear-gradient(180deg, var(--dash-shell-hi) 0%, var(--dash-shell-lo) 100%);
    box-shadow:
      inset 0 1px 0 var(--dash-glint),
      inset 0 -10px 18px var(--dash-shell-inset);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
    transition: none;
  }
  html.cz-expand .dash {
    width: min(100%, 420px);
    max-height: 700px;
  }
  html.cz-feed .dash {
    width: min(100%, 500px);
    max-height: 840px;
  }

  /* 深色主屏幕：复原 v2 CSS mask 凹拱缺口（R=140px, depth=24px / 32px） */
  .panel {
    --notch: var(--dash-notch);
    --notch-r: 85px;
    --notch-depth: 24px;
    background: var(--dash-panel);
    color: var(--dash-panel-text);
    border: none;
    border-radius: 24px;
    -webkit-mask-clip: border-box;
    mask-clip: border-box;
    padding: 10px 14px 6px;
    display: flex; flex-direction: column; gap: 8px;
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    z-index: 1;
    -webkit-mask-image: radial-gradient(circle var(--notch-r) at 50% var(--notch-cy, calc(100% + var(--notch-r) - var(--notch-depth))), transparent 98%, black 100%);
    mask-image: radial-gradient(circle var(--notch-r) at 50% var(--notch-cy, calc(100% + var(--notch-r) - var(--notch-depth))), transparent 98%, black 100%);
  }
  .dash[data-depth="32"] .panel,
  .dash[data-dome="deep"] .panel,
  .dash[data-dome="32"] .panel,
  .dash[data-dome="v2"] .panel {
    --notch-depth: 32px;
  }
  .dash[data-depth="24"] .panel,
  .dash[data-dome="shallow"] .panel,
  .dash[data-dome="24"] .panel,
  .dash[data-dome="shrunk"] .panel {
    --notch-depth: 24px;
  }
  .status {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    min-height: 22px; color: var(--dash-panel-dim); font-size: 11px;
    position: relative;
    padding: 0 var(--cz-status-pad-x, 16px);
    box-sizing: border-box;
    width: 100%;
  }
  /* 三列钉死：时钟隐藏（计时态）后电池不能被挤到中列；MIC 指示灯文案与上方卡槽左边对齐，电池与上方卡槽右边对齐 */
  .status > .mic-status-btn {
    grid-column: 1;
    justify-self: start;
    position: relative;
    left: auto;
    top: auto;
    margin: 0;
  }
  .status > .clock {
    grid-column: 2;
    text-align: center;
    justify-self: center;
    /* 顶部时间相对居中，略往左移 */
    transform: translateX(-6px);
  }
  .status > .battery {
    grid-column: 3;
    justify-self: end;
    position: relative;
    right: auto;
    top: auto;
    margin: 0;
  }

  /* 麦克风入口：位于 panel 顶部左上，与参考图同位 */
  .mic-status-btn {
    justify-self: start;
    border: 1px solid var(--dash-cover-line);
    background: var(--dash-tray-inset);
    color: var(--dash-panel-text);
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 6px;
    cursor: pointer; font-size: 10.5px; font-weight: 700;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .mic-status-btn:hover { background: var(--dash-ink-a12); }
  .mic-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dash-muted);
    transition: background-color 0.15s, box-shadow 0.15s;
  }
  .mic-dot.on {
    background: var(--dash-mic-on);
    box-shadow: 0 0 6px var(--dash-mic-on);
  }
  .clock { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .battery { justify-self: end; display: flex; align-items: center; gap: 4px; }
  .bat {
    width: 22px; height: 11px; border: 1.5px solid var(--dash-battery);
    border-radius: 3px; padding: 1px; position: relative;
  }
  .bat::after {
    content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 5px;
    background: var(--dash-battery); border-radius: 0 1px 1px 0;
  }
  .bat-fill { display: block; width: 76%; height: 100%; background: var(--dash-battery); border-radius: 1px; }
  .bat-pct { font-size: 10px; color: var(--dash-battery); font-weight: 700; }

  /* 屏幕中段：封面 + 读数一行，ruler 进度条独占下一行整宽（不再与读数叠压） */
  .panel-main {
    flex: 1 1 auto; min-height: 0;
    display: grid;
    grid-template-columns: 96px minmax(0, 1fr);
    grid-template-rows: auto auto;
    column-gap: 14px; row-gap: 10px;
    align-items: center; align-content: center;
    padding: 0;
  }
  .cover-col { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; width: 96px; flex: 0 0 auto; align-self: center; }
  .cover-halo {
    padding: 3px; border-radius: 15px;
    border: 1px solid var(--dash-cover-line);
  }
  .cover-frame {
    width: var(--cover-w, 72px); height: var(--cover-w, 72px); border-radius: 12px; overflow: hidden; background: var(--dash-ink);
  }
  .cover-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; display: block; }
  .cover-name { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }

  .title-col {
    grid-column: 2; grid-row: 1; align-self: center;
    min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; width: 100%;
  }
  .readout { --num-size: var(--dash-num); display: flex; flex-direction: column; align-items: center; gap: 0; transform: translate(var(--cz-readout-dx, -26px), var(--cz-readout-dy, -10.2px)); }
  /* 练习科目：读数上方的标题（黑屏内，不再和 ruler 叠压） */
  /* S9：黑屏内不再重复科目名/副标题 —— 卡槽露头条已承载这些信息 */
  .readout-title,
  .readout-note { display: none !important; }
  .ac-root {
    display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 560; letter-spacing: -0.03em; line-height: 1;
    font-size: var(--num-size); color: var(--dash-panel-text);
  }
  .ac-digit {
    position: relative; display: inline-grid; overflow: hidden; height: 1.5em; line-height: 1.5;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
  }
  .ac-sizer { visibility: hidden; grid-area: 1 / 1; display: grid; }
  .ac-stack { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; }
  .ac-face { height: 1.5em; display: flex; align-items: center; justify-content: center; }
  .ac-mark { display: inline-block; margin: 0 -0.08em; }
  .readout-sub {
    margin-top: 3px; font-size: 20px; font-weight: 750; color: var(--dash-panel-text); letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 2px;
  }
  .readout-sub small { font-size: 13px; font-weight: 600; color: var(--dash-panel-dim); }
  /* dad 2610102107 条3：空心 monoline 计时数字（复用 D6 引擎），基准 20px ×3 = 60px */
  .readout-line { display: inline-flex; align-items: flex-end; justify-content: center; gap: 4px; position: relative; }
  .readout-unit {
    position: absolute;
    left: 100%;
    bottom: 4px;
    margin-left: 3px;
    font-family: var(--font-base);
    /* dad 261024：下标“分钟”约为左侧数字的一半高（--readout-digits-h 的一半），保持极细字重 */
    font-size: calc(var(--readout-digits-h, 60px) / 2);
    font-weight: 250;
    letter-spacing: 0.04em;
    color: rgba(255, 248, 240, 0.70);
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
  }
  /* 准备态（分钟数）才显示「分钟」；计时中/暂停态是 MM:SS，不显示单位 (Fix 2.1.2: 实值是 run/pause) */
  .dash[data-mode="run"] .readout-unit,
  .dash[data-mode="pause"] .readout-unit { display: none !important; }
  /* 计时态：练习科目由卡槽露头条展示，黑屏内不再重复 */
  .dash[data-mode="run"] .readout-title,
  .dash[data-mode="pause"] .readout-title { display: none !important; }
  .readout-digits { display: inline-flex; align-items: center; justify-content: center; }
  .readout-digits .hollow-digits-svg {
    display: block; height: var(--readout-digits-h, 60px); width: auto;
    color: var(--dash-panel-text);
    overflow: visible;
  }
  .readout-digits .hollow-digits-svg path,
  .readout-digits .hollow-digits-svg rect,
  .readout-digits .hollow-digits-svg line { fill: none; }
  .readout-digits .hollow-digits-svg circle { fill: currentColor; }
  #readoutDigits { font-size: 0; line-height: 0; }
  /* 旧 #metaVal 兼容节点：共享脚本仍会往里写，但不再可见 */
  .legacy-readout { display: none !important; }
  html.cz-expand .dash .readout-digits { --readout-digits-h: 60px; }
  html.cz-feed .dash .readout-digits { --readout-digits-h: 66px; }
  /* 下标“分钟”与数字共享同一基准：变量挂到 readout-line，兄弟节点也能继承 */
  html.cz-expand .dash .readout-line { --readout-digits-h: 60px; }
  html.cz-feed .dash .readout-line { --readout-digits-h: 66px; }
  html.cz-fill .panel { padding-bottom: 12px !important; }
  html.cz-fill:not(.cz-land):not(.cz-feed) .panel { padding-bottom: 12px !important; }

  .panel-main > .ruler-wrap {
    grid-column: 1 / -1;
    grid-row: 2;
    margin-block-start: 0;
    min-width: 0;
  }
  .ruler-vine {
    max-width: 100%;
  }

  /* 纵向三列强对齐结构：panel-foot / mid-row / transport 共用同一列网格 (68px 1fr 68px) */
  .grid-3col {
    display: grid;
    grid-template-columns: 68px minmax(0, 1fr) 68px;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }
  .grid-3col .c-left { justify-self: start; display: flex; justify-content: center; width: 68px; }
  .grid-3col .c-mid  { justify-self: center; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .grid-3col .c-right{ justify-self: end; display: flex; justify-content: center; width: 68px; }

  /* 深色圆盘操作圆钮：58px，深色盘带强烈立体浮起阴影 */
  .round {
    width: 58px; height: 58px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: linear-gradient(180deg, #2A3036 0%, #101316 100%);
    color: #FFF8F0;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      0 6px 14px rgba(0, 0, 0, 0.30),
      0 2px 4px rgba(0, 0, 0, 0.20);
    font-size: 26px; font-weight: 400; line-height: 1;
    display: grid; place-items: center;
    cursor: pointer;
    touch-action: manipulation; user-select: none;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .round:active:not(:disabled) {
    transform: translateY(1px) scale(0.96);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      0 4px 8px rgba(0, 0, 0, 0.40);
  }
  .round:disabled { opacity: 0.38; cursor: default; }
  :root[data-skin="ink"] .round {
    border: 1px solid rgba(255, 255, 255, 0.20);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.25),
      0 8px 18px rgba(0, 0, 0, 0.60),
      0 2px 5px rgba(0, 0, 0, 0.40);
  }

  /* panel-foot 正常流：左右边缘与 MIC / 封面 / 电池共用 panel 的 12px 基线。 */
  .panel-foot {
    position: relative;
    left: auto;
    right: auto;
    bottom: auto;
    z-index: 4;
    padding: 0;
    margin-top: 4px;
    width: 100%;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.04em;
    color: var(--dash-panel-dim);
    min-width: 0;
    flex: 0 0 auto;
    box-sizing: border-box;
  }
  /* S17 批注3（dad 261026）+ S18 批注5/6：状态行锚到「黑区底部圆点弧左右两侧」——
     位置由 JS 按圆点弧顶边算出（--cz-foot-top），动态下移贴近黑色面板下缘，
     横排/纵向两种视口下都落在拱肩上，不压刻度、不进 notch 裁切区。 */
  .panel-foot.grid-3col {
    position: absolute;
    left: 12px; right: 12px;
    top: var(--cz-foot-top, auto);
    bottom: auto;
    display: block;
    width: calc(100% - 24px);
    height: 20px;
    margin-top: 0;
    box-sizing: border-box;
  }
  .panel-foot.grid-3col .c-left,
  .panel-foot.grid-3col .c-right {
    position: absolute; top: 0;
    display: flex;
    align-items: center;
    width: auto !important;
    transform: translateX(-50%);
  }
  /* S14 批注 2/3、4/5（dad 261025）：今日与 BPM 中心按 dad 圈定的拱肩 20% / 83% 落位。
     foot 自身左右内缩 12px（宽 = panel − 24），calc 把 20%/83% 精确换算回 panel 坐标。 */
  .panel-foot.grid-3col .c-left { left: calc(20% - 7.2px); }
  .panel-foot.grid-3col .c-right { left: calc(83% + 7.9px); pointer-events: auto; }
  .panel-foot.grid-3col .c-mid { display: none; }
  html.cz-fill:not(.cz-feed) .panel-foot,
  html.cz-fill:not(.cz-land):not(.cz-feed) .panel-foot {
    position: absolute !important;
    left: 12px !important;
    right: 12px !important;
    top: var(--cz-foot-top, auto) !important;
    bottom: auto !important;
    width: calc(100% - 24px) !important;
    margin-top: 0 !important;
    padding: 0 !important;
  }
  html.cz-feed .panel-foot {
    position: absolute !important;
    left: 12px !important;
    right: 12px !important;
    top: var(--cz-foot-top, auto) !important;
    bottom: auto !important;
    margin-top: 0 !important;
    width: calc(100% - 24px) !important;
    padding: 0 !important;
  }
  #todayTotal {
    font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .metro-sound-toggle {
    border: 0; background: transparent; color: var(--dash-panel-text);
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 2px 0; border-radius: 6px;

  }
  .metro-sound-toggle:hover { background: var(--dash-ink-a12); }
  #bpmRead {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
