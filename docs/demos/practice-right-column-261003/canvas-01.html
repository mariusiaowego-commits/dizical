  function applyModuleState(f) {
    var d = modDoc(f);
    if (!d || !d.documentElement) { return; }
    if (state.skin === 'ink') { d.documentElement.setAttribute('data-skin', 'ink'); }
    else { d.documentElement.removeAttribute('data-skin'); }
    /* 宽屏按票卡高填满。窄档（<1024 且不是 negctl=stack）改由内容撑高，类名只打在喂流卡上。 */
    d.documentElement.classList.add('cz-fill');
    var wrap = f.closest ? f.closest('.cz-mod') : null;
    if (f.dataset.mod === 'S' && (state.combo === '2' || (wrap && wrap.dataset.tate === '1'))) { d.documentElement.classList.add('cz-tate'); }
    else { d.documentElement.classList.remove('cz-tate'); }
    applyLayoutMode(f);
    var feed = (d.documentElement.dataset.layout === 'feed');
    var cdFeed = canvasDoc();
    var land = state.combo === '1' && f.dataset.mod === 'A' && !feed && f.id !== 'czPopFrame';
    d.documentElement.classList.toggle('cz-land', land);
    /* S14：自定义档 D 卡走竖条形态（cz-dcol），组合档保持 220px 横条 */
    d.documentElement.classList.toggle('cz-dcol', f.dataset.mod === 'D' && state.combo === 'off');
    var slotted = !!(f.dataset.mod === 'A' && cdFeed && cdFeed.querySelector('.cz-astack-crown') && f.id !== 'czPopFrame');
    d.documentElement.classList.toggle('cz-slot', slotted);
    if (f.id === 'czPopFrame' && cdFeed && cdFeed.documentElement.clientWidth < NARROW && !NEG_STACK) { d.documentElement.classList.add('cz-pop'); }
    else { d.documentElement.classList.remove('cz-pop'); }
    /* 卡内视口档：宽屏沿用用户选择（data-vp 驱动卡内布局，是 demo 既有约定）；
       仅当画布已堆叠（窄屏、卡片被拉到整宽）时才按实际卡宽降档，否则 1133 档塞进 468px 会卡内溢出 */
    var cd2 = canvasDoc();
    var stacked = !!(cd2 && cd2.documentElement.clientWidth < NARROW);
    var vpEff = state.vp;
    if (stacked) {
      var fit = 440;
      if (f.offsetWidth >= 560 || state.vp === '744') { fit = 744; }
      else if (f.offsetWidth >= 1024 - 1) { fit = 1133; }
      vpEff = String(Math.min(parseInt(state.vp, 10) || 1133, fit));
    }
    f.dataset.vpEffective = vpEff;
    f.dataset.vpStacked = stacked ? '1' : '0';
    var mode = vpEff === '440' ? '440x956' : (vpEff === '744' ? '744x1133' : '1133x744');
    var els = d.querySelectorAll('[data-vp]');
    for (var i = 0; i < els.length; i++) {
      var cur = els[i].getAttribute('data-vp');
      els[i].setAttribute('data-vp', cur && cur.indexOf('x') > -1 ? mode : vpEff);
    }
    var sf = d.querySelector('.stage-frame');
    if (sf) { sf.style.width = '100%'; sf.style.maxWidth = '100%'; }
  }

  function contentHeight(d) {
    if (!d || !d.body) { return 0; }
    var e = d.documentElement, b = d.body;
    return Math.max(e ? e.scrollHeight : 0, b ? b.scrollHeight : 0, b ? b.offsetHeight : 0);

  function syncModuleHeight(f) {
    if (!f || f.offsetParent === null || f.id === 'czPopFrame') { return; }
    /* 组合档的高由 applyComboSizes 管。窄档自定义改按内容撑高，不再抄票卡高。 */
    if (state.combo !== 'off') { return; }
    var wrap = f.closest ? f.closest('.cz-mod') : null;
    if (!wrap) { return; }
    var cd = canvasDoc();
    if (cd && cd.documentElement.clientWidth < NARROW && !NEG_STACK) {

    /* S14 批注2（dad 261025）：自定义档 D 卡不再拉到票卡高（798px 空盒），
       竖条卡按内容测高，五行堆叠之间不再有大片空白。测高循环需要稳定读数，
       800px 假高已在上面解除；730px 封顶是矮盒裁切余量（实际内容 ~170px）。 */
    if (wrap.dataset.mod === 'D') {
      var dH = 0;
      for (var dGuard = 0; dGuard < 6; dGuard++) {
        var dMeasured = measureCardContent(f, { uncap: true });
        if (!(dMeasured > 40)) { dMeasured = 120; }
        if (dMeasured > 730) { dMeasured = 730; }
        if (Math.abs(dMeasured - dH) <= 2) { break; }
        dH = dMeasured;
        f.style.setProperty('height', dH + 'px', 'important');
        f.style.setProperty('min-height', dH + 'px', 'important');
        f.style.maxHeight = 'none';
        wrap.style.setProperty('height', dH + 'px', 'important');
        wrap.style.setProperty('max-height', 'none', 'important');
      }
      f.style.setProperty('height', dH + 'px', 'important');
      f.style.setProperty('min-height', dH + 'px', 'important');
      wrap.style.setProperty('height', dH + 'px', 'important');
      wrap.style.setProperty('max-height', 'none', 'important');
      wrap.style.overflow = 'hidden';
      return;
    }
    var tb = ticketBox(cd);
    if (!tb || tb.h < 40) { return; }
    sizeBox(wrap, tb.h);
  }

  function syncAll() {
    var col = railEl();

    alignColTop();

    syncDashCoverOuter();

  /* feed 流插卡行程 = 票夹黑 bar 底到卡槽顶的实际距离（行程终点即卡槽，起点即 bar） */
  function syncFeedTravel() {
    var cd = canvasDoc();
    if (!cd) { return; }
    var root = cd.documentElement;
    var track = cd.querySelector('.cz-combo') || cd.querySelector('.cz-rail') || cd.getElementById('czModCol');
    var isFeed = !!(track && cd.defaultView && cd.defaultView.getComputedStyle(track).flexDirection === 'column');
    if (!isFeed) { root.style.removeProperty('--cz-feed-travel'); return; }
    var railEl2 = cd.getElementById('pkRunRail');
    var card = cd.getElementById('czTicketStage');
    if (!railEl2 || !card) { return; }
    var travel = Math.max(60, Math.round(card.getBoundingClientRect().top - railEl2.getBoundingClientRect().bottom));
    root.style.setProperty('--cz-feed-travel', travel + 'px');

  /* 261012c 第 2 条：模块列（含卡槽占位）顶边必须与左栏票卡顶边对齐 ——
     画布左右两栏各自有 4px 级内边距差，用运行时 margin-top 抹平（只动这一处，不改画布源文件） */
  function alignColTop() {
    var cd = canvasDoc();
    if (!cd) { return null; }
    var target = cd.getElementById('czRail') || cd.getElementById('czCombo');
    var ticket = ticketCardEl(cd);
    if (!target || !ticket) { return null; }

    var anchor = target.querySelector('.cz-mod[data-mod="A"]') || target.querySelector('.cz-mod') || target;

            }
          }
        }
        return step(i + 1);
      });
    }

    return readBaseline().then(function () { return step(0); });
  }
