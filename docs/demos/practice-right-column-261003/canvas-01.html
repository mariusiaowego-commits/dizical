  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    background: var(--surface-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 8px 16px 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #practiceStage {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
  }

  [hidden] { display: none !important; }

  /* 状态切换作用域显隐 */
  #practiceStage.stage-prep .prep-only { display: flex; }
  #practiceStage.stage-prep .prep-only-block { display: block; }
  #practiceStage.stage-prep .pk-session-slot.prep-only { display: block; width: 100%; }
  #practiceStage.stage-prep .pk-subject-info-card.prep-only { display: grid; }
  #practiceStage.stage-prep .run-only { display: none !important; }
  #practiceStage.stage-prep .run-only-block { display: none !important; }
  /* S22：stage-bar = 只把票夹收成窄条，计时态仍属准备态 → 保留 prep 语义的显隐 */
  #practiceStage.stage-bar .run-only,
  #practiceStage.stage-bar .run-only-block { display: none !important; }

  #practiceStage.stage-running:not(.cz-ticket-enter) .prep-only { display: none !important; }
  #practiceStage.stage-running:not(.cz-ticket-enter) .prep-only-block { display: none !important; }
  #practiceStage.stage-running .run-only { display: flex; }
  #practiceStage.stage-running .run-only-block { display: block; }

  /* 顶栏右侧今日记录入口（准备态与计时态均常驻开放抽屉） */
  #practiceStage.stage-prep #pkRecords,
  #practiceStage.stage-running #pkRecords { display: inline-flex !important; }
  #practiceStage.stage-prep #pkRunStat,
  #practiceStage.stage-running #pkRunStat { display: none !important; }

  /* 工具类 */
  .pk-nowrap { white-space: nowrap; }
  .pk-shrink0 { flex: 0 0 auto; }
  .pk-ellip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pk-row { display: flex; align-items: center; }
  .pk-between { justify-content: space-between; }
  .pk-grow { flex: 1 1 auto; }
  .pk-sub { font-size: 12px; color: var(--text-muted); }
  .key { font-weight: 700; color: var(--text-main); }

  /* R8 90ms 弹簧按压反馈 */
  .pk-press {
    transition: transform 90ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
  }
  .pk-press:active:not(:disabled) { transform: scale(0.985); }

  /* ══════ 自定义滚动条（符合 dizicute 规范） ══════ */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(44, 62, 80, 0.18);
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(44, 62, 80, 0.35);
  }
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(44, 62, 80, 0.18) transparent;
  }

  /* ══════ 顶栏 40px（与下方舞台 max-width 1280 居中左右边缘对齐） ══════ */
  .pk-top {
    max-width: 1280px;
    width: 100%;
    height: 40px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    background: var(--surface-card);
    border: 1px solid var(--border-card);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    box-sizing: border-box;
  }
  .pk-brand {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .pk-brand.running {
    color: var(--c-primary);
  }
  .pk-mid {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .pk-mid b {
    color: var(--text-main);
  }
  .pk-run-stat {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-well);
    padding: 4px 12px;
    border-radius: 9999px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .pk-server-clock {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-well);
    border: 1px solid var(--border-card);
    padding: 3px 10px;
    border-radius: 9999px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    box-sizing: border-box;
  }

  .pk-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 9999px;
    padding: 6px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border-card);
    background: var(--surface-card);
    color: var(--text-main);
    min-height: 36px;
    white-space: nowrap;
    flex: 0 0 auto;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(44, 62, 80, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }
  .pk-pill.mini {
    min-height: 28px;
    padding: 3px 10px;
    font-size: 11.5px;
  }
  .pk-pill.mark {
    background: var(--surface-subtle);
    border-color: var(--border-active);
    color: var(--c-primary);
    font-weight: 600;
  }
  .pk-pill.ok {
    font-weight: 600;
    color: var(--text-main);
  }
  .pk-pill.arch {
    background: var(--surface-archived);
    border-color: rgba(44, 62, 80, 0.08);
    color: var(--text-muted);
    font-weight: 500;
  }

  /* ══════ 主舞台布局（多设备三档形态适配 · 与 pk-top 严格对齐左右边缘） ══════ */
  .pk-stage-wrap {
    flex: 1 1 auto;
    display: flex;
    gap: 24px;
    align-items: stretch;
    justify-content: flex-start;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 0;
    box-sizing: border-box;
    min-height: calc(100vh - 80px);
    transition: gap 0.55s ease;
  }

  /* 左侧：练习票卡列（准备态 380px，计时态收拢至 220px，以左边框为轴心） */
  .pk-left-col {
    width: 380px;
    flex-shrink: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-self: stretch;
    container-type: inline-size;
    container-name: ticket;
    transform-origin: left center;
    transition: opacity 0.26s ease;
  }

  /* 右侧：中轴主栏（仪表卡 + 老师要求卡，流体填充并右侧 flush 对齐 pk-top） */
  .pk-main-col {
    flex: 1 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-self: stretch;
    transition: all 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ② 中屏（1024px–1199px，如 iPad 横屏 1133×744 / 1024×768）：两栏保持并排，比例收窄，左右边缘依然与 pk-top 对齐 */
  @media (max-width: 1199px) and (min-width: 1024px) {
    .pk-top {
      max-width: 100%;
    }
    .pk-stage-wrap {
      max-width: 100%;
      gap: 16px;
      padding: 0;
    }
    .pk-left-col {
      width: 360px;
    }
  }

  /* iPad mini / iPad 沉浸式一屏适配（1133x744 / 1024x768 零页面滚动） */
  @media (min-width: 1024px) and (max-height: 800px) {
    html, body {
      height: auto;
      min-height: 100vh;
      overflow-y: auto !important;
    }
    body {
      padding: 3px 6px;
    }
    .pk-top {
      height: 32px;
      margin-bottom: 4px;
      padding: 0 6px;
    }
    .pk-stage-wrap {
      min-height: 0;
      height: auto;
      max-height: none;
      gap: 12px;
    }
    .pk-ticket {
      --pk-ticket-pad-x: 14px;
      padding: 8px var(--pk-ticket-pad-x);
    }
    .pk-ticket .pk-ticket-hero-frame {
      height: 84px;
      margin-top: 4px;
    }
    .pk-ticket .pk-ticket-subject-block {
      padding: 4px 12px;
      border-radius: 10px;
    }
    .pk-ticket .pk-ticket-subject-title {
      font-size: 18px;
    }
    .pk-ticket .pk-ticket-subject-sub {
      font-size: 10px;
      margin-top: 1px;
    }
    .pk-ticket .pk-ticket-digits-grid {
      gap: 6px;
      margin-top: 4px;
    }
    .pk-ticket .pk-bignum-val {
      font-size: 24px;
    }
    .pk-ticket .pk-session-slot {
      margin-top: 4px;
    }
    .pk-ticket .pk-session-tags-wrap {
      margin-top: 4px;
      margin-bottom: 12px;
    }
    .pk-ticket .pk-perforation-line {
      margin: 6px calc(-1 * var(--pk-ticket-pad-x, 14px));
    }
    .pk-ticket .pk-subject-info-card {
      padding: 5px 8px;
      margin-top: 3px;
      margin-bottom: 3px;
    }
    .pk-ticket .pk-info-bignum-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }
    .pk-ticket .pk-cal-header-row {
      display: none !important;
      min-height: 0;
    }
    .pk-ticket .pk-stub-memo-block {
      padding: 5px 8px;
      gap: 3px;
    }
    .pk-ticket .pk-memo-row {
      min-height: 16px;
    }
    .pk-main-col {
      gap: 8px;
    }
    .pk-instr-deck {
      padding: 8px 12px;
      gap: 6px;
    }
    .pk-slot-idle {
      padding: 5px 8px;
      font-size: 11px;
    }
    .pk-slot2-box {
      padding: 6px 8px;
    }
    .pk-slot4-box {
      margin-top: 4px;
    }
    .pk-ticket-cta {
      padding: 7px 14px;
      font-size: 13.5px;
    }
    .pk-req-card {
      padding: 8px 12px;
      gap: 4px;
      flex: 0 0 auto;
      min-height: 0;
    }
    .pk-req-card .pk-card-title,
    .pk-req-card .pk-req-title {
      font-size: 13.5px;
    }
    .pk-req-card .pk-req-item-name {
      font-size: 12.5px;
    }
    .pk-req-list {
      max-height: none;
      overflow: hidden;
      gap: 3px;
      margin: 2px 0;
      padding-left: 20px;
    }
    .pk-req-list li {
      font-size: 12.5px !important;
      line-height: 1.5 !important;
    }
    .pk-req-list li:nth-child(n+4) {
      display: none !important;
    }
    .pk-running-telemetry {
      padding: 6px 12px;
      margin-top: 4px;
    }
    .pk-tele-val-subject {
      font-size: 18px;
    }
    .pk-tele-val-speed {
      font-size: 17px;
    }
    .pk-tele-pill-session {
      font-size: 11.5px;
      padding: 2px 10px;
    }
    .pk-footer-note {
      display: none !important;
    }
  }

  /* 矮视口紧凑适配（如 1080x657 / 1199x700 / 1280x700 零页面滚动） */
  @media (min-width: 1024px) and (max-height: 700px) {
    body {
      padding: 2px 6px;
    }
    .pk-top {
      height: 28px;
      margin-bottom: 2px;
      padding: 0 6px;
    }
    .pk-stage-wrap {
      height: calc(100vh - 34px);
      max-height: calc(100vh - 34px);
      gap: 10px;
    }
    .pk-ticket {
      --pk-ticket-pad-x: 12px;
      padding: 6px var(--pk-ticket-pad-x);
    }
    .pk-ticket .pk-ticket-hero-frame {
      height: 56px;
      margin-top: 2px;
    }
    .pk-ticket .pk-ticket-subject-block {
      padding: 2px 8px;
      border-radius: 8px;
    }
    .pk-ticket .pk-ticket-subject-title {
      font-size: 15px;
    }
    .pk-ticket .pk-ticket-digits-grid {
      gap: 4px;
      margin-top: 2px;
    }
    .pk-ticket .pk-bignum-val {
      font-size: 22px;
    }
    .pk-ticket .pk-session-slot {
      margin-top: 2px;
    }
    .pk-ticket .pk-session-tags-wrap {
      margin-top: 2px;
      margin-bottom: 6px;
    }
    .pk-ticket .pk-perforation-line {
      margin: 4px calc(-1 * var(--pk-ticket-pad-x, 12px));
    }
    .pk-ticket .pk-subject-info-card {
      padding: 4px 8px;
      margin-top: 2px;
      margin-bottom: 2px;
    }
    .pk-ticket .pk-stub-memo-block {
      padding: 4px 8px;
      gap: 2px;
    }
    .pk-ticket .pk-memo-row {
      min-height: 14px;
    }
    .pk-instr-deck {
      padding: 6px 10px;
      gap: 4px;
    }
    .pk-req-card {
      padding: 6px 10px;
      gap: 3px;
      flex: 0 0 auto;
      min-height: 0;
    }
    .pk-req-card .pk-card-title,
    .pk-req-card .pk-req-title {
      font-size: 12.5px;
    }
    .pk-req-card .pk-req-item-name {
      font-size: 11.5px;
    }
    .pk-req-list {
      max-height: none;
      overflow: hidden;
      margin: 2px 0;
      padding-left: 18px;
      gap: 2px;
    }
    .pk-req-list li {
      font-size: 12.5px !important;
      line-height: 1.5 !important;
    }
    .pk-req-list li:nth-child(n+2) {
      display: none !important;
    }
    .pk-running-telemetry {
      padding: 4px 10px;
      margin-top: 2px;
    }
    .pk-tele-val-subject {
      font-size: 16px;
    }
    .pk-tele-val-speed {
      font-size: 15px;
    }
    .pk-tele-pill-session {
      font-size: 11px;
      padding: 2px 8px;
    }
  }

  /* 矮视口短档 (max-height: 700px) 计时态收拢卡自适应可压缩机制 */
  @media (max-height: 700px) {
    #practiceStage.stage-running .pk-ticket-hero-frame {
      width: clamp(68px, 11vh, 92px) !important;
      height: clamp(68px, 11vh, 92px) !important;
      margin: 2px auto 0 !important;
    }
    #practiceStage.stage-running .pk-ticket-subject-block {
      margin-top: clamp(3px, 0.7vh, 6px) !important;
    }
    #practiceStage.stage-running .pk-ticket-digits-grid {
      gap: clamp(4px, 0.7vh, 6px) !important;
      margin-top: clamp(3px, 0.7vh, 6px) !important;
    }
    #practiceStage.stage-running .pk-ticket-num-col {
      padding: 4px 10px !important;
      min-height: 28px !important;
    }
    #practiceStage.stage-running .pk-perforation-line {
      margin: clamp(6px, 1vh, 10px) calc(-1 * var(--pk-ticket-pad-x, 12px)) !important;
    }

    /* Level 1: 日历块收缩（7列铺满，格子高度随可用高度收缩，隐藏星期行） */
    .pk-collapsed-cal-block {
      padding: clamp(3px, 0.6vh, 5px) clamp(6px, 1vw, 8px);
      gap: 2px;
      margin-top: clamp(3px, 0.6vh, 5px);
    }
    .pk-cal-weekdays.mini {
      display: none !important;
    }
    .pk-collapsed-cal-grid {
      gap: clamp(1px, 0.25vh, 2px);
    }
    .pk-collapsed-cal-grid .pk-cal-dot {
      height: clamp(8px, 1.45vh, 12px);
      padding-bottom: 0;
      border-radius: 2px;
    }

    /* Level 2: 次要信息行降级合并（今日累计与连续打卡合并为单微卡片） */
    #practiceStage.stage-running #pkCollapsedTodayRow {
      display: none !important;
    }
    #practiceStage.stage-running #pkCollapsedStreakRow {
      display: none !important;
    }
    #practiceStage.stage-running #pkCollapsedDivider1 {
      display: none !important;
    }
    #practiceStage.stage-running #pkCollapsedDivider2 {
      display: none !important;
    }
    #practiceStage.stage-running #pkCollapsedMergedRow,
    #practiceStage.stage-running .pk-collapsed-merged-row,
    #practiceStage.stage-running .pk-collapsed-merged-card {
      display: flex !important;
    }

    /* 微卡片间距弹性压缩 */
    .pk-collapsed-stat-card,
    .pk-collapsed-stat-row,
    .pk-collapsed-progress-card,
    .pk-collapsed-progress-block {
      margin-top: clamp(2px, 0.4vh, 3px);
      padding: clamp(2px, 0.4vh, 3px) 8px;
      gap: 1px;
    }
    .pk-collapsed-card-head .pk-info-icon-disc.mini {
      width: 13px;
      height: 13px;
    }
    .pk-collapsed-card-head .pk-info-icon-disc.mini .pk-info-icon-svg {
      width: 8px;
      height: 8px;
    }
    .pk-collapsed-stat-val {
      font-size: 11.5px;
      line-height: 1;
    }
    .pk-collapsed-progress-val {
      font-size: 10px;
      line-height: 1;
    }
    .pk-collapsed-progress-bar-track {
      height: 3px;
      margin-top: 1.5px;
    }
    .pk-collapsed-divider {
      display: none !important;
    }
    #practiceStage.stage-running .pk-stub-memo-block {
      padding: 3px 8px;
    }
  }

  /* Level 3: 极矮视口二次降级（若合并卡仍过紧，则丢弃连续打卡保留今日与本次进度） */
  @media (max-height: 590px) {
    #practiceStage.stage-running #pkCollapsedMergedRow {
      display: none !important;
    }
    #practiceStage.stage-running #pkCollapsedTodayRow {
      display: flex !important;
    }
    #practiceStage.stage-running #pkCollapsedStreakRow {
      display: none !important;
    }
  }

  /* PC 宽屏高度分配适配（1728x1117 / 1440x900 方案 A 竖向填充） */
  @media (min-width: 1200px) and (min-height: 850px) {
    html, body {
      height: 100vh;
      overflow-y: hidden !important;
    }
    body {
      padding: 6px 16px;
    }
    .pk-top {
      height: 36px;
      margin-bottom: 6px;
    }
    .pk-stage-wrap {
      min-height: 0;
      height: calc(100vh - 68px);
      max-height: calc(100vh - 68px);
      gap: 16px;
    }
    .pk-ticket .pk-ticket-hero-frame {
      height: clamp(128px, 16vh, 148px);
    }
    .pk-ticket .pk-perforation-line {
      margin: 10px calc(-1 * var(--pk-ticket-pad-x, 14px));
    }
    .pk-ticket .pk-session-tags-wrap {
      margin-bottom: 8px;
    }
    #pkSubjectInfoCard, .pk-subject-info-card {
      flex: 1 1 auto;
      min-height: 0;
      align-items: stretch;
      grid-template-columns: 1fr 1fr;
      padding: 8px 10px;
      gap: 12px;
      margin-top: 6px;
      margin-bottom: 0;
    }
    #pkSubjectInfoCard .pk-info-left-col {
      height: auto;
      align-self: start;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0;
    }
    #pkSubjectInfoCard .pk-info-metric-header {
      margin-bottom: 4px;
    }
    #pkSubjectInfoCard .pk-info-label {
      font-size: 12px;
    }
    #pkSubjectInfoCard .pk-info-bignum-wrap {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    #pkSubjectInfoCard .pk-info-bignum {
      font-size: 38px;
    }
    #pkSubjectInfoCard .pk-cal-wrap {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #pkSubjectInfoCard .pk-cal-month-badge {
      font-size: 12px;
    }
    #pkSubjectInfoCard .pk-cal-weekdays {
      font-size: 10px;
      gap: 3.5px;
    }
    #pkSubjectInfoCard .pk-cal-grid {
      container-type: inline-size;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-auto-rows: var(--cal-dot-size, calc((100cqw - 21px) / 7));
      align-content: start;
      gap: 3.5px;
      width: 100%;
      height: auto;
    }
    #pkSubjectInfoCard .pk-cal-dot {
      width: 100%;
      height: var(--cal-dot-size, calc((100cqw - 21px) / 7));
      padding-bottom: 0;
      min-width: 0;
      min-height: 0;
      align-self: start;
      justify-self: stretch;
      border-radius: 3px;
      box-sizing: border-box;
    }
    #pkSubjectInfoCard .pk-info-right-col {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 12px 0 12px 14px;
      box-sizing: border-box;
    }
    #pkSubjectInfoCard .pk-info-stat-row {
      flex: 0 0 auto;
      min-height: 0;
      max-height: none;
      padding: 4px 0;
    }
    #pkSubjectInfoCard .pk-info-icon-disc {
      width: 22px;
      height: 22px;
    }
    #pkSubjectInfoCard .pk-info-icon-svg {
      width: 13px;
      height: 13px;
    }
    #pkSubjectInfoCard .pk-info-row-title {
      font-size: 12.5px;
    }
    #pkSubjectInfoCard .pk-info-val-num {
      font-size: 15px;
    }
    #pkSubjectInfoCard .pk-info-val-unit {
      font-size: 11.5px;
    }
    .pk-ticket .pk-stub-memo-block, .pk-stub-memo-block {
      margin-top: 10px;
      padding: 12px 14px;
      gap: 8px;
    }
    .pk-ticket .pk-memo-row, .pk-memo-row {
      min-height: 24px;
    }
    .pk-ticket .pk-memo-label, .pk-memo-label {
      font-size: 12px;
    }
    .pk-ticket .pk-memo-val, .pk-ticket .pk-memo-val.mono, .pk-memo-val, .pk-memo-val.mono {
      font-size: 13.5px;
    }
    #pkInstrCard, .pk-instr-deck {
      flex: 1 1 auto;
      min-height: 340px;
      justify-content: flex-start;
      gap: 16px;
      padding: 16px 20px;
    }
    #pkInstrCard .timer-block, .pk-instr-deck .timer-block {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #pkReqCard, .pk-req-card {
      flex: 0 0 auto;
      min-height: 0;
      padding: 14px 20px;
      gap: 6px;
    }
    .pk-footer-note {
      display: none !important;
    }
  }

  /* PC 超高屏适配（1728x1117）：卡片按内容收缩，票根 hero 承接剩余高度，大数字 64px */
  @media (min-width: 1200px) and (min-height: 1000px) {
    .pk-ticket .pk-ticket-hero-frame {
      height: 338px;
    }
    #pkSubjectInfoCard {
      flex: 0 1 auto;
      align-self: start;
    }
    #pkSubjectInfoCard .pk-info-bignum {
      font-size: 64px;
    }
    #pkSubjectInfoCard .pk-info-metric-header {
      margin-bottom: 8px;
    }
    #pkSubjectInfoCard .pk-info-bignum-wrap {
      margin-bottom: 16px;
    }
    #pkSubjectInfoCard .pk-cal-header-row {
      min-height: 24px;
    }
    #pkSubjectInfoCard .pk-cal-weekdays {
      min-height: 12px;
      font-size: 12px;
    }
  }

  /* ③ 窄屏（< 1024px，如 iPad 竖屏 744×1133、手机 440×956）：单列堆叠（与 pk-top 同宽对齐） */
  @media (max-width: 1023px) {
    .pk-top {
      max-width: 580px;
      width: 100%;
      margin: 0 auto 10px;
      padding: 0 10px;
      gap: 8px;
    }
    .pk-stage-wrap {
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
      padding: 0;
    }
    .pk-left-col, .pk-main-col {
      width: 100%;
      max-width: 100%;
    }
    #practiceStage.stage-running .pk-stage-wrap {
      flex-direction: column;
      align-items: center;
    }
    #practiceStage.stage-running .pk-left-col {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
  }

  /* 手机端极窄屏（≤ 480px，如 iPhone 440×956）细节微调 */
  @media (max-width: 480px) {
    .pk-stage-wrap {
      padding: 0;
      gap: 10px;
    }
    .pk-left-col, .pk-main-col {
      width: 100%;
      max-width: 100%;
    }
    .pk-top {
      max-width: 100%;
      height: auto;
      min-height: 40px;
      padding: 6px 10px;
      gap: 6px 8px;
      flex-wrap: wrap;
    }
    .pk-brand, .pk-mid {
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .pk-brand {
      font-size: 13px;
    }
    .pk-mid {
      font-size: 11.5px;
    }
    .pk-grow {
      flex-basis: 100%;
      height: 0;
      margin: 0;
    }
    .pk-run-stat {
      display: none;
    }
    .pk-top .pk-pill {
      font-size: 11px;
      padding: 3px 8px;
      height: 26px;
      min-height: 24px;
      white-space: nowrap;
    }
    .pk-top .pk-server-clock {
      font-size: 11px;
      padding: 2px 6px;
      height: 24px;
      line-height: 20px;
      white-space: nowrap;
    }
    .pk-ticket {
      padding: 10px 10px 12px;
    }
    .pk-ticket-hero-frame {
      height: 108px;
    }
    .pk-ticket-subject-block {
      margin-top: 10px;
    }
    .pk-ticket-digits-grid {
      margin-top: 10px;
      gap: 10px;
    }
    .pk-perforation-line {
      margin: 12px -10px 12px;
    }
    .pk-stub-memo-block {
      margin-top: 10px;
      padding: 8px 10px;
    }
    .pk-instr-deck {
      padding: 12px 12px 14px;
      gap: 10px;
    }
  }

  /* ═══════════════════════════════════════════════════════════
     练习票卡（Museum Ticket Style）
     - 底色：暖白 #FFF8F0 叠 12% 珊瑚粉
     - 竖长比例（1 : 2.2）
     - 包含两个打孔、沉浸名画、并排大数字、艺术家姓名位、撕裂虚线、票根条形码
  ═══════════════════════════════════════════════════════════ */
  .pk-ticket {
    --pk-ticket-pad-x: 14px;
    background: linear-gradient(180deg, rgba(255, 107, 107, 0.07) 0%, rgba(255, 107, 107, 0.02) 100%), var(--surface-page);
    border: 1px solid rgba(44, 62, 80, 0.12);
    border-radius: 18px;
    box-shadow: var(--shadow-ticket);
    padding: 12px var(--pk-ticket-pad-x) 14px;
    box-sizing: border-box;
    position: relative;
    overflow: visible;
    user-select: none;
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    height: 100%;
    min-height: 520px;
  }

  /* 蒙版锁定层（练习态票卡变淡 + 灰蒙版，纯色无模糊，支持 --practice-mask-color 变量） */
  .pk-ticket-lock-overlay {
    position: absolute;
    inset: 0;
    background: var(--practice-mask-color, rgba(44, 62, 80, 0.0875));
    border-radius: inherit;
    z-index: 20;
    display: none;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    filter: none !important;
  }

  /* 顶部票头行：左上打孔 + 展务铭文 + 换科目入口 */
  .pk-ticket-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  /* 打孔设计（正圆保障：aspect-ratio 1/1 + flex-shrink 0，抗压扁） */
  .pk-hole-punch {
    width: 16px;
    height: 16px;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    box-sizing: border-box;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 16px;
    flex-shrink: 0;
  }
  .pk-hole-punch.mini {
    width: 12px;
    height: 12px;
    flex: 0 0 12px;
    flex-shrink: 0;
  }
  .pk-hole-punch.status-focus {
    background: var(--c-primary);
    border: none;
    box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.22);
  }
  .pk-hole-punch.status-focus::after {
    content: "";
    width: 5px;
    height: 5px;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--surface-card);
  }
  .pk-hole-punch.status-other {
    background: transparent;
    border: 2px solid rgba(44, 62, 80, 0.30);
  }
  .pk-hole-punch.status-arch {
    background: rgba(44, 62, 80, 0.22);
    border: none;
  }

  .pk-ticket-folio-trigger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-card);
    border: 1px solid var(--border-card);
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(44, 62, 80, 0.04);
  }
  .pk-ticket-folio-trigger:hover {
    background: var(--surface-subtle);
    border-color: var(--border-active);
  }

  /* 顶部大图块（压缩至 140px，保持票面主视觉） */
  .pk-ticket-hero-frame {
    width: 100%;
    height: 140px;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(44, 62, 80, 0.10);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 2px 8px rgba(44, 62, 80, 0.06);
    background: var(--surface-card);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .pk-ticket-hero-frame:focus-visible {
    outline: 2px solid var(--c-primary);
    outline-offset: 2px;
  }
  .pk-ticket-hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform 0.3s ease;
  }
  .pk-ticket-hero-frame:hover .pk-ticket-hero-img {
    transform: scale(1.02);
  }

  .pk-ticket-header-label {
    font-family: var(--font-serif);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  /* 艺术家姓名位浮层：叠压在 hero 上（半透明浅底 + 档案编号小字） */
  .pk-ticket-subject-block {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    padding: 7px 18px;
    background: rgba(255, 255, 255, 0.76);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(44, 62, 80, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.5);
    max-width: 86%;
    box-sizing: border-box;
    cursor: pointer;
    z-index: 2;
    pointer-events: auto;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    filter: none !important;
  }
  .pk-ticket-subject-title {
    font-family: var(--font-serif);
    font-size: 26px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.2;
    letter-spacing: 0.02em;
    margin: 0 auto;
    max-width: 100%;
    word-break: break-word;
    white-space: nowrap;
  }
  .pk-ticket-subject-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  /* 并排大数字（左：速度BPM，右：时长分钟） - 删去三处线条，依靠 18px 组间距与 16px 列间隙自然分组 */
  .pk-ticket-digits-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 18px;
    padding: 0;
  }
  .pk-ticket-num-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 4px;
    text-align: center;
  }
  .pk-bignum-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 30px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
    letter-spacing: 0;
    min-width: 2.2ch;
    text-align: center;
    display: inline-block;
  }

  /* 44px 触控命中区与注解交互 */
  .pk-num-stepper-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: auto;
  }
  .pk-mini-stepper-btn {
    width: 40px;
    height: 40px;
    min-height: 40px; /* 触控命中区保障 */
    min-width: 40px;
    box-sizing: border-box;
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: grid;
    place-items: center;
    border-radius: 8px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .pk-mini-stepper-btn:hover {
    background: var(--surface-subtle);
    color: var(--c-primary);
  }
  .pk-mini-stepper-btn:active {
    transform: scale(0.92);
  }

  .pk-annotation-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
    padding: 2px 8px;
    min-height: 24px;
    border-radius: 9999px;
    background: var(--surface-card);
    border: 1px solid rgba(44, 62, 80, 0.10);
    font-family: var(--font-serif);
    font-size: 11px;
    font-weight: 400; /* 细体注字 */
    color: var(--text-muted);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(44, 62, 80, 0.03);
    white-space: nowrap;
  }
  .pk-annotation-btn:hover {
    border-color: var(--border-active);
    color: var(--c-primary);
  }

  /* 撕裂虚线（带两侧内凹半圆咬口缺角 · 票卡外框灰色线沿半圆绕行，外侧无直穿灰线，无外凸线） */
  .pk-perforation-line {
    position: relative;
    height: 0;
    border-top: 2px dashed rgba(44, 62, 80, 0.20);
    margin: 18px calc(-1 * var(--pk-ticket-pad-x, 14px));
  }
  .pk-perf-notch-left, .pk-perf-notch-right {
    position: absolute;
    top: -10px;
    width: 11px;
    height: 20px;
    background: var(--surface-page);
    border: 1px solid rgba(44, 62, 80, 0.12);
    box-sizing: border-box;
    z-index: 2;
  }
  .pk-perf-notch-left {
    left: -1px;
    border-radius: 0 10px 10px 0;
    border-left: none;
    box-shadow: inset -1px 0 2px rgba(44, 62, 80, 0.04);
  }
  .pk-perf-notch-right {
    right: -1px;
    border-radius: 10px 0 0 10px;
    border-right: none;
    box-shadow: inset 1px 0 2px rgba(44, 62, 80, 0.04);
  }

  /* 票根区（composer + 2排胶囊标签 + 科目独立信息备注区） */
  .pk-ticket-stub-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* 2 排 Session 胶囊标签网格（统一左对齐，固定 2 排高度盒 60px，标签增减绝不影响后方排版） */
  .pk-session-tags-wrap {
    width: 100%;
    height: 60px;
    min-height: 60px;
    max-height: 60px;
    flex: 0 0 60px;
    box-sizing: border-box;
    overflow: hidden;
    margin-top: 4px;
    margin-bottom: 12px;
  }
  .pk-session-tags-grid {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    column-gap: 5px; /* 行内 gap 5px */
    row-gap: 8px;    /* 行间 gap 8px > 行内 gap */
    height: 100%;
    max-height: 60px;
    min-height: 60px;
    overflow: hidden;
    justify-content: flex-start; /* 统一左对齐 */
    align-items: center;
  }
  .pk-session-pill, .pk-session-tag {
    height: 26px;
    padding: 0 8px;
    border-radius: 9999px;
    background: var(--surface-card);
    border: 1px solid rgba(44, 62, 80, 0.10);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    white-space: nowrap;
    max-width: 145px; /* 限制长标签宽度，后续标签自然跟随 */
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    box-sizing: border-box;
    flex: 0 0 auto;
  }
  .pk-session-pill:hover, .pk-session-tag:hover {
    border-color: rgba(44, 62, 80, 0.22);
    color: var(--c-primary);
  }
  /* 选中态：淡底色 + 珊瑚字色，严格无第二道红框，瞬时生效无过渡延迟 */
  .pk-session-pill.is-active, .pk-session-tag.is-active {
    background: rgba(255, 107, 107, 0.08);
    border-color: transparent !important;
    color: var(--c-primary);
    font-weight: 700;
    transition: none !important;
  }
  .pk-session-pill.more-pill, .pk-session-tag.more-pill {
    color: var(--text-muted);
    font-weight: 500;
    border-style: dashed;
    border-color: rgba(44, 62, 80, 0.18);
  }
  .pk-session-pill.more-pill:hover, .pk-session-tag.more-pill:hover {
    color: var(--c-primary);
    border-color: var(--c-primary);
  }
  .pk-pill-text {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-block;
  }

  /* ══════ 科目历史信息模块（逐帧 copy 参考图 · 左右分栏 · 自然月日历打卡 + 4行真数） ══════ */
  .pk-subject-info-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid rgba(44, 62, 80, 0.08);
    box-shadow: 0 1px 3px rgba(44, 62, 80, 0.03);
    margin-top: 4px;
    margin-bottom: 4px;
    position: relative;
    box-sizing: border-box;
  }

  /* 左分栏：累计练习天数 + 自然月日历网格（better-layout 重排：随 50% 宽自适应伸展） */
  .pk-info-left-col {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 0;
    min-width: 0;
    padding: 0;
    margin: 0;
  }
  .pk-info-metric-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    line-height: 1;
    margin-bottom: 8px;
  }
  .pk-info-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .pk-info-bignum-wrap {
    display: flex;
    align-items: baseline;
    gap: 2px;
    line-height: 1;
    margin-bottom: 16px;
  }
  .pk-info-bignum {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 30px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .pk-info-unit {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }

  /* 自然月日历网格容器（移除 96px 锁宽，随左半栏自适应 100% 宽度） */
  .pk-cal-wrap {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 100%;
  }
  .pk-cal-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    line-height: 1;
    margin-bottom: 2px;
  }
  .pk-cal-month-badge {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .pk-month-toggle-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 8.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: rgba(44, 62, 80, 0.05);
    border: 1px solid rgba(44, 62, 80, 0.10);
    border-radius: 3px;
    padding: 2px 5px;
    cursor: pointer;
    line-height: 1.1;
    user-select: none;
    touch-action: manipulation;
    white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .pk-month-toggle-btn::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    pointer-events: auto;
  }
  .pk-month-toggle-btn:hover {
    color: var(--c-primary);
    border-color: var(--c-primary);
  }
  .pk-cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    color: var(--text-muted);
    line-height: 1;
    opacity: 0.85;
  }
  .pk-cal-grid {
    container-type: inline-size;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: var(--cal-dot-size, calc((100cqw - 18px) / 7));
    align-content: start;
    gap: 3px;
    width: 100%;
    height: auto;
  }
  .pk-cal-dot {
    width: 100%;
    height: var(--cal-dot-size, calc((100cqw - 18px) / 7));
    padding-bottom: 0;
    min-width: 0;
    min-height: 0;
    align-self: start;
    justify-self: stretch;
    border-radius: 2.5px;
    background: rgba(44, 62, 80, 0.08);
    box-sizing: border-box;
    display: block;
    transition: background 0.15s ease;
  }
  .pk-cal-dot.is-active {
    background: var(--c-primary);
  }
  .pk-cal-dot.is-empty {
    visibility: hidden;

  /* ══════ 科目档案信息区（Dad 选项 B：仅 档案编号 + 真实分类字段，无装饰） ══════ */
  .pk-stub-memo-block {

  /* ══════ 计时态：50px 竖向计时轨（准备态票夹保持原样，不在这里重排） ══════ */
  #practiceStage.stage-running:not(.cz-ticket-exit):not(.cz-ticket-enter) .pk-left-col {
    width: 50px !important;
    min-width: 50px !important;
    max-width: 50px !important;
    flex: 0 0 50px !important;
    align-self: flex-start !important;
    overflow: visible;
  }
  #practiceStage.cz-ticket-exit .pk-left-col,
  #practiceStage.cz-ticket-enter .pk-left-col {
    overflow: visible;
    align-self: flex-start !important;
  }
  #practiceStage.stage-running .pk-main-col {
    padding-top: 0;
    box-sizing: border-box;
  }
  #practiceStage.stage-running .cz-combo {
    overflow: visible !important;
  }
  #practiceStage.stage-running:not(.cz-ticket-exit):not(.cz-ticket-enter) .pk-ticket {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-12px) scaleX(.72);
    transform-origin: left center;
  }
  #practiceStage.cz-ticket-exit .pk-ticket,
  #practiceStage.cz-ticket-enter .pk-ticket {
    display: flex !important;
    pointer-events: none !important;
    transform-origin: left center;
  }
  #practiceStage.stage-prep .pk-ticket {
    opacity: 1;
    transform: none;
    transition: opacity .28s ease .16s, transform .48s cubic-bezier(.22,1,.36,1) .08s;
  }
  .pk-run-rail {
    display: none;
    position: absolute;
    inset: 0 auto 0 0;
    width: 50px;
    height: 100%;
    box-sizing: border-box;
    z-index: 31;
    overflow: hidden;
    border-radius: 22px;
    color: #FFF8F0;
    background:
      radial-gradient(ellipse 80% 22% at 50% 4%, rgba(255,140,90,.24), transparent 68%),
      linear-gradient(180deg, #202A33 0%, #161A1E 46%, #111519 100%);
    border: 1px solid rgba(255,248,240,.13);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 16px 36px rgba(20,24,28,.22);
    user-select: none;
  }
  #practiceStage.stage-running .pk-run-rail,
  #practiceStage.cz-ticket-exit .pk-run-rail,
  #practiceStage.cz-ticket-enter .pk-run-rail {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    opacity: 1;
    animation: none !important;
  }
  #practiceStage.cz-ticket-exit .pk-run-rail,
  #practiceStage.cz-ticket-enter .pk-run-rail {
    pointer-events: none;
  }
  @keyframes pkRailSplit {
    0% { opacity: 0; transform: translateX(96px) scaleX(.22); filter: blur(1px); }
    58% { opacity: 1; transform: translateX(-2px) scaleX(1.02); filter: blur(0); }
    100% { opacity: 1; transform: translateX(0) scaleX(1); }
  }

  /* ══════ S22：票夹「已选完 → 收成黑窄条」与「计时中」解耦 ══════
     窄条形态只是票夹的形态，不是计时态。用独立 .stage-bar 承载几何，
     绝不借用 .stage-running（否则插卡、prep-only 隐藏、run-only 显示、
     『进行中』标签全部提前发生，用户还没点开始就看到计时态）。 */
  #practiceStage.stage-bar .pk-left-col,
  #practiceStage.stage-bar #pkLeftCol {
    width: 50px !important;
    min-width: 50px !important;
    max-width: 50px !important;
    flex: 0 0 50px !important;
    align-self: flex-start !important;
    /* 票卡 display:none 后 leftCol 会塌成 0 高，而 .pk-run-rail 是 height:100%
       → 窄条会被压成 0px（实测 1133 只剩 2px 细边）。高度由 morph 时写入。 */
    height: var(--cz-bar-h, auto) !important;
    overflow: visible;
  }
  #practiceStage.stage-bar #pkTicketCard,
  #practiceStage.stage-bar .pk-ticket {
    opacity: 0 !important;
    pointer-events: none !important;
    display: none !important;
  }
  #practiceStage.stage-bar .pk-run-rail {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    opacity: 1;
    animation: none !important;
    pointer-events: auto !important;
  }
  /* 纵向视口（feed）：窄条改为顶部横向 bar */
  @media (max-width: 1023px) {
    #practiceStage.stage-bar .pk-left-col,
    #practiceStage.stage-bar #pkLeftCol {
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      height: 52px !important;
      min-height: 52px !important;
      max-height: 52px !important;
      flex: 0 0 auto !important;
      overflow: visible !important;
      margin-bottom: 12px !important;
    }
    #practiceStage.stage-bar .pk-run-rail {
      flex-direction: row !important;
      inset: 0 !important;
      width: 100% !important;
      height: 52px !important;
      border-radius: 14px !important;
    }
  }
  /* S22-P0：变形过渡态 .stage-morphing
     .stage-bar 用 !important 锁死几何（width/height/flex），而 GSAP 补间写的是内联
     style —— 内联非 !important 打不过样式表 !important，于是票夹在补间第一帧就被压成
     50px（瞬间跳变，dad 261027 验收可见）。过渡态单独用 .stage-morphing：只负责把
     窄条显示出来，不锁几何；动画结束后再切回 .stage-bar 稳态。 */
  #practiceStage.stage-morphing .pk-run-rail {
    display: flex !important;
    animation: none !important;
    pointer-events: none !important;
  }
  @media (min-width: 1024px) {
    #practiceStage.stage-morphing .pk-run-rail {
      flex-direction: column !important;
      align-items: center !important;
    }
  }
  @keyframes pkRailExit {
    0% { opacity: 1; transform: translateX(0) scaleX(1); }
    40% { opacity: 1; transform: translateX(-2px) scaleX(1.02); }
    100% { opacity: 0; transform: translateX(96px) scaleX(.22); filter: blur(1px); }
  }
  .pk-run-rail-subject {
    width: 100%;
    flex: 0 0 auto;
    padding: 14px 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255,248,240,.10);
  }
  .pk-run-rail-subject-text {
    font-size: 11px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: .16em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    color: #FFE29A;
    text-shadow: 0 1px 4px rgba(0,0,0,.55);
    white-space: nowrap;
    max-height: 96px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pk-run-rail-remain {
    width: 100%;
    flex: 0 0 auto;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border-bottom: 1px solid rgba(255,248,240,.10);
  }
  .pk-run-rail-remain-label {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .14em;
    color: rgba(255,248,240,.52);
  }
  .pk-run-rail-remain-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* 50px 窄条里竖排 + rotate(180deg) 会把「10:00」倒着读成「00:01」，dad 反复要求可读性优先。
       「10:00」@11px 等宽 ≈ 33px，横排能完整放进 50px。 */
    font-size: 11px;
    line-height: 1;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    writing-mode: horizontal-tb;
    transform: none;
    color: #FFF8F0;
  }
  .pk-run-rail-bpm {
    width: 100%;
    flex: 0 0 auto;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border-bottom: 1px solid rgba(255,248,240,.10);
  }
  .pk-run-rail-bpm-num {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    font-weight: 800;
    line-height: 1;
    color: #FF9E7A;
  }
  .pk-run-rail-bpm-unit {
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .10em;
    color: rgba(255,248,240,.52);
  }
  .pk-run-rail-content {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px 0 14px;
    overflow: hidden;
  }
  .pk-run-rail-content-label {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .12em;
    color: rgba(255,248,240,.45);
    margin-bottom: 6px;
    flex: 0 0 auto;
  }
  .pk-run-rail-content-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: var(--font-serif, serif);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: .08em;
    color: rgba(255,248,240,.84);
    max-height: calc(100% - 18px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 2px 0;
  }
  .pk-run-rail-reselect-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 248, 240, 0.18);
    background: rgba(255, 248, 240, 0.08);
    color: rgba(255, 248, 240, 0.88);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease, transform 0.12s ease;
    user-select: none;
    box-sizing: border-box;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 0.14em;
    padding: 8px 6px;
    width: 32px;
    margin-top: auto;
    margin-bottom: 14px;
    line-height: 1.25;
  }
  .pk-run-rail-reselect-btn:hover:not(:disabled) {
    background: rgba(255, 248, 240, 0.18);
    border-color: rgba(255, 248, 240, 0.35);
    color: #FFF8F0;
  }
  .pk-run-rail-reselect-btn:active:not(:disabled) {
    transform: scale(0.95);
  }
  .pk-run-rail-reselect-btn:disabled,
  .pk-run-rail-reselect-btn[disabled] {
    opacity: 0.28 !important;
    cursor: not-allowed !important;
    pointer-events: none !important;
    filter: grayscale(1);
  }

  /* ══════ 计时态信用卡：真信用卡比例 1.586，槽内仅露上 1/5 露出条，槽内与读数区交叠严格为 0 ══════ */
  #czTicketStage {
    position: absolute;
    left: 50%;
    top: var(--cz-card-rise, -16px);
    bottom: auto;
    width: 100%;
    height: var(--pk-card-total-h, 86px);
    max-height: none;
    transform: translateX(-50%);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 44;
    border-radius: 12px 12px 4px 4px;
    /* v3.10（261027）：卡槽卡片不走黑色金属风格，改本项目主题色（dizicute 奶油面），
       不透明（渐变两端均为实色，无 alpha）。深墨皮肤下随 --dash-* token 自动转深。 */
    background: linear-gradient(180deg, var(--dash-surface-soft) 0%, var(--dash-surface-2) 48%, var(--dash-shell-lo) 100%);
    border: 1px solid var(--dash-ink-a16);
    border-bottom: 1px solid var(--dash-ink-a16);
    box-shadow: inset 0 1px 0 var(--dash-key-hi), inset 0 -14px 22px var(--dash-shell-inset), 0 8px 18px var(--dash-shell-shadow);
    cursor: pointer;
    overflow: hidden;
    clip-path: inset(0 0 0 0);
    display: flex;
    flex-direction: column;
  }
  #practiceStage.stage-running:not(.cz-ticket-exit) #czTicketStage,
  #practiceStage.cz-ticket-live:not(.cz-ticket-exit) #czTicketStage {
    visibility: visible;
    pointer-events: auto;
    animation: pkCardToSlot var(--s6-enter-slot-dur, 0.24s) cubic-bezier(.16,.84,.24,1) var(--s6-enter-slot-delay, 0.26s) both;
  }
  @keyframes pkCardToSlot {
    0% {
      opacity: 0;
      transform: translate(-50%, -44px);
    }
    30% {
      opacity: 0.72;
    }
    /* 抽屉到位：保留减速回弹，Y 严禁 > 0 以免卡片下缘从卡槽下半部露出来穿帮。
       72% 到位 0px，85% 向上微回弹 -2px，100% 顺滑归座 0px */
    72% {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    85% {
      transform: translate(-50%, -2px);
    }
    100% {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }
  #practiceStage.cz-ticket-exit #czTicketStage {
    visibility: visible;
    pointer-events: none;
    animation: pkCardFromSlot var(--s6-exit-slot-dur, 0.20s) cubic-bezier(.55,0,.86,.35) both;
  }
  /* feed 流（纵向无限流）：票夹黑 bar 在上、卡槽在下，插卡改为「从 bar 处下行入槽」的连续行程 */
  html.cz-feed #practiceStage.stage-running:not(.cz-ticket-exit) #czTicketStage {
    animation-name: pkCardToSlotFeed;
  }
  html.cz-feed #practiceStage.cz-ticket-exit #czTicketStage {
    animation-name: pkCardFromSlotFeed;
  }
  @keyframes pkCardToSlotFeed {
    0%   { opacity: 0; transform: translate(-50%, calc(-1 * var(--cz-feed-travel, 90px))); }
    34%  { opacity: 0.72; }
    72%  { opacity: 1; transform: translate(-50%, 0); }
    85%  { transform: translate(-50%, -2px); }
    100% { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes pkCardFromSlotFeed {
    0%   { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, calc(-1 * var(--cz-feed-travel, 90px))); }
  }
  @keyframes pkCardFromSlot {
    0% {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -26px);
    }
  }
  #practiceStage.stage-prep:not(.cz-ticket-exit) #czTicketStage {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* 露出部分（约 1/5）：标题 + session + 速度 + 时长 */
  .pk-card-exposed-bar {
    height: var(--pk-card-exposed-h, 54px);

  .pk-exposed-meta {

    font-size: 11px;

  .pk-exposed-session {

    overflow: hidden;

  .pk-exposed-bpm, .pk-exposed-dur {

  .pk-exposed-expand-hint {

  }
  @media (max-width: 600px) {

    .pk-exposed-expand-hint { display: none !important; }
    .pk-exposed-chip { font-size: 8px !important; padding: 1px 4px !important; }
    .pk-exposed-title { font-size: 11.5px !important; max-width: 80px !important; overflow: hidden !important; text-overflow: ellipsis !important; white-space: nowrap !important; }
    .pk-exposed-bpm, .pk-exposed-dur { font-size: 10px !important; flex-shrink: 0 !important; }
  }
  #czTicketStage.is-compact .pk-card-exposed-bar,
  .pk-card-exposed-bar.is-compact,
  .is-compact .pk-card-exposed-bar {
    padding: 0 6px !important;
  }
  #czTicketStage.is-compact .pk-exposed-left,
  .pk-card-exposed-bar.is-compact .pk-exposed-left,

  /* ══════ Grok Session Selector（上浮面板 · 不撑高票卡 · 实时过滤） ══════ */
  .pk-session-slot {
    position: relative;

    display: block;

  }
  .pss {
    width: 100%;
    display: block;
    box-sizing: border-box;
  }
  .pss-anchor {
    position: relative;
    width: 100%;
    box-sizing: border-box;
  }
  .pss-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 100%;
    height: 42px;
    min-height: 42px;
    max-height: 42px;
    padding: 0 4px;
    border-radius: 9999px;
    border: 1px solid rgba(44, 62, 80, 0.12);
    background: var(--surface-card);
    box-shadow: var(--shadow-ticket);
    box-sizing: border-box;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .pss-bar:focus-within {
    border-color: rgba(44, 62, 80, 0.22);
    box-shadow: var(--shadow-ticket);
  }
  .pss-plus,
  .pss-clear {
    flex: 0 0 34px;
    width: 34px;
    min-width: 34px;
    height: 34px;
    min-height: 34px;
    border-radius: 9999px;
    border: 0;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    box-sizing: border-box;
    transition: background 0.15s ease, color 0.15s ease;
  }
  /* 触控热区保证 ≥ 44px */
  .pss-plus::after,
  .pss-clear::after {
    content: '';
    position: absolute;
    inset: -5px;
  }
  .pss-plus:hover,
  .pss-clear:hover {
    background: rgba(44, 62, 80, 0.05);
    color: var(--text-main);
  }
  .pss.is-open .pss-plus {
    background: rgba(255, 107, 107, 0.10);
    color: var(--c-primary);
  }
  .pss-plus svg,
  .pss-clear svg { display: block; }
  .pss-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 34px;
    min-height: 34px;
    line-height: 34px;
    border: 0;
    margin: 0;
    padding: 0 8px;
    background: transparent;
    color: var(--text-main);
    font-size: 13.5px;
    outline: none;
    font-family: inherit;
    box-sizing: border-box;
  }
  .pss-input::placeholder { color: var(--text-muted); opacity: 0.75; }

  .pss-panel {
    position: absolute;
    z-index: 30;
    left: 0;
    right: 0;
    bottom: calc(100% + 8px);
    padding: 4px 4px 0;
    border-radius: 14px;
    border: 1px solid rgba(44, 62, 80, 0.14);
    background: var(--surface-card);
    box-shadow:
      0 1px 2px rgba(44, 62, 80, 0.06),
      0 16px 36px -18px rgba(44, 62, 80, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    transform-origin: bottom center;
    animation: pss-pop 180ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  @keyframes pss-pop {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pss-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .pss-list {
    position: relative;
    max-height: 280px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .pss-hl {
    position: absolute;
    left: 4px;
    right: 4px;
    border-radius: 8px;
    background: rgba(255, 107, 107, 0.10);
    pointer-events: none;
    opacity: 0;
    transition:
      top 220ms cubic-bezier(0.23, 1, 0.32, 1),
      height 220ms cubic-bezier(0.23, 1, 0.32, 1),
      opacity 150ms ease;
  }
  .pss-row,
  .pss-none {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 44px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    display: flex;
    align-items: center;
    text-align: left;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-main);
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pss-none {

  .pss-row.is-current {

  .pss-foot {

  .pss-plus:focus-visible,
  .pss-clear:focus-visible {
    outline: 2px solid rgba(44, 62, 80, 0.25);
    outline-offset: -2px;
  }
  .pss-input:focus-visible,
  .pss-row:focus-visible {
    outline: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .pss-panel { animation-name: pss-fade; }
    .pss-hl { transition: opacity 150ms ease; }
    .pss-plus { transition: none; }

    border-radius: 22px;
  }

  /* ══════ 模块 4：老师要求卡（常驻可见 · 字级下限 ≥12.5px · 结构稳定） ══════ */
  .pk-req-card {
    background: var(--pk-req-bg, var(--surface-card));
    border: var(--pk-req-border, 1px solid var(--border-card));
    border-left: var(--pk-req-border-left, 4px solid var(--c-primary));
    border-radius: var(--pk-req-radius, 16px);
    box-shadow: var(--shadow-card);
    padding: var(--pk-req-padding, 14px 18px);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: var(--pk-req-gap, 8px);
    flex: 0 0 auto;
    min-height: 0;
  }
  .pk-req-title {
    font-size: var(--pk-req-title-size, 15px);
  }
  .pk-req-item-name {
    font-size: var(--pk-req-sub-size, 13px);
  }
  .pk-req-list {
    margin: 4px 0;
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
  }
  .pk-req-list li {
    font-size: var(--pk-req-font-size, 13px);
    line-height: var(--pk-req-line-height, 1.55);
    color: var(--pk-req-item-color, var(--text-main));
  }
  .pk-req-list li:nth-child(n+4) {
    display: none;
  }
  .pk-sep {
    height: 1px;
    border: 0;
    margin: 6px 0;
    background: linear-gradient(90deg, transparent, rgba(44, 62, 80, 0.08) 20%, rgba(44, 62, 80, 0.08) 80%, transparent);
  }

  /* ══════ 票夹（Folio）弹出层（尺寸固定，切换不跳动） ══════ */
  .pk-folio-modal {
    position: fixed;
    inset: 0;
    background: rgba(44, 62, 80, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .pk-folio-modal.open { display: flex; }
  .pk-folio-box {
    background: var(--surface-card);
    border-radius: 20px;
    box-shadow: var(--shadow-raised);
    width: min(540px, 92vw);
    height: min(620px, 85vh); /* 固定尺寸，切换分组与展开不许跳动外框尺寸 */
    padding: 22px 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }
  .pk-folio-scroll-body {
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    padding-right: 4px;
  }
  .pk-folio-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--surface-well);
    border: 1px solid rgba(44, 62, 80, 0.08);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pk-folio-item.active {
    background: var(--surface-subtle);
    border-color: var(--border-active);
  }

  /* ══════ R11 全屏阅读层 ══════ */
  .pk-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44, 62, 80, 0.42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .pk-overlay.open { display: flex; }
  .pk-reader {
    background: var(--surface-card);
    border-radius: 20px;
    box-shadow: var(--shadow-raised);
    width: min(860px, 94vw);
    max-height: 84vh;
    overflow-y: auto;
    padding: 28px 32px;
    box-sizing: border-box;
  }
  .pk-reader-text {
    font-size: 17.5px;
    line-height: 1.8;
    color: var(--text-main);
    margin: 16px 0 0;
    padding-left: 24px;
  }
  .pk-reader-text li { margin-bottom: 10px; }

  /* ══════ 今日练习记录抽屉 ══════ */
  .pk-drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44, 62, 80, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 110;
  }
  .pk-drawer-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .pk-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(var(--pk-drawer-width, 340px), 100vw);
    background: var(--pk-drawer-bg, var(--surface-page));
    border-left: var(--pk-drawer-border, 1px solid var(--border-card));
    box-shadow: -4px 0 24px rgba(44, 62, 80, 0.12);
    z-index: 120;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .pk-drawer.open {
    transform: translateX(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .pk-drawer {
      transform: none !important;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease !important;
    }
    .pk-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }
  }

  .pk-drawer-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: var(--pk-drawer-padding, 16px 18px);
    gap: var(--pk-drawer-gap, 12px);
    box-sizing: border-box;
  }
  .pk-drawer-header {
    min-height: 36px;
  }
  .pk-drawer-title {
    font-size: var(--pk-drawer-title-size, 16px);
    font-weight: 700;
    color: var(--text-main);
  }
  .pk-drawer-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--c-primary);
    background: rgba(255, 107, 107, 0.10);
    padding: 2px 8px;
    border-radius: 9999px;
  }
  #pkDrawerClose {
    position: relative;
  }
  #pkDrawerClose::after {
    content: "";
    position: absolute;
    inset: -8px -12px;
  }
  .pk-drawer-summary {
    background: var(--pk-drawer-summary-bg, var(--surface-subtle));
    border: var(--pk-drawer-summary-border, 1px solid rgba(255, 107, 107, 0.20));
    border-radius: var(--pk-drawer-summary-radius, 12px);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .pk-drawer-summary-lead {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .pk-drawer-summary-val {
    font-size: 20px;
    font-weight: 800;
    color: var(--c-primary);
    font-variant-numeric: tabular-nums;
  }
  .pk-drawer-list-wrap {
    overflow-y: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding-right: 2px;
  }
  .pk-drawer-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pk-drawer-item {
    background: var(--pk-drawer-item-bg, var(--surface-card));
    border: var(--pk-drawer-item-border, 1px solid var(--border-card));
    border-radius: var(--pk-drawer-item-radius, 10px);
    padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(44, 62, 80, 0.03);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .pk-drawer-item-head {
    font-size: 12px;
  }
  .pk-drawer-item-time {
    font-weight: 600;
    color: var(--text-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .pk-drawer-item-dur {
    font-weight: 700;
    color: var(--c-primary);
    font-variant-numeric: tabular-nums;
  }
  .pk-drawer-item-subject {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-main);
  }
  .pk-drawer-item-session {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .pk-drawer-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .pk-drawer-foot {
    padding-top: 8px;
    border-top: 1px solid rgba(44, 62, 80, 0.06);
    text-align: center;
  }
  .pk-drawer-foot-text {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* 提示条 */
  .pk-toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 28px;
    z-index: 200;
    background: var(--surface-card);
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 9999px;
    padding: 8px 20px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: var(--shadow-raised);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .pk-footer-note {
    display: flex;
    justify-content: center;
    max-width: 1280px;
    margin: 4px auto 0;
    padding: 0;
    box-sizing: border-box;
  }
  .pk-demo-notes-fold {
    text-align: center;
  }
  .pk-demo-notes-summary {
    list-style: none;
    font-size: 10.5px;
    color: var(--text-muted);
    opacity: 0.55;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 4px;
    transition: opacity 0.15s ease;
  }
  .pk-demo-notes-summary::-webkit-details-marker { display: none; }
  .pk-demo-notes-summary:hover { opacity: 0.9; }
  .pk-demo-notes-text {
    margin: 4px auto 0;
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--text-muted);
    opacity: 0.7;
    max-width: 860px;
    text-align: left;
  }
</style>
</head>
<body>

<div id="practiceStage" class="stage-prep">

  <!-- ══════════ 顶栏 40px ══════════ -->
  <header class="pk-top" id="pkTop">
    <span class="pk-brand" id="pkBrand">练习准备</span>
    <span class="pk-mid" id="pkMid">女儿竹笛早课</span>
    <span class="pk-grow"></span>
    <button class="pk-pill mini" id="pkStateToggle">切到练习态</button>
    <button class="pk-pill mini ok" id="pkRecords">今日记录 15分 · 3次 ▾</button>
    <span class="pk-run-stat" id="pkRunStat">今日累计 18m</span>
    <div class="pk-server-clock" id="serverClock" title="当前时间 (CST)"></div>
  </header>

  <!-- ══════════ 主舞台 ══════════ -->
  <main class="pk-stage-wrap" id="stageWrap">

    <!-- ─── 左侧：练习票卡（Museum Ticket 390px） ─── -->
    <aside class="pk-left-col" id="pkLeftCol">

      <article class="pk-ticket" id="pkTicketCard" aria-label="练习准备票卡">

        <!-- 蒙版锁定层（练习态票卡变淡 + 灰蒙版锁定） -->
        <div class="pk-ticket-lock-overlay" id="pkTicketLockOverlay"></div>

        <!-- 顶部票头：左上打孔 + 展务铭文 + 票夹入口 -->
        <div class="pk-ticket-header-row">
          <div class="pk-row" style="gap:8px">
            <!-- 左上打孔：反映科目状态（实心珊瑚红＝本周作业） -->
            <div class="pk-hole-punch status-focus" id="pkTicketHoleTopLeft" title="科目状态打孔"></div>
            <span class="pk-ticket-header-label">dizical practice ticket</span>
          </div>
          <button class="pk-ticket-folio-trigger prep-only" id="pkFolioBtn">票夹 · 换曲目 ▾</button>
        </div>

        <!-- 顶部大图块：沉浸名画手绘笔触竹笛（42% 高度） -->
        <div class="pk-ticket-hero-frame" id="pkTicketHeroFrame" tabindex="0" role="button" aria-label="打开票夹换曲目">
          <img src="./assets/practice-hero-ticket-260922.png" alt="竹笛名画手绘" class="pk-ticket-hero-img" id="pkTicketHeroImg">
          <!-- 艺术家姓名位浮层：叠压在 hero 上（半透明浅底 + 档案编号小字） -->
          <div class="pk-ticket-subject-block" id="pkTicketSubjectBlock" title="点击打开票夹换曲目">
            <div class="pk-ticket-subject-title" id="pkTicketSubjectName">吸气长音</div>
            <div class="pk-ticket-subject-sub" id="pkTicketSubjectSub">档案编号 No.1034</div>
          </div>
        </div>

        <!-- 并排大数字：左=速度BPM + 下方注字；右=时长分钟 + 下方注字 -->
        <div class="pk-ticket-digits-grid">
          <!-- 左列：BPM -->
          <div class="pk-ticket-num-col">
            <span class="pk-collapsed-metric-label run-only">速度</span>
            <div class="pk-num-stepper-wrap">
              <button class="pk-mini-stepper-btn prep-only" id="pkBpmDown" aria-label="减速">−</button>
              <div class="pk-bignum-val" id="pkBpmVal">80</div>
              <button class="pk-mini-stepper-btn prep-only" id="pkBpmUp" aria-label="加速">+</button>
            </div>
            <!-- 音符档位注字（点击循环换档） -->
            <button class="pk-annotation-btn prep-only" id="pkTicketNoteBtn">
              <span id="pkTicketNoteSym">♩</span>
              <span id="pkTicketNoteCap">四分音符 ▾</span>
            </button>
            <span class="pk-collapsed-metric-unit run-only" id="pkCollapsedSpeedSym">♩</span>
          </div>

          <!-- 右列：时长 -->
          <div class="pk-ticket-num-col">
            <span class="pk-collapsed-metric-label run-only">时长</span>
            <div class="pk-num-stepper-wrap">
              <button class="pk-mini-stepper-btn prep-only" id="pkTicketDurDown" aria-label="减少时长">−</button>
              <div class="pk-bignum-val" id="pkTicketDurVal">10</div>
              <button class="pk-mini-stepper-btn prep-only" id="pkTicketDurUp" aria-label="增加时长">+</button>
            </div>
            <!-- 时长单位注字 -->
            <div class="pk-annotation-btn prep-only" id="pkTicketDurBtn">
              <span>练习时长 (分钟)</span>
            </div>
            <span class="pk-collapsed-metric-unit run-only">分钟</span>
          </div>
        </div>

        <!-- 撕裂虚线（带两侧半圆切口） -->
        <div class="pk-perforation-line">
          <div class="pk-perf-notch-left"></div>
          <div class="pk-perf-notch-right"></div>
        </div>

        <!-- 票根区：Grok 输入栏 + 2排胶囊标签 + 手写批注 + 细线参数网格 + 底部印章条码打孔条 -->
        <div class="pk-ticket-stub-col">
          <!-- ① Grok 输入选择器挂载槽（无标题，直接输入） -->
          <div class="pk-session-slot prep-only" id="pkSessionSlot"></div>

          <!-- ② 输入框下方 2 排 session 胶囊标签（可视即点，双向同步） -->
          <div class="pk-session-tags-wrap prep-only">
            <div class="pk-session-tags-grid" id="pkSessionTags"></div>
          </div>

          <!-- 计时态核心单行 Session 胶囊展示 -->
          <div class="pk-collapsed-session-row run-only" id="pkCollapsedSessionRow">
            <span class="pk-collapsed-session-label">本次内容</span>
            <span class="pk-collapsed-session-val" id="pkCollapsedSessionVal">未选内容</span>
          </div>

          <!-- 计时态收拢卡自然月点阵图（充实下半段，保持卡片高度 0 差） -->
          <div class="pk-collapsed-cal-block run-only" id="pkCollapsedCalBlock">
            <div class="pk-collapsed-cal-header">
              <span class="pk-collapsed-cal-title" id="pkCollapsedCalMonth">9月打卡</span>
              <span class="pk-collapsed-cal-stat" id="pkCollapsedDaysVal">累计 101 天</span>
            </div>
            <div class="pk-cal-weekdays mini">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="pk-collapsed-cal-grid" id="pkCollapsedDotMatrix" aria-label="收拢态自然月练习日历"></div>
          </div>

          <!-- (A) 今日累计块 (Variant B: 微卡片) -->
          <div class="pk-collapsed-stat-card pk-collapsed-stat-row run-only" id="pkCollapsedTodayRow">
            <div class="pk-collapsed-card-head">
              <span class="pk-info-icon-disc mini disc-dur">
                <svg class="pk-info-icon-svg" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-4.25a.75.75 0 0 1 .75.75V8h2.5a.75.75 0 0 1 0 1.5H8a.75.75 0 0 1-.75-.75V4.5A.75.75 0 0 1 8 3.75z"/></svg>
              </span>
              <span class="pk-collapsed-stat-label">今日已练</span>
            </div>
            <div class="pk-collapsed-card-body">
              <span class="pk-collapsed-stat-val" id="pkCollapsedTodayVal">0</span>
              <span class="pk-collapsed-stat-unit">分 · 0 次</span>
            </div>
          </div>

          <div class="pk-collapsed-divider run-only" id="pkCollapsedDivider1"></div>

          <!-- (B) 本次进度块 (Variant B: 微卡片) -->
          <div class="pk-collapsed-progress-card pk-collapsed-progress-block run-only" id="pkCollapsedProgressBlock">
            <div class="pk-collapsed-card-head">
              <span class="pk-info-icon-disc mini disc-max">
                <svg class="pk-info-icon-svg" viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 0a.75.75 0 0 0 0 1.5h3a.75.75 0 0 0 0-1.5h-3zM8 3a6 6 0 1 0 0 12A6 6 0 0 0 8 3zm-4.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0zm4.25-2.75a.75.75 0 0 1 1.5 0v2.44l1.28.77a.75.75 0 1 1-.76 1.3l-1.75-1.05A.75.75 0 0 1 7.75 9V6.25z"/></svg>
              </span>
              <span class="pk-collapsed-progress-label">本次进度</span>
            </div>
            <div class="pk-collapsed-card-body">
              <span class="pk-collapsed-progress-val" id="pkCollapsedProgressVal">已练 00:00 / 目标 10 分</span>
            </div>
            <div class="pk-collapsed-progress-bar-track">
              <div class="pk-collapsed-progress-bar-fill" id="pkCollapsedProgressBarFill"></div>
            </div>
          </div>

          <div class="pk-collapsed-divider run-only" id="pkCollapsedDivider2"></div>

          <!-- (C) 连续打卡块 (Variant B: 微卡片) -->
          <div class="pk-collapsed-stat-card pk-collapsed-stat-row run-only" id="pkCollapsedStreakRow">
            <div class="pk-collapsed-card-head">
              <span class="pk-info-icon-disc mini disc-count">
                <svg class="pk-info-icon-svg" viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1zm10.854 3.646a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L7.5 10.293l3.646-3.647a.5.5 0 0 1 .708 0z"/></svg>
              </span>
              <span class="pk-collapsed-stat-label">连续打卡</span>
            </div>
            <div class="pk-collapsed-card-body">
              <span class="pk-collapsed-stat-val" id="pkCollapsedStreakVal">61</span>
              <span class="pk-collapsed-stat-unit">天 <span class="pk-collapsed-stat-hint">· 最近 9-23</span></span>
            </div>
          </div>

          <!-- (A+C 矮档合并块) 今日与连续合并 (Variant B: 微卡片) -->
          <div class="pk-collapsed-stat-card pk-collapsed-stat-row pk-collapsed-merged-card pk-collapsed-merged-row run-only" id="pkCollapsedMergedRow">
            <div class="pk-collapsed-card-head">
              <span class="pk-info-icon-disc mini disc-dur">
                <svg class="pk-info-icon-svg" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-4.25a.75.75 0 0 1 .75.75V8h2.5a.75.75 0 0 1 0 1.5H8a.75.75 0 0 1-.75-.75V4.5A.75.75 0 0 1 8 3.75z"/></svg>
              </span>
              <span class="pk-collapsed-stat-label">今日/连续</span>
            </div>
            <div class="pk-collapsed-card-body">
              <span class="pk-collapsed-stat-val" id="pkCollapsedMergedVal">今日 0 分 · 连续 61 天</span>
            </div>
          </div>

          <!-- ═══ 科目历史信息模块（逐帧 copy 参考图 · 左右分栏 · 自然月日历打卡 + 4行真数） ═══ -->
          <div class="pk-subject-info-card prep-only" id="pkSubjectInfoCard">
            <!-- 左分栏：累计练习天数 + 自然月日历网格 -->
            <div class="pk-info-left-col">
              <div class="pk-info-metric-header">
                <span class="pk-info-label">累计练习</span>
              </div>
              <div class="pk-info-bignum-wrap">
                <span class="pk-info-bignum" id="pkSubjectDaysVal">101</span>
                <button type="button" class="pk-month-toggle-btn" id="pkMonthToggleBtn" onclick="toggleDemoMonth()" title="点击切换：9月(当月·云端真值) / 8月(历史数据)">切8月</button>
              </div>
