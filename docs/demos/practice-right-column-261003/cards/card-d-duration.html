  * { box-sizing: border-box; }

  .card-wrap {

    gap: 16px;
    user-select: none;
    box-sizing: border-box;
  }

  /* 顶部日期行：Tuesday 17 */
  .date-row {
    font-size: 15px; font-weight: 600;
    color: var(--dash-text);
    letter-spacing: 0.06em;
    font-family: var(--font-base);
  }

  /* 空心细体大时钟 (08:26 + 43 秒右上小字) */
  .clock-display {
    display: flex; align-items: flex-start;
    gap: 8px;
    line-height: 1;
    margin-top: -2px;
    color: var(--dash-text);
  }
  .hollow-digits-svg {
    display: block;
    height: 68px;
    width: auto;
  }

  .hollow-digits-svg rect,
  .hollow-digits-svg line { fill: none; }
  .hollow-digits-svg circle { fill: currentColor; }
  .superscript-sec-svg {
    display: block;
    height: 30px;
    width: auto;
    margin-top: 4px;

  }

  /* 段落标签与总量胶囊行 */
  .section-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 2px;
  }
  .section-label {
    font-size: 14.5px; font-weight: 600;
    color: var(--dash-text);
    letter-spacing: 0.02em;
  }
  .pill-duration {
    background: var(--dash-vermilion);
    color: var(--dash-knob-lo); /* 深炭字 */
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 850;
    padding: 3.5px 9px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px var(--dash-vermilion-glow);
  }

  /* ══════ 核心可视化：细长橙色圆胶囊时间轴 (高约 51px，全圆角 Pill，极薄细线) ══════ */
  .timeline-rail-capsule {
    width: 100%;
    height: 51px; /* 高度提升 1.5 倍 (51px，占卡高约 17%~18%) */
    background: var(--dash-vermilion);
    border-radius: 999px;
    padding: 0 14px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* 时间标签行：首次练习起点 + 每次练习起点 + 最后一次练习结束点
     D6-1：贴近 dash（CSS 偏移 8 → 3.5px）+ 细体 800 → 400；实测墨迹净距见自检 */
  .time-ticks-row {
    position: absolute;
    left: 14px; right: 14px;
    bottom: calc(50% + 3.5px);
    width: auto;
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 400;
    color: var(--dash-knob-lo);
    letter-spacing: 0.02em;
    padding: 0;
    line-height: 1;
    margin-bottom: 0;
    height: 10px;
  }
  .time-ticks-row span {
    position: absolute;
    top: 0;
    white-space: nowrap;
    line-height: 1;
  }
  .time-ticks-row span.tick-end {
    transform: translateX(-100%);
  }

  /* 胶囊内的细长线轨：实线练习 / 虚线休息 */
  .rail-track-line {
    position: absolute;
    left: 14px; right: 14px;
    top: calc(50% - 2px);
    width: auto;
    height: 4px;
    display: flex; align-items: center;
  }
  /* 基础虚线轴 (未完/休息段：点划/虚线，包豪斯圆头点划) */
  .rail-baseline-dash {
    position: absolute;
    left: 0; right: 0; top: 0;
    width: 100%;
    height: 4px;
    display: block;
    overflow: visible;
  }
  /* 实线练习段：细白线 (发丝线 2px，圆头) */
  .session-seg-white {
    position: absolute;
    top: 1px;
    height: 2px;
    background: var(--dash-white);
    border-radius: 999px;
    box-shadow: 0 0.5px 1.5px rgba(0, 0, 0, 0.25);
    z-index: 2;
  }

  /* B2: 虚线下方练习时长展示行
     D6-1：贴近 dash（CSS 偏移 8 → 5.5px）+ 细体 800 → 400 */
  .rail-duration-row {
    position: absolute;
    left: 14px; right: 14px;
    top: calc(50% + 5.5px);
    width: auto;
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 400;
    color: var(--dash-knob-lo);
    letter-spacing: 0.02em;
    padding: 0;
    line-height: 1;
    margin-top: 0;
    height: 10px;
  }
  .rail-duration-text {
    position: absolute;
    left: 6%;
    top: 0;
    white-space: nowrap;
    line-height: 1;
  }

  /* ══════ 底部状态栏：最近练习科目 + 包豪斯双图标 ══════ */
  .footer-status-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px;
    padding-top: 2px;
  }
  .recent-subject {
    font-size: 18px; font-weight: 350;
    color: var(--dash-text);
    letter-spacing: 0.02em;
  }

  /* 严格按 dad prompt 复刻的包豪斯 monoline 双图标 (12px 间距，1.5px 线宽，纯二维单线无发光) */
  .icons-bauhaus-group {
    display: flex; align-items: center;
    gap: 12px;
  }
  .bauhaus-ic {
    display: block;
    width: 22px; height: 22px;
    color: var(--dash-text);
  }

  button:focus-visible {
    outline: 2px solid var(--dash-vermilion);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  /* demo-ver badge */
  .demo-ver{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:11px;letter-spacing:.02em;border:1px solid var(--dash-ink-a16);color:var(--dash-text-soft);
    background:var(--dash-surface-soft)}
  .demo-ver b{color:var(--dash-vermilion-text);font-weight:600}
</style>

<body>

<div class="demo-bar">
  <span class="demo-ver" title="demo 版本（工具自动盖，勿手改）"><b>demo v3.8</b> · 卡 v3 · 2026-10-27</span>
  <div class="demo-title">
    D6 今日练习时长 <span>v3 · Bauhaus</span>
  </div>
  <div class="seg" id="vpSeg">
    <button type="button" data-vp="480">480 大屏</button>
    <button type="button" data-vp="380" class="is-on">380 契约</button>
    <button type="button" data-vp="340">340 手机</button>
  </div>
  <div class="seg" id="skinSeg">
    <button type="button" data-skin="ink" class="is-on">深墨</button>
    <button type="button" data-skin="light">浅银</button>
  </div>
</div>

<!-- 卡片容器 -->
<article class="card-wrap" id="cardWrap">
  <!-- 顶部日期 -->
  <div class="date-row" id="dateText">Tuesday 17</div>

  <!-- 空心几何细体大时钟 (SVG Monoline 线框字形) -->
  <div class="clock-display">
    <svg class="hollow-digits-svg" id="clockSvg" viewBox="0 0 162 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="08:26">
      <!-- 动态由 HOLLOW_DIGITS 生成 -->
    </svg>
    <svg class="superscript-sec-svg" id="secSvg" viewBox="0 0 72 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="43">
      <!-- 动态由 HOLLOW_DIGITS 生成 -->
    </svg>
  </div>

  <!-- 段落与总量胶囊 -->
  <div class="section-row">
    <span class="section-label">Practice</span>
    <span class="pill-duration" id="pillVal">2H 45M</span>
  </div>

  <!-- 橙色细长胶囊时间轴 (约 34px 全圆角胶囊) -->
  <div class="timeline-rail-capsule" id="railCapsule">
    <div class="time-ticks-row" id="timeTicksRow">
      <span style="left: 6%;">07:15</span>
      <span style="left: 36%;">07:45</span>
      <span style="left: 68%;">08:15</span>
      <span class="tick-end" style="left: 92%;">08:45</span>
    </div>

  var HOLLOW_DIGITS = {

    '3': '<path d="M 4,8 C 7,-0.8 28,-0.8 28,14 C 28,23 18,26 13,26 C 20,26 28,29 28,38 C 28,52.5 7,52.5 3,44" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />',

    '6': '<path d="M 24,2 C 12,2 2,14 2,36 A 14 14 0 1 0 16,22 A 14 14 0 0 0 2.8,32" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />',

  }

  }

  function updateClockDisplay() {

  }

  function tickSecond() {
    curSec++;
    if (curSec >= 60) {
      curSec = 0;
      curMin++;
      if (curMin >= 60) {

        curHour = (curHour + 1) % 24;

  }

  function formatPracticeDuration(minutes) {

    }

  var clockTimer = setInterval(tickSecond, 1000);

  // 暴露给自检及外部自动化
  window.__cardClockState = {
    getHour: function () { return curHour; },
    getMin: function () { return curMin; },

      curHour = h; curMin = m; curSec = s;

  };

  // 视口与皮肤切换 (真实响应宽度与背景)
  document.getElementById('vpSeg').addEventListener('click', function (e) {

      document.documentElement.removeAttribute('data-skin');

    document.querySelectorAll('#skinSeg button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
  });

  // 初始设为深墨以对齐参考图
  document.documentElement.setAttribute('data-skin', 'ink');

  // ?audit=1 契约自检
  if (location.search.indexOf('audit=1') >= 0) {
    var fails = [];
    var rail = document.getElementById('railCapsule');
    var railH = rail.getBoundingClientRect().height;
    var cardH = card.getBoundingClientRect().height;
    var railRatio = railH / cardH;

    // B1 断言：rail 高度提升 1.5 倍 (34px -> 51px，占卡高约 17%~18%)
    if (Math.abs(railH - 51) > 1.0) {
      fails.push('B1 fail: railHeight want 51px got ' + Math.round(railH) + 'px');
    }

    // 断言 2：白线段数 = 3
    var segs = document.querySelectorAll('.session-seg-white').length;
    if (segs !== 3) fails.push('white segs got ' + segs + ' want 3');

    // 断言 3：右下两枚包豪斯矢量图标齐备，间距严格 12px
    var ics = document.querySelectorAll('.bauhaus-ic');
    if (ics.length !== 2) fails.push('icons count got ' + ics.length + ' want 2');
    var icGroup = document.querySelector('.icons-bauhaus-group');
    var gap = icGroup ? parseFloat(window.getComputedStyle(icGroup).gap) : 0;
    if (Math.abs(gap - 12) > 1.0) fails.push('icon gap got ' + gap + 'px want 12px');

    // 断言 4：无横向溢出
    var noHOverflow = card.scrollWidth <= card.clientWidth;
    if (!noHOverflow) fails.push('horizontal overflow');

    // 断言 5：皮肤切换真实响应 (深墨 vs 浅银 卡面背景色互不相等)
    var origSkin = document.documentElement.getAttribute('data-skin');
    document.documentElement.setAttribute('data-skin', 'ink');
    var inkBg = window.getComputedStyle(card).backgroundColor;
    document.documentElement.removeAttribute('data-skin');
    var lightBg = window.getComputedStyle(card).backgroundColor;
    if (inkBg === lightBg) fails.push('skin switch failed: ink and light background identical (' + inkBg + ')');
    if (origSkin) document.documentElement.setAttribute('data-skin', origSkin);
    else document.documentElement.setAttribute('data-skin', 'ink');

    // 断言 6：三档宽度切换真实响应 (480 / 380 / 340)
    card.style.width = '480px';
    var w480 = Math.round(card.getBoundingClientRect().width);
    card.style.width = '380px';
    var w380 = Math.round(card.getBoundingClientRect().width);
    card.style.width = '340px';
    var w340 = Math.round(card.getBoundingClientRect().width);
    if (!(w480 > w380 && w380 > w340)) {
      fails.push('viewport widths not distinct: ' + w480 + ', ' + w380 + ', ' + w340);
    }
    card.style.width = '380px'; // 恢复默认契约宽

    // D6-1 断言：纯 1px 细虚线（去掉长段，首段 1px，无 >=2px 长段，段与段间隙均匀，段数 >=3）
    var gapLines = document.querySelectorAll('.session-gap-dash');
    var segTypes = (segs > 0 ? 1 : 0) + (gapLines.length > 0 ? 1 : 0);
    var dashStr = gapLines.length > 0 ? gapLines[0].getAttribute('stroke-dasharray') : '';
    var parts = dashStr ? dashStr.split(/[\s,]+/).map(parseFloat).filter(function (n) { return !isNaN(n); }) : [];
    var firstIs1px = parts.length > 0 && Math.abs(parts[0] - 1.0) < 0.1;
    var noLongSeg = parts.every(function (n, idx) { return (idx % 2 === 1) || (n < 2.0); });
    var isUniform = parts.length === 2 || (parts.length >= 4 && parts[1] === parts[3]);
    var segCount = parts.length >= 2 ? Math.floor(100 / (parts[0] + parts[1])) : 0;
    var gapStroke = gapLines.length > 0 ? (gapLines[0].getAttribute('stroke') || '') : '';
    var isWhiteStroke = gapStroke.indexOf('white') >= 0 || gapStroke.indexOf('var(--dash-white)') >= 0;
    if (segTypes < 2 || !firstIs1px || !noLongSeg || !isUniform || segCount < 3 || !isWhiteStroke) {
      fails.push('D6-1 fail: dasharray="' + dashStr + '" (firstIs1px=' + firstIs1px + ', noLongSeg=' + noLongSeg + ', isUniform=' + isUniform + ', segCount=' + segCount + '), stroke="' + gapStroke + '"');
    }

    // D6-1 断言：秒针 59->00 真实驱动分针联动进位 (+1 步)
    var origH = window.__cardClockState.getHour();
    var origM = window.__cardClockState.getMin();
    var origS = window.__cardClockState.getSec();
    window.__cardClockState.setTime(8, 26, 59);
    var preMin = window.__cardClockState.getMin();
    window.__cardClockState.tick();
    var postMin = window.__cardClockState.getMin();
    var postSec = window.__cardClockState.getSec();
    var minStepped = (postMin === preMin + 1) && (postSec === 0);
    // 恢复现场
    window.__cardClockState.setTime(origH, origM, origS);
    if (!minStepped) {
      fails.push('D6-1 fail: clock rollover from 59 to 00 did not advance minute: preMin=' + preMin + ', postMin=' + postMin + ', postSec=' + postSec);
    }

    // B2 断言：10 个数字 SVG 的视觉盒高度极差 ≤1px；数字个数 = 10
    var digitKeys = Object.keys(HOLLOW_DIGITS).filter(function (k) { return k >= '0' && k <= '9'; });
    if (digitKeys.length !== 10) {
      fails.push('B2 fail: digit count got ' + digitKeys.length + ' want 10');
    }
    var testSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    testSvg.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;width:200px;height:200px;';
    document.body.appendChild(testSvg);
    var digitHeights = [];
    digitKeys.forEach(function (k) {
      testSvg.innerHTML = '<g>' + HOLLOW_DIGITS[k] + '</g>';
      var g = testSvg.querySelector('g');
      if (g) {
        var bbox = g.getBBox();
        digitHeights.push(bbox.height);
      }
    });
    var minH = Math.min.apply(null, digitHeights);
    var maxH = Math.max.apply(null, digitHeights);
    var hRange = maxH - minH;
    if (hRange > 1.0) {
      fails.push('B2 fail: 0-9 glyph height spread got ' + hRange.toFixed(2) + 'px (> 1.0px): min=' + minH.toFixed(2) + ' max=' + maxH.toFixed(2));
    }

    // A2-3 断言：6/9 正圆与无搭接
    testSvg.innerHTML = '<path d="M 2,36 A 14 14 0 1 0 16,22 A 14 14 0 0 0 2.8,32" stroke="currentColor" stroke-width="1.8" fill="none" />';
    var b6Loop = testSvg.querySelector('path').getBBox();
    var loop6Ratio = b6Loop.width / b6Loop.height;

    testSvg.innerHTML = '<path d="M 30,16 A 14 14 0 1 0 16,30 A 14 14 0 0 0 29.2,20" stroke="currentColor" stroke-width="1.8" fill="none" />';
    var b9Loop = testSvg.querySelector('path').getBBox();
    var loop9Ratio = b9Loop.width / b9Loop.height;

    document.body.removeChild(testSvg);

    if (Math.abs(loop6Ratio - 1.0) > 0.03) {
      fails.push('A2-3 fail: 6 loop ratio got ' + loop6Ratio.toFixed(3) + ' want 1.0 +-0.03');
    }
    if (Math.abs(loop9Ratio - 1.0) > 0.03) {
      fails.push('A2-3 fail: 9 loop ratio got ' + loop9Ratio.toFixed(3) + ' want 1.0 +-0.03');
    }

    var strokeClearance6 = 2.8 - 2.0; // 0.8px > 0
    var strokeClearance9 = 30.0 - 29.2; // 0.8px > 0
    if (strokeClearance6 <= 0 || strokeClearance9 <= 0) {

    // B2 断言：练习时长文本展示与单位切换逻辑 (常态 xx 分钟，极限 x.x 小时)
    var durationRowEl = document.getElementById('railDurationRow');
    var durationTextEl = document.getElementById('railDurationText');
    var durationTextContent = durationTextEl ? durationTextEl.textContent.trim() : '';
    if (!durationTextEl || !durationTextContent) {

    var test42 = formatPracticeDuration(42);
    var test90 = formatPracticeDuration(90);
    if (test42 !== '42 分钟') {

    // B3 断言（D6-1 改法）：两行到 dash 的【墨迹净距】≥4 且 ≤6px + 字重 400 + 字号 8.5~9px + 不压线/不裁切
    // 墨迹用 canvas 的真实字体度量算（getClientRects 只给行盒，行盒含字身空白，会把净距报大）
    function inkMetrics(el) {
      var cs = getComputedStyle(el);
      var cv = document.createElement('canvas').getContext('2d');
      cv.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      var m = cv.measureText((el.textContent || '').replace(/\s+/g, ''));
      var L = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize);
      var r = el.getBoundingClientRect();
      var halfLead = (L - ((m.fontBoundingBoxAscent || 0) + (m.fontBoundingBoxDescent || 0))) / 2;
      var baseline = r.top + halfLead + (m.fontBoundingBoxAscent || 0);

        inkTop: baseline - (m.actualBoundingBoxAscent || 0),
        inkBottom: baseline + (m.actualBoundingBoxDescent || 0),
        weight: cs.fontWeight, size: parseFloat(cs.fontSize), font: cv.font

    }
    var ticksRowEl = document.getElementById('timeTicksRow');

    var paintTop = lineRect.top + 1.2;

    var dm = inkMetrics(durationTextEl);
    var ticksInkGap = paintTop - tm.inkBottom;
    var durInkGap = dm.inkTop - paintBottom;
    if (ticksInkGap < 4.0 || ticksInkGap > 6.0) fails.push('B3 fail: 刻度行墨迹净距 want 4..6px got ' + ticksInkGap.toFixed(2) + 'px');
    if (durInkGap < 4.0 || durInkGap > 6.0) fails.push('B3 fail: 时长行墨迹净距 want 4..6px got ' + durInkGap.toFixed(2) + 'px');
    if (tm.weight !== '400') fails.push('B3 fail: 刻度行字重 want 400 got ' + tm.weight);
    if (dm.weight !== '400') fails.push('B3 fail: 时长行字重 want 400 got ' + dm.weight);

    if (durBoxGap < 1.0) fails.push('B3 fail: 时长行盒贴死/压线 got ' + durBoxGap.toFixed(2) + 'px');
    [ticksRowEl, durRowEl].forEach(function (el) {

    var capsuleCenterY = capsuleRect.top + capsuleRect.height / 2;
    var lineCenterDiff = Math.abs(lineCenterY - capsuleCenterY);
    if (lineCenterDiff > 1.0) {
      fails.push('A2-2 fail: rail line center diff got ' + lineCenterDiff.toFixed(2) + 'px (> 1.0px)');
    }

    var tickSpans = Array.from(document.querySelectorAll('#timeTicksRow span'));
    var segEls = Array.from(document.querySelectorAll('.session-seg-white'));
    var tickLabels = tickSpans.map(function (s) { return s.textContent.trim(); });
    var tick0Diff = -1;
    if (tickSpans.length > 0 && segEls.length > 0) {
      var t0Rect = tickSpans[0].getBoundingClientRect();
      var s0Rect = segEls[0].getBoundingClientRect();
      tick0Diff = Math.abs(t0Rect.left - s0Rect.left);
      if (tick0Diff > 1.0) {
        fails.push('A2-1 fail: tick0 left diff got ' + tick0Diff.toFixed(2) + 'px (> 1.0px)');
      }
    } else {
      fails.push('A2-1 fail: missing ticks or segments');
    }

    var wantTickCount = segEls.length + 1;
    if (tickSpans.length !== wantTickCount) {
      fails.push('A2-2 fail: tick count got ' + tickSpans.length + ' want ' + wantTickCount);
    }
    if (tickLabels[0] !== '07:15') {

    }

    var isOk = fails.length === 0;
    var out = {
      card: 'card-practice-duration-v3',
      railHeight: Math.round(railH),
      railHeightBefore: 34,
      cardHeight: Math.round(cardH),
      railRatio: Number(railRatio.toFixed(3)),
      railRatioBefore: 0.12,
      ticksToDash: Number(ticksToDash.toFixed(1)),
      textToDash: Number(textToDash.toFixed(1)),
