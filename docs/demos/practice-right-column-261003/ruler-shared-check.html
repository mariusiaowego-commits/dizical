  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: -apple-system, "PingFang SC", sans-serif; background: var(--dash-page); color: var(--dash-text); }

<body>

<div class="bar">
  <span class="demo-ver" title="demo 版本（工具自动盖，勿手改）"><b>demo v3.8</b> · 卡 v1 · 2026-10-27</span>
  <b>共享刻度尺接入自检</b>
  <div class="seg" id="skinSeg">
    <button type="button" data-skin="light" class="on">浅银</button>
    <button type="button" data-skin="ink">深墨</button>
  </div>
  <button type="button" id="btnStepMinus" class="step-btn" aria-label="减少一分钟">−</button>
  <button type="button" id="btnStepPlus" class="step-btn" aria-label="增加一分钟">+</button>
  <button type="button" id="btnBubble">冒一次气泡</button>
</div>

<div class="card">
  <div class="readout"><b id="durText">10</b><span>分钟</span></div>
  <!-- 生产同名 markup（practice.html:1712-1721 原样，只把 onclick 指到共享件 API） -->
  <div class="ruler-wrap">
    <button class="step-btn minus" id="ttStepMinus" aria-label="减少一分钟">−</button>
    <div class="ruler" id="ruler">
      <div class="ruler-row" id="rulerRow" aria-hidden="true"></div>
      <div class="notes-bubbles" aria-hidden="true"></div>
      <input class="ruler-input" id="rulerInput" type="range" min="1" max="30" step="1" value="10"
             tabindex="-1" aria-label="练习时长（分钟）">
    </div>
    <button class="step-btn plus" id="ttStepPlus" aria-label="增加一分钟">+</button>
  </div>
  <p class="note">
    尺子/气泡/卷草纹全部来自 <code>../shared/ruler-production.js</code>（逐行切片自 practice.html）；
    本页只做接线与自检，不含任何自造刻度实现。
  </p>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/ruler-production.js"></script>
<script>
(function () {
  const audit = new URLSearchParams(location.search).has('audit');
  const R = window.RulerProduction;
  const mountInfo = R.mount({ minutes: 10 });

  const durText = document.getElementById('durText');
  const sync = () => { durText.textContent = R.duration; };
  sync();

  document.getElementById('btnStepPlus').addEventListener('click', () => { R.step(1); sync(); });
  document.getElementById('btnStepMinus').addEventListener('click', () => { R.step(-1); sync(); });
  document.getElementById('ttStepPlus').addEventListener('click', () => { R.step(1); sync(); });
  document.getElementById('ttStepMinus').addEventListener('click', () => { R.step(-1); sync(); });
  document.getElementById('ttStepPlus') && document.getElementById('ttStepPlus')
    .addEventListener('click', () => { R.step(1); sync(); });
  document.getElementById('btnBubble').addEventListener('click', () => { R.emitBubbles(); });
  // step 后同步读数（无论从哪触发）
  document.getElementById('rulerInput').addEventListener('input', sync);

  document.getElementById('skinSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.skin === 'ink') document.documentElement.dataset.skin = 'ink';
    else delete document.documentElement.dataset.skin;
    document.querySelectorAll('#skinSeg button').forEach(x => x.classList.toggle('on', x === b));
  });

  if (!audit) return;

  const fails = [];
  const out = { mount: mountInfo };

  // 断言 1：刻度数 = 生产 TICKS(60)
  out.tickCount = R.tickCount;
  if (R.tickCount !== 60) fails.push(`tickCount got ${R.tickCount} want 60`);

  // 断言 2：卷草纹 SVG 存在（有 gsap 时必须建出来）
  out.vine = !!document.querySelector('.ruler-vine');
  if (window.gsap && !out.vine) fails.push('vine got false want true (gsap present)');

  // 断言 3：气泡池 = 22（生产 buildBubbles 的池子大小）
  out.bubblePool = mountInfo.bubbles;
  if (mountInfo.bubbles !== 22) fails.push(`bubblePool got ${mountInfo.bubbles} want 22`);

  // 断言 4：步进 +1 真的改时长，且当前针跟着走
  const d0 = R.duration;
  const idx0 = [...document.querySelectorAll('.tick')].indexOf(document.querySelector('.tick.cur'));
  document.getElementById('btnStepPlus').click();
  const d1 = R.duration;
  const idx1 = [...document.querySelectorAll('.tick')].indexOf(document.querySelector('.tick.cur'));
  out.step = { before: d0, after: d1, markerBefore: idx0, markerAfter: idx1 };
  if (d1 !== d0 + 1) fails.push(`stepPlus got ${d1} want ${d0 + 1}`);
  if (idx1 === idx0) fails.push(`marker moved got idx ${idx1} same as ${idx0}`);

  // 断言 5：合成拖拽（按下→移动 40px→松手）真的改时长，且 .is-dragging 挂上又摘掉
  const ri = document.getElementById('rulerInput');
  const rulerEl = document.getElementById('ruler');
  const w = rulerEl.getBoundingClientRect().width;
  const pd = (type, x) => ri.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: 10, bubbles: true, pointerId: 1, button: 0, isPrimary: true }));
  const dB = R.duration;
  pd('pointerdown', 100);
  const draggedFlag = rulerEl.classList.contains('is-dragging');
  pd('pointermove', 100 + Math.round((w / 29) * 2));   // 往右拖 ≈ +2 分钟
  pd('pointerup', 100 + Math.round((w / 29) * 2));
  const dA = R.duration;
  const clearedFlag = !rulerEl.classList.contains('is-dragging');
  out.drag = { before: dB, after: dA, dragFlagOn: draggedFlag, dragFlagCleared: clearedFlag, rulerW: Math.round(w) };
  if (!draggedFlag) fails.push('is-dragging not set on pointerdown');
  if (!clearedFlag) fails.push('is-dragging not cleared on pointerup');
  if (dA <= dB) fails.push(`drag got dur ${dA} want > ${dB}`);

  // 断言 6：emitBubbles 真的写了符到气泡里
  R.emitBubbles();
  const live = [...document.querySelectorAll('.tt-bubble')].filter(b => b.textContent.trim().length);
  out.bubblesEmitted = live.length;
  if (!live.length) fails.push('emitBubbles wrote nothing');

  // 断言 7：深墨皮肤下刻度色确实换了
  // ⚠️ 不能读元素的 computed backgroundColor —— .tick 挂着 200ms background-color 过渡,
  //    切肤瞬间读到的是过渡起始值（浅银）→ 假红。改读 :root 上的变量本身, 不经过过渡。
  const lightVar = getComputedStyle(document.documentElement).getPropertyValue('--ruler-tick-major-future').trim();
  document.querySelector('#skinSeg button[data-skin="ink"]').click();
  const inkVar = getComputedStyle(document.documentElement).getPropertyValue('--ruler-tick-major-future').trim();
  const inkRailVar = getComputedStyle(document.documentElement).getPropertyValue('--ruler-rail-line').trim();
  out.ink = { lightVar, inkVar, inkRailVar };
  if (inkVar === lightVar) fails.push(`ink var unchanged (${inkVar})`);
  if (!/255, 248, 240/.test(inkVar)) fails.push(`ink var looks light-themed: ${inkVar}`);

  out.fails = fails;
  out.verdict = fails.length ? 'ASSERT_FAIL' : 'ASSERT_OK';
  console.log(JSON.stringify(out, null, 1));
  document.title = (fails.length ? 'FAIL ' : 'OK ') + '共享刻度尺自检';
})();
</script>
