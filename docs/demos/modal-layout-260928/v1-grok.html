<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提前结束练习 · 布局 v1</title>
<style>
  :root { --bg: #FFFDF5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: #5D4037;
    font-family: "PingFang SC", system-ui, -apple-system, sans-serif;
  }
  .page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    gap: 14px;
  }
  .ver {
    margin: 0;
    max-width: 28em;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
  }
  .ver b { font-weight: 700; }
  .open-btn {
    min-height: 44px;
    padding: 0 18px;
    border: 0;
    border-radius: 16px;
    background: #FF6B6B;
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .note {
    min-height: 20px;
    margin: 0;
    font-size: 13px;
    color: #7F8C8D;
  }

  #finishEarlyModal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 200; align-items: center; justify-content: center; padding: 12px;
  }
  #finishEarlyModal.open { display: flex; }
  .finish-modal-box {
    background: white; border-radius: 24px; padding: 14px 16px 12px;
    max-width: 416px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-height: 92vh; overflow-y: auto;
  }
  .finish-modal-screen { width: 100%; }
  .finish-modal-box .finish-icon { font-size: 22px; margin: 0; line-height: 0; color: #2E7D32; }
  .finish-modal-box .finish-icon svg { width: 22px; height: 22px; display: block; }
  .finish-modal-box h3 { font-size: 18px; color: #2E7D32; margin: 0; font-weight: 700; }
  .finish-modal-box .finish-mins {
    font-size: 48px; font-weight: 800; color: #4ECDC4;
    line-height: 0.95; margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .finish-modal-box .finish-mins-label { font-size: 14px; color: #7F8C8D; margin: 2px 0 0; }
  .finish-modal-actions { display: flex; gap: 8px; flex-direction: row; margin-top: 8px; }
  .finish-modal-actions button {
    padding: 10px 6px; border: none; border-radius: 16px;
    font-size: 15px; font-weight: bold; cursor: pointer;
    transition: transform 0.15s;
    flex: 1; white-space: nowrap; min-width: 0; min-height: 44px;
  }
  .finish-modal-actions button:active { transform: scale(0.96); }
  .finish-modal-actions .btn-submit { background: linear-gradient(135deg, #4ECDC4, #44B8AC); color: white; }
  .finish-modal-actions .btn-resume { background: #F0D060; color: #5D4037; }
  .finish-modal-actions .btn-abort { background: #F0F0F0; color: #888; }

  .split-head {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 0 0 8px;
  }
  .split-body {
    display: flex; align-items: center; gap: 6px;
  }
  .split-time {
    flex: 0 0 86px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .split-reps { flex: 1 1 auto; min-width: 0; }

  /* 滚轮 v2 视觉本体，照 practice.html 78-209 行 */
  .reps-wheel-container {
    margin: 0; width: 100%; display: flex; flex-direction: column; align-items: center;
  }
  .reps-wheel-title {
    font-size: 14px; font-weight: 700; color: #5D4037; margin: 0 0 2px;
    align-self: flex-start; padding-left: 2px;
  }
  .counter-stage.reps-stage {
    position: relative; width: 100%; height: 126px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; margin: 0 auto;
  }
  .tape-ribbon-track {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 118px; display: flex; flex-direction: column; align-items: center;
    pointer-events: none; z-index: 1;
  }
  .tape-slot-top {
    position: absolute; bottom: 31px; width: 70px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; pointer-events: auto; z-index: 2;
    transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.22s ease;
    mask-image: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
  }
  .tape-slot-top:hover { transform: translateY(-2px); }
  .tape-slot-bottom {
    position: absolute; top: 31px; width: 70px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; pointer-events: auto; z-index: 2;
    transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.22s ease;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
  }
  .tape-slot-bottom:hover { transform: translateY(2px); }
  .tape-inner-box {
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; font-style: italic; color: #8A8A93;
    font-variant-numeric: tabular-nums;
  }
  .reps-band {
    position: relative; width: 100%; height: 62px; border-radius: 0;
    background: linear-gradient(180deg, #FBF8F3 0%, #F2ECE1 100%);
    border-top: 1px solid rgba(0,0,0,0.07); border-bottom: 1px solid rgba(0,0,0,0.07);
    display: flex; align-items: center; padding: 0 10px; gap: 10px;
    z-index: 3; user-select: none; -webkit-user-select: none;
  }
  .roller-casing {
    position: relative; width: 118px; height: 44px; border-radius: 0;
    background: linear-gradient(180deg, #D9D4CC 0%, #E8E3DB 100%);
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.24), inset 0 -1px 2px rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    cursor: grab; touch-action: none; flex-shrink: 0;
  }
  .roller-casing:active { cursor: grabbing; }
  .axle-pin {
    width: 4px; height: 12px;
    background: linear-gradient(180deg, #8E8E93 0%, #D1D1D6 40%, #AEAEB2 70%, #636366 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 1px 2px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }
  .roller-wheel {
    position: relative; width: 11px; height: 38px; border-radius: 0;
    background: #C7C7CD;
    background-image:
      repeating-linear-gradient(
        180deg, rgba(255,255,255,0.52) 0px, rgba(255,255,255,0.52) 2px,
        transparent 2px, transparent 4px,
        rgba(0,0,0,0.16) 4px, rgba(0,0,0,0.16) 6px,
        transparent 6px, transparent 8px
      ),
      linear-gradient(180deg, #9E9EA5 0%, #BFBFC6 22%, #DADAE0 42%, #B8B8BF 68%, #8C8C93 100%);
    box-shadow: inset -1px 0 2px rgba(0,0,0,0.26), inset 1px 0 2px rgba(255,255,255,0.72), 0 2px 5px rgba(0,0,0,0.20);
    flex-shrink: 0;
  }
  .roller-drum {
    position: relative; width: 72px; height: 38px; margin: 0 2px; border-radius: 0;
    background: linear-gradient(180deg, #D4CEBF 0%, #FFFFFF 18%, #FFFFFF 82%, #CCC6B7 100%);
    border: 1px solid rgba(0,0,0,0.09);
    box-shadow: 0 3px 8px rgba(0,0,0,0.12), inset 0 1px 1px rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; perspective: 800px; flex-shrink: 0;
  }
  .drum-value {
    font-size: 24px; font-weight: 800; font-style: italic; color: #2C3E50;
    letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
    will-change: transform, opacity;
    transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15);
  }
  .drum-value.empty-state {
    font-style: normal; font-size: 21px; font-weight: 600; color: #7F8C8D;
  }
  .stepper-card { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .stepper-btn {
    width: 30px; height: 22px; min-height: 22px; border: 0; background: transparent; border-radius: 0;
    color: #2C3E50; display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .stepper-btn:hover { background: #F8F5F0; }
  .stepper-btn:active { transform: scale(0.90); }
  .stepper-btn svg { width: 12px; height: 12px; fill: currentColor; }
  .stepper-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
  .capsule-summary {
    flex: 1; display: flex; align-items: center; justify-content: flex-end; min-width: 0;
  }
  .capsule-summary-text {
    font-size: 13px; font-weight: 700; color: #FF6B6B; letter-spacing: -0.01em;
  }
  .presets-row {
    display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 4px 0 0;
  }
  .preset-chip {
    min-height: 26px; padding: 0 10px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.08); background: #FFFFFF;
    color: #5D4037; font-size: 12px; font-weight: 500;
    cursor: pointer; touch-action: manipulation; transition: all 0.16s ease;
  }
  .preset-chip:hover { border-color: #FF6B6B; color: #FF6B6B; }
  .preset-chip.active { background: #FF6B6B; color: #FFFFFF; border-color: #FF6B6B; }
  .zero-copy {
    font-size: 14px; color: #7F8C8D; line-height: 1.5; margin: 8px 0 12px;
  }
  @media (prefers-reduced-motion: reduce) {
    .drum-value, .tape-slot-top, .tape-slot-bottom, .stepper-btn {
      transition: none !important; animation: none !important;
    }
  }
  @media (min-width: 744px) {
    .finish-modal-box { max-width: 440px; }
  }
</style>
</head>
<body>
  <div class="page">
    <p class="ver"><b>v1-grok · 横向分区</b>　时长在左，遍数在右。</p>
    <button type="button" class="open-btn" id="openBtn">打开弹窗</button>
    <p class="note" id="note"></p>
  </div>

  <div id="finishEarlyModal" class="open">
    <div class="finish-modal-box" id="modalBox">
      <div id="feScreen1" class="finish-modal-screen">
        <div class="split-head">
          <div class="finish-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="13" r="8"/>
              <path d="M12 9v4l2.5 2"/>
              <path d="M9 3h6"/>
            </svg>
          </div>
          <h3>提前结束练习</h3>
        </div>
        <div class="split-body">
          <div class="split-time">
            <div class="finish-mins" id="finishMinsDisplay">8</div>
            <div class="finish-mins-label">分钟</div>
          </div>
          <div class="split-reps">
            <div class="reps-wheel-container">
              <div class="reps-wheel-title">练习遍数</div>
              <div class="counter-stage reps-stage" id="stageEarly">
                <div class="tape-ribbon-track" id="ribbonWrapEarly">
                  <div class="tape-slot-top" id="topSlotEarly" title="点击选择此项" onclick="if(window.repsWheelEarly) window.repsWheelEarly.step(-1)">
                    <div class="tape-inner-box" id="topValEarly">—</div>
                  </div>
                  <div class="tape-slot-bottom" id="bottomSlotEarly" title="点击选择此项" onclick="if(window.repsWheelEarly) window.repsWheelEarly.step(1)">
                    <div class="tape-inner-box" id="bottomValEarly">1</div>
                  </div>
                </div>
                <div class="reps-band">
                  <div class="roller-casing" id="casingEarly">
                    <div class="axle-pin left"></div>
                    <div class="roller-wheel left"></div>
                    <div class="roller-drum" id="drumEarly">
                      <div class="drum-value empty-state" id="drumValEarly">—</div>
                    </div>
                    <div class="roller-wheel right"></div>
                    <div class="axle-pin right"></div>
                  </div>
                  <div class="stepper-card">
                    <button type="button" class="stepper-btn" id="btnUpEarly" aria-label="增加一遍" onclick="if(window.repsWheelEarly) window.repsWheelEarly.step(1)">
                      <svg viewBox="0 0 24 24"><path d="M12 7l-6 6h12z"/></svg>
                    </button>
                    <button type="button" class="stepper-btn" id="btnDownEarly" aria-label="减少一遍" onclick="if(window.repsWheelEarly) window.repsWheelEarly.step(-1)">
                      <svg viewBox="0 0 24 24"><path d="M12 17l6-6H6z"/></svg>
                    </button>
                  </div>
                  <div class="capsule-summary">
                    <span class="capsule-summary-text" id="statusTagEarly">不记遍数</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="presets-row" id="presetsEarly">
          <button type="button" class="preset-chip active" onclick="if(window.repsWheelEarly) window.repsWheelEarly.set(0)">不记</button>
          <button type="button" class="preset-chip" onclick="if(window.repsWheelEarly) window.repsWheelEarly.set(1)">1 遍</button>
          <button type="button" class="preset-chip" onclick="if(window.repsWheelEarly) window.repsWheelEarly.set(3)">3 遍</button>
          <button type="button" class="preset-chip" onclick="if(window.repsWheelEarly) window.repsWheelEarly.set(5)">5 遍</button>
          <button type="button" class="preset-chip" onclick="if(window.repsWheelEarly) window.repsWheelEarly.set(10)">10 遍</button>
          <button type="button" class="preset-chip" onclick="if(window.repsWheelEarly) window.repsWheelEarly.set(20)">20 遍</button>
        </div>
        <div class="finish-modal-actions finish-modal-3btns">
          <button class="btn-submit" onclick="confirmFinishEarly()">提交</button>
          <button class="btn-resume" onclick="cancelFinishEarly()">继续练</button>
          <button class="btn-abort" onclick="abortFinishEarly()">不练了</button>
        </div>
      </div>

      <div id="feScreen2" class="finish-modal-screen" style="display:none">
        <div class="split-head">
          <div class="finish-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 8v5M12 16.5v.5"/>
            </svg>
          </div>
          <h3 style="color:#5D4037">本次不记录遍数？</h3>
        </div>
        <p class="zero-copy">当前遍数为「—」，确定后只记练习时长。</p>
        <div class="finish-modal-actions">
          <button type="button" class="btn-resume" onclick="showScreenEarly(1)">返回修改</button>
          <button type="button" class="btn-submit" onclick="confirmZeroFinishEarly()">确认不记遍数</button>
        </div>
      </div>
    </div>
  </div>

<script>
  let _repsAudioCtx = null;
  function playMechanicalClick(freq = 1100) {
    try {
      if (!_repsAudioCtx) _repsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (_repsAudioCtx.state === 'suspended') _repsAudioCtx.resume();
      const osc = _repsAudioCtx.createOscillator();
      const gain = _repsAudioCtx.createGain();
      const filter = _repsAudioCtx.createBiquadFilter();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, _repsAudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, _repsAudioCtx.currentTime + 0.024);
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800, _repsAudioCtx.currentTime);
      filter.Q.setValueAtTime(2.5, _repsAudioCtx.currentTime);
      gain.gain.setValueAtTime(0.14, _repsAudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, _repsAudioCtx.currentTime + 0.024);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(_repsAudioCtx.destination);
      osc.start();
      osc.stop(_repsAudioCtx.currentTime + 0.026);
    } catch (e) {}
  }

  class RepsWheelWidget {
    constructor(prefix, initialValue = 0) {
      this.prefix = prefix;
      this.min = 0;
      this.max = 24;
      this.value = initialValue;
      this.casing = document.getElementById('casing' + prefix);
      this.drumVal = document.getElementById('drumVal' + prefix);
      this.topVal = document.getElementById('topVal' + prefix);
      this.bottomVal = document.getElementById('bottomVal' + prefix);
      this.topSlot = document.getElementById('topSlot' + prefix);
      this.bottomSlot = document.getElementById('bottomSlot' + prefix);
      this.statusTag = document.getElementById('statusTag' + prefix);
      this.btnUp = document.getElementById('btnUp' + prefix);
      this.btnDown = document.getElementById('btnDown' + prefix);
      this.stage = document.getElementById('stage' + prefix);
      this.presetsContainer = document.getElementById('presets' + prefix);
      this.initEvents();
      this.render(false);
    }
    formatLabel(val) { return val === 0 ? '—' : String(val); }
    set(newVal, withSound = true) {
      const clamped = Math.max(this.min, Math.min(this.max, newVal));
      if (clamped !== this.value) {
        const direction = clamped > this.value ? 1 : -1;
        this.value = clamped;
        if (withSound && typeof playMechanicalClick === 'function') {
          playMechanicalClick(clamped === 0 ? 800 : 1100 + clamped * 20);
        }
        this.animateRoll(direction);
      } else {
        this.render(false);
      }
    }
    step(delta) { this.set(this.value + delta, true); }
    animateRoll(direction) {
      if (!this.drumVal) return;
      this.drumVal.style.transition = 'none';
      this.drumVal.style.transform = 'translateY(' + (direction * 14) + 'px) rotateX(' + (direction * -22) + 'deg)';
      this.drumVal.style.opacity = '0.35';
      void this.drumVal.offsetHeight;
      this.drumVal.style.transition = 'transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.18s ease';
      this.drumVal.style.transform = 'translateY(0) rotateX(0deg)';
      this.drumVal.style.opacity = '1';
      this.render(true);
    }
    render() {
      if (!this.drumVal) return;
      const cur = this.value;
      const prev = cur - 1;
      const next = cur + 1;
      if (cur === 0) {
        this.drumVal.textContent = '—';
        this.drumVal.classList.add('empty-state');
      } else {
        this.drumVal.textContent = cur;
        this.drumVal.classList.remove('empty-state');
      }
      if (this.topSlot && this.topVal) {
        if (prev >= this.min) {
          this.topSlot.style.display = 'flex';
          this.topVal.textContent = this.formatLabel(prev);
          this.topSlot.style.opacity = '1';
        } else {
          this.topSlot.style.display = 'none';
        }
      }
      if (this.bottomSlot && this.bottomVal) {
        if (next <= this.max) {
          this.bottomSlot.style.display = 'flex';
          this.bottomVal.textContent = this.formatLabel(next);
          this.bottomSlot.style.opacity = '1';
        } else {
          this.bottomSlot.style.display = 'none';
        }
      }
      if (this.btnUp) this.btnUp.disabled = cur >= this.max;
      if (this.btnDown) this.btnDown.disabled = cur <= this.min;
      if (this.statusTag) this.statusTag.textContent = cur === 0 ? '不记遍数' : (cur + ' 遍');
      if (this.presetsContainer) {
        this.presetsContainer.querySelectorAll('.preset-chip').forEach(chip => {
          const chipVal = parseInt(chip.textContent, 10) || 0;
          if (chipVal === cur || (chip.textContent.indexOf('不记') >= 0 && cur === 0)) chip.classList.add('active');
          else chip.classList.remove('active');
        });
      }
    }
    initEvents() {
      if (!this.casing) return;
      let isDragging = false;
      let startY = 0;
      let startVal = 0;
      const STEP_THRESHOLD = 28;
      const onPointerDown = (e) => {
        isDragging = true;
        startY = e.clientY;
        startVal = this.value;
        try { this.casing.setPointerCapture(e.pointerId); } catch (_) {}
      };
      const onPointerMove = (e) => {
        if (!isDragging) return;
        const dy = e.clientY - startY;
        const deltaSteps = Math.trunc(dy / STEP_THRESHOLD);
        const targetVal = startVal + deltaSteps;
        if (targetVal !== this.value) this.set(targetVal, true);
      };
      const onPointerUp = (e) => {
        if (!isDragging) return;
        isDragging = false;
        try { this.casing.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      this.casing.addEventListener('pointerdown', onPointerDown);
      this.casing.addEventListener('pointermove', onPointerMove);
      this.casing.addEventListener('pointerup', onPointerUp);
      this.casing.addEventListener('pointercancel', onPointerUp);
      if (this.stage) {
        let wheelTimeout = null;
        let wheelAccum = 0;
        this.stage.addEventListener('wheel', (e) => {
          e.preventDefault();
          wheelAccum += e.deltaY;
          if (Math.abs(wheelAccum) >= 24) {
            this.step(wheelAccum > 0 ? 1 : -1);
            wheelAccum = 0;
          }
          clearTimeout(wheelTimeout);
          wheelTimeout = setTimeout(() => { wheelAccum = 0; }, 140);
        }, { passive: false });
      }
    }
  }

  function showScreenEarly(n) {
    const s1 = document.getElementById('feScreen1');
    const s2 = document.getElementById('feScreen2');
    if (!s1 || !s2) return;
    s1.style.display = n === 2 ? 'none' : 'block';
    s2.style.display = n === 2 ? 'block' : 'none';
  }
  function openModal() {
    showScreenEarly(1);
    document.getElementById('finishEarlyModal').classList.add('open');
    document.getElementById('note').textContent = '';
  }
  function closeModal(msg) {
    document.getElementById('finishEarlyModal').classList.remove('open');
    showScreenEarly(1);
    if (msg) document.getElementById('note').textContent = msg;
  }
  function confirmFinishEarly() {
    if (window.repsWheelEarly && window.repsWheelEarly.value === 0) {
      showScreenEarly(2);
      return;
    }
    const n = window.repsWheelEarly ? window.repsWheelEarly.value : null;
    closeModal(n ? ('已提交 ' + n + ' 遍') : '');
  }
  function confirmZeroFinishEarly() { closeModal('只记时长，不记遍数'); }
  function cancelFinishEarly() { closeModal('继续练'); }
  function abortFinishEarly() { closeModal('不练了'); }

  document.getElementById('openBtn').addEventListener('click', openModal);
  window.repsWheelEarly = new RepsWheelWidget('Early', 3);
  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName)) return;
    const modal = document.getElementById('finishEarlyModal');
    const screen = document.getElementById('feScreen1');
    if (!modal.classList.contains('open') || screen.style.display === 'none') return;
    if (!window.repsWheelEarly) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); window.repsWheelEarly.step(1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); window.repsWheelEarly.step(-1); }
    else if (e.key >= '0' && e.key <= '9') { e.preventDefault(); window.repsWheelEarly.set(parseInt(e.key, 10)); }
  });
</script>
</body>
</html>
