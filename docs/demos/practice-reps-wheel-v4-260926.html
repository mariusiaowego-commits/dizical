<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>dizical 练习遍数 · 物理滚轮控件 (v4-agy)</title>
<style>
  :root {
    --accent: #FF6B6B;         /* dizicute 珊瑚红 */
    --accent-dark: #D94848;
    --ink: #2C3E50;
    --ink-subtle: #7F8C8D;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: var(--font);
    background: #EAE6DF;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .demo-container {
    width: 100%;
    max-width: 1140px;
  }

  /* 顶部导航与控制栏 */
  .demo-header {
    margin-bottom: 24px;
    text-align: center;
  }
  .demo-title {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .demo-sub {
    font-size: 13px;
    color: var(--ink-subtle);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .toolbar {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 4px;
    border-radius: 9999px;
    border: 1px solid rgba(0, 0, 0, 0.06);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
  }
  .narrow-tab-bar {
    display: inline-flex;
    gap: 4px;
  }
  .tab-btn {
    min-height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 9999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn[aria-selected="true"] {
    background: #FFFFFF;
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
  }
  .sound-btn {
    min-height: 38px;
    padding: 0 14px;
    border: 0;
    border-radius: 9999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sound-btn svg {
    width: 16px;
    height: 16px;
  }
  .sound-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .sound-dot.off {
    background: #BDC3C7;
  }

  /* 双栏展示区域 */
  .pair-grid {
    display: grid;
    gap: 24px;
    margin-bottom: 24px;
  }

  /* 变体卡片容器基类 */
  .theme-card {
    border-radius: 30px;
    padding: 32px 24px 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: visible;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.07);
    transition: box-shadow 0.3s ease;
  }

  /* 变体卡片容器基类 */
  .theme-card {
    border-radius: 30px;
    padding: 32px 24px 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: visible;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.07);
    transition: box-shadow 0.3s ease;
  }

  .card-badge {
    position: absolute;
    top: 18px;
    left: 24px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 9999px;
    pointer-events: none;
  }

  /* ═══ 主题 A：暖白版 (#FFF8F0 底) ═══ */
  .theme-card[data-theme="a"] {
    background: #FFF8F0;
    color: var(--ink);
    --capsule-bg: linear-gradient(180deg, #FFFFFF 0%, #F5F1EB 100%);
    --capsule-border: rgba(255, 255, 255, 0.95);
    --capsule-shadow: 0 22px 48px -12px rgba(88, 70, 50, 0.18), 0 8px 18px -4px rgba(88, 70, 50, 0.08), inset 0 1px 1px #FFFFFF, inset 0 -1px 2px rgba(0, 0, 0, 0.04);
    --strip-bg: #FFFFFF;
    --strip-border: rgba(0, 0, 0, 0.06);
    --strip-shadow: 0 12px 30px rgba(88, 70, 50, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
    --casing-bg: linear-gradient(180deg, #D9D4CC 0%, #E8E3DB 100%);
    --casing-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.24), inset 0 -1px 2px rgba(255, 255, 255, 0.85);
    --drum-bg: linear-gradient(180deg, #D4CEBF 0%, #FFFFFF 18%, #FFFFFF 82%, #CCC6B7 100%);
    --drum-border: rgba(0, 0, 0, 0.09);
    --drum-inner-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
    --num-color: #2C3E50;
    --stepper-bg: #FFFFFF;
    --stepper-border: rgba(255, 255, 255, 0.95);
    --stepper-shadow: 0 3px 8px rgba(88, 70, 50, 0.08), inset 0 1px 0 #FFFFFF;
    --stepper-btn-hover: #F8F5F0;
    --action-color: #2C3E50;
    --action-hover: rgba(44, 62, 80, 0.06);
    --readout-color: #5D6D7E;
    --preset-bg: #FFFFFF;
    --preset-border: rgba(0, 0, 0, 0.06);
  }
  .theme-card[data-theme="a"] .card-badge {
    background: rgba(44, 62, 80, 0.06);
    color: #5D6D7E;
  }

  /* ═══ 主题 B：深底版 (#1A1A1A 底) ═══ */
  .theme-card[data-theme="b"] {
    background: #1A1A1A;
    color: #FFFFFF;
    --capsule-bg: linear-gradient(180deg, #333333 0%, #212121 100%);
    --capsule-border: rgba(255, 255, 255, 0.12);
    --capsule-shadow: 0 24px 52px -12px rgba(0, 0, 0, 0.8), 0 8px 20px -4px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.25), inset 0 -1px 2px rgba(0, 0, 0, 0.35);
    --strip-bg: #262626;
    --strip-border: rgba(255, 255, 255, 0.08);
    --strip-shadow: 0 14px 34px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4);
    --casing-bg: linear-gradient(180deg, #131313 0%, #1E1E1E 100%);
    --casing-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.75), inset 0 -1px 2px rgba(255, 255, 255, 0.08);
    --drum-bg: linear-gradient(180deg, #2D2D2D 0%, #FAF8F5 18%, #FFFFFF 50%, #FAF8F5 82%, #222222 100%);
    --drum-border: rgba(0, 0, 0, 0.15);
    --drum-inner-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.15);
    --num-color: #1A1A1A;
    --stepper-bg: #2B2B2B;
    --stepper-border: rgba(255, 255, 255, 0.12);
    --stepper-shadow: 0 3px 8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    --stepper-btn-hover: #363636;
    --action-color: #FFFFFF;
    --action-hover: rgba(255, 255, 255, 0.08);
    --readout-color: #BDC3C7;
    --preset-bg: #252525;
    --preset-border: rgba(255, 255, 255, 0.1);
  }
  .theme-card[data-theme="b"] .card-badge {
    background: rgba(255, 255, 255, 0.1);
    color: #BDC3C7;
  }

  /* 提示说明 */
  .section-label {
    font-size: 15px;
    font-weight: 600;
    margin-top: 14px;
    margin-bottom: 34px;
    letter-spacing: -0.01em;
  }

  /* ═══ 控件核心舞台 (高度足够露出上下穿插的数字条) ═══ */
  .counter-stage {
    position: relative;
    width: 100%;
    max-width: 440px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    touch-action: none;
  }

  /* ═══ 纵向延伸的数字列表条 (在胶囊正下方与正上方伸出，Z-Index 在胶囊后) ═══ */
  .tape-ribbon-track {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 142px;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    z-index: 1;
  }

  /* 连续贯穿底板条 (参考中的垂直白色长条) */
  .tape-track-backdrop {
    position: absolute;
    width: 82px;
    height: 220px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--strip-bg);
    border-radius: 12px;
    border: 1px solid var(--strip-border);
    box-shadow: var(--strip-shadow);
    z-index: 1;
    /* 顶部与底部边缘自然渐淡 */
    mask-image: linear-gradient(180deg, transparent 0%, #000000 16%, #000000 84%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000000 16%, #000000 84%, transparent 100%);
  }

  /* 上方露出的前一项 (dad 规则: 渐变透明，越往上越淡) */
  .tape-slot-top {
    position: absolute;
    bottom: 54px;
    width: 82px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    z-index: 2;
    transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.22s ease;
    /* 渐变透明度 */
    mask-image: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
  }
  .tape-slot-top:hover {
    transform: translateY(-2px);
  }

  /* 下方露出的后一项 (dad 规则: 渐变透明，越往下越淡) */
  .tape-slot-bottom {
    position: absolute;
    top: 54px;
    width: 82px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    z-index: 2;
    transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.22s ease;
    /* 渐变透明度 */
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
  }
  .tape-slot-bottom:hover {
    transform: translateY(2px);
  }

  .tape-inner-box {
    width: 64px;
    height: 36px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 700;
    font-style: italic;
    color: var(--ink);
  }
  .theme-card[data-theme="b"] .tape-inner-box {
    border-color: rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.06);
    color: #FFFFFF;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }

  /* §1 ⑧ 列表左侧的小珊瑚红方块点缀 */
  .tape-coral-dot {
    position: absolute;
    left: 4px;
    top: 88px;
    width: 6px;
    height: 6px;
    border-radius: 1.5px;
    background: var(--accent);
    box-shadow: 0 1px 3px rgba(255, 107, 107, 0.4);
    pointer-events: none;
    z-index: 3;
  }

  /* ═══ 横向主胶囊 (大圆角 pill，光泽塑料/玻璃凸起感) ═══ */
  .capsule-pill {
    position: relative;
    width: 100%;
    height: 94px;
    border-radius: 9999px;
    background: var(--capsule-bg);
    border: 1px solid var(--capsule-border);
    box-shadow: var(--capsule-shadow);
    display: flex;
    align-items: center;
    padding: 0 18px 0 14px;
    gap: 12px;
    z-index: 3;
    user-select: none;
    -webkit-user-select: none;
  }

  @media (max-width: 420px) {
    .capsule-pill {
      padding: 0 12px 0 10px;
      gap: 8px;
      height: 90px;
    }
  }

  /* ═══ 滚轮总成 (左侧内凹机舱) ═══ */
  .roller-casing {
    position: relative;
    width: 142px;
    height: 64px;
    border-radius: 14px;
    background: var(--casing-bg);
    box-shadow: var(--casing-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    flex-shrink: 0;
  }
  .roller-casing:active {
    cursor: grabbing;
  }

  /* 左右外侧金属销轴 */
  .axle-pin {
    width: 5px;
    height: 14px;
    background: linear-gradient(180deg, #8E8E93 0%, #D1D1D6 40%, #AEAEB2 70%, #636366 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 1px 2px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }
  .axle-pin.left {
    border-radius: 2px 0 0 2px;
  }
  .axle-pin.right {
    border-radius: 0 2px 2px 0;
  }

  /* 左右两根淡灰肋条滚轴 (3D 齿轮轮轴) */
  .roller-wheel {
    position: relative;
    width: 13px;
    height: 52px;
    border-radius: 3px;
    background: #C7C7CD;
    /* 3D 圆柱侧光 + 高光与阴影肋条纹理（一道亮一道暗） */
    background-image:
      repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.52) 0px,
        rgba(255, 255, 255, 0.52) 2px,
        transparent 2px,
        transparent 4px,
        rgba(0, 0, 0, 0.16) 4px,
        rgba(0, 0, 0, 0.16) 6px,
        transparent 6px,
        transparent 8px
      ),
      linear-gradient(
        180deg,
        #9E9EA5 0%,
        #BFBFC6 22%,
        #DADAE0 42%,
        #B8B8BF 68%,
        #8C8C93 100%
      );
    box-shadow:
      inset -1px 0 2px rgba(0, 0, 0, 0.26),
      inset 1px 0 2px rgba(255, 255, 255, 0.72),
      0 2px 5px rgba(0, 0, 0, 0.20);
    flex-shrink: 0;
  }

  /* 中央白色滚筒 (当前选中的数字显示窗) */
  .roller-drum {
    position: relative;
    width: 82px;
    height: 52px;
    margin: 0 2px;
    border-radius: 4px;
    background: var(--drum-bg);
    border: 1px solid var(--drum-border);
    box-shadow:
      0 3px 8px rgba(0, 0, 0, 0.12),
      inset 0 1px 1px rgba(255, 255, 255, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 800px;
    flex-shrink: 0;
  }

  /* 滚筒内的内凹框与数字 */
  .drum-frame {
    width: 66px;
    height: 38px;
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: var(--drum-inner-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .drum-value {
    font-size: 32px;
    font-weight: 800;
    font-style: italic;
    color: var(--num-color);
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    will-change: transform, opacity;
    transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15);
  }
  .drum-value.empty-state {
    font-style: normal;
    font-size: 24px;
    font-weight: 600;
    color: var(--ink-subtle);
  }

  /* ═══ 竖向堆叠的上下箭头按钮 (独立圆角卡片) ═══ */
  .stepper-card {
    width: 44px;
    height: 64px;
    border-radius: 13px;
    background: var(--stepper-bg);
    border: 1px solid var(--stepper-border);
    box-shadow: var(--stepper-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .stepper-btn {
    width: 100%;
    height: 32px;
    min-height: 32px;
    border: 0;
    background: transparent;
    color: var(--action-color);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .stepper-btn:hover {
    background: var(--stepper-btn-hover);
  }
  .stepper-btn:active {
    transform: scale(0.90);
  }
  .stepper-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }
  .stepper-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
    transform: none;
  }
  .stepper-divider {
    height: 1px;
    background: rgba(0, 0, 0, 0.05);
    margin: 0 4px;
  }
  .theme-card[data-theme="b"] .stepper-divider {
    background: rgba(255, 255, 255, 0.08);
  }

  /* ═══ 动作按钮 "确认" (文字当按钮用，优雅大气) ═══ */
  .action-btn {
    flex: 1;
    min-width: 90px;
    height: 64px;
    border: 0;
    border-radius: 18px;
    background: transparent;
    color: var(--action-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.18s ease, transform 0.12s ease;
    padding: 0 10px;
  }
  .action-btn:hover {
    background: var(--action-hover);
  }
  .action-btn:active {
    transform: scale(0.96);
  }
  .action-text {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .action-sub {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.65;
    line-height: 1;
  }

  /* ═══ 状态指示器与快捷预设 ═══ */
  .status-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
    width: 100%;
  }
  .status-readout {
    font-size: 13px;
    color: var(--readout-color);
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .status-tag {
    font-weight: 700;
    color: var(--accent);
  }
  .presets-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .preset-chip {
    min-height: 32px;
    padding: 0 12px;
    border-radius: 9999px;
    border: 1px solid var(--preset-border);
    background: var(--preset-bg);
    color: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.16s ease;
  }
  .preset-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .preset-chip.active {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
  }

  /* ═══ 反馈弹窗 / 提示 (纯原生交互) ═══ */
  .feedback-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: #2C3E50;
    color: #FFFFFF;
    padding: 10px 20px;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.24s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.24s ease;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feedback-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast-check {
    width: 16px;
    height: 16px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .toast-check svg {
    width: 10px;
    height: 10px;
    fill: #FFFFFF;
  }

  /* 确认不填弹窗 */
  .confirm-modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 999;
  }
  .confirm-modal-mask.open {
    display: flex;
  }
  .confirm-modal-box {
    width: 100%;
    max-width: 320px;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 24px 20px 20px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    text-align: center;

<script>
  /* ═══ WebAudio API: 拟物物理齿轮点击声 ═══ */
  let audioCtx = null;
  let isSoundOn = true;

  function toggleSound() {
    isSoundOn = !isSoundOn;
    const dot = document.getElementById('soundDot');
    const text = document.getElementById('soundText');
    if (isSoundOn) {
      dot.classList.remove('off');
      text.textContent = '音效开';
      playMechanicalClick(1200);
    } else {
      dot.classList.add('off');
      text.textContent = '已静音';
    }
  }

  function playMechanicalClick(freq = 1100) {
    if (!isSoundOn) return;
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.024);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800, audioCtx.currentTime);
      filter.Q.setValueAtTime(2.5, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.024);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.026);
    } catch (e) {
      // 容错: 部分浏览器在无用户手势前禁止播放音频
    }
  }

  /* ═══ 窄屏 Tab 切换逻辑 ═══ */
  function switchThemeTab(theme) {
    const cardA = document.getElementById('cardA');
    const cardB = document.getElementById('cardB');
    const tabA = document.getElementById('tabA');
    const tabB = document.getElementById('tabB');

    if (theme === 'a') {
      cardA.classList.add('active-tab');
      cardB.classList.remove('active-tab');
      tabA.setAttribute('aria-selected', 'true');
      tabB.setAttribute('aria-selected', 'false');
    } else {
      cardB.classList.add('active-tab');
      cardA.classList.remove('active-tab');
      tabB.setAttribute('aria-selected', 'true');
      tabA.setAttribute('aria-selected', 'false');
    }
  }

  /* ═══ 弹窗与 Toast 交互 ═══ */
  let activePendingWidget = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.classList.remove('show');
    }, 2200);
  }

  function openZeroModal(widget) {
    activePendingWidget = widget;
    document.getElementById('zeroModal').classList.add('open');
  }

  function closeZeroModal() {
    document.getElementById('zeroModal').classList.remove('open');
    activePendingWidget = null;
  }

  function confirmZeroSubmit() {
    closeZeroModal();
    showToast('打卡成功 · 本次不记遍数');
  }

  /* ═══ 物理滚轮核心逻辑控制器 ═══ */
  class RepsWheelWidget {
    constructor(prefix, initialValue = 5) {
      this.prefix = prefix;
      this.min = 0;   // 0 = "—" (不记)
      this.max = 24;  // UI 最大 24
      this.value = initialValue;

      // DOM Elements
      this.casing = document.getElementById(`casing${prefix}`);
      this.drumVal = document.getElementById(`drumVal${prefix}`);
      this.topVal = document.getElementById(`topVal${prefix}`);
      this.bottomVal = document.getElementById(`bottomVal${prefix}`);
      this.topSlot = document.getElementById(`topSlot${prefix}`);
      this.bottomSlot = document.getElementById(`bottomSlot${prefix}`);
      this.actionSub = document.getElementById(`actionSub${prefix}`);
      this.statusTag = document.getElementById(`statusTag${prefix}`);
      this.btnUp = document.getElementById(`btnUp${prefix}`);
      this.btnDown = document.getElementById(`btnDown${prefix}`);
      this.stage = document.getElementById(`stage${prefix}`);

      this.initEvents();
      this.render(false);
    }

    formatLabel(val) {
      if (val === 0) return '—';
      return String(val);
    }

    set(newVal, withSound = true) {
      const clamped = Math.max(this.min, Math.min(this.max, newVal));
      if (clamped !== this.value) {
        const direction = clamped > this.value ? 1 : -1;
        this.value = clamped;
        if (withSound) playMechanicalClick(clamped === 0 ? 800 : 1100 + clamped * 20);
        this.animateRoll(direction);
      } else {
        this.render(false);
      }
    }

    step(delta) {
      this.set(this.value + delta, true);
    }

    animateRoll(direction) {
      // 3D 滚筒物理滚动过渡
      this.drumVal.style.transition = 'none';
      this.drumVal.style.transform = `translateY(${direction * 14}px) rotateX(${direction * -22}deg)`;
      this.drumVal.style.opacity = '0.35';

      // 强制重绘
      void this.drumVal.offsetHeight;

      this.drumVal.style.transition = 'transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.18s ease';
      this.drumVal.style.transform = 'translateY(0) rotateX(0deg)';
      this.drumVal.style.opacity = '1';

      this.render(true);
    }

    render(isAnimated = false) {
      const cur = this.value;
      const prev = cur - 1;
      const next = cur + 1;

      // 1. 中央当前项
      if (cur === 0) {
        this.drumVal.textContent = '—';
        this.drumVal.classList.add('empty-state');
      } else {
        this.drumVal.textContent = cur;
        this.drumVal.classList.remove('empty-state');
      }

      // 2. 上方前一项 (根据 dad 明确要求：相邻一项渐变透明露出，更远不可见)
      if (prev >= this.min) {
        this.topSlot.style.display = 'flex';
        this.topVal.textContent = this.formatLabel(prev);
        this.topSlot.style.opacity = '1';
      } else {
        this.topSlot.style.display = 'none';
      }

      // 3. 下方后一项 (相邻一项渐变透明露出，更远不可见)
      if (next <= this.max) {
        this.bottomSlot.style.display = 'flex';
        this.bottomVal.textContent = this.formatLabel(next);
        this.bottomSlot.style.opacity = '1';
      } else {
        this.bottomSlot.style.display = 'none';
      }

      // 4. 按钮禁用状态
      this.btnDown.disabled = cur <= this.min;
      this.btnUp.disabled = cur >= this.max;

      // 5. 右侧 "确认" 动作说明与下方状态
      const statusText = cur === 0 ? '不记录遍数 (—)' : `${cur} 遍`;
      this.actionSub.textContent = cur === 0 ? '不记遍数' : `${cur} 遍`;
      this.statusTag.textContent = statusText;

      // 6. 预设 chip 激活态高亮
      const parentCard = document.getElementById(`card${this.prefix}`);
      if (parentCard) {
        parentCard.querySelectorAll('.preset-chip').forEach(chip => {
          const chipVal = parseInt(chip.textContent) || 0;
          if (chipVal === cur || (chip.textContent === '不记' && cur === 0)) {
            chip.classList.add('active');
          } else {
            chip.classList.remove('active');
          }
        });
      }
    }

    confirm() {
      if (this.value === 0) {
        openZeroModal(this);
      } else {
        showToast(`打卡成功 · 本次已记录 ${this.value} 遍！`);
      }
    }

    initEvents() {
      let isDragging = false;
      let startY = 0;
      let startVal = 0;
      const STEP_THRESHOLD = 32; // 垂直移动 32px 滚一格

      const onPointerDown = (e) => {
        isDragging = true;
        startY = e.clientY;
        startVal = this.value;
        this.casing.setPointerCapture(e.pointerId);
      };

      const onPointerMove = (e) => {
        if (!isDragging) return;
        const dy = e.clientY - startY;
        const deltaSteps = Math.trunc(dy / STEP_THRESHOLD);

        // 垂直往上滑是增加，往下滑是减少（遵循自然滚筒滚动直觉）
        const targetVal = startVal - deltaSteps;
        if (targetVal !== this.value) {
          this.set(targetVal, true);
        }
      };

      const onPointerUp = (e) => {
        if (!isDragging) return;
        isDragging = false;
        try {
          this.casing.releasePointerCapture(e.pointerId);
        } catch (_) {}
      };

      this.casing.addEventListener('pointerdown', onPointerDown);
      this.casing.addEventListener('pointermove', onPointerMove);
      this.casing.addEventListener('pointerup', onPointerUp);
      this.casing.addEventListener('pointercancel', onPointerUp);

      // 鼠标滚轮 / Trackpad 滚动支持 (防抖切换)
      let wheelTimeout = null;
      let wheelAccum = 0;
      this.stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        wheelAccum += e.deltaY;
        if (Math.abs(wheelAccum) >= 26) {
          const step = wheelAccum > 0 ? 1 : -1;
          this.step(step);
          wheelAccum = 0;
        }
        clearTimeout(wheelTimeout);
        wheelTimeout = setTimeout(() => { wheelAccum = 0; }, 140);
      }, { passive: false });
    }
  }

  // 实例化双主题 Widget
  const widgetA = new RepsWheelWidget('A', 5);
  const widgetB = new RepsWheelWidget('B', 5);

  // 全局键盘监听 (↑ / ↓ 步进, 0-9 直接选)
  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      widgetA.step(-1);
      widgetB.step(-1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      widgetA.step(1);
      widgetB.step(1);
    } else if (e.key >= '0' && e.key <= '9') {
      const num = parseInt(e.key, 10);
      widgetA.set(num);
      widgetB.set(num);
    }
  });
</script>
</body>
</html>
