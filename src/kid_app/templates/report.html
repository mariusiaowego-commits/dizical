<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>练习报告 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 4px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: var(--card, #fff); box-shadow: 0 -2px 12px rgba(0,0,0,0.1); z-index: 100;
    }
    .nav a {
      flex: 1; min-width: 0; padding: 14px 8px !important; background: transparent; border-radius: 16px;
      text-align: center; text-decoration: none; color: #7F8C8D; font-size: 16px !important;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .nav a:active { transform: scale(0.95); }
    .nav a.active { background: var(--primary, #FF6B6B); color: white; }
    .nav-icon { font-size: 20px; }

    /* dayDetail 区域 */
  /* ── Stage 堆叠柱状图 ─────────────────────────────────── */
  /* ── 月份切换器 (feat/happy-month-switch) ──────────────── */
  .month-switcher {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin: 4px 0 18px;
    padding: 6px 0;
  }
  .month-arrow {
    width: 44px; height: 44px;
    border: 1px solid #EDE6DA; background: #FFF;
    border-radius: 50%; color: #8B6914; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .month-arrow:hover:not(.disabled) {
    background: #FF6B6B; border-color: #FF6B6B; color: #FFF;
  }
  .month-arrow:active:not(.disabled) { transform: scale(0.92); }
  .month-arrow.disabled { opacity: 0.35; cursor: not-allowed; }
  .month-label-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 130px;
  }
  .month-label {
    font-size: 22px; font-weight: 600; color: #3D2E1E;
    letter-spacing: 0.5px;
    transition: opacity 0.18s;
  }
  .month-label.loading { opacity: 0.4; }
  .month-current-badge {
    font-size: 11px; color: #B23A48; background: #FFE8EA;
    padding: 2px 10px; border-radius: 10px;
    letter-spacing: 0.5px;
  }

  /* ── Stage 堆叠柱状图 ──────────────────────────── */
  #stageChartTitle { font-size: 17px !important; }
  #stageChartSub { font-size: 13px !important; }
  #stageChartWrap {
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    min-height: 216px;
  }
  #stageChartWrap svg { display: block; }
  .bar-tooltip {
    position: fixed;
    background: rgba(40,40,40,0.92);
    color: white;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
    transform: translate(-50%, -110%);
    transition: opacity 0.15s;
  }
  .bar-tooltip .tt-item { margin: 2px 0; }
  .bar-tooltip .tt-diff { font-size: 11px; margin-top: 3px; }
  .bar-tooltip .tt-diff.up { color: #6EE7B7; }
  .bar-tooltip .tt-diff.down { color: #FCA5A5; }

  /* ── 竹笛弹窗（新模板） ─────────────────────────── */
  :root { --modal-bg: #FFFDF8; }
  #diziModal {
    position: fixed; inset: 0; z-index: 10000;
    display: none; align-items: center; justify-content: center;
  }
  #diziModal .modal-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(5px);
    cursor: pointer;
  }
  #diziModal .modal-content {
    position: relative; z-index: 1;
    background: var(--modal-bg);
    border-radius: 24px;
    padding: 24px 28px 28px;
    max-width: 860px; width: 94%;
    max-height: min(88vh, 720px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 28px 80px rgba(0,0,0,0.30);
    box-sizing: border-box;
  }
  #diziModal .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  #diziModal .modal-title { font-size: 18px; font-weight: bold; color: #3D2E1E; }
  #diziModal .modal-total { font-size: 13px; color: #8B6914; background: #FEF3C7; padding: 4px 12px; border-radius: 20px; margin-top: 6px; display: inline-block; }
  #diziModal .modal-close { width: 34px; height: 34px; border-radius: 50%; background: #EDE8E0; border: none; cursor: pointer; font-size: 20px; color: #7A6A5A; line-height: 1; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
  #diziModal .modal-close:hover { background: #D8CEBD; }
  #diziModal #diziBg { width: 100%; height: auto; display: block; pointer-events: none; max-height: 160px; object-fit: contain; }
  #diziModal #segmentsContainer { position: relative; width: 100%; height: 52px; margin-top: 10px; }
  #diziModal .seg-item { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  #diziModal .seg-text-col { display: flex; flex-direction: column; align-items: center; z-index: 2; gap: 10px; }
  #diziModal .seg-line-wrap { position: absolute; top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); display: flex; align-items: center; }
  #diziModal .seg-bar { width: 2px; height: 14px; border-radius: 1px; background: #C9A030; flex-shrink: 0; }
  #diziModal .seg-bar-line { height: 2px; border-radius: 1px; background: #C9A030; flex-grow: 1; }
  #diziModal .seg-name { font-family: 'Ma Shan Zheng','Noto Serif SC','SimSun',serif; font-size: 14px; color: #3D2E1E; background: var(--modal-bg); padding: 2px 6px; border-radius: 3px; white-space: nowrap; letter-spacing: 2px; }
  #diziModal .seg-mins { font-size: 11px; color: #8B6914; text-align: center; }
  #diziModal .modal-footer {
    margin-top: 16px;
    font-size: 12px; color: #B0A090; text-align: center;
  }
  #diziModal #modalSessionDetail { margin-top: 18px; }

  @media (max-width: 600px) {
    #stageChartCard { padding: 10px 10px 14px; }
    #stageChartTitle { font-size: 15px !important; }
    #diziModal .modal-content { padding: 18px 16px 20px; max-height: 90vh; }
    #diziModal .seg-name { font-size: 12px; letter-spacing: 1px; }
  }
  @media (min-width: 1024px) {
    #stageChartCard { padding: 16px 20px 20px; }
  }
  /* iPad mini landscape ~1024×768: keep modal compact */
  @media (max-height: 800px) {
    #diziModal #diziBg { max-height: 120px; }
    #diziModal .modal-content { max-height: 90vh; padding: 18px 22px 20px; }
    #diziModal #segmentsContainer { height: 44px; margin-top: 6px; }
  }

  /* ── 共享: 科目 session 明细列表 (modal + dayDetail) ───── */
  .rp-session-list { margin-top: 4px; }
  .rp-session-heading {
    font-size: 13px; color: #8B6914; font-weight: 600;
    margin: 0 0 10px; letter-spacing: 0.3px;
  }
  .rp-group {
    margin-bottom: 10px; background: #FFFEFA;
    border-radius: 10px; padding: 8px 12px;
    border: 1px solid #F0E8D0;
  }
  .rp-group-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 6px; border-bottom: 1px dashed #E8D8B0; margin-bottom: 4px;
  }
  .rp-g-name { font-size: 14px; font-weight: 600; color: #3D2E1E; }
  .rp-g-mins { font-size: 13px; color: #8B6914; font-weight: 500; }
  .rp-session {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0 5px 8px; font-size: 13px; color: #6D5540;
    border-left: 2px solid #E8D8B0; margin: 2px 0;
    flex-wrap: wrap;
  }
  .rp-tempo { font-weight: 600; color: #8B6914; min-width: 48px; flex-shrink: 0; }
  .rp-content { flex: 1; color: #5D4037; min-width: 0; word-break: break-word; }
  .rp-mins { color: #888; font-size: 12px; flex-shrink: 0; min-width: 36px; text-align: right; }
  .rp-legacy { color: #B0A090; font-style: italic; }
  .rp-session-empty { text-align: center; color: #BDBDBD; padding: 12px; font-size: 13px; }

  /* ── 日历 dayDetail ─────────────────────────────────── */
  #dayDetail {
    margin-top: 12px; margin-bottom: 12px;
  }
  #dayDetail h3 { font-size: 17px !important; color: #FF6B6B !important; margin-bottom: 14px !important; }
  #dayDetail .detail-total-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #EEE; margin-bottom: 12px;
  }
  .detail-empty { text-align: center; color: #BDBDBD; padding: 24px; font-size: 15px; }

    /* 哑铃图 */
    .dumbbell-chart { width: 100%; }
    .dumbbell-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #F5F5F5; }
    .dumbbell-row:last-child { border-bottom: none; }
    .dumbbell-item-name { min-width: 80px; font-size: 15px; color: #333; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .dumbbell-svg-wrap { flex: 1; position: relative; height: 40px; padding: 0 6px; box-sizing: border-box; }
    .dumbbell-bar-wrap { position: absolute; top: 50%; transform: translateY(-50%); left: 6px; right: 6px; height: 4px; background: #E0E0E0; border-radius: 2px; }
    .dumbbell-bar-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 2px; transition: width 0.3s ease; }
    .dumbbell-marker { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .dumbbell-marker.yesterday { background: #90A4AE; }
    .dumbbell-marker.today { background: #27AE60; }
    .dumbbell-marker.today.decrease { background: #E74C3C; }
    .dumbbell-marker.today.same { background: #90A4AE; }
    .dumbbell-marker.today.new-item { background: #FFB300; }
    .dumbbell-mins { position: absolute; font-size: 11px; color: #7F8C8D; white-space: nowrap; transform: translateX(-50%); }
    .dumbbell-mins.yesterday { bottom: 20px; color: #90A4AE; font-weight: 500; }
    .dumbbell-mins.today { bottom: 20px; font-weight: bold; }
    .dumbbell-mins.today.increase { color: #27AE60; }
    .dumbbell-mins.today.decrease { color: #E74C3C; }
    .dumbbell-mins.today.same { color: #7F8C8D; }

    /* 练习轨迹 */
    .trail-section { margin-top: 14px; padding: 16px; background: #FFF; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .trail-header { font-size: 14px; color: #888; margin-bottom: 12px; }
    .trail-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 15px; }
    .trail-time { color: #999; font-size: 13px; min-width: 38px; }
    .trail-item-tag { background: #E3F2FD; padding: 3px 10px; border-radius: 12px; color: #1565C0; font-size: 14px; }
    .trail-mins { color: #888; font-size: 14px; }

    /* 图例 */
    .dumbbell-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: #7F8C8D; flex-wrap: wrap; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body class="has-sidebar">
  {% include "_sidebar.html" %}


  <div class="card">
    <div class="month-switcher" id="monthSwitcher">
      <button type="button" class="month-arrow" id="monthPrev" data-month="{{ prev_month }}" aria-label="上一月">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 L6.5 10 L12.5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="month-label-wrap">
        <div class="month-label" id="monthLabel">{{ month_str }}</div>
        {% if is_current_month %}
          <div class="month-current-badge">本月</div>
        {% endif %}
      </div>
      <button type="button" class="month-arrow {% if is_current_month %}disabled{% endif %}" id="monthNext" data-month="{{ next_month }}" aria-label="下一月" {% if is_current_month %}disabled{% endif %}>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4 L13.5 10 L7.5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <div style="flex:1;text-align:center;padding:12px;background:#E8F5E9;border-radius:12px;">
        <div style="font-size:28px;font-weight:bold;color:#27AE60;">{{total_mins}}</div>
        <div style="font-size:13px;color:#7F8C8D;">总练习分钟</div>
      </div>
      <div style="flex:1;text-align:center;padding:12px;background:#FFF8E1;border-radius:12px;">
        <div style="font-size:28px;font-weight:bold;color:#F57C00;">{{practice_days}}</div>
        <div style="font-size:13px;color:#7F8C8D;">练习天数</div>
      </div>
    </div>
    <div style="margin-bottom:8px;color:#7F8C8D;">日</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:4px;font-size:13px;color:#7F8C8D;font-weight:bold;">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid">{{cal_html}}</div>

  <!-- 当天明细区域: 日历正下方 (feat/report-session-detail) -->
  <div id="dayDetail" class="card" style="display:none;">
    <h3 id="detailDate"></h3>
    <div id="detailBody"></div>
  </div>

  <!-- 月份堆叠柱状图卡片 (feat/month-chart) - 常驻, 跟 stage chart 共存, 切月自动刷 -->
  <div id="monthChartCard" class="card" style="margin-top:12px;">
    <h3 id="monthChartTitle" style="color:#4ECDC4;font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:6px;"><img src="/static/icons/chart-bar.svg" width="16" height="16" alt=""><span id="monthChartTitleText">月练习</span></h3>
    <div id="monthChartSub" style="font-size:12px;color:#999;margin-bottom:16px;">加载中...</div>
    <div id="monthChartWrap" style="position:relative;overflow-x:auto;width:100%;"></div>
    <div id="monthChartLegend" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;"></div>
  </div>

  <!-- 月份科目累计卡片 (feat/month-summary) - 同宽, 横向 bar 从长到短排序, 颜色复用月图 STAGE_COLORS -->
  <div id="monthSummaryCard" class="card" style="margin-top:12px;">
    <h3 id="monthSummaryTitle" style="color:#4ECDC4;font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:6px;"><img src="/static/icons/chart-bar.svg" width="16" height="16" alt=""><span>月科目累计</span></h3>
    <div id="monthSummarySub" style="font-size:12px;color:#999;margin-bottom:16px;">加载中...</div>
    <div id="monthSummaryWrap" style="position:relative;width:100%;"></div>
  </div>

  <!-- Stage堆叠柱状图卡片 -->
  <div id="stageChartCard" class="card" style="display:none;margin-top:12px;">
    <h3 id="stageChartTitle" style="color:#4ECDC4;font-size:16px;margin-bottom:4px;"></h3>
    <div id="stageChartSub" style="font-size:12px;color:#999;margin-bottom:16px;"></div>
    <div id="stageChartWrap" style="position:relative;overflow-x:auto;"></div>
    <div id="stageChartLegend" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;"></div>
  </div>

    <div style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:#7F8C8D;flex-wrap:wrap;">
      <span style="width:16px;height:16px;background:#E8F5E9;border-radius:4px;display:inline-block;"></span> 少量
      <span style="width:16px;height:16px;background:#FFF8E1;border-radius:4px;display:inline-block;"></span> 中等
      <span style="width:16px;height:16px;background:#FFEBEE;border-radius:4px;display:inline-block;"></span> 充足
    </div>
  </div>
</body>
<script>
document.addEventListener('DOMContentLoaded', function() {

  // ── 月份切换 (feat/happy-month-switch) ─────────────────────────────
  var monthLabel = document.getElementById('monthLabel');
  var monthPrev = document.getElementById('monthPrev');
  var monthNext = document.getElementById('monthNext');

  function navigateMonth(targetMonth) {
    if (!targetMonth || monthLabel.classList.contains('loading')) return;
    monthLabel.classList.add('loading');
    fetch('/report?month=' + encodeURIComponent(targetMonth), { headers: { 'X-Partial': '1' }})
      .then(function(r){ return r.text(); })
      .then(function(html) {
        // 解析返回的 HTML, 抽出需要替换的 4 块
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var newLabel = doc.getElementById('monthLabel');
        var newPrev = doc.getElementById('monthPrev');
        var newNext = doc.getElementById('monthNext');
        var newTotal = doc.querySelector('.card .month-switcher ~ div div[style*="color:#27AE60"]');
        var newDays = doc.querySelector('.card .month-switcher ~ div div[style*="color:#F57C00"]');
        var newCal = doc.querySelector('.cal-grid');

        if (newLabel) monthLabel.textContent = newLabel.textContent;
        // 更新 data-month + disabled 状态
        if (newPrev && monthPrev) monthPrev.setAttribute('data-month', newPrev.getAttribute('data-month'));
        if (newNext && monthNext) {
          monthNext.setAttribute('data-month', newNext.getAttribute('data-month'));
          if (newNext.hasAttribute('disabled')) {
            monthNext.setAttribute('disabled', 'disabled');
            monthNext.classList.add('disabled');
          } else {
            monthNext.removeAttribute('disabled');
            monthNext.classList.remove('disabled');
          }
        }
        // 当前月 badge 显隐
        var oldBadge = document.querySelector('.month-current-badge');
        if (oldBadge) oldBadge.remove();
        var wrap = document.querySelector('.month-label-wrap');
        if (wrap && doc.querySelector('.month-current-badge')) {
          var badge = document.createElement('div');
          badge.className = 'month-current-badge';
          badge.textContent = '本月';
          wrap.appendChild(badge);
        }
        // 替换 cal-grid + 两个数字
        if (newCal) document.querySelector('.cal-grid').innerHTML = newCal.innerHTML;
        if (newTotal) document.querySelector('[style*="color:#27AE60"]').textContent = newTotal.textContent;
        if (newDays) document.querySelector('[style*="color:#F57C00"]').textContent = newDays.textContent;
        // 切月后清掉旧选中 + 关 dayDetail (不让旧月份的选中带过去)
        document.querySelectorAll('.cal-day.selected').forEach(function(c){ c.classList.remove('selected'); });
        loadMonthChart(targetMonth);
        var dd = document.getElementById('dayDetail');
        if (dd) dd.style.display = 'none';
      })
      .catch(function() {
        // 失败回退到整页跳转, 至少能用
        window.location.href = '/report?month=' + encodeURIComponent(targetMonth);
      })
      .finally(function() {
        monthLabel.classList.remove('loading');
      });
  }

  function rebindCalDays() {
    // noop: cal-day 点击已用事件委托绑在 .cal-grid 父容器上, 月份切换不会丢
  }

  if (monthPrev) {
    monthPrev.addEventListener('click', function() {
      var target = monthPrev.getAttribute('data-month');
      if (target) navigateMonth(target);
    });
  }
  if (monthNext) {
    monthNext.addEventListener('click', function() {
      if (monthNext.classList.contains('disabled')) return;
      var target = monthNext.getAttribute('data-month');
      if (target) navigateMonth(target);
    });
  }

  // 初始加载月图 (feat/month-chart)
  (function() {
    var labelText = monthLabel && monthLabel.textContent;  // "2026/07"
    if (labelText) {
      var parts = labelText.split('/');
      loadMonthChart(parts[0] + '-' + parts[1]);
    }
  })();

  // ── 共享: 堆叠柱状图渲染 (feat/month-chart 抽出, stage 与 month 共用) ───────
  var STAGE_COLORS = ['#4ECDC4','#FF6B6B','#45B7D1','#96CEB4','#F7DC6F','#BB8FCE','#F0A500','#76D7C4','#E74C3C','#3498DB','#2ECC71','#9B59B6','#E67E22','#1ABC9C','#E91E63'];
  var STAGE_COLORS_LIGHT = ['#7EDDD6','#FF8A8A','#61C4DD','#A8DBC8','#F9E06F','#C9A0DC','#F4B820','#8EE4D4','#F06060','#54B4DB','#58D68D','#B07CC6','#F09540','#3DCDB4','#F1407A'];
  var STAGE_GRAD_IDS = ['g0','g1','g2','g3','g4','g5','g6','g7','g8','g9','g10','g11','g12','g13','g14'];

  function renderStackedChart(chartData, opts) {
    opts = opts || {};
    var dates = chartData.dates;
    var items = chartData.items;
    var data = chartData.data;
    var n = dates.length;
    // 默认宽度 (stage 用); month 图柱窄 (feat/month-chart)
    var BAR_W = opts.barW || (n <= 3 ? 72 : n <= 5 ? 52 : 40);
    var BAR_GAP = opts.barGap != null ? opts.barGap : 20;
    var CHART_H = opts.chartH || 160;
    var LABEL_W = 44;
    var RIGHT_PAD = 10;
    // month 图 30 天柱窄, 每周只标 "周一" 减少拥挤 (feat/month-chart)
    var labelStride = opts.labelStride || 1;
    var labelY = opts.labelY || (CHART_H + 40);
    var subY = opts.subY || (CHART_H + 52);
    var SVG_H = 40 + CHART_H + 52;
    var SVG_W = LABEL_W + n * BAR_W + (n - 1) * BAR_GAP + RIGHT_PAD;
    var weekdayNames = ['周日','周一','周二','周三','周四','周五','周六'];

    var dailyTotals = {};
    dates.forEach(function(d) {
      var dt = 0;
      items.forEach(function(it) {
        var v = data[d] && data[d][it.id];
        if (v > 0) dt += v;
      });
      dailyTotals[d] = dt;
    });

    var maxTotal = Math.max.apply(null, Object.values(dailyTotals).filter(function(v){ return v > 0; }));
    if (maxTotal === 0) maxTotal = 60;
    var hScale = (CHART_H - 8) / maxTotal;

    function minsToH(mins) { return mins * hScale; }

    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + SVG_W + '" style="display:block;" height="' + SVG_H + '">';
    svg += '<defs>';
    for (var gi = 0; gi < STAGE_GRAD_IDS.length; gi++) {
      svg += '<linearGradient id="' + STAGE_GRAD_IDS[gi] + '" x1="0" y1="0" x2="0" y2="1">';
      svg += '<stop offset="0%" stop-color="' + STAGE_COLORS[gi] + '"/>';
      svg += '<stop offset="100%" stop-color="' + STAGE_COLORS_LIGHT[gi] + '"/></linearGradient>';
    }
    svg += '</defs>';

    dates.forEach(function(d, i) {
      var x = LABEL_W + i * (BAR_W + BAR_GAP);
      var dayTotal = dailyTotals[d] || 0;
      var stackY = 40 + CHART_H;

      items.forEach(function(it, idx) {
        var v = data[d] && data[d][it.id];
        if (!v || v <= 0) return;
        var barH = Math.max(0, minsToH(v));
        var barY = stackY - barH;
        var colIdx = it.id % STAGE_COLORS.length;
        var gradUrl = 'url(#' + STAGE_GRAD_IDS[colIdx] + ')';
        svg += '<rect x="' + x + '" y="' + barY + '" width="' + BAR_W + '" height="' + barH + '" fill="' + gradUrl + '" data-bar="1" data-itemname="' + (it.name || '未知') + '" data-value="' + v + '" data-prev="" data-date="' + d + '" style="cursor:pointer"/>';
        stackY = barY;
      });

      // 数字标签 (全部显示)
      svg += '<text x="' + (x + BAR_W / 2) + '" y="32" text-anchor="middle" font-size="10" fill="#666" font-weight="500" class="bar-label">' + Math.round(dayTotal) + '分</text>';

      // 日期 + 周几 (labelStride 控制密度, feat/month-chart 用 stride=3 简化后每 i%stride 都标)
      if (i % labelStride === 0 || i === n - 1) {
        var dtParts = d.split('-');
        var label = dtParts[1] + '/' + dtParts[2];
        var wd = weekdayNames[new Date(d + 'T00:00:00').getDay()];
        var wdLabel = (wd === '周一') ? '一' : (wd === '周三') ? '三' : (wd === '周五') ? '五' : (wd === '周日') ? '日' : '';
        if (labelStride === 1) {
          // stage 图: 全部日期 + 周几
          svg += '<text x="' + (x + BAR_W / 2) + '" y="' + labelY + '" text-anchor="middle" font-size="11" fill="#888" font-weight="500">' + label + '</text>';
          svg += '<text x="' + (x + BAR_W / 2) + '" y="' + subY + '" text-anchor="middle" font-size="10" fill="#BBB">' + wd + '</text>';
        } else {
          // month 图: 按 stride 都标日期 (feat/month-chart 简化掉周几 sub-label, 避免跟相邻日期 label 视觉重叠)
          svg += '<text x="' + (x + BAR_W / 2) + '" y="' + labelY + '" text-anchor="middle" font-size="10" fill="#888" font-weight="500">' + label + '</text>';
        }
      }
    });

    svg += '</svg>';
    return {
      svg: svg,
      svgW: SVG_W,
      items: items.map(function(it) { return {name: it.name || '未知', color: STAGE_COLORS[it.id % STAGE_COLORS.length]}; })
    };
  }

  // stage chart 兼容入口 (调公共函数, 保留原行为)
  function renderStageChart(stageData) {
    return renderStackedChart(stageData);
  }

  // 月份图渲染 (feat/month-chart): 走公共渲染函数, 窄柱+稀疏 label
  function renderMonthChart(monthData) {
    // 响应式: BAR_W 跟随 wrap 宽度, 上限 28px (修当月被拉宽问题)
    var wrapW = document.getElementById('monthChartWrap');
    var containerW = wrapW ? wrapW.clientWidth : 700;
    var n = monthData.dates.length;
    var LABEL_W = 44, RIGHT_PAD = 10;
    var availableForBars = Math.max(containerW - LABEL_W - RIGHT_PAD, 200);
    var barW = Math.max(4, Math.min(28, Math.floor((availableForBars - (n - 1) * 6) / n)));
    return renderStackedChart(monthData, {
      barW: barW, barGap: 6, chartH: 140, labelStride: 3, labelY: 192
    });
  }

  // 月份科目累计渲染 (feat/month-summary): 横向 bar, 从长到短排序, 颜色复用月图 STAGE_COLORS
  function renderMonthSummary(monthData) {
    // 1) 聚合每科目总分钟
    var totals = {};  // item_id -> total minutes
    var itemNames = {};  // item_id -> name (复用月图 items 数组的 name)
    monthData.items.forEach(function(it) {
      totals[it.id] = 0;
      itemNames[it.id] = it.name || ('科目' + it.id);
    });
    monthData.dates.forEach(function(d) {
      var row = monthData.data[d] || {};
      Object.keys(row).forEach(function(itemIdStr) {
        var itemId = parseInt(itemIdStr, 10);
        var v = row[itemIdStr];
        if (v && v > 0) totals[itemId] = (totals[itemId] || 0) + v;
      });
    });
    // 2) 数组化 + 排序 (从长到短, 同长度按 id 升序)
    var arr = Object.keys(totals).map(function(id) {
      return { id: parseInt(id, 10), name: itemNames[id], total: totals[id] };
    }).filter(function(x) { return x.total > 0; });
    arr.sort(function(a, b) {
      if (b.total !== a.total) return b.total - a.total;
      return a.id - b.id;
    });
    return arr;
  }

  // 月份科目累计 DOM 渲染 (feat/month-summary): 渲染横向 bar 列表到 #monthSummaryWrap
  function renderMonthSummaryDOM(monthData) {
    var titleEl = document.getElementById('monthSummaryTitle');
    var subEl = document.getElementById('monthSummarySub');
    var wrapEl = document.getElementById('monthSummaryWrap');
    if (!titleEl || !subEl || !wrapEl) return;
    var labelParts = (monthData.month || '').split('-');
    titleEl.innerHTML = '<img src="/static/icons/chart-bar.svg" width="16" height="16" alt="" style="vertical-align:-3px;margin-right:6px;"><span>' + (labelParts[0] || '') + '/' + (labelParts[1] || '') + ' 科目累计</span>';
    var arr = renderMonthSummary(monthData);
    if (arr.length === 0) {
      subEl.textContent = '本月暂无练习数据';
      wrapEl.innerHTML = '';
      return;
    }
    var maxTotal = arr[0].total;
    var grandTotal = arr.reduce(function(s, x) { return s + x.total; }, 0);
    subEl.textContent = '共 ' + arr.length + ' 个科目, 总 ' + grandTotal + ' 分钟';
    // 响应式: 横向 bar 长度按容器宽自适应, 留 40% 给右侧文字
    var containerW = wrapEl.clientWidth || 600;
    var RANK_W = 24, LABEL_W = 70, RIGHT_PAD = 8, BAR_AREA_RATIO = 0.6;
    var availableForBar = Math.max(containerW - RANK_W - LABEL_W - RIGHT_PAD, 100);
    var maxBarW = Math.max(40, Math.floor(availableForBar * BAR_AREA_RATIO));
    var html = '';
    arr.forEach(function(x, i) {
      var barW = Math.max(2, Math.round(maxBarW * (x.total / maxTotal)));
      var pct = Math.round(x.total / grandTotal * 100);
      var rankColor = i < 3 ? '#FF6B6B' : '#999';
      var colorIdx = x.id % 15;  // 复用月图 STAGE_COLORS (15 色梯度)
      var color = STAGE_COLORS[colorIdx];
      // 行布局: [排名] [bar] [科目名 + 数字]
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">'
        + '<span style="min-width:' + RANK_W + 'px;font-size:11px;color:' + rankColor + ';font-weight:600;text-align:right;">#' + (i + 1) + '</span>'
        + '<div style="min-width:' + LABEL_W + 'px;font-size:13px;color:#3D2E1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + x.name + '</div>'
        + '<div style="flex:1;background:#F5F0E8;border-radius:6px;height:14px;overflow:hidden;position:relative;">'
        +   '<div data-summary-bar="1" data-item-id="' + x.id + '" data-item-name="' + x.name + '" data-total="' + x.total + '" data-pct="' + pct + '" '
        +        'style="width:' + barW + 'px;height:100%;background:' + color + ';cursor:pointer;transition:transform 0.15s;"></div>'
        + '</div>'
        + '<span style="min-width:60px;font-size:12px;color:#666;text-align:right;font-weight:500;">' + x.total + ' 分 <span style="color:#999;font-weight:400;">' + pct + '%</span></span>'
        + '</div>';
    });
    wrapEl.innerHTML = html;
    bindSummaryBarHover();
  }

  // 月份科目累计 bar hover + click (feat/month-summary): 复用 .bar-tooltip, click 弹 diziModal
  function bindSummaryBarHover() {
    var bars = document.querySelectorAll('[data-summary-bar="1"]');
    bars.forEach(function(bar) {
      bar.addEventListener('mouseenter', function() {
        var name = bar.getAttribute('data-item-name');
        var total = bar.getAttribute('data-total');
        var pct = bar.getAttribute('data-pct');
        showSummaryTooltip(bar, '<div class="tt-item"><strong>' + name + '</strong></div><div class="tt-item">' + total + ' 分钟 (' + pct + '%)</div>');
        gsap.to(bar, { scaleY: 1.15, transformOrigin: 'left center', duration: 0.15, ease: 'power2.out' });
      });
      bar.addEventListener('mousemove', function(e) {
        moveSummaryTooltip(e);
      });
      bar.addEventListener('mouseleave', function() {
        hideSummaryTooltip();
        gsap.to(bar, { scaleY: 1, duration: 0.2, ease: 'power2.out' });
      });
    });
  }
  var _summaryTooltip = null;
  function showSummaryTooltip(anchor, html) {
    if (!_summaryTooltip) {
      _summaryTooltip = document.createElement('div');
      _summaryTooltip.className = 'bar-tooltip';
      _summaryTooltip.style.opacity = '0';
      document.body.appendChild(_summaryTooltip);
    }
    _summaryTooltip.innerHTML = html;
    _summaryTooltip.style.opacity = '1';
  }
  function moveSummaryTooltip(e) {
    if (_summaryTooltip) {
      _summaryTooltip.style.left = e.clientX + 'px';
      _summaryTooltip.style.top = e.clientY + 'px';
    }
  }
  function hideSummaryTooltip() {
    if (_summaryTooltip) _summaryTooltip.style.opacity = '0';
  }

  // 月份图 fetch + 渲染 (feat/month-chart)
  function loadMonthChart(monthStr) {
    var titleEl = document.getElementById('monthChartTitle');
    var subEl = document.getElementById('monthChartSub');
    var wrapEl = document.getElementById('monthChartWrap');
    var legendEl = document.getElementById('monthChartLegend');
    if (!titleEl || !wrapEl) return;
    subEl.textContent = '加载中...';
    fetch('/api/practices/monthly?month=' + encodeURIComponent(monthStr), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (data.error) {
          subEl.textContent = '加载失败: ' + data.error;
          return;
        }
        var labelParts = monthStr.split('-');
        titleEl.innerHTML = '<img src="/static/icons/chart-bar.svg" width="16" height="16" alt="" style="vertical-align:-3px;margin-right:6px;"><span>' + labelParts[0] + '/' + labelParts[1] + ' 月练习</span>';
        subEl.textContent = '共 ' + data.dates.length + ' 天, 截止 ' + data.end_date;

        wrapEl.innerHTML = result.svg;
        legendEl.innerHTML = result.items.map(function(it) {
          return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#555;background:#F5F5F5;padding:3px 8px;border-radius:12px;"><span style="width:9px;height:9px;border-radius:2px;background:' + it.color + ';display:inline-block;"></span>' + it.name + '</span>';
        }).join('');

        renderMonthSummaryDOM(data);

        subEl.textContent = '加载失败';
      });

  // ── 绑定柱状图悬停 ─────────────────────────────────────────
  function bindBarHover() {
    var tooltip = document.createElement('div');
    tooltip.className = 'bar-tooltip';
    tooltip.style.opacity = '0';
    document.body.appendChild(tooltip);

    document.querySelectorAll('[data-bar="1"]').forEach(function(rect) {
      rect.addEventListener('mouseenter', function() {
        var name = rect.getAttribute('data-itemname');
        var val = rect.getAttribute('data-value');
        var prev = rect.getAttribute('data-prev');
        var date = rect.getAttribute('data-date');

        var diffHtml = '';
        if (prev !== '' && prev !== 'null' && prev !== null) {
          var diff = parseInt(val) - parseInt(prev);
          if (diff > 0) diffHtml = '<div class="tt-diff up">↑ +' + diff + '分 vs昨日</div>';
          else if (diff < 0) diffHtml = '<div class="tt-diff down">↓ ' + diff + '分 vs昨日</div>';
          else diffHtml = '<div class="tt-diff" style="color:#AAA">＝ 持平昨日</div>';
        }
        tooltip.innerHTML = '<div class="tt-item"><strong>' + name + '</strong></div><div class="tt-item">' + val + '分钟</div>' + diffHtml;
        tooltip.style.opacity = '1';
        gsap.to(rect, { scaleY: 1.04, transformOrigin: 'bottom', duration: 0.15, ease: 'power2.out' });
      });
      rect.addEventListener('mousemove', function(e) {
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top = e.clientY + 'px';
      });
      rect.addEventListener('mouseleave', function() {
        tooltip.style.opacity = '0';
        gsap.to(rect, { scaleY: 1, duration: 0.2, ease: 'power2.out' });
      });

      // ── 点击弹出竹笛弹窗 ─────────────────────────────
      rect.addEventListener('click', function() {
        var date = rect.getAttribute('data-date');
        openDiziModal(date);
      });
    });
  }

  // ── 共享: 练习明细渲染 (feat/report-session-detail) ────────
  // 与 practice.html renderTodayRecords 分组规则对齐: items 主序 + sessions 挂组 + legacy 补差
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatCnDate(iso) {
    if (!iso || iso.length < 10) return iso || '';
    var parts = iso.substring(0, 10).split('-');
    if (parts.length < 3) return iso;
    return parseInt(parts[1], 10) + '月' + parseInt(parts[2], 10) + '日';
  }

  function groupSessionsByItem(items, sessions) {
    var itemMinutes = {};
    var itemNames = {};
    var itemOrder = [];
    (items || []).forEach(function(it) {
      var id = it.item_id;
      if (id == null) return;
      if (!itemMinutes.hasOwnProperty(id)) {
        itemOrder.push(id);
        itemMinutes[id] = 0;
        itemNames[id] = it.item || '未知科目';
      }
      itemMinutes[id] += (it.minutes || 0);
      if (it.item) itemNames[id] = it.item;
    });

    var sessionMinutes = {};
    var sessionsByItem = {};
    (sessions || []).forEach(function(s) {
      var id = s.item_id;
      if (id == null) return;
      if (!sessionsByItem[id]) sessionsByItem[id] = [];
      sessionsByItem[id].push(s);
      sessionMinutes[id] = (sessionMinutes[id] || 0) + (s.duration_minutes || 0);
      if (!itemNames.hasOwnProperty(id)) {
        itemOrder.push(id);
        itemNames[id] = s.item_name || '未知科目';
      } else if (s.item_name && !itemMinutes.hasOwnProperty(id)) {
        itemNames[id] = s.item_name;
      }
    });

    // items 有分钟但 sessions 未覆盖 → 历史汇总伪行
    itemOrder.forEach(function(id) {
      if (!itemMinutes.hasOwnProperty(id)) return;
      var totalForItem = itemMinutes[id] || 0;
      var covered = sessionMinutes[id] || 0;
      if (totalForItem > covered) {
        if (!sessionsByItem[id]) sessionsByItem[id] = [];
        sessionsByItem[id].push({
          id: -id,
          item_id: id,
          item_name: itemNames[id],
          tempo_note: '',
          tempo_bpm: 0,
          content: '历史汇总',
          duration_minutes: totalForItem - covered,
          is_legacy: true
        });
      }
    });

    return itemOrder.map(function(id) {
      var rows = sessionsByItem[id] || [];
      var sessSum = (sessionMinutes[id] || 0);
      // 组头优先用 items 汇总 (含 legacy 补差后的真值), 否则 session 合计
      var headerMins = itemMinutes.hasOwnProperty(id) ? itemMinutes[id] : sessSum;
      return {
        item_id: id,
        name: itemNames[id] || '未知科目',
        minutes: headerMins,
        sessions: rows
      };
    }).filter(function(g) { return g.minutes > 0 || (g.sessions && g.sessions.length); });
  }

  function renderSessionGroupsHtml(items, sessions, opts) {
    opts = opts || {};
    var groups = groupSessionsByItem(items, sessions);
    if (!groups.length) {
      return '<div class="rp-session-empty">' + (opts.emptyText || '暂无练习明细') + '</div>';
    }
    var html = '<div class="rp-session-list">';
    if (opts.heading !== false) {
      html += '<div class="rp-session-heading">' + escapeHtml(opts.heading || '练习明细') + '</div>';
    }
    groups.forEach(function(g) {
      html += '<div class="rp-group">';
      html += '<div class="rp-group-header">';
      html += '<span class="rp-g-name">' + escapeHtml(g.name) + '</span>';
      html += '<span class="rp-g-mins">' + escapeHtml(g.minutes) + ' 分钟</span>';
      html += '</div>';
      if (g.sessions && g.sessions.length) {
        g.sessions.forEach(function(s) {
          var tempoText = s.tempo_bpm ? ((s.tempo_note || '') + '=' + s.tempo_bpm) : '';
          var contentText = s.is_legacy
            ? (s.content || '历史汇总')
            : (s.content || (s.tempo_bpm ? '未填写练习内容' : ''));
          html += '<div class="rp-session' + (s.is_legacy ? ' rp-legacy' : '') + '">';
          if (tempoText) {
            html += '<span class="rp-tempo">' + escapeHtml(tempoText) + '</span>';
          }
          html += '<span class="rp-content">' + escapeHtml(contentText) + '</span>';
          html += '<span class="rp-mins">' + escapeHtml(s.duration_minutes || 0) + 'min</span>';
          html += '</div>';
        });
      } else {
        // 仅有汇总、无 session 行
        html += '<div class="rp-session rp-legacy">';
        html += '<span class="rp-content">科目汇总</span>';
        html += '<span class="rp-mins">' + escapeHtml(g.minutes) + 'min</span>';
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ── 竹笛弹窗（新线段模板 + 下方 session 明细） ────────────

            + '</div>';
        });
        document.getElementById('segmentsContainer').innerHTML = html;
      }

      // 科目下方练习明细 (session 分组列表)
      if (modalDetail) {
        if (!items.length && !sessions.length) {
          modalDetail.innerHTML = '<div class="rp-session-empty">这天没有练习记录</div>';
        } else {
          modalDetail.innerHTML = renderSessionGroupsHtml(items, sessions, {
            heading: '练习明细 · 共 ' + total + ' 分钟'
          });
          gsap.fromTo(modalDetail.querySelectorAll('.rp-group'), {
            opacity: 0, y: 10
          }, {
            opacity: 1, y: 0, duration: 0.3, stagger: 0.05, ease: 'power2.out', delay: 0.15
          });
        }
      }
    }).catch(function() {
      document.getElementById('diziModalTotal').textContent = '加载失败';
      if (modalDetail) modalDetail.innerHTML = '<div class="rp-session-empty">加载失败</div>';
    });
  }

  function closeDiziModal() {
    if (!diziModal) return;
    var mask = document.getElementById('diziModalMask');
    var content = diziModal.querySelector('.modal-content');
    var diziBgEl = document.getElementById('diziBg');
    gsap.killTweensOf(diziBgEl);
    gsap.to([content, mask], { opacity: 0, scale: 0.9, duration: 0.25, ease: 'power2.in', onComplete: function() {
      diziModal.style.display = 'none';
      gsap.set([content, mask], { opacity: 1, scale: 1 });
    }});
  }

  document.getElementById('diziModalMask') && document.getElementById('diziModalMask').addEventListener('click', closeDiziModal);
  document.getElementById('diziModalClose') && document.getElementById('diziModalClose').addEventListener('click', closeDiziModal);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeDiziModal();
  });

  // ── 练习轨迹渲染函数 ───────────────────────────────────────────────
  function renderTrail(behLog, dateStr) {
    if (!behLog || behLog.length === 0) return '';
    var html = '<div class="trail-section">';
    html += '<div class="trail-header"><img src="/static/icons/location-dot.svg" width="14" height="14" alt="" style="vertical-align:-2px;margin-right:4px;">练习轨迹</div>';
    behLog.forEach(function(entry) {
      var t = entry.enter_time || '';
      // 兼容 CST 'YYYY-MM-DD HH:MM:SS' (空格分隔) 和 UTC ISO 'YYYY-MM-DDTHH:MM:SS' (T 分隔)
      // 2026-06-13 timezone fix 后 enter_time 改 CST, 旧数据混存两种格式
      var sep = t.indexOf('T') >= 0 ? 'T' : ' ';
      var timeStr = '--:--';
      if (t) {
        var parts = t.split(sep);
        if (parts.length >= 2) {
          var hm = parts[1].substring(0, 5);
          if (hm) timeStr = hm;
        }
      }
      html += '<div class="trail-item">';
      html += '<span class="trail-time">' + timeStr + '</span>';
      html += '<span class="trail-item-tag">' + (entry.item || '未知') + '</span>';
      html += '<span class="trail-mins">' + (entry.minutes || 0) + '分钟</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ── 点击日历格子 (事件委托到 .cal-grid, 月份切换不会丢监听) ──
  var calGrid = document.querySelector('.cal-grid');
  if (calGrid) {
    calGrid.addEventListener('click', function(e) {
      var cell = e.target.closest('.cal-day:not(.empty)');
      if (!cell || !calGrid.contains(cell)) return;
      cell.style.cursor = 'pointer';

      var prev = document.querySelector('.cal-day.selected');
      document.querySelectorAll('.cal-day.selected').forEach(function(c){ c.classList.remove('selected'); });
      cell.classList.add('selected');

      var oldBar = prev ? prev.querySelector('.sel-bar') : null;
      if (oldBar) {
        gsap.killTweensOf(oldBar);
        oldBar.style.transform = 'scaleY(0)';
      }
      var bar = cell.querySelector('.sel-bar');
      if (bar) {
        gsap.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: 'back.out(2.2)' });
      }

      var date = cell.getAttribute('data-date');
      if (!date) return;

      var detailDiv = document.getElementById('dayDetail');
      var detailBody = document.getElementById('detailBody');

      detailDiv.style.display = 'block';
      document.getElementById('detailDate').textContent = formatCnDate(date) + ' · 练习明细';
      document.getElementById('detailDate').style.color = '#FF6B6B';
      detailBody.innerHTML = '<div style="text-align:center;color:#BDBDBD;padding:24px;">加载中...</div>';
      gsap.fromTo(detailDiv, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });

      // 用本地日期解析, 避免 UTC toISOString 跨日偏差 (CST 项目惯例)
      var dateParts = date.split('-').map(function(x) { return parseInt(x, 10); });
      var prevDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
      prevDate.setDate(prevDate.getDate() - 1);
      var pad = function(n) { return String(n).padStart(2, '0'); };
      var prevDateStr = prevDate.getFullYear() + '-' + pad(prevDate.getMonth() + 1) + '-' + pad(prevDate.getDate());
      var now = new Date();
      var todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
      var isToday = (date === todayStr);

      Promise.all([
        fetch('/api/practices/' + date).then(function(r){ return r.json(); }),
        isToday ? Promise.resolve({items: [], total_minutes: 0, behavior_log: [], sessions: []})
                : fetch('/api/practices/' + prevDateStr).then(function(r){ return r.json(); })
      ]).then(function(results) {
        var data = results[0];
        var prevData = results[1];

        if (isToday && (data.total_minutes === 0 || (Array.isArray(data.items) && data.items.length === 0))) {
          detailBody.innerHTML = '<div class="detail-empty">今天还没过完，明天来看</div>';
          return;
        }

        if ((data.total_minutes === 0 || (Array.isArray(data.items) && data.items.length === 0))
            && (!(data.sessions && data.sessions.length))) {
          detailBody.innerHTML = '<div class="detail-empty">这天没有练习记录</div>';
          return;
        }

        var totalDiff = (data.total_minutes || 0) - (prevData.total_minutes || 0);
        var totalDiffColor = totalDiff > 0 ? '#27AE60' : totalDiff < 0 ? '#E74C3C' : '#999';
        var diffLabel = totalDiff > 0 ? '↑' : totalDiff < 0 ? '↓' : '＝';

        var detailHtml = '';
        detailHtml += '<div class="detail-total-row">';
        detailHtml += '<span style="font-size:14px;color:#333;">总时长</span>';
        detailHtml += '<span style="font-size:14px;font-weight:bold;color:#333;">' + (data.total_minutes || 0) + ' 分钟';
        if (!isToday) {
          detailHtml += ' <span style="font-size:12px;color:' + totalDiffColor + ';">' + diffLabel + ' ' + Math.abs(totalDiff) + '分 vs 昨日</span>';
        }
        detailHtml += '</span></div>';

        // 主内容: 科目组成 + session 明细 (55 分怎么来的)
        detailHtml += renderSessionGroupsHtml(data.items || [], data.sessions || [], {
          heading: formatCnDate(date) + ' 共 ' + (data.total_minutes || 0) + ' 分钟，组成如下'
        });

        var trail = renderTrail(data.behavior_log || [], date);
        detailBody.innerHTML = detailHtml + trail;
        gsap.fromTo(detailBody.querySelectorAll('.rp-group'), {
          opacity: 0, x: -12
        }, {
          opacity: 1, x: 0, duration: 0.28, stagger: 0.06, ease: 'power2.out'
        });
        if (trail) gsap.fromTo('.trail-item', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.07, ease: 'power2.out' });

        fetch('/api/practices/stage/' + date).then(function(r){ return r.json(); }).then(function(stageData) {
          if (stageData.error) return;
          var chartCard = document.getElementById('stageChartCard');
          var result = renderStageChart(stageData);
          document.getElementById('stageChartTitle').innerHTML = '<img src="/static/icons/chart-bar.svg" width="16" height="16" alt="" style="vertical-align:-3px;margin-right:6px;"><span>' + stageData.stage_start + ' ~ ' + stageData.stage_end + ' 周练习</span>';
          document.getElementById('stageChartSub').textContent = '共 ' + stageData.dates.length + ' 天';
          document.getElementById('stageChartWrap').innerHTML = result.svg;
          document.getElementById('stageChartLegend').innerHTML = result.items.map(function(it) {
            return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#555;background:#F5F5F5;padding:3px 8px;border-radius:12px;"><span style="width:9px;height:9px;border-radius:2px;background:' + it.color + ';display:inline-block;"></span>' + it.name + '</span>';
          }).join('');
          chartCard.style.display = 'block';
          gsap.fromTo(chartCard, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' });
          bindBarHover();
        }).catch(function(){});
      }).catch(function() {
        detailBody.innerHTML = '<div class="detail-empty">加载失败</div>';
      });
    });
  }

  // 页面整体弹入
  var pageContent = document.querySelector('.page-content');
  if (pageContent) {
    gsap.fromTo(pageContent, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' });
  }
});
</script>
<div id="diziModal">
  <div class="modal-mask" id="diziModalMask"></div>
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="diziModalDate"></div>
        <div class="modal-total" id="diziModalTotal"></div>
      </div>
      <button class="modal-close" id="diziModalClose">×</button>
    </div>
    <div id="diziContainer">
      <img id="diziBg" src="" alt="">
    </div>
    <div id="segmentsContainer"></div>
    <div id="modalSessionDetail"></div>
    <div class="modal-footer">点击遮罩或 × 关闭</div>
  </div>
</div>
</div><!-- .page-content -->
</body>
</html>
