<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>练习报告 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body { padding-bottom: 0; }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 4px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: var(--card, #fff); box-shadow: 0 -2px 12px rgba(0,0,0,0.1); z-index: 100;
    }
    .nav a {
      flex: 1; min-width: 0; padding: 14px 8px !important; background: transparent; border-radius: 16px;
      text-align: center; text-decoration: none; color: #7F8C8D; font-size: 16px !important;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .nav a:active { transform: scale(0.95); }
    .nav a.active { background: var(--primary, #FF6B6B); color: white; }
    .nav-icon { font-size: 20px; }

    /* dayDetail 区域 */
    #dayDetail { font-size: 16px; }
    #dayDetail h3 { font-size: 18px; color: #FF6B6B; margin-bottom: 14px; }
    .detail-empty { text-align: center; color: #BDBDBD; padding: 24px; font-size: 15px; }

    /* 哑铃图 */
    .dumbbell-chart { width: 100%; }
    .dumbbell-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #F5F5F5; }
    .dumbbell-row:last-child { border-bottom: none; }
    .dumbbell-item-name { min-width: 80px; font-size: 15px; color: #333; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .dumbbell-svg-wrap { flex: 1; position: relative; height: 40px; padding: 0 6px; box-sizing: border-box; }
    .dumbbell-bar-wrap { position: absolute; top: 50%; transform: translateY(-50%); left: 6px; right: 6px; height: 4px; background: #E0E0E0; border-radius: 2px; }
    .dumbbell-bar-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 2px; transition: width 0.3s ease; }
    .dumbbell-marker { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .dumbbell-marker.yesterday { background: #90A4AE; }
    .dumbbell-marker.today { background: #27AE60; }
    .dumbbell-marker.today.decrease { background: #E74C3C; }
    .dumbbell-marker.today.same { background: #90A4AE; }
    .dumbbell-marker.today.new-item { background: #FFB300; }
    .dumbbell-mins { position: absolute; font-size: 11px; color: #7F8C8D; white-space: nowrap; transform: translateX(-50%); }
    .dumbbell-mins.yesterday { bottom: 20px; color: #90A4AE; font-weight: 500; }
    .dumbbell-mins.today { bottom: 20px; font-weight: bold; }
    .dumbbell-mins.today.increase { color: #27AE60; }
    .dumbbell-mins.today.decrease { color: #E74C3C; }
    .dumbbell-mins.today.same { color: #7F8C8D; }

    /* 练习轨迹 */
    .trail-section { margin-top: 14px; padding: 16px; background: #FFF; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .trail-header { font-size: 14px; color: #888; margin-bottom: 12px; }
    .trail-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 15px; }
    .trail-time { color: #999; font-size: 13px; min-width: 38px; }
    .trail-item-tag { background: #E3F2FD; padding: 3px 10px; border-radius: 12px; color: #1565C0; font-size: 14px; }
    .trail-mins { color: #888; font-size: 14px; }

    /* 图例 */
    .dumbbell-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: #7F8C8D; flex-wrap: wrap; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
<div class="page-content" style="padding-bottom: calc(60px + env(safe-area-inset-bottom));">
  <div class="nav">
    <a href="/prepare" class="nav-item"><span class="nav-icon">🏠</span><span>准备</span></a>
    <a href="/practice" class="nav-item"><span class="nav-icon">🎵</span><span>练习</span></a>
    <a href="/achievements" class="nav-item"><span class="nav-icon">🏆</span><span>成就</span></a>
    <a href="/report" class="nav-item active"><span class="nav-icon">📊</span><span>报告</span></a>
    <a href="/config" class="nav-item"><span class="nav-icon">⚙️</span><span>配置</span></a>
  </div>

  <div class="card">
    <h2>{{month_str}} 练习报告</h2>
    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <div style="flex:1;text-align:center;padding:12px;background:#E8F5E9;border-radius:12px;">
        <div style="font-size:28px;font-weight:bold;color:#27AE60;">{{total_mins}}</div>
        <div style="font-size:13px;color:#7F8C8D;">总练习分钟</div>
      </div>
      <div style="flex:1;text-align:center;padding:12px;background:#FFF8E1;border-radius:12px;">
        <div style="font-size:28px;font-weight:bold;color:#F57C00;">{{practice_days}}</div>
        <div style="font-size:13px;color:#7F8C8D;">练习天数</div>
      </div>
    </div>
    <div style="margin-bottom:8px;color:#7F8C8D;">日</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:4px;font-size:13px;color:#7F8C8D;font-weight:bold;">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid">{{cal_html}}</div>

  <!-- Stage堆叠柱状图卡片 -->
  <div id="stageChartCard" class="card" style="display:none;margin-top:12px;">
    <h3 id="stageChartTitle" style="color:#4ECDC4;font-size:16px;margin-bottom:4px;"></h3>
    <div id="stageChartSub" style="font-size:12px;color:#999;margin-bottom:16px;"></div>
    <div id="stageChartWrap" style="position:relative;overflow-x:auto;"></div>
    <div id="stageChartLegend" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;"></div>
  </div>

    <div style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:#7F8C8D;flex-wrap:wrap;">
      <span style="width:16px;height:16px;background:#E8F5E9;border-radius:4px;display:inline-block;"></span> 少量
      <span style="width:16px;height:16px;background:#FFF8E1;border-radius:4px;display:inline-block;"></span> 中等
      <span style="width:16px;height:16px;background:#FFEBEE;border-radius:4px;display:inline-block;"></span> 充足
    </div>
  </div>

  <!-- 当天明细区域 -->
  <div id="dayDetail" class="card" style="display:none;margin-top:12px;">
    <h3 id="detailDate"></h3>
    <div id="detailBody"></div>
  </div>
</body>
<script>
document.addEventListener('DOMContentLoaded', function() {

  // ── Stage 堆叠柱状图渲染函数 ─────────────────────────────────────────
  var STAGE_COLORS = ['#4ECDC4','#FF6B6B','#45B7D1','#96CEB4','#F7DC6F','#BB8FCE','#F0A500','#76D7C4','#E74C3C','#3498DB'];

  function renderStageChart(stageData) {
    var dates = stageData.dates; // 最多7个
    var items = stageData.items; // [{id, name}]
    var data = stageData.data;   // {date: {itemId: mins|null}}

    var n = dates.length;
    var BAR_W = 36;
    var BAR_GAP = Math.max(12, Math.floor((300 - n * BAR_W) / (n - 1)));
    var CHART_H = 160;
    var LEFT_PAD = 8;
    var RIGHT_PAD = 8;
    var SVG_W = LEFT_PAD + n * BAR_W + (n - 1) * BAR_GAP + RIGHT_PAD;
    var SVG_H = CHART_H + 60;

    // 计算每天的总分钟数（用于Y轴上限）
    var dailyTotals = {};
    dates.forEach(function(d) {
      var total = 0;
      items.forEach(function(it) {
        var v = data[d] && data[d][it.id];
        if (v !== null && v !== undefined) total += v;
      });
      dailyTotals[d] = total;
    });
    var maxTotal = Math.max(...Object.values(dailyTotals), 1);

    function minsToH(mins) {
      return Math.round((mins / maxTotal) * CHART_H);
    }
    function dateX(i) {
      return LEFT_PAD + i * (BAR_W + BAR_GAP);
    }

    // 预计算每列每个item的bottom累加高度
    // colStacks[d][itemIdx] = {bottom, height, top}
    var colStacks = {};
    dates.forEach(function(d) {
      colStacks[d] = [];
      var bottom = 0;
      items.forEach(function(it) {
        var v = (data[d] && data[d][it.id] !== null && data[d][it.id] !== undefined) ? data[d][it.id] : null;
        var h = v !== null ? minsToH(v) : 0;
        colStacks[d].push({bottom: bottom, height: h, top: bottom + h, value: v});
        bottom += h;
      });
    });

    var weekdayNames = ['周日','周一','周二','周三','周四','周五','周六'];

    var svg = '<svg width="' + SVG_W + '" height="' + SVG_H + '" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;font-family:sans-serif;">';

    // 画连接线（底层到顶层，每层一条）
    for (var ii = 0; ii < items.length; ii++) {
      for (var jj = 0; jj < dates.length - 1; jj++) {
        var d1 = dates[jj], d2 = dates[jj + 1];
        var s1 = colStacks[d1][ii], s2 = colStacks[d2][ii];
        if (s1.value === null || s2.value === null) continue;
        var x1 = dateX(jj) + BAR_W;
        var x2 = dateX(jj + 1);
        var col1 = s1.value <= s2.value ? '#27AE60' : '#E74C3C';
        // top线
        svg += '<line x1="' + x1 + '" y1="' + (CHART_H - s1.top) + '" x2="' + x2 + '" y2="' + (CHART_H - s2.top) + '" stroke="' + col1 + '" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,2"/>';
        // bottom线
        svg += '<line x1="' + x1 + '" y1="' + (CHART_H - s1.bottom) + '" x2="' + x2 + '" y2="' + (CHART_H - s2.bottom) + '" stroke="' + col1 + '" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,2"/>';
      }
    }

    // 画堆叠柱
    for (var jj = 0; jj < dates.length; jj++) {
      var d = dates[jj];
      var x = dateX(jj);
      var stacks = colStacks[d];
      var isFuture = (data[d] && Object.values(data[d]).every(function(v){ return v === null; }));
      var barOpacity = isFuture ? 0.25 : 1;

      for (var ii = 0; ii < stacks.length; ii++) {
        var s = stacks[ii];
        if (s.height === 0) continue;
        var col = STAGE_COLORS[ii % STAGE_COLORS.length];
        var y = CHART_H - s.top;
        svg += '<rect x="' + x + '" y="' + y + '" width="' + BAR_W + '" height="' + s.height + '" fill="' + col + '" opacity="' + barOpacity + '" rx="2"/>';
        // 数据标签
        if (s.value !== null && s.height > 14) {
          svg += '<text x="' + (x + BAR_W / 2) + '" y="' + (y + s.height / 2 + 4) + '" text-anchor="middle" font-size="9" fill="white" opacity="0.9">' + s.value + '</text>';
        }
      }

      // x轴标签
      var dtParts = d.split('-');
      var label = dtParts[1] + '/' + dtParts[2];
      var wd = weekdayNames[new Date(d + 'T00:00:00').getDay()];
      svg += '<text x="' + (x + BAR_W / 2) + '" y="' + (SVG_H - 8) + '" text-anchor="middle" font-size="10" fill="#999">' + label + '</text>';
      svg += '<text x="' + (x + BAR_W / 2) + '" y="' + (SVG_H - 20) + '" text-anchor="middle" font-size="9" fill="#BBB">' + wd + '</text>';
    }

    // y轴参考线
    [0.25, 0.5, 0.75, 1.0].forEach(function(ratio) {
      var y = Math.round(CHART_H * (1 - ratio));
      svg += '<line x1="0" y1="' + y + '" x2="' + SVG_W + '" y2="' + y + '" stroke="#EEE" stroke-width="1"/>';
      svg += '<text x="2" y="' + (y - 2) + '" font-size="9" fill="#CCC">' + Math.round(maxTotal * ratio) + '</text>';
    });

    svg += '</svg>';

    return {
      svg: svg,
      svgW: SVG_W,
      items: items.map(function(it, idx) { return {name: it.name, color: STAGE_COLORS[idx % STAGE_COLORS.length]}; })
    };
  }

  // ── 练习轨迹渲染函数 ───────────────────────────────────────────────
  function renderTrail(behLog, dateStr) {
    if (!behLog || behLog.length === 0) return '';
    let html = '<div class="trail-section">';
    html += '<div class="trail-header">📍 练习轨迹</div>';
    behLog.forEach(function(entry) {
      const t = entry.enter_time || '';
      const timeStr = t ? t.split('T')[1].substring(0, 5) : '--:--';
      html += '<div class="trail-item">';
      html += '<span class="trail-time">' + timeStr + '</span>';
      html += '<span class="trail-item-tag">' + (entry.item || '未知') + '</span>';
      html += '<span class="trail-mins">' + (entry.minutes || 0) + '分钟</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ── 点击日历格子 ──────────────────────────────────────────────────
  document.querySelectorAll('.cal-day:not(.empty)').forEach(function(cell) {
    cell.style.cursor = 'pointer';
    cell.addEventListener('click', function() {

      // GSAP 格子动画
      var prev = document.querySelector('.cal-day.selected');
      document.querySelectorAll('.cal-day.selected').forEach(function(c){ c.classList.remove('selected'); });
      this.classList.add('selected');

      var oldBar = prev ? prev.querySelector('.sel-bar') : null;
      if (oldBar) {
        gsap.killTweensOf(oldBar);
        oldBar.style.transform = 'scaleY(0)';
      }
      var bar = this.querySelector('.sel-bar');
      if (bar) {
        gsap.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: 'back.out(2.2)' });
      }

      var date = this.getAttribute('data-date');
      if (!date) return;

      var detailDiv = document.getElementById('dayDetail');
      var detailBody = document.getElementById('detailBody');

      // 显示并 GSAP 滑入
      detailDiv.style.display = 'block';
      document.getElementById('detailDate').textContent = date;
      document.getElementById('detailDate').style.color = '#FF6B6B';
      detailBody.innerHTML = '<div style="text-align:center;color:#BDBDBD;padding:24px;">加载中...</div>';
      gsap.fromTo(detailDiv, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });

      var prevDate = new Date(date);
      prevDate.setDate(prevDate.getDate() - 1);
      var prevDateStr = prevDate.toISOString().split('T')[0];
      var isToday = (date === new Date().toISOString().split('T')[0]);

      Promise.all([
        fetch('/api/practices/' + date).then(function(r){ return r.json(); }),
        isToday ? Promise.resolve({items: [], total_minutes: 0, behavior_log: []})
                : fetch('/api/practices/' + prevDateStr).then(function(r){ return r.json(); })
      ]).then(function(results) {
        var data = results[0];
        var prevData = results[1];
        var prevItemsMap = {};
        (prevData.items || []).forEach(function(it){ prevItemsMap[it.item] = it.minutes; });

        // ── 今天无数据 ──────────────────────────────────────────
        if (isToday && (data.total_minutes === 0 || (Array.isArray(data.items) && data.items.length === 0))) {
          detailBody.innerHTML = '<div class="detail-empty">今天还没过完，明天来看</div>';
          return;
        }

        // ── 两天都没数据 ────────────────────────────────────────
        if ((data.total_minutes === 0 || (Array.isArray(data.items) && data.items.length === 0))
            && (prevData.total_minutes === 0 || (Array.isArray(prevData.items) && prevData.items.length === 0))) {
          detailBody.innerHTML = '<div class="detail-empty">这两天都没有练习记录</div>';
          return;
        }

        // ── 渲染当日明细（文字对比，无图表） ───────────────
        var totalDiff = data.total_minutes - prevData.total_minutes;
        var totalDiffStr = totalDiff > 0 ? '+' + totalDiff : String(totalDiff);
        var totalDiffColor = totalDiff > 0 ? '#27AE60' : totalDiff < 0 ? '#E74C3C' : '#999';
        var diffLabel = totalDiff > 0 ? '↑' : totalDiff < 0 ? '↓' : '＝';

        var detailHtml = '';
        detailHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EEE;margin-bottom:8px;">';
        detailHtml += '<span style="font-size:14px;color:#333;">总时长</span>';
        detailHtml += '<span style="font-size:14px;font-weight:bold;color:#333;">' + data.total_minutes + '分 <span style="font-size:12px;color:' + totalDiffColor + ';">' + diffLabel + ' ' + Math.abs(totalDiff) + '分</span></span>';
        detailHtml += '</div>';

        var trail = renderTrail(data.behavior_log || [], date);
        detailBody.innerHTML = detailHtml + trail;
        if (trail) gsap.fromTo('.trail-item', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.07, ease: 'power2.out' });

        // ── 加载并渲染 Stage 堆叠柱状图 ───────────────────
        fetch('/api/practices/stage/' + date).then(function(r){ return r.json(); }).then(function(stageData) {
          if (stageData.error) return;
          var chartCard = document.getElementById('stageChartCard');
          var result = renderStageChart(stageData);
          document.getElementById('stageChartTitle').textContent = '📊 ' + stageData.stage_start + ' ~ ' + stageData.stage_end + ' 周练习';
          document.getElementById('stageChartSub').textContent = '共 ' + stageData.dates.length + ' 天';
          document.getElementById('stageChartWrap').innerHTML = result.svg;
          document.getElementById('stageChartLegend').innerHTML = result.items.map(function(it) {
            return '<span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#555;"><span style="width:10px;height:10px;border-radius:2px;background:' + it.color + ';display:inline-block;"></span>' + it.name + '</span>';
          }).join('');
          chartCard.style.display = 'block';
          gsap.fromTo(chartCard, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' });
        }).catch(function(){});
      }).catch(function() {
        detailBody.innerHTML = '<div class="detail-empty">加载失败</div>';
      });
    });
  });

  // 页面整体弹入
  document.querySelectorAll('.card').forEach(function(card) {
    gsap.fromTo(card, { opacity: 0, scale: 0.82, y: 28 }, { opacity: 1, scale: 1, y: 0, duration: 0.65, ease: 'back.out(2)', delay: 0.05 });
  });
});
</script>
</div><!-- .page-content -->
</body>
</html>
