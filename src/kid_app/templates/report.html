<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>练习报告 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <style>
    body { padding-bottom: 0; }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 4px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: var(--card, #fff); box-shadow: 0 -2px 12px rgba(0,0,0,0.1); z-index: 100;
    }
    .nav a {
      flex: 1; min-width: 0; padding: 14px 8px !important; background: transparent; border-radius: 16px;
      text-align: center; text-decoration: none; color: #7F8C8D; font-size: 16px !important;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .nav a:active { transform: scale(0.95); }
    .nav a.active { background: var(--primary, #FF6B6B); color: white; }
    .nav-icon { font-size: 20px; }

    /* dayDetail 区域 */
  /* ── Stage 堆叠柱状图 ─────────────────────────────────── */
  #stageChartCard {
    margin-top: 14px;
    padding-bottom: 14px;
    min-height: 320px;
  }
  #stageChartTitle { font-size: 17px !important; }
  #stageChartSub { font-size: 13px !important; }
  #stageChartWrap {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  #stageChartWrap svg { display: block; }
  .bar-tooltip {
    position: fixed;
    background: rgba(40,40,40,0.92);
    color: white;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
    transform: translate(-50%, -110%);
    transition: opacity 0.15s;
  }
  .bar-tooltip .tt-item { margin: 2px 0; }
  .bar-tooltip .tt-diff { font-size: 11px; margin-top: 3px; }
  .bar-tooltip .tt-diff.up { color: #6EE7B7; }
  .bar-tooltip .tt-diff.down { color: #FCA5A5; }

  /* ── 竹笛弹窗 ─────────────────────────────────── */
  #diziModal {
    position: fixed; inset: 0; z-index: 10000;
    display: none; align-items: center; justify-content: center;
  }
  #diziModal .modal-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.60);
    backdrop-filter: blur(6px);
  }
  #diziModal .modal-content {
    position: relative; z-index: 1;
    background: #FFFDF8;
    border-radius: 24px;
    padding: 28px 32px 32px;
    max-width: 760px; width: 94%;
    box-shadow: 0 28px 80px rgba(0,0,0,0.30);
    overflow: hidden;
  }
  #diziModal .modal-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 24px;
  }
  #diziModal .modal-title { font-size: 18px; font-weight: bold; color: #3D2E1E; }
  #diziModal .modal-total {
    font-size: 13px; color: #8B6914; background: #FEF3C7;
    padding: 4px 12px; border-radius: 20px; margin-top: 6px;
    display: inline-block;
  }
  #diziModal .modal-close {
    width: 34px; height: 34px; border-radius: 50%;
    background: #EDE8E0; border: none; cursor: pointer;
    font-size: 20px; color: #7A6A5A; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
  }
  #diziModal .modal-close:hover { background: #D8CEBD; }

  /* 爆炸轴测竹笛容器 */
  #diziExploded {
    display: flex; align-items: center; justify-content: center;
    gap: 0; padding: 12px 0 4px;
    flex-wrap: wrap;
  }
  #dizi3dcanvas {
    display: block;
    margin: 0 auto;
    border-radius: 12px;
    background: transparent;
  }

  /* 每段竹笛 */
  .dizi-seg-wrap {
    display: flex; align-items: stretch;
    text-decoration: none; /* 去掉下划线 */
    gap: 6px; /* 段与段之间的爆炸间距 */
  }
  .dizi-seg-body {
    position: relative;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12), inset 0 0 12px rgba(0,0,0,0.08);
    display: flex; align-items: center;
  }
  .dizi-seg-body img.dizi-seg-img {
    height: 72px; width: auto;
    object-fit: cover; display: block;
  }
  /* 横截面 */
  .dizi-seg-cross {
    width: 42px; height: 72px;
    flex-shrink: 0;
    background: url('/static/dizi-cross-detail.png') no-repeat center;
    background-size: cover;
    border-radius: 0;
    position: relative;
  }
  /* 段内标签 */
  .dizi-seg-body .seg-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6px 10px; text-align: center;
    pointer-events: none;
  }
  .dizi-seg-body .seg-name {
    font-size: 13px; font-weight: 700; color: #FFF;
    text-shadow: 0 2px 6px rgba(0,0,0,0.55);
  }
  .dizi-seg-body .seg-mins {
    font-size: 11px; color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    margin-top: 3px;
  }

  #diziModal .modal-footer {
    margin-top: 18px;
    font-size: 12px; color: #B0A090; text-align: center;
  }

  @media (max-width: 600px) {
    #stageChartCard { padding: 10px 10px 14px; }
    #stageChartTitle { font-size: 15px !important; }
  }
  @media (min-width: 1024px) {
    #stageChartCard { padding: 16px 20px 20px; }
  }

  /* ── 日历 dayDetail ─────────────────────────────────── */
  #dayDetail h3 { font-size: 17px !important; color: #FF6B6B !important; margin-bottom: 14px !important; }
    .detail-empty { text-align: center; color: #BDBDBD; padding: 24px; font-size: 15px; }

    /* 哑铃图 */
    .dumbbell-chart { width: 100%; }
    .dumbbell-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #F5F5F5; }
    .dumbbell-row:last-child { border-bottom: none; }
    .dumbbell-item-name { min-width: 80px; font-size: 15px; color: #333; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .dumbbell-svg-wrap { flex: 1; position: relative; height: 40px; padding: 0 6px; box-sizing: border-box; }
    .dumbbell-bar-wrap { position: absolute; top: 50%; transform: translateY(-50%); left: 6px; right: 6px; height: 4px; background: #E0E0E0; border-radius: 2px; }
    .dumbbell-bar-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 2px; transition: width 0.3s ease; }
    .dumbbell-marker { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .dumbbell-marker.yesterday { background: #90A4AE; }
    .dumbbell-marker.today { background: #27AE60; }
    .dumbbell-marker.today.decrease { background: #E74C3C; }
    .dumbbell-marker.today.same { background: #90A4AE; }
    .dumbbell-marker.today.new-item { background: #FFB300; }
    .dumbbell-mins { position: absolute; font-size: 11px; color: #7F8C8D; white-space: nowrap; transform: translateX(-50%); }
    .dumbbell-mins.yesterday { bottom: 20px; color: #90A4AE; font-weight: 500; }
    .dumbbell-mins.today { bottom: 20px; font-weight: bold; }
    .dumbbell-mins.today.increase { color: #27AE60; }
    .dumbbell-mins.today.decrease { color: #E74C3C; }
    .dumbbell-mins.today.same { color: #7F8C8D; }

    /* 练习轨迹 */
    .trail-section { margin-top: 14px; padding: 16px; background: #FFF; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .trail-header { font-size: 14px; color: #888; margin-bottom: 12px; }
    .trail-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 15px; }
    .trail-time { color: #999; font-size: 13px; min-width: 38px; }
    .trail-item-tag { background: #E3F2FD; padding: 3px 10px; border-radius: 12px; color: #1565C0; font-size: 14px; }
    .trail-mins { color: #888; font-size: 14px; }

    /* 图例 */
    .dumbbell-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: #7F8C8D; flex-wrap: wrap; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
<div class="page-content" style="padding-bottom: calc(60px + env(safe-area-inset-bottom));">
  <div class="nav">
    <a href="/prepare" class="nav-item"><span class="nav-icon">🏠</span><span>准备</span></a>
    <a href="/practice" class="nav-item"><span class="nav-icon">🎵</span><span>练习</span></a>
    <a href="/achievements" class="nav-item"><span class="nav-icon">🏆</span><span>成就</span></a>
    <a href="/report" class="nav-item active"><span class="nav-icon">📊</span><span>报告</span></a>
    <a href="/config" class="nav-item"><span class="nav-icon">⚙️</span><span>配置</span></a>
  </div>

  <div class="card">
    <h2>{{month_str}} 练习报告</h2>
    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <div style="flex:1;text-align:center;padding:12px;background:#E8F5E9;border-radius:12px;">
        <div style="font-size:28px;font-weight:bold;color:#27AE60;">{{total_mins}}</div>
        <div style="font-size:13px;color:#7F8C8D;">总练习分钟</div>
      </div>
      <div style="flex:1;text-align:center;padding:12px;background:#FFF8E1;border-radius:12px;">
        <div style="font-size:28px;font-weight:bold;color:#F57C00;">{{practice_days}}</div>
        <div style="font-size:13px;color:#7F8C8D;">练习天数</div>
      </div>
    </div>
    <div style="margin-bottom:8px;color:#7F8C8D;">日</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:4px;font-size:13px;color:#7F8C8D;font-weight:bold;">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid">{{cal_html}}</div>

  <!-- Stage堆叠柱状图卡片 -->
  <div id="stageChartCard" class="card" style="display:none;margin-top:12px;">
    <h3 id="stageChartTitle" style="color:#4ECDC4;font-size:16px;margin-bottom:4px;"></h3>
    <div id="stageChartSub" style="font-size:12px;color:#999;margin-bottom:16px;"></div>
    <div id="stageChartWrap" style="position:relative;overflow-x:auto;"></div>
    <div id="stageChartLegend" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;"></div>
  </div>

    <div style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:#7F8C8D;flex-wrap:wrap;">
      <span style="width:16px;height:16px;background:#E8F5E9;border-radius:4px;display:inline-block;"></span> 少量
      <span style="width:16px;height:16px;background:#FFF8E1;border-radius:4px;display:inline-block;"></span> 中等
      <span style="width:16px;height:16px;background:#FFEBEE;border-radius:4px;display:inline-block;"></span> 充足
    </div>
  </div>

  <!-- 当天明细区域 -->
  <div id="dayDetail" class="card" style="display:none;margin-top:12px;">
    <h3 id="detailDate"></h3>
    <div id="detailBody"></div>
  </div>
</body>
<script>
document.addEventListener('DOMContentLoaded', function() {

  // ── Stage 堆叠柱状图渲染函数 ─────────────────────────────────────────
  var STAGE_COLORS = ['#4ECDC4','#FF6B6B','#45B7D1','#96CEB4','#F7DC6F','#BB8FCE','#F0A500','#76D7C4','#E74C3C','#3498DB'];

  function renderStageChart(stageData) {
    var dates = stageData.dates;
    var items = stageData.items;
    var data = stageData.data;

    var n = dates.length;
    var BAR_W = n <= 3 ? 72 : n <= 5 ? 52 : 40;
    var BAR_GAP = 20;
    var CHART_H = 200;
    var LABEL_W = 62;   // 左侧标签宽度
    var RIGHT_PAD = 10;
    var SVG_W = LABEL_W + n * BAR_W + (n - 1) * BAR_GAP + RIGHT_PAD;
    var SVG_H = CHART_H + 50;

    var weekdayNames = ['周日','周一','周二','周三','周四','周五','周六'];

    // 计算每天总时长和最大值
    var dailyTotals = {};
    dates.forEach(function(d) {
      var total = 0;
      items.forEach(function(it) {
        var v = data[d] && data[d][it.id];
        if (v !== null && v !== undefined) total += v;
      });
      dailyTotals[d] = total;
    });
    var maxTotal = Math.max(...Object.values(dailyTotals), 1);

    function minsToH(mins) { return Math.round((mins / maxTotal) * CHART_H); }
    function barX(i) { return LABEL_W + i * (BAR_W + BAR_GAP); }

    // 预计算每列堆叠
    var colStacks = {};
    dates.forEach(function(d) {
      colStacks[d] = [];
      var bottom = 0;
      items.forEach(function(it) {
        var raw = (data[d] && data[d][it.id] !== null && data[d][it.id] !== undefined) ? data[d][it.id] : null;
        var h = raw !== null ? minsToH(raw) : 0;
        colStacks[d].push({bottom: bottom, height: h, top: bottom + h, value: raw});
        bottom += h;
      });
    });

    // 昨天数据映射（用于tooltip对比）
    var prevData = {};
    if (dates.length > 1) {
      var prevDate = dates[dates.length - 2];
      items.forEach(function(it, ii) {
        prevData[it.id] = colStacks[prevDate] ? colStacks[prevDate][ii].value : null;
      });
    }

    var svg = '<svg width="' + SVG_W + '" height="' + SVG_H + '" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;font-family:sans-serif;">';

    // Y轴参考线
    [0.25, 0.5, 0.75, 1.0].forEach(function(r) {
      var y = Math.round(CHART_H * (1 - r));
      svg += '<line x1="0" y1="' + y + '" x2="' + SVG_W + '" y2="' + y + '" stroke="#F0F0F0" stroke-width="1"/>';
      svg += '<text x="3" y="' + (y - 3) + '" font-size="10" fill="#CCC">' + Math.round(maxTotal * r) + '分</text>';
    });

    // 连接线
    for (var ii = 0; ii < items.length; ii++) {
      for (var jj = 0; jj < dates.length - 1; jj++) {
        var d1 = dates[jj], d2 = dates[jj + 1];
        var s1 = colStacks[d1][ii], s2 = colStacks[d2][ii];
        if (s1.value === null || s2.value === null) continue;
        var x1 = barX(jj) + BAR_W;
        var x2 = barX(jj + 1);
        var col = s1.value <= s2.value ? '#34D399' : '#F87171';
        svg += '<line x1="' + x1 + '" y1="' + (CHART_H - s1.top) + '" x2="' + x2 + '" y2="' + (CHART_H - s2.top) + '" stroke="' + col + '" stroke-width="2" opacity="0.5"/>';
        svg += '<line x1="' + x1 + '" y1="' + (CHART_H - s1.bottom) + '" x2="' + x2 + '" y2="' + (CHART_H - s2.bottom) + '" stroke="' + col + '" stroke-width="1.5" opacity="0.35"/>';
      }
    }

    // 堆叠柱 + 悬停
    for (var jj = 0; jj < dates.length; jj++) {
      var d = dates[jj];
      var x = barX(jj);
      var stacks = colStacks[d];
      var isFuture = !data[d] || Object.values(data[d]).every(function(v){ return v === null; });
      var barOpacity = isFuture ? 0.2 : 1;

      for (var ii = 0; ii < stacks.length; ii++) {
        var s = stacks[ii];
        if (s.height === 0) continue;
        var col = STAGE_COLORS[ii % STAGE_COLORS.length];
        var y = CHART_H - s.top;
        svg += '<rect data-bar="1" data-date="' + d + '" data-itemid="' + items[ii].id + '" data-itemname="' + items[ii].name + '" data-value="' + (s.value !== null ? s.value : 0) + '" data-prev="' + (prevData[items[ii].id] !== undefined ? (prevData[items[ii].id] !== null ? prevData[items[ii].id] : 'null') : '') + '" x="' + x + '" y="' + y + '" width="' + BAR_W + '" height="' + s.height + '" fill="' + col + '" opacity="' + barOpacity + '" rx="3" style="cursor:pointer;transition:opacity 0.15s,filter 0.15s;"/>';
        // 数据标签
        if (s.value !== null && s.height > 18) {
          svg += '<text x="' + (x + BAR_W / 2) + '" y="' + (y + s.height / 2 + 4) + '" text-anchor="middle" font-size="11" fill="white" font-weight="600" style="pointer-events:none;">' + s.value + '</text>';
        }
      }

      // x轴
      var dtParts = d.split('-');
      var label = dtParts[1] + '/' + dtParts[2];
      var wd = weekdayNames[new Date(d + 'T00:00:00').getDay()];
      svg += '<text x="' + (x + BAR_W / 2) + '" y="' + (SVG_H - 6) + '" text-anchor="middle" font-size="11" fill="#888" font-weight="500">' + label + '</text>';
      svg += '<text x="' + (x + BAR_W / 2) + '" y="' + (SVG_H - 18) + '" text-anchor="middle" font-size="10" fill="#BBB">' + wd + '</text>';

      // 左侧总时长标签
      var total = dailyTotals[d] || 0;
      if (total > 0) {
        svg += '<text x="' + (LABEL_W - 4) + '" y="' + (CHART_H - minsToH(total) / 2 + 4) + '" text-anchor="end" font-size="10" fill="#888" font-weight="500" style="writing-mode:tb">' + total + '分</text>';
      }
    }

    svg += '</svg>';
    return {
      svg: svg,
      svgW: SVG_W,
      items: items.map(function(it, idx) { return {name: it.name, color: STAGE_COLORS[idx % STAGE_COLORS.length]}; })
    };
  }

  // ── 绑定柱状图悬停 ─────────────────────────────────────────
  function bindBarHover() {
    var tooltip = document.createElement('div');
    tooltip.className = 'bar-tooltip';
    tooltip.style.opacity = '0';
    document.body.appendChild(tooltip);

    document.querySelectorAll('[data-bar="1"]').forEach(function(rect) {
      rect.addEventListener('mouseenter', function() {
        var name = rect.getAttribute('data-itemname');
        var val = rect.getAttribute('data-value');
        var prev = rect.getAttribute('data-prev');
        var date = rect.getAttribute('data-date');

        var diffHtml = '';
        if (prev !== '' && prev !== 'null' && prev !== null) {
          var diff = parseInt(val) - parseInt(prev);
          if (diff > 0) diffHtml = '<div class="tt-diff up">↑ +' + diff + '分 vs昨日</div>';
          else if (diff < 0) diffHtml = '<div class="tt-diff down">↓ ' + diff + '分 vs昨日</div>';
          else diffHtml = '<div class="tt-diff" style="color:#AAA">＝ 持平昨日</div>';
        }
        tooltip.innerHTML = '<div class="tt-item"><strong>' + name + '</strong></div><div class="tt-item">' + val + '分钟</div>' + diffHtml;
        tooltip.style.opacity = '1';
        gsap.to(rect, { scaleY: 1.04, transformOrigin: 'bottom', duration: 0.15, ease: 'power2.out' });
      });
      rect.addEventListener('mousemove', function(e) {
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top = e.clientY + 'px';
      });
      rect.addEventListener('mouseleave', function() {
        tooltip.style.opacity = '0';
        gsap.to(rect, { scaleY: 1, duration: 0.2, ease: 'power2.out' });
      });

      // ── 点击弹出竹笛弹窗 ─────────────────────────────
      rect.addEventListener('click', function() {
        var date = rect.getAttribute('data-date');
        openDiziModal(date);
      });
    });
  }

  // ── Three.js 竹笛 3D 爆炸轴测图 ───────────────────────────────────
  var _diziScene = null;
  var _diziRenderer = null;
  var _diziAnimFrame = null;

  function disposeDizi3D() {
    if (_diziAnimFrame) { cancelAnimationFrame(_diziAnimFrame); _diziAnimFrame = null; }
    if (_diziRenderer) {
      _diziRenderer.dispose();
      _diziRenderer = null;
    }
    _diziScene = null;
    var canvas = document.getElementById('dizi3dcanvas');
    if (canvas) canvas._diziMeshes = null;
  }

  function renderDizi3D(items, totalMins) {
    disposeDizi3D();

    var canvas = document.getElementById('dizi3dcanvas');
    if (!canvas) return;

    var W = canvas.width, H = canvas.height;

    // Scene
    var scene = new THREE.Scene();
    _diziScene = scene;

    // Colors
    var STAGE_COLORS3 = ['#4ECDC4','#FF6B6B','#45B7D1','#96CEB4','#F7DC6F','#BB8FCE','#F0A500','#76D7C4','#E74C3C','#3498DB'];

    // ── Camera: orthographic for isometric ─────────────────────────
    var aspect = W / H;
    var frustSize = 3.2;
    var camera = new THREE.OrthographicCamera(
      -frustSize * aspect, frustSize * aspect,
       frustSize, -frustSize,
       0.1, 100
    );
    camera.position.set(5, 5, 5);
    camera.lookAt(0, 0, 0);

    // ── Renderer ────────────────────────────────────────────────────
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    _diziRenderer = renderer;

    // ── Lights ──────────────────────────────────────────────────────
    var ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);
    var dirLight = new THREE.DirectionalLight(0xffeedd, 0.85);
    dirLight.position.set(4, 6, 4);
    scene.add(dirLight);
    var fillLight = new THREE.DirectionalLight(0xddeeff, 0.3);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    // ── Compute segment lengths ─────────────────────────────────────
    var TOTAL_LEN = 6.0;
    var GAP = 0.18;
    var segLengths = items.map(function(it) {
      return Math.max(0.3, (it.minutes / totalMins) * TOTAL_LEN);
    });

    // ── Textures ───────────────────────────────────────────────────
    var crossTex = new THREE.TextureLoader().load('/static/dizi-cross-detail.png');
    crossTex.wrapS = THREE.ClampToEdgeWrapping;
    crossTex.wrapT = THREE.ClampToEdgeWrapping;

    // ── Build segments ─────────────────────────────────────────────
    var segMeshes = [];
    var xOffset = 0;

    // Center the whole dizi
    var totalExplodedLen = segLengths.reduce(function(a, b){ return a + b; }, 0)
                            + (items.length - 1) * GAP;
    var startX = -totalExplodedLen / 2;

    items.forEach(function(it, idx) {
      var segLen = segLengths[idx];
      var col = STAGE_COLORS3[idx % STAGE_COLORS3.length];
      var colInt = parseInt(col.replace('#',''), 16);
      var matColor = new THREE.Color(colInt);

      // Main cylinder body
      var cylGeo = new THREE.CylinderGeometry(0.28, 0.28, segLen, 24, 1, false);
      var cylMat = new THREE.MeshPhongMaterial({
        color: matColor,
        transparent: true,
        opacity: 0.80,
        shininess: 45,
        specular: 0x444444,
      });
      var cylMesh = new THREE.Mesh(cylGeo, cylMat);
      cylMesh.rotation.z = Math.PI / 2; // lay along X axis
      cylMesh.position.x = startX + xOffset + segLen / 2;
      cylMesh.userData.idx = idx;
      cylMesh.userData.it = it;
      scene.add(cylMesh);
      segMeshes.push(cylMesh);

      // End cross-section disk (right end, where next segment begins)
      // Slightly inset into the gap
      var diskGeo = new THREE.CircleGeometry(0.28, 24);
      var diskMat = new THREE.MeshBasicMaterial({
        map: crossTex,
        transparent: true,
        opacity: 0.92,
        side: THREE.DoubleSide,
      });
      var disk = new THREE.Mesh(diskGeo, diskMat);
      disk.position.x = startX + xOffset + segLen + GAP / 2;
      disk.rotation.y = Math.PI / 2; // face +X direction
      disk.userData.idx = idx;
      scene.add(disk);
      segMeshes.push(disk);

      xOffset += segLen + GAP;
    });

    // ── GSAP: animate from collapsed center outward ───────────────
    // Start all meshes compressed to center at scale 0
    segMeshes.forEach(function(mesh) {
      mesh.scale.set(0.01, 0.01, 0.01);
      mesh.position.y = 0;
    });

    // Expand outward
    var expandObjs = segMeshes.map(function(mesh) { return { mesh: mesh }; });
    gsap.to(expandObjs.map(function(o){ return o.mesh.scale; }), {
      x: 1, y: 1, z: 1,
      duration: 0.55,
      stagger: 0.09,
      ease: 'back.out(1.7)',
      delay: 0.1,
    });
    gsap.to(expandObjs.map(function(o){ return o.mesh.position; }), {
      y: 0,
      duration: 0.55,
      stagger: 0.09,
      ease: 'back.out(1.7)',
      delay: 0.1,
    });

    // ── Gentle idle rotation ───────────────────────────────────────
    var idleAngle = 0;
    function animate() {
      _diziAnimFrame = requestAnimationFrame(animate);
      idleAngle += 0.006;
      segMeshes.forEach(function(mesh) {
        mesh.rotation.y = idleAngle * 0.3;
      });
      renderer.render(scene, camera);
    }
    animate();

    // Store for close animation
    canvas._diziMeshes = segMeshes;
  }

  // ── 竹笛弹窗 ─────────────────────────────────────────────
  var diziModal = document.getElementById('diziModal');
  var diziModalContent = diziModal ? diziModal.querySelector('.modal-content') : null;

  function openDiziModal(date) {
    if (!diziModal) return;
    diziModal.style.display = 'flex';
    document.getElementById('diziModalDate').textContent = date;
    document.getElementById('diziModalTotal').textContent = '加载中...';

    // GSAP
    var mask = document.getElementById('diziModalMask');
    var content = document.getElementById('diziModalContent');
    gsap.fromTo(mask, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' });
    gsap.fromTo(content, { scale: 0.5, opacity: 0, y: 50 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: 'back.out(1.7)', delay: 0.05 });

    // 获取当天数据
    fetch('/api/practices/' + date).then(function(r){ return r.json(); }).then(function(data) {
      var total = data.total_minutes || 0;
      document.getElementById('diziModalTotal').textContent = '总练习 ' + total + ' 分钟';
      var items = data.items || [];
      if (items.length === 0 || total === 0) {
        document.getElementById('diziModalTotal').textContent = '总练习 0 分钟（当日无练习数据）';
        return;
      }
      renderDizi3D(items, total);
    }).catch(function() {
      document.getElementById('diziModalTotal').textContent = '加载失败';
    });
  }

  function closeDiziModal() {
    if (!diziModal) return;
    var content = document.getElementById('diziModalContent');
    var mask = document.getElementById('diziModalMask');

    // Shrink and fade the 3D meshes before closing
    var canvas = document.getElementById('dizi3dcanvas');
    if (canvas && canvas._diziMeshes) {
      var meshes = canvas._diziMeshes;
      gsap.to(meshes.map(function(m){ return m.scale; }), {
        x: 0.01, y: 0.01, z: 0.01,
        duration: 0.28,
        stagger: 0.05,
        ease: 'power2.in',
        onComplete: disposeDizi3D
      });
    } else {
      disposeDizi3D();
    }

    gsap.to(content, { scale: 0.6, opacity: 0, y: 30, duration: 0.3, ease: 'power2.in' });
    gsap.to(mask, { opacity: 0, duration: 0.25, delay: 0.05, onComplete: function() {
      diziModal.style.display = 'none';
      gsap.set(content, { clearProps: 'all' });
      gsap.set(mask, { clearProps: 'all' });
    }});
  }

  // 绑定关闭
  document.getElementById('diziModalClose').addEventListener('click', closeDiziModal);
  document.querySelector('#diziModal .modal-mask').addEventListener('click', closeDiziModal);

  // ── 练习轨迹渲染函数 ───────────────────────────────────────────────
  function renderTrail(behLog, dateStr) {
    if (!behLog || behLog.length === 0) return '';
    let html = '<div class="trail-section">';
    html += '<div class="trail-header">📍 练习轨迹</div>';
    behLog.forEach(function(entry) {
      const t = entry.enter_time || '';
      const timeStr = t ? t.split('T')[1].substring(0, 5) : '--:--';
      html += '<div class="trail-item">';
      html += '<span class="trail-time">' + timeStr + '</span>';
      html += '<span class="trail-item-tag">' + (entry.item || '未知') + '</span>';
      html += '<span class="trail-mins">' + (entry.minutes || 0) + '分钟</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ── 点击日历格子 ──────────────────────────────────────────────────
  document.querySelectorAll('.cal-day:not(.empty)').forEach(function(cell) {
    cell.style.cursor = 'pointer';
    cell.addEventListener('click', function() {

      // GSAP 格子动画
      var prev = document.querySelector('.cal-day.selected');
      document.querySelectorAll('.cal-day.selected').forEach(function(c){ c.classList.remove('selected'); });
      this.classList.add('selected');

      var oldBar = prev ? prev.querySelector('.sel-bar') : null;
      if (oldBar) {
        gsap.killTweensOf(oldBar);
        oldBar.style.transform = 'scaleY(0)';
      }
      var bar = this.querySelector('.sel-bar');
      if (bar) {
        gsap.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: 'back.out(2.2)' });
      }

      var date = this.getAttribute('data-date');
      if (!date) return;

      var detailDiv = document.getElementById('dayDetail');
      var detailBody = document.getElementById('detailBody');

      // 显示并 GSAP 滑入
      detailDiv.style.display = 'block';
      document.getElementById('detailDate').textContent = date;
      document.getElementById('detailDate').style.color = '#FF6B6B';
      detailBody.innerHTML = '<div style="text-align:center;color:#BDBDBD;padding:24px;">加载中...</div>';
      gsap.fromTo(detailDiv, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });

      var prevDate = new Date(date);
      prevDate.setDate(prevDate.getDate() - 1);
      var prevDateStr = prevDate.toISOString().split('T')[0];
      var isToday = (date === new Date().toISOString().split('T')[0]);

      Promise.all([
        fetch('/api/practices/' + date).then(function(r){ return r.json(); }),
        isToday ? Promise.resolve({items: [], total_minutes: 0, behavior_log: []})
                : fetch('/api/practices/' + prevDateStr).then(function(r){ return r.json(); })
      ]).then(function(results) {
        var data = results[0];
        var prevData = results[1];
        var prevItemsMap = {};
        (prevData.items || []).forEach(function(it){ prevItemsMap[it.item] = it.minutes; });

        // ── 今天无数据 ──────────────────────────────────────────
        if (isToday && (data.total_minutes === 0 || (Array.isArray(data.items) && data.items.length === 0))) {
          detailBody.innerHTML = '<div class="detail-empty">今天还没过完，明天来看</div>';
          return;
        }

        // ── 两天都没数据 ────────────────────────────────────────
        if ((data.total_minutes === 0 || (Array.isArray(data.items) && data.items.length === 0))
            && (prevData.total_minutes === 0 || (Array.isArray(prevData.items) && prevData.items.length === 0))) {
          detailBody.innerHTML = '<div class="detail-empty">这两天都没有练习记录</div>';
          return;
        }

        // ── 渲染当日明细（文字对比，无图表） ───────────────
        var totalDiff = data.total_minutes - prevData.total_minutes;
        var totalDiffStr = totalDiff > 0 ? '+' + totalDiff : String(totalDiff);
        var totalDiffColor = totalDiff > 0 ? '#27AE60' : totalDiff < 0 ? '#E74C3C' : '#999';
        var diffLabel = totalDiff > 0 ? '↑' : totalDiff < 0 ? '↓' : '＝';

        var detailHtml = '';
        detailHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EEE;margin-bottom:8px;">';
        detailHtml += '<span style="font-size:14px;color:#333;">总时长</span>';
        detailHtml += '<span style="font-size:14px;font-weight:bold;color:#333;">' + data.total_minutes + '分 <span style="font-size:12px;color:' + totalDiffColor + ';">' + diffLabel + ' ' + Math.abs(totalDiff) + '分</span></span>';
        detailHtml += '</div>';

        var trail = renderTrail(data.behavior_log || [], date);
        detailBody.innerHTML = detailHtml + trail;
        if (trail) gsap.fromTo('.trail-item', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.07, ease: 'power2.out' });

        // ── 加载并渲染 Stage 堆叠柱状图 ───────────────────
        fetch('/api/practices/stage/' + date).then(function(r){ return r.json(); }).then(function(stageData) {
          if (stageData.error) return;
          var chartCard = document.getElementById('stageChartCard');
          var result = renderStageChart(stageData);
          document.getElementById('stageChartTitle').textContent = '📊 ' + stageData.stage_start + ' ~ ' + stageData.stage_end + ' 周练习';
          document.getElementById('stageChartSub').textContent = '共 ' + stageData.dates.length + ' 天';
          document.getElementById('stageChartWrap').innerHTML = result.svg;
          document.getElementById('stageChartLegend').innerHTML = result.items.map(function(it) {
            return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#555;background:#F5F5F5;padding:3px 8px;border-radius:12px;"><span style="width:9px;height:9px;border-radius:2px;background:' + it.color + ';display:inline-block;"></span>' + it.name + '</span>';
          }).join('');
          chartCard.style.display = 'block';
          gsap.fromTo(chartCard, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' });
          bindBarHover();
        }).catch(function(){});
      }).catch(function() {
        detailBody.innerHTML = '<div class="detail-empty">加载失败</div>';
      });
    });
  });

  // 页面整体弹入
  document.querySelectorAll('.card').forEach(function(card) {
    gsap.fromTo(card, { opacity: 0, scale: 0.82, y: 28 }, { opacity: 1, scale: 1, y: 0, duration: 0.65, ease: 'back.out(2)', delay: 0.05 });
  });
});
</script>
<div id="diziModal">
  <div class="modal-mask" id="diziModalMask"></div>
  <div class="modal-content" id="diziModalContent">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="diziModalDate"></div>
        <div class="modal-total" id="diziModalTotal"></div>
      </div>
      <button class="modal-close" id="diziModalClose">×</button>
    </div>
    <div id="diziExploded"><canvas id="dizi3dcanvas" width="700" height="120"></canvas></div>
    <div class="modal-footer">点击遮罩或 × 关闭</div>
  </div>
</div>
</div><!-- .page-content -->
</body>
</html>
