<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密码 — dizical</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFF5F5 0%, #FFE5E5 100%);
      min-height: 100vh; margin: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .pw-card {
      background: white;
      border-radius: 16px;
      padding: 40px 36px;
      width: 420px; max-width: 90vw;
      box-shadow: 0 8px 32px rgba(255,107,107,0.12), 0 2px 8px rgba(0,0,0,0.04);
    }
    .pw-title { font-size: 22px; font-weight: 600; color: #2C3E50; text-align: center; margin: 0 0 8px 0; }
    .pw-sub { font-size: 13px; color: #888; text-align: center; margin: 0 0 24px 0; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .form-input {
      width: 100%; padding: 11px 14px;
      font-size: 15px; font-family: inherit;
      border: 1.5px solid #E5E5E5; border-radius: 8px;
      box-sizing: border-box;
      transition: border-color 180ms ease;
    }
    .form-input:focus { outline: none; border-color: #FF6B6B; }
    .pw-btn {
      width: 100%; padding: 12px;
      background: #FF6B6B; color: white;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: background 180ms ease, transform 100ms ease;
      margin-top: 8px;
    }
    .pw-btn:hover:not(:disabled) { background: #FF5252; }
    .pw-btn:active:not(:disabled) { transform: scale(0.98); }
    .pw-btn:disabled { background: #FFB3B3; cursor: not-allowed; }
    .pw-error {
      background: #FFF0F0; color: #D32F2F;
      padding: 10px 14px; border-radius: 6px;
      font-size: 13px; margin-bottom: 14px; display: none;
    }
    .pw-error.show { display: block; }
    .pw-hint { text-align: center; margin-top: 18px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="pw-card">
    <h1 class="pw-title">修改密码</h1>
    <p class="pw-sub">首次登录请修改密码. 新密码至少 6 位.</p>
    <div id="pwError" class="pw-error"></div>
    <form id="pwForm">
      <input type="hidden" id="user_id" value="{{ user_id }}">
      <div class="form-group">
        <label class="form-label" for="old_password">旧密码</label>
        <input class="form-input" id="old_password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="new_password">新密码</label>
        <input class="form-input" id="new_password" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">确认新密码</label>
        <input class="form-input" id="confirm_password" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="pw-btn" id="pwBtn">确认修改</button>
    </form>
    <p class="pw-hint">改完密码后会自动登录.</p>
  </div>

  <script>
    const REDIRECT = (new URLSearchParams(location.search).get('redirect') || '/').replace(/[<>"']/g, '');

    function showError(msg) {
      const el = document.getElementById('pwError');
      el.textContent = msg; el.classList.add('show');
    }

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const oldP = document.getElementById('old_password').value;
      const newP = document.getElementById('new_password').value;
      const conf = document.getElementById('confirm_password').value;
      if (newP !== conf) { showError('两次输入的新密码不一致'); return; }
      if (newP.length < 6) { showError('新密码至少 6 位'); return; }
      const btn = document.getElementById('pwBtn');
      btn.disabled = true; btn.textContent = '修改中...';
      try {
        const r = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            user_id: parseInt(document.getElementById('user_id').value),
            old_password: oldP,
            new_password: newP,
          }),
        });
        const data = await r.json();
        if (!data.ok) { showError(data.error || '修改失败'); return; }
        // 改完跳回登录 (让用户用新密码重新登录, 必须走完整流程)
        // 也可以直接跳 REDIRECT — 选直接跳
        location.href = REDIRECT;
      } catch (err) {
        showError('网络错: ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = '确认修改';
      }
    });
  </script>
</body>
</html>
