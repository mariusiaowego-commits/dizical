<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 — dizical</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFE5E0 100%);
      min-height: 100vh; margin: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px 36px;
      width: 420px; max-width: 90vw;
      box-shadow: 0 8px 32px rgba(220,53,69,0.12), 0 2px 8px rgba(0,0,0,0.04);
      border-top: 4px solid #DC3545;
    }
    .role-badge {
      display: inline-block;
      background: #DC3545; color: white;
      padding: 4px 12px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .login-title { font-size: 22px; font-weight: 600; color: #2C3E50; margin: 0 0 6px 0; }
    .login-sub { font-size: 13px; color: #888; margin: 0 0 24px 0; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .form-input {
      width: 100%; padding: 11px 14px;
      font-size: 15px; font-family: inherit;
      border: 1.5px solid #E5E5E5; border-radius: 8px;
      box-sizing: border-box;
      transition: border-color 180ms ease;
    }
    .form-input:focus { outline: none; border-color: #DC3545; }
    .login-btn {
      width: 100%; padding: 12px;
      background: #DC3545; color: white;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: background 180ms ease, transform 100ms ease;
      margin-top: 8px;
    }
    .login-btn:hover:not(:disabled) { background: #C82333; }
    .login-btn:active:not(:disabled) { transform: scale(0.98); }
    .login-btn:disabled { background: #E89AA0; cursor: not-allowed; }
    .login-error {
      background: #FFF0F0; color: #DC3545;
      padding: 10px 14px; border-radius: 6px;
      font-size: 13px; margin-bottom: 14px; display: none;
      border-left: 3px solid #DC3545;
    }
    .login-error.show { display: block; }
    .login-info {
      background: #F0F8FF; color: #0C5460;
      padding: 10px 14px; border-radius: 6px;
      font-size: 12px; margin: 14px 0 0 0;
      border-left: 3px solid #17A2B8;
    }
    .login-info strong { color: #0C5460; }
    .login-hint {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #F0F0F0;
      font-size: 12px; color: #888; text-align: center;
    }
    .login-hint a { color: #FF6B6B; text-decoration: none; }
    .login-hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="role-badge">管理员登录</div>
    <h1 class="login-title">dizical 管理员</h1>
    <p class="login-sub">仅 root 用户可访问账号管理后台</p>

    <div id="err" class="login-error"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input class="form-input" id="username" type="text" required minlength="2" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input class="form-input" id="password" type="password" required minlength="8" autocomplete="current-password">
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:6px;">
        <input id="remember" type="checkbox" checked>
        <label for="remember" style="font-size:13px; color:#555; cursor:pointer;">记住 30 天</label>
      </div>
      <button type="submit" class="login-btn" id="submitBtn">登录</button>
    </form>

    <div class="login-info">
      <strong>提示:</strong> 初始密码见服务启动日志 <code>/tmp/dizical-8765.log</code>,
      或 <code>python3 src/migrate_add_web_users.py</code> 输出. 首次登录后必须改密.
    </div>

    <div class="login-hint">
      普通用户? <a href="/login">点此登录</a><br>
      忘了密码? <a href="/admin/reset-password">用 PIN 应急重置</a>
    </div>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById('err');
      el.textContent = msg; el.classList.add('show');
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password, remember}),
        });
        const data = await r.json();
        if (!data.ok) {
          // 显示锁定/账号错
          const http = r.status;
          if (http === 423) {
            showError('账号锁定: ' + (data.error || '5 分钟后再试'));
          } else {
            showError(data.error || '登录失败 (' + http + ')');
          }
          btn.disabled = false; btn.textContent = '登录';
          return;
        }
        // 校验是不是 dad role
        if (data.user.role !== 'dad') {
          showError(`该账号 (${data.user.role}) 不是管理员, 请用管理员账号登录`);
          // 自动登出
          await fetch('/api/auth/logout', {method: 'POST'});
          btn.disabled = false; btn.textContent = '登录';
          return;
        }
        // 强制改密?
        if (data.user.must_change_password) {
          location.href = `/change-password?user_id=${data.user.user_id}&redirect=/config/users`;
          return;
        }
        // 直接进后台
        location.href = '/config/users';
      } catch (err) {
        showError('网络错: ' + err.message);
        btn.disabled = false; btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
