<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% include "_favicon.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应急重置密码 — dizical</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFE5E0 100%);
      min-height: 100vh; margin: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .reset-card {
      background: white; border-radius: 16px;
      padding: 40px 32px;
      width: 420px; max-width: calc(100vw - 32px);
      box-sizing: border-box;
      box-shadow: 0 8px 32px rgba(220,53,69,0.12), 0 2px 8px rgba(0,0,0,0.04);
      border-top: 4px solid #DC3545;
    }
    .role-badge {
      display: inline-block;
      background: #DC3545; color: white;
      padding: 4px 12px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .reset-title { font-size: 22px; font-weight: 600; color: #2C3E50; margin: 0 0 6px 0; }
    .reset-sub { font-size: 13px; color: #888; margin: 0 0 24px 0; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .form-input {
      width: 100%; padding: 11px 14px;
      font-size: 15px; font-family: inherit;
      border: 1.5px solid #E5E5E5; border-radius: 8px;
      box-sizing: border-box;
      transition: border-color 180ms ease;
    }
    .form-input:focus { outline: none; border-color: #DC3545; }
    .form-input.code { letter-spacing: 6px; text-align: center; font-size: 18px; }
    .reset-btn {
      width: 100%; padding: 12px;
      background: #DC3545; color: white;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: background 180ms ease, transform 100ms ease;
      margin-top: 8px;
    }
    .reset-btn:hover:not(:disabled) { background: #C82333; }
    .reset-btn:active:not(:disabled) { transform: scale(0.98); }
    .reset-btn:disabled { background: #E89AA0; cursor: not-allowed; }
    .reset-error {
      background: #FFF0F0; color: #DC3545;
      padding: 10px 14px; border-radius: 6px;
      font-size: 13px; margin-bottom: 14px; display: none;
      border-left: 3px solid #DC3545;
    }
    .reset-error.show { display: block; }
    .reset-info {
      background: #FFF5F5; color: #555;
      padding: 10px 14px; border-radius: 6px;
      font-size: 12px; margin: 14px 0 0 0;
      border-left: 3px solid #DC3545;
      box-sizing: border-box; max-width: 100%;
    }
    .reset-hint {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #F0F0F0;
      font-size: 12px; color: #888; text-align: center;
    }
    .reset-hint a { color: #DC3545; text-decoration: none; }
    .reset-hint a:hover { text-decoration: underline; }
    .pw-display {
      background: #F8F8F8; border: 2px dashed #FF6B6B;
      padding: 16px; border-radius: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 18px; text-align: center;
      letter-spacing: 2px;
      margin: 16px 0;
      word-break: break-all;
      display: none;
    }
    .pw-display.show { display: block; }
    .pw-actions { display: flex; gap: 10px; justify-content: center; display: none; }
    .pw-actions.show { display: flex; }
    .mini-btn {
      padding: 8px 18px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      font-family: inherit;
    }
    .mini-btn-primary { background: #DC3545; color: white; }
    .mini-btn-secondary { background: #F0F0F0; color: #555; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="role-badge">应急重置</div>
    <h1 class="reset-title">dad 密码忘了?</h1>
    <p class="reset-sub">用 PIN=0905 应急重置 dad 账号密码</p>

    <div id="err" class="reset-error"></div>

    <form id="resetForm">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input class="form-input" id="username" type="text" value="dad"
               required minlength="2" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="pin">管理员 PIN</label>
        <input class="form-input code" id="pin" type="password"
               required minlength="4" maxlength="8" inputmode="numeric"
               autocomplete="off" placeholder="****">
      </div>
      <button type="submit" class="reset-btn" id="submitBtn">重置密码</button>
    </form>

    <div class="pw-display" id="pwDisplay"></div>
    <div class="pw-actions" id="pwActions">
      <button type="button" class="mini-btn mini-btn-secondary" id="copyBtn">复制</button>
      <button type="button" class="mini-btn mini-btn-primary" id="loginBtn">用新密码登录</button>
    </div>

    <div class="reset-info">
      <strong>用途:</strong> 只有忘了 dad 密码 / 启动日志找不到时才用. 知道密码的 dad
      请直接去 <a href="/admin-login" style="color:#DC3545;">管理员登录</a>.
    </div>

    <div class="reset-hint">
      普通用户? <a href="/login">点此登录</a>
    </div>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById('err');
      el.textContent = msg; el.classList.add('show');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const pin = document.getElementById('pin').value;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = '重置中...';
      try {
        const r = await fetch('/api/admin/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, pin}),
        });
        const data = await r.json();
        if (!data.ok) {
          showError(data.error || '重置失败 (' + r.status + ')');
          btn.disabled = false; btn.textContent = '重置密码';
          return;
        }
        // 显示新密码
        document.getElementById('pwDisplay').textContent = data.new_password;
        document.getElementById('pwDisplay').classList.add('show');
        document.getElementById('pwActions').classList.add('show');
        btn.textContent = '已重置 ✓';
      } catch (err) {
        showError('网络错: ' + err.message);
        btn.disabled = false; btn.textContent = '重置密码';
      }
    });

    // Sprint v3.3.4 修: navigator.clipboard 在 http://10.x:8765 静默拒绝.
    // 加 try/catch + execCommand fallback + alert 失败.
    document.getElementById('copyBtn').addEventListener('click', async () => {
      const pw = document.getElementById('pwDisplay').textContent;
      const b = document.getElementById('copyBtn');
      const t = b.textContent;
      const showOk = () => {
        b.textContent = '已复制 ✓';
        setTimeout(() => { b.textContent = t; }, 1200);
      };
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = pw;
        ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select();
        try {
          const success = document.execCommand('copy');
          if (success) showOk();
          else alert('自动复制失败, 请手动复制:\n\n' + pw);
        } catch (e) {
          alert('自动复制失败, 请手动复制:\n\n' + pw);
        } finally {
          document.body.removeChild(ta);
        }
      };
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(pw);
          showOk();
        } catch (e) {
          fallback();
        }
      } else {
        fallback();
      }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      // 跳 admin-login 页面 (让 dad 手动输新密码)
      window.location.href = '/admin-login';
    });
  </script>
</body>
</html>
