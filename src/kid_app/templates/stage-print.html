<!DOCTYPE html>
<html lang="zh">
<head>
{% include "_favicon.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage 练习明细 · 打印</title>
  <style>
    :root {
      --ink: #2c2416;
      --muted: #7a6a5a;
      --line: #e8dcc8;
      --paper: #fffef9;
      --accent: #c45c26;
      --gold: #8b6914;
      --card: #faf6ee;
      --paper-table-w: 420mm;
      --col-item-min: 22mm;
      --col-short-min: 8mm;
      --col-tempo-min: 12mm;
      --col-detail-min: 18mm;
      --col-detail-max: 32mm;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "PingFang SC", serif;
      color: var(--ink);
      background: #e8e4dc;
    }

    /* ── 屏上工具条 (打印隐藏) ── */
    .toolbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: rgba(255,253,248,0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }
    .toolbar label { font-size: 13px; color: var(--muted); }
    .toolbar select {
      min-width: 220px; max-width: 360px;
      padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: #fff;
      font-size: 13px; color: var(--ink);
    }
    .toolbar button, .toolbar a.btn {
      appearance: none; border: none; cursor: pointer;
      padding: 7px 14px; border-radius: 8px;
      font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-print { background: var(--accent); color: #fff; font-weight: 600; }
    .btn-image { background: #4ecdc4; color: #fff; font-weight: 600; }
    .btn-image:disabled { background: #b0d8d4; cursor: wait; opacity: 0.7; }
    .btn-back { background: #ede8e0; color: var(--ink); }
    .btn-ghost {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; color: var(--ink);
    }
    .btn-ghost:hover { background: #f5f0e8; }
    .btn-apply {
      appearance: none; border: none; background: #3d2e1e; color: #fffef9;
      border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-apply:hover { background: #5c4a36; }
    .toolbar .hint { font-size: 12px; color: var(--muted); margin-left: auto; }
    .status { font-size: 12px; color: var(--muted); }

    /* 练习日勾选条 */
    .day-filter {
      display: none;
      flex-wrap: wrap; align-items: center; gap: 8px 10px;
      padding: 8px 16px 10px;
      background: #faf6ee;
      border-bottom: 1px solid var(--line);
    }
    .day-filter.visible { display: flex; }
    .day-filter .df-label {
      font-size: 12px; font-weight: 600; color: #8b6914; flex-shrink: 0;
    }
    .day-filter .df-checks {
      display: flex; flex-wrap: wrap; gap: 6px 10px; flex: 1; min-width: 0;
    }
    .day-filter .df-item {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; color: var(--ink);
      background: #fff; border: 1px solid var(--line);
      border-radius: 14px; padding: 3px 10px 3px 6px;
      cursor: pointer; user-select: none;
    }
    .day-filter .df-item:hover { border-color: #c9a030; }
    .day-filter .df-item input { margin: 0; accent-color: #c45c26; }
    .day-filter .df-item .df-mins { color: var(--muted); font-size: 11px; }
    .day-filter .df-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .day-filter .df-hint { font-size: 11px; color: var(--muted); width: 100%; }
    /* 视图切换: 分组 / 表格 */
    .view-toggle {
      display: inline-flex; border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; background: #fff;
    }
    .view-toggle button {
      appearance: none; border: none; background: transparent; cursor: pointer;
      padding: 6px 12px; font-size: 12px; color: var(--muted);
      border-right: 1px solid var(--line);
    }
    .view-toggle button:last-child { border-right: none; }
    .view-toggle button.active {
      background: #3d2e1e; color: #fffef9; font-weight: 600;
    }
    .view-toggle button:hover:not(.active) { background: #f5f0e8; }

    /* ── 纸张预览：屏上 100% 可读，可增高滚动；缩放仅打印 ── */
    .stage-wrap {
      padding: 18px 12px 40px;
      display: flex; justify-content: center;
    }
    .paper-scale {
      transform: none !important; /* 屏上禁止 scale，避免小纸片 */
      transform-origin: top center;
    }
    .paper {
      width: 210mm;
      min-height: 297mm;
      max-height: none; /* 屏上允许长于 A4，滚动查看 */
      overflow: visible;
      background: var(--paper);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 8mm 9mm 10mm;
      position: relative;
      zoom: 1 !important; /* 屏上禁止 zoom 压缩 */
    }
    /* 表格视图: A3 横向几何 (padding/min-height). 屏上宽度见 @media screen; 打印见 @media print. */
    .paper.is-table.is-landscape {
      min-height: 297mm;
      max-height: none;  /* sprint 26080103 v2: 不限制, 屏上可滚 */
      padding: 4mm 5mm 4mm;
      box-sizing: border-box;
      overflow: visible;
    }

    /* ── 内容紧凑排版 (A4 单页) ── */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1.5px solid var(--ink); padding-bottom: 3mm; margin-bottom: 2.5mm;
      gap: 8px;
    }
    .ph-title { font-size: 13pt; font-weight: 700; letter-spacing: 0.5px; line-height: 1.2; }
    .ph-sub { font-size: 8pt; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    .ph-stats {
      text-align: right; font-size: 8pt; color: var(--ink); line-height: 1.4;
      white-space: nowrap;
    }
    .ph-stats strong { font-size: 11pt; color: var(--accent); }

    .assign-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2mm 2.5mm;
      margin-bottom: 2.5mm;
    }
    .assign-card h2 {
      margin: 0 0 1.5mm; font-size: 8.5pt; color: var(--gold);
      font-weight: 700; letter-spacing: 0.3px;
    }
    .assign-item {
      margin-bottom: 1.2mm; padding-bottom: 1.2mm;
      border-bottom: 1px dashed #e5d9c4;
      font-size: 7.5pt; line-height: 1.35;
      break-inside: avoid;
    }
    .assign-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .ai-name { font-weight: 700; color: var(--ink); }
    .ai-metro { color: var(--gold); margin-left: 4px; font-weight: 600; }
    .ai-req { color: #4a3f32; white-space: pre-wrap; margin-top: 0.5mm; }

    .overview {
      display: flex; flex-wrap: wrap; gap: 1.5mm 3mm;
      margin-bottom: 2mm; font-size: 7pt; color: var(--muted);
    }
    .overview .ov {
      background: #f3efe6; border-radius: 3px; padding: 0.6mm 1.5mm;
    }
    .overview .ov b { color: var(--ink); font-weight: 600; }
    .days { font-size: 9.5pt; }  /* sprint 26080103: iPad mini 上从 7.2pt 提 */
    .day-block {
      margin-bottom: 1.8mm;
      break-inside: avoid;
    }
    .day-head {
      display: flex; justify-content: space-between; align-items: baseline;
      background: #3d2e1e; color: #fffef9;
      padding: 0.8mm 1.8mm; border-radius: 2px;
      font-size: 9.5pt; font-weight: 600;
      margin-bottom: 0.8mm;
    }
    .day-head .dh-meta { font-weight: 400; opacity: 0.9; font-size: 8.5pt; }

    .item-block { margin: 0 0 1mm 0.5mm; }
    .item-head {
      font-weight: 700; font-size: 9.2pt; color: var(--ink);
      border-left: 2px solid var(--accent); padding-left: 1.5mm;
      margin-bottom: 0.4mm;
    }
    .item-head span { font-weight: 500; color: var(--muted); margin-left: 3px; }

    table.sess {
      width: 100%; border-collapse: collapse;
      font-size: 8.8pt;  /* sprint 26080103: 从 6.8pt 提 */
    }
    table.sess th {
      text-align: left; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--line); padding: 0.6mm 1.2mm;
      font-size: 8pt;
    }
    table.sess td {
      padding: 0.8mm 1.2mm; vertical-align: top;
      border-bottom: 1px dotted #efe6d6;
      line-height: 1.4;
    }
    table.sess .c-time { min-width: 12mm; white-space: nowrap; color: var(--muted); }
    table.sess .c-mins { min-width: 8mm; white-space: nowrap; font-weight: 600; text-align: right; }
    table.sess .c-tempo { min-width: 14mm; white-space: nowrap; color: var(--gold); font-weight: 600; }
    table.sess .c-extra {
      width: 10mm; text-align: center;
    }
    .tag-extra {
      display: inline-block; font-size: 6pt; padding: 0 1.2mm;
      border: 1px solid var(--accent); color: var(--accent); border-radius: 2px;
    }
    .empty-content { color: #b0a090; font-style: italic; }

    /* ── 表格视图 · A4 横向 · 科目×日期矩阵 · 撑满至页脚 ── */
    .paper.is-table.is-landscape {
      display: flex;
      flex-direction: column;
    }
    .paper.is-table .table-chrome {
      flex: 0 0 auto;
      margin-bottom: 1mm;
    }
    .paper.is-table .view-table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .paper.is-table .view-table-wrap table.matrix {
      flex: 1 1 auto;
      height: 100%;
    }
    .paper.is-table .pf {
      flex: 0 0 auto;
      margin-top: auto;
      font-size: 5.5pt;
    }
    .paper.is-table .ph {
      padding-bottom: 1mm; margin-bottom: 1mm;
    }
    .paper.is-table .ph-title { font-size: 9pt; }
    .paper.is-table .ph-sub { font-size: 6pt; }
    .paper.is-table .ph-stats { font-size: 6.5pt; }
    .paper.is-table .ph-stats strong { font-size: 9pt; }

    /* 老师要求：多列紧凑铺开，全文显示、不截断 */
    .paper.is-table .assign-card {
      padding: 1mm 1.8mm;
      margin-bottom: 0.8mm;
      max-height: none;
      overflow: visible;
    }
    .paper.is-table .assign-card h2 {
      font-size: 6.5pt; margin: 0 0 0.8mm; line-height: 1.15;
    }
    .paper.is-table .assign-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8mm 2mm;
    }
    .paper.is-table .assign-grid .assign-item {
      font-size: 6.2pt;
      margin: 0;
      padding: 0.6mm 0.8mm;
      border: 1px solid #efe6d6;
      border-radius: 2px;
      background: #fffef9;
      line-height: 1.25;
      max-height: none;
      overflow: visible;
    }
    .paper.is-table .assign-grid .assign-item .ai-name {
      font-size: 6.5pt;
    }
    .paper.is-table .assign-grid .assign-item .ai-req {
      margin-top: 0.4mm;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: visible;
      /* 取消 line-clamp，全文可见 */
      display: block;
      -webkit-line-clamp: unset;
    }
    .paper.is-table .overview {
      font-size: 5.5pt; margin-bottom: 0.6mm; gap: 0.5mm 1.2mm;
    }

    .view-table-wrap { margin-top: 0; overflow-x: auto; }
    .view-table-wrap:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    table.matrix {
      width: 100%; border-collapse: collapse;
      font-size: 11pt; /* sprint 26080103: iPad mini 横屏主表可读字号 (从 8pt) */
      table-layout: auto;  /* sprint 26080103: 取消 fixed, 改自适应, min-width 保底 */
    }
    table.matrix thead th {
      background: #3d2e1e; color: #fffef9;
      font-weight: 600; text-align: center;
      border: 0.25pt solid #2a2015;
      padding: 1mm 0.5mm;
      line-height: 1.2;
    }
    table.matrix thead th.th-item {
      background: #2a2015; min-width: var(--col-item-min); font-size: 11pt;
    }
    table.matrix thead th.th-day {
      font-size: 11pt; letter-spacing: 0.15px;
      border-left: 1pt solid #c9a030;
    }
    table.matrix thead th.th-sub {
      background: #5c4a36; font-size: 8.5pt; font-weight: 500;
      padding: 0.6mm 0.3mm;
    }
    table.matrix thead th.th-sub.th-first { border-left: 1pt solid #c9a030; }
    table.matrix thead th.th-sub.th-detail { font-size: 9pt; }
    table.matrix tbody td {
      border: 0.25pt solid #e0d4c0;
      padding: 0.8mm 0.5mm;
      vertical-align: middle;
      text-align: center;
      line-height: 1.25;
      word-break: break-word;
    }
    table.matrix tbody tr { min-height: 8mm; }  /* sprint 26080103: 触摸友好行高 */
    table.matrix tbody tr:nth-child(even) td:not(.m-item) { background: #faf6ee; }
    table.matrix td.m-item {
      background: #f5f0e6; font-weight: 700; font-size: 11pt;
      text-align: center; min-width: var(--col-item-min);
      border-right: 1pt solid #c9a030;
      word-break: break-all; padding: 0.7mm 0.5mm;
    }
    table.matrix td.m-total {
      font-weight: 700; color: var(--accent); white-space: nowrap;
      border-left: 1pt solid #c9a030; background: #fff8f0;
      font-size: 8pt; min-width: var(--col-short-min); max-width: 10mm;  /* sprint-26080802: 9.5pt → 8pt 防 iPad Safari 速度列文字溢出 */
      text-align: center !important; vertical-align: middle !important;
      padding: 0.5mm 0;
    }
    table.matrix td.m-tempo {
      color: var(--gold); font-weight: 600; white-space: nowrap;
      font-size: 8pt; min-width: var(--col-tempo-min);  /* sprint-26080802: 9pt → 8pt */
      overflow-wrap: anywhere;  /* sprint-26080802: 防 ♩=60-112 速度字符串溢出列 */
      text-align: center !important; vertical-align: middle !important;
      padding: 0.5mm 0.3mm;
    }
    table.matrix td.m-once {
      font-weight: 700; white-space: nowrap;
      font-size: 8pt; min-width: var(--col-short-min); max-width: 10mm;  /* sprint-26080802: 9.5pt → 8pt */
      text-align: center !important; vertical-align: middle !important;
      padding: 0.5mm 0;
    }
    table.matrix td.m-detail {
      text-align: left; padding: 0.8mm 1.2mm;
      font-size: 9pt; overflow-wrap: anywhere; min-width: var(--col-detail-min); max-width: var(--col-detail-max);  /* v2: 设上限, 文字换行不跨列 */
    }
    table.matrix td.m-empty { background: #f7f5f0; color: #ccc; }
    table.matrix .det-extra {
      display: inline-block; font-size: 7pt; margin-left: 1px;
      padding: 0 0.8mm; border: 1px solid var(--accent); color: var(--accent); border-radius: 1px;
    }
    table.matrix tfoot td {
      background: #f3efe6; font-weight: 700; font-size: 9pt;
      border: 0.25pt solid #e0d4c0; padding: 0.7mm 0.5mm;
      text-align: center;
    }
    table.matrix tfoot td.m-item { background: #ebe4d6; font-size: 9pt; }
    table.matrix tfoot td.m-summary {
      text-align: left; padding: 0.8mm 1.2mm;
      font-weight: 600; font-size: 9pt; line-height: 1.4;
    }
    table.matrix tfoot td.m-summary .sum-item {
      display: inline-block; margin-right: 2mm; white-space: nowrap;
    }
    /* 天数少时字号略放大, 适配更宽明细 */
    table.matrix.days-1,
    table.matrix.days-2 { font-size: 12pt; }
    table.matrix.days-1 thead th.th-day,
    table.matrix.days-2 thead th.th-day,
    table.matrix.days-1 td.m-item,
    table.matrix.days-2 td.m-item,
    table.matrix.days-1 td.m-detail,
    table.matrix.days-2 td.m-detail { font-size: 12pt; }
    table.matrix.days-1 td.m-total,
    table.matrix.days-2 td.m-total,
    table.matrix.days-1 td.m-tempo,
    table.matrix.days-2 td.m-tempo,
    table.matrix.days-1 td.m-once,
    table.matrix.days-2 td.m-once { font-size: 9.5pt; }  /* sprint-26080802: 10.5pt → 9.5pt (主表 11pt, 短列 9.5pt 已足) */

    .pf {
      margin-top: 1.5mm;
      font-size: 5.5pt; color: #a89880;
      display: flex; justify-content: space-between;
      border-top: 1px solid var(--line); padding-top: 0.6mm;
    }

    .loading, .err {
      padding: 40px; text-align: center; color: var(--muted); font-size: 14px;
    }
    .err { color: #b23a48; }

    /* ── 屏上响应式 (不泄漏到 print): fluid paper + sticky 科目 + 横滑 ── */
    @media screen {
      .stage-wrap {
        overflow-x: auto;
        justify-content: safe center;
      }
      /* paper-scale 默认 shrink-to-fit; 表格视图必须自己占满视口, 否则 paper width:100% 相对不定宽父级算不成 */
      .paper-scale.is-table,
      .paper-scale:has(> .paper.is-table) {
        width: 100%;
        max-width: var(--paper-table-w);
        min-width: 0;
      }
      .paper.is-table.is-landscape {
        width: 100%;
        max-width: var(--paper-table-w);
        min-width: 0;
        display: block;  /* 覆盖 L236 display:flex */
      }
      .paper.is-table .view-table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      table.matrix thead th.th-item,
      table.matrix td.m-item,
      table.matrix tfoot td.m-item {
        position: sticky;
        left: 0;
        z-index: 2;
        box-shadow: 1px 0 0 #c9a030;  /* 替代 border-collapse 丢失的右边框 (P2: 整数像素避免 1x 屏抗锯齿毛刺) */
      }
      table.matrix thead th.th-item { z-index: 3; }
    }

    /* iPad 768-1180: 合并原两段 1180 块, 必须在所有 .paper.is-table.is-landscape 之后. */
    @media (max-width: 1180px) {
      .paper.is-table.is-landscape {
        width: 100% !important;
        min-width: 0 !important;
        padding: 8px 4px !important;
        display: block !important;  /* 屏上禁用 flex column, 让表格自然撑 */
      }
      .paper.is-table .view-table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      .stage-wrap { padding: 0 !important; }
      .paper { box-shadow: none !important; }
    }

    @media screen and (max-width: 768px) {
      :root {
        --col-item-min: 20mm;  /* 原 16mm → 20mm */
        --col-detail-min: 14mm;
        --col-detail-max: 28mm;
      }
      .paper.is-table .assign-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      /* P1: view=group 在手机端也要自适应，避免 210mm 撑爆 390px 视区 */
      .paper {
        width: 100% !important;
        max-width: 100% !important;
        padding: 6mm 4mm !important;
        box-shadow: none !important;
      }
      /* group view 手机端: 卡片网格 2 列 + 紧凑排版 */
      .paper:not(.is-table) .assign-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 2mm 3mm;
      }
      .paper:not(.is-table) .assign-card {
        padding: 1.5mm 2mm;
        margin-bottom: 2mm;
      }
      .paper:not(.is-table) .assign-card h2 {
        font-size: 7.5pt;
      }
      .paper:not(.is-table) .assign-item {
        font-size: 7pt;
        padding: 0.5mm 0.6mm;
      }
      .paper:not(.is-table) .day-block {
        margin-bottom: 1.2mm;
      }
    }

    /* iPad 768-1180: group view 3 列 */
    @media screen and (min-width: 769px) and (max-width: 1180px) {
      .paper:not(.is-table) .assign-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 1mm 1.5mm;
      }
    }

    /* ── 打印：可多页（A4 横向/竖向均可），sprint 26080103 不再强制单页 ── */
    @media print {
      html, body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        height: auto;
      }
      .no-print,
      .toolbar,
      .day-filter { display: none !important; }
      .stage-wrap {
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }
      .paper-scale {
        transform: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .paper {
        box-shadow: none !important;
        margin: 0 auto !important;
        width: 100% !important;
        zoom: var(--print-zoom, 1) !important;
      }
      .paper:not(.is-landscape) {
        max-width: 210mm !important;
        min-height: 297mm;
        padding: 5mm 6mm !important;
        overflow: visible !important;
      }
      .paper.is-landscape {
        max-width: 420mm !important;  /* sprint 26080103 v2: A3 横向; sprint-26080801: 改 max-width 防 iPad Safari 越界 */
        min-height: 297mm;
        padding: 3.5mm 4.5mm !important;
        overflow: visible !important;
      }
      /* sprint-26080801: 矩阵打印上下文锁列宽, 防 flex 压; 屏上仍 table-layout: auto */
      table.matrix {
        table-layout: fixed !important;
        width: 100% !important;
      }
      /* thead 在多页重复; 行不跨页; tfoot 不被孤立到新页 */
      table.matrix thead { display: table-header-group !important; }
      table.matrix tbody tr { break-inside: avoid !important; page-break-inside: avoid !important; }
      table.matrix tfoot { display: table-row-group !important; break-before: avoid !important; page-break-before: avoid !important; }
    }
  </style>
  <style id="printPageRule">@page { size: A4 portrait; margin: 0; }</style>  <!-- sprint 26080103 v2: 表格视图走 A3 横向 (JS 动态改) -->
</head>
<body>
  <div class="toolbar no-print">
    <a class="btn btn-back" href="/report">← 报告</a>
    <label for="stageSelect">阶段</label>
    <select id="stageSelect" aria-label="选择 Stage"></select>
    <div class="view-toggle" role="group" aria-label="展示样式">
      <button type="button" id="viewGroup" class="active" data-view="group">分组</button>
      <button type="button" id="viewTable" data-view="table">表格</button>
    </div>
    <button type="button" class="btn btn-image" id="btnImage">导出图片</button>
    <button type="button" class="btn btn-print" id="btnPrint">打印 / PDF</button>
    <span class="hint">A4 · 勾选练习日 → 确认展示</span>
    <span class="status" id="statusMsg"></span>
  </div>

  <!-- 选 stage 后：勾选要展示的练习日 -->
  <div class="day-filter no-print" id="dayFilter" aria-label="选择练习日">
    <span class="df-label">练习日</span>
    <div class="df-checks" id="dayChecks"></div>
    <div class="df-actions">
      <button type="button" class="btn-ghost" id="daySelectAll">全选</button>
      <button type="button" class="btn-ghost" id="daySelectNone">清空</button>
      <button type="button" class="btn-apply" id="dayApply">确认展示</button>
    </div>
    <div class="df-hint" id="dayFilterHint">勾选要出现在表格中的日期，点「确认展示」刷新</div>
  </div>

  <div class="stage-wrap">
    <div class="paper-scale" id="paperScale">
      <div class="paper" id="paper">
        <div class="loading" id="bootMsg">加载中…</div>
      </div>
    </div>
  </div>

<script>
(function () {
  var stageSelect = document.getElementById('stageSelect');
  var paper = document.getElementById('paper');
  var paperScale = document.getElementById('paperScale');
  var statusMsg = document.getElementById('statusMsg');
  var stagesCache = [];
  var lastPayload = null;       // 全量 stage 数据
  var draftDays = {};           // 勾选草稿 date -> true
  var appliedDays = null;       // 已确认展示的日期 Set；null=尚未确认用全选

  function qsInit(name) {
    try {
      return new URL(window.location.href).searchParams.get(name);
    } catch (e) { return null; }
  }

  // view: group | table  默认分组；URL ?view= 与 localStorage 可记
  var viewMode = (function () {
    var fromUrl = qsInit('view');
    if (fromUrl === 'table' || fromUrl === 'group') return fromUrl;
    try {
      var ls = localStorage.getItem('stage-print-view');
      if (ls === 'table' || ls === 'group') return ls;
    } catch (e) {}
    return 'group';
  })();

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtCnDate(iso) {
    if (!iso || iso.length < 10) return iso || '';
    var p = iso.substring(0, 10).split('-');
    return parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
  }

  function fmtTime(startedAt) {
    if (!startedAt) return '—';
    var s = String(startedAt);
    var sep = s.indexOf('T') >= 0 ? 'T' : ' ';
    var parts = s.split(sep);
    if (parts.length < 2) return '—';
    return parts[1].substring(0, 5);
  }

  function qs(name) {
    var u = new URL(window.location.href);
    return u.searchParams.get(name);
  }

  function parseDaysParam() {
    var raw = qsInit('days');
    if (!raw) return null;
    var set = {};
    raw.split(',').forEach(function (d) {
      d = d.trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) set[d] = true;
    });
    return Object.keys(set).length ? set : null;
  }

  function setQuery(stageOrder, view, daysMap) {
    var u = new URL(window.location.href);
    if (stageOrder != null && stageOrder !== '') {
      u.searchParams.set('stage_order', stageOrder);
      u.searchParams.delete('date');
    }
    if (view) u.searchParams.set('view', view);
    if (daysMap && Object.keys(daysMap).length) {
      var keys = Object.keys(daysMap).filter(function (k) { return daysMap[k]; }).sort();
      if (keys.length) u.searchParams.set('days', keys.join(','));
      else u.searchParams.delete('days');
    }
    history.replaceState(null, '', u.pathname + u.search);
  }

  /** 从全量 payload 按已确认日期过滤，并重算 summary / by_item */
  function filterPayloadByDays(data, daysMap) {
    if (!data) return data;
    var allDays = data.days || [];
    if (!daysMap) {
      // null = 全部
      return data;
    }
    var filtered = allDays.filter(function (d) { return daysMap[d.date]; });
    var total = 0;
    var sessN = 0;
    var itemMap = {};
    filtered.forEach(function (day) {
      total += day.total_minutes || 0;
      sessN += day.session_count || 0;
      (day.groups || []).forEach(function (g) {
        var id = g.item_id;
        if (id == null) return;
        if (!itemMap[id]) {
          itemMap[id] = { item_id: id, item_name: g.item_name, minutes: 0, session_count: 0 };
        }
        itemMap[id].minutes += g.minutes || 0;
        itemMap[id].session_count += (g.sessions || []).length;
        if (g.item_name) itemMap[id].item_name = g.item_name;
      });
    });
    var byItem = Object.keys(itemMap).map(function (k) { return itemMap[k]; });
    byItem.sort(function (a, b) { return b.minutes - a.minutes; });
    return {
      ok: data.ok,
      stage_order: data.stage_order,
      lesson_date: data.lesson_date,
      stage_start: data.stage_start,
      stage_end: data.stage_end,
      effective_end: data.effective_end,
      notes: data.notes,
      assignment_items: data.assignment_items || [],
      summary: {
        total_minutes: total,
        practice_days: filtered.length,
        session_count: sessN,
        item_count: byItem.length
      },
      by_item: byItem,
      days: filtered
    };
  }

  function availableDayList(data) {
    return (data && data.days ? data.days : []).map(function (d) {
      return { date: d.date, total_minutes: d.total_minutes || 0, session_count: d.session_count || 0 };
    });
  }

  function renderDayPicker(data) {
    var panel = document.getElementById('dayFilter');
    var box = document.getElementById('dayChecks');
    var hint = document.getElementById('dayFilterHint');
    if (!panel || !box) return;
    var list = availableDayList(data);
    if (!list.length) {
      panel.classList.remove('visible');
      box.innerHTML = '';
      return;
    }
    panel.classList.add('visible');
    // 初始化草稿：优先已确认 / URL / 全选
    if (!Object.keys(draftDays).length) {
      if (appliedDays) {
        draftDays = Object.assign({}, appliedDays);
      } else {
        list.forEach(function (d) { draftDays[d.date] = true; });
      }
    }
    box.innerHTML = '';
    list.forEach(function (d) {
      var lab = document.createElement('label');
      lab.className = 'df-item';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = d.date;
      cb.checked = !!draftDays[d.date];
      cb.addEventListener('change', function () {
        draftDays[d.date] = cb.checked;
        updateDayFilterHint();
      });
      lab.appendChild(cb);
      var t = document.createElement('span');
      t.textContent = fmtCnDate(d.date);
      lab.appendChild(t);
      var m = document.createElement('span');
      m.className = 'df-mins';
      m.textContent = d.total_minutes + '′';
      lab.appendChild(m);
      box.appendChild(lab);
    });
    updateDayFilterHint();
  }

  function updateDayFilterHint() {
    var hint = document.getElementById('dayFilterHint');
    if (!hint || !lastPayload) return;
    var list = availableDayList(lastPayload);
    var n = 0;
    list.forEach(function (d) { if (draftDays[d.date]) n++; });
    var appliedN = 0;
    if (appliedDays) {
      list.forEach(function (d) { if (appliedDays[d.date]) appliedN++; });
    } else {
      appliedN = list.length;
    }
    hint.textContent = '已勾选 ' + n + '/' + list.length + ' 天 · 当前展示 ' + appliedN + ' 天 · 改勾选后点「确认展示」';
  }

  function applyDaySelection() {
    if (!lastPayload) return;
    var list = availableDayList(lastPayload);
    var map = {};
    var n = 0;
    list.forEach(function (d) {
      if (draftDays[d.date]) {
        map[d.date] = true;
        n++;
      }
    });
    if (n === 0) {
      statusMsg.textContent = '请至少勾选一天';
      statusMsg.style.color = '#b23a48';
      return;
    }
    statusMsg.style.color = '';
    appliedDays = map;
    var order = stageSelect.value || lastPayload.stage_order;
    setQuery(order, viewMode, appliedDays);
    try {
      localStorage.setItem('stage-print-days-' + order, Object.keys(map).join(','));
    } catch (e) {}
    renderPayload(lastPayload);
    updateDayFilterHint();
  }

  function syncViewToggle() {
    var g = document.getElementById('viewGroup');
    var t = document.getElementById('viewTable');
    if (g) g.classList.toggle('active', viewMode === 'group');
    if (t) t.classList.toggle('active', viewMode === 'table');
  }

  /** 分组=竖向；表格=横向矩阵 */
  function syncPaperMode() {
    var isTable = viewMode === 'table';
    paper.classList.toggle('is-table', isTable);
    paper.classList.toggle('is-landscape', isTable);
    /* P2: :has() fallback — 给 paperScale 同步 is-table class，低版本内核也能命中 .paper-scale.is-table */
    if (paperScale) paperScale.classList.toggle('is-table', isTable);
    var rule = document.getElementById('printPageRule');
    if (rule) {
      rule.textContent = isTable
        ? '@page { size: A3 landscape; margin: 0; }'  /* sprint 26080103 v2: A3 横向装 7 天 */
        : '@page { size: A4 portrait; margin: 0; }';
    }
    var hint = document.querySelector('.toolbar .hint');
    if (hint) {
      hint.textContent = isTable
        ? '表格 · A3 横向 · 屏上可横滑 · 打印按内容自动分页'  /* sprint-26080801: 不再"打印一页约 X%"误导 */
        : '分组 · 可切换表格';  /* sprint-26080802: 删 "A4 竖向" 冗余 */
    }
  }

  function a3PageHeightPx() {
    // sprint 26080103 v2: 表格视图 A3 横向 297mm, 分组视图 A4 竖向 297mm
    var mm = viewMode === 'table' ? 297 : 297;
    return Math.round(mm * (96 / 25.4));
  }

  function updatePreviewStatus() {
    paper.style.setProperty('--print-zoom', '1');
    paperScale.style.transform = '';
    var a3px = a3PageHeightPx();  /* sprint 26080103 v2: A3 横向 */
    var contentH = paper.scrollHeight;
    var modeLabel = viewMode === 'table' ? '表格·横向' : '分组·竖向';
    var nDays = (lastPayload && appliedDays)
      ? Object.keys(appliedDays).filter(function (k) { return appliedDays[k]; }).length
      : ((lastPayload && lastPayload.days) ? lastPayload.days.length : 0);
    var overflow = paper.scrollWidth > (paper.clientWidth + 4);  /* sprint-26080801: 屏上溢出判断 */
    if (overflow) {
      statusMsg.textContent = modeLabel + ' · 已选 ' + nDays + ' 天 · 屏上可横滑 · 打印按内容自动分页';
    } else if (contentH > a3px + 8) {
      var pct = Math.max(40, Math.min(100, Math.round((a3px / contentH) * 100)));
      statusMsg.textContent = modeLabel + ' · 预览 100%（可滚动）· 打印一页约 ' + pct + '%';
    } else {
      statusMsg.textContent = modeLabel + ' · 预览 100% · 已在一页内';
    }
  }

  /** 页眉：无老师要求模块；分组视图保留科目小计 chips */
  function renderHeader(data) {
    var sum = data.summary || {};
    /* PDF 内容标题保留中文 (sprint-26080804 round 3: 只改 document.title 为日期格式, 内容标题恢复中文) */
    var title = '竹笛练习明细 · Stage ' + (data.stage_order != null ? data.stage_order : '—');
    /* sprint-26080802: 删 styleLabel 死代码 + 删 ph-sub 周期/上课日/截止/styleLabel 拼入 */
    var isTable = viewMode === 'table';
    var html = '';
    if (isTable) html += '<div class="table-chrome">';

    html += '<div class="ph">';
    html += '<div>';
    html += '<div class="ph-title">' + esc(title) + '</div>';
    /* sprint-26080802: 删 ph-sub "周期 X ~ Y · 上课日 · 截止 · styleLabel" 冗余 */
    if (data.notes) {
      html += '<div class="ph-sub">备注：' + esc(data.notes) + '</div>';
    }
    html += '</div>';
    html += '<div class="ph-stats">';
    html += '<div><strong>' + esc(sum.total_minutes || 0) + '</strong> 分钟</div>';
    html += '<div>' + esc(sum.practice_days || 0) + ' 天 · ' + esc(sum.session_count || 0) + ' 次 · ' + esc(sum.item_count || 0) + ' 科</div>';
    html += '</div></div>';

    // 分组视图保留科目小计；表格视图靠表内数据
    var byItem = data.by_item || [];
    if (byItem.length && !isTable) {
      html += '<div class="overview">';
      byItem.forEach(function (it) {
        var pct = sum.total_minutes ? Math.round(it.minutes / sum.total_minutes * 100) : 0;
        html += '<span class="ov"><b>' + esc(it.item_name) + '</b> ' + esc(it.minutes) + '′/' + esc(it.session_count) + '次 ' + pct + '%</span>';
      });
      html += '</div>';
    }

    if (isTable) html += '</div>'; // .table-chrome
    return html;
  }

  /** 分组视图：日 → 科目 → session（原样式） */
  function renderBodyGroup(data) {
    var html = '<div class="days">';
    var days = data.days || [];
    if (!days.length) {
      html += '<div class="err" style="padding:12px;">本阶段暂无练习明细 (session)</div>';
    }
    days.forEach(function (day) {
      html += '<div class="day-block">';
      html += '<div class="day-head"><span>' + esc(fmtCnDate(day.date)) + ' · ' + esc(day.date) + '</span>';
      html += '<span class="dh-meta">' + esc(day.total_minutes) + ' 分钟 · ' + esc(day.session_count) + ' 次</span></div>';
      (day.groups || []).forEach(function (g) {
        html += '<div class="item-block">';
        html += '<div class="item-head">' + esc(g.item_name) + '<span>' + esc(g.minutes) + ' 分钟 · ' + esc((g.sessions || []).length) + ' 次</span></div>';
        html += '<table class="sess"><thead><tr>';
        html += '<th class="c-time">时间</th><th class="c-mins">时长</th><th class="c-tempo">速度</th><th>内容</th><th class="c-extra"></th>';
        html += '</tr></thead><tbody>';
        (g.sessions || []).forEach(function (s) {
          var tempo = s.tempo_bpm ? ((s.tempo_note || '') + '=' + s.tempo_bpm) : '—';
          var content = s.content ? esc(s.content) : '<span class="empty-content">（未填写）</span>';
          html += '<tr>';
          html += '<td class="c-time">' + esc(fmtTime(s.started_at)) + '</td>';
          html += '<td class="c-mins">' + esc(s.duration_minutes) + '′</td>';
          html += '<td class="c-tempo">' + esc(tempo) + '</td>';
          html += '<td>' + content + '</td>';
          html += '<td class="c-extra">' + (s.is_extra ? '<span class="tag-extra">额外</span>' : '') + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  /**
   * 表格视图：A4 横向矩阵
   * 行 = 科目；列组 = 每个日期 × (总时长 | 速度 | 单次 | 明细)  — 无 session 列
   * 短列极窄，明细吃宽；同科同日多 session 多行
   */
  function renderBodyTable(data) {
    var sum = data.summary || {};
    var days = data.days || [];
    var html = '<div class="view-table-wrap" tabindex="0" role="region" aria-label="练习明细矩阵表">';
    if (!days.length) {
      html += '<div class="err" style="padding:12px;">本阶段暂无练习明细 (session)</div>';
      html += '</div>';
      return html;
    }

    var itemOrder = [];
    var itemNames = {};
    var itemTotals = {}; // 全阶段每科合计，供小结
    (data.by_item || []).forEach(function (it) {
      var id = it.item_id;
      if (id == null) return;
      if (itemOrder.indexOf(id) < 0) itemOrder.push(id);
      itemNames[id] = it.item_name || ('科目' + id);
      itemTotals[id] = it.minutes || 0;
    });
    days.forEach(function (day) {
      (day.groups || []).forEach(function (g) {
        var id = g.item_id;
        if (id == null) return;
        if (itemOrder.indexOf(id) < 0) itemOrder.push(id);
        itemNames[id] = g.item_name || itemNames[id] || ('科目' + id);
        if (itemTotals[id] == null) itemTotals[id] = 0;
      });
    });

    var grid = {};
    var dateList = [];
    days.forEach(function (day) {
      var d = day.date;
      dateList.push(d);
      grid[d] = {};
      (day.groups || []).forEach(function (g) {
        grid[d][g.item_id] = {
          minutes: g.minutes || 0,
          sessions: (g.sessions && g.sessions.length) ? g.sessions.slice() : []
        };
      });
    });

    var nDays = dateList.length;
    var COLS_PER_DAY = 4; // 总时长 速度 单次 明细
    var subLabels = ['总时长', '速度', '单次', '明细'];
    // 按展示天数自适应：天越少，短列可略宽、明细更宽
    var itemW = nDays <= 2 ? 10 : nDays <= 4 ? 8 : 7;
    var shortW = nDays <= 1 ? 5 : nDays <= 2 ? 4 : nDays <= 4 ? 3 : nDays <= 6 ? 2.8 : 2.4;  /* sprint-26080801: 6 天时短列 2% → 2.8%, iPad viewport 1133px 上 ≈ 32px ≈ 8mm */
    var tempoW = shortW + 0.5;
    html += '<table class="matrix days-' + nDays + '"><colgroup>';
    html += '<col style="width:' + itemW + '%">';
    dateList.forEach(function () {
      html += '<col style="width:' + shortW + '%">';
      html += '<col style="width:' + tempoW + '%">';
      html += '<col style="width:' + shortW + '%">';
      html += '<col>'; // 明细
    });
    html += '</colgroup>';

    html += '<thead><tr>';
    html += '<th class="th-item" rowspan="2">科目</th>';
    dateList.forEach(function (d) {
      html += '<th class="th-day" colspan="' + COLS_PER_DAY + '">' + esc(fmtCnDate(d)) + '</th>';
    });
    html += '</tr><tr>';
    dateList.forEach(function () {
      subLabels.forEach(function (lab, i) {
        var cls = 'th-sub' + (i === 0 ? ' th-first' : '') + (i === 3 ? ' th-detail' : '');
        html += '<th class="' + cls + '">' + lab + '</th>';
      });
    });
    html += '</tr></thead><tbody>';

    if (!itemOrder.length) {
      html += '<tr><td colspan="' + (1 + nDays * COLS_PER_DAY) + '" class="empty-content">无科目</td></tr>';
    }

    itemOrder.forEach(function (itemId) {
      var maxS = 1;
      dateList.forEach(function (d) {
        var cell = grid[d][itemId];
        var n = cell && cell.sessions ? cell.sessions.length : 0;
        if (n > maxS) maxS = n;
      });
      if (maxS < 1) maxS = 1;

      for (var ri = 0; ri < maxS; ri++) {
        html += '<tr>';
        if (ri === 0) {
          html += '<td class="m-item" rowspan="' + maxS + '">' + esc(itemNames[itemId] || itemId) + '</td>';
        }
        dateList.forEach(function (d) {
          var cell = grid[d][itemId];
          var sess = (cell && cell.sessions) ? cell.sessions : [];
          var total = cell ? cell.minutes : 0;

          if (!cell || (!sess.length && !total)) {
            if (ri === 0) {
              html += '<td class="m-total m-empty" rowspan="' + maxS + '">—</td>';
              html += '<td class="m-empty" rowspan="' + maxS + '" colspan="3"></td>';
            }
            return;
          }

          if (sess.length === 0) {
            if (ri === 0) {
              html += '<td class="m-total" rowspan="' + maxS + '">' + esc(total) + '′</td>';
              html += '<td class="m-tempo">—</td>';
              html += '<td class="m-once">—</td>';
              html += '<td class="m-detail empty-content">—</td>';
            } else {
              html += '<td class="m-empty" colspan="3"></td>';
            }
            return;
          }

          var daySessN = sess.length;
          if (ri === 0) {
            html += '<td class="m-total" rowspan="' + maxS + '">' + esc(total) + '′</td>';
          }
          if (ri < daySessN) {
            var s = sess[ri];
            var tempo = s.tempo_bpm ? ((s.tempo_note || '') + '=' + s.tempo_bpm) : '—';
            var content = s.content ? esc(s.content) : '<span class="empty-content">（未填写）</span>';
            html += '<td class="m-tempo">' + esc(tempo) + '</td>';
            html += '<td class="m-once">' + esc(s.duration_minutes || 0) + '′</td>';
            html += '<td class="m-detail">' + content;
            if (s.is_extra) html += '<span class="det-extra">额外</span>';
            html += '</td>';
          } else {
            html += '<td class="m-empty"></td><td class="m-empty"></td><td class="m-empty"></td>';
          }
        });
        html += '</tr>';
      }
    });

    // 日合计：只显示总练习时长
    html += '</tbody><tfoot><tr>';
    html += '<td class="m-item">日合计</td>';
    dateList.forEach(function (d) {
      var dayObj = null;
      for (var i = 0; i < days.length; i++) {
        if (days[i].date === d) { dayObj = days[i]; break; }
      }
      var t = dayObj ? dayObj.total_minutes : 0;
      html += '<td class="m-total" colspan="' + COLS_PER_DAY + '">' + esc(t) + '′</td>';
    });
    html += '</tr>';

    // 小结：本周练习 x 天 总时长 xxx 分 每科 xx分(xx%) …
    var grand = sum.total_minutes || 0;
    var dayN = sum.practice_days || 0;
    var parts = [];
    itemOrder.forEach(function (id) {
      var m = itemTotals[id] || 0;
      if (m <= 0) return;
      var pct = grand ? Math.round(m / grand * 100) : 0;
      parts.push(esc(itemNames[id]) + m + '分(' + pct + '%)');
    });
    html += '<tr>';
    html += '<td class="m-item">小结</td>';
    html += '<td class="m-summary" colspan="' + (nDays * COLS_PER_DAY) + '">';
    html += '本周练习' + esc(dayN) + '天　总时长' + esc(grand) + '分';
    if (parts.length) {
      html += '　';
      parts.forEach(function (p) {
        html += '<span class="sum-item">' + p + '</span>';
      });
    }
    html += '</td></tr></tfoot></table></div>';
    return html;
  }

  function renderPayload(data) {
    lastPayload = data;
    // 展示用：按已确认日期过滤
    var viewData = filterPayloadByDays(data, appliedDays);
    var nShow = (viewData.days || []).length;
    var nAll = (data.days || []).length;

    /* sprint-26080804 round 3: document.title 用日期范围 (YYMMDD-YYMMDD), 不用 Stage 序号.
       iOS Safari 打印文件名源 = document.title, 全 - 连接无空格无中文. */
    function toYYMMDD(s) {
      if (!s) return '000000';
      var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[1].slice(2) + m[2] + m[3];
      return String(s).replace(/[^0-9]/g, '').slice(0, 6);
    }
    var title = 'Dizical-Practice-Detail-' + toYYMMDD(data.stage_start) + '-' + toYYMMDD(data.stage_end);
    document.title = title + (viewMode === 'table' ? '-Table' : '-Grouped') + (nShow < nAll ? '-' + nShow + 'days' : '');

    /* sprint-26080802: 删生成时间 + styleLabel 冗余, pf 块只保留数据源标识 */
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var gen = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
      + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

    syncPaperMode();
    var html = renderHeader(viewData);
    if (viewMode === 'table') {
      if (!nShow) {
        html += '<div class="err" style="padding:20px;">未选择练习日，请在上方勾选后点「确认展示」</div>';
      } else {
        html += renderBodyTable(viewData);
      }
    } else {
      html += nShow ? renderBodyGroup(viewData) : '<div class="err" style="padding:20px;">未选择练习日</div>';
    }
    /* sprint-26080802: pf 块只保留 "数据: practice_sessions · 展示 N/M 天", 删生成时间 + styleLabel */
    html += '<div class="pf"><span>数据: practice_sessions · 展示 ' + esc(nShow) + '/' + esc(nAll) + ' 天</span></div>';

    paper.innerHTML = html;
    syncViewToggle();
    if (viewMode === 'table' && nShow) {
      requestAnimationFrame(function () {
        fillMatrixToPaper();
        updatePreviewStatus();
        bindKeyboardA11y();
      });
    } else {
      updatePreviewStatus();
    }
  }

  /** 屏上: 矩阵可撑高, 不强制 fit. 打印前由 fillMatrixForPrint 处理. */
  function fillMatrixToPaper() {
    if (viewMode !== 'table') return;
    var wrap = paper.querySelector('.view-table-wrap');
    var table = paper.querySelector('table.matrix');
    if (!wrap || !table) return;
    // sprint 26080103: 不再 paper.style.height=210mm, 让纸自然撑高
    paper.style.height = '';
    paper.style.maxHeight = '';
    paper.style.minHeight = '';
    paper.style.overflow = 'visible';
    wrap.style.height = '';
    wrap.style.maxHeight = '';
    wrap.style.overflow = '';  /* CSS @media screen 管 overflow-x:auto; 不写 visible 以免盖掉横滑 */
    wrap.style.flex = '';
    table.style.height = '';
    table.style.maxHeight = '';
    table.style.minHeight = '';
    // 行高清空, 改由 CSS min-height 8mm 控制
    var rows = table.querySelectorAll('tbody tr');
    rows.forEach(function (r) { r.style.height = ''; r.style.minHeight = '8mm'; });
  }

  /** 键盘无障碍：← → 横滑 + Home/End 跳端点 + aria-live 提示 */
  function bindKeyboardA11y() {
    if (viewMode !== 'table') return;
    var wrap = paper.querySelector('.view-table-wrap');
    if (!wrap) return;
    wrap.addEventListener('keydown', function(e) {
      var step = 200;
      if (e.key === 'ArrowRight') { wrap.scrollLeft += step; e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { wrap.scrollLeft -= step; e.preventDefault(); }
      else if (e.key === 'Home') { wrap.scrollLeft = 0; e.preventDefault(); }
      else if (e.key === 'End') { wrap.scrollLeft = wrap.scrollWidth; e.preventDefault(); }
    });
    var live = document.createElement('div');
    live.setAttribute('aria-live', 'polite');
    live.className = 'sr-only';
    live.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);';
    wrap.appendChild(live);
    wrap.addEventListener('scroll', function() {
      var first = wrap.querySelector('td.m-item');
      if (first) live.textContent = first.textContent.trim() + ' · 练习科目列';
    });
  }

  /** 打印前: 不缩放, 让浏览器自然分页 (Q2=A 多页). */
  function fillMatrixForPrint() {
    if (viewMode !== 'table') return;
    // 确保行不被强制高
    var rows = paper.querySelectorAll('table.matrix tbody tr');
    rows.forEach(function (r) { r.style.height = ''; r.style.minHeight = '8mm'; });
  }

  function setViewMode(mode) {
    if (mode !== 'group' && mode !== 'table') return;
    viewMode = mode;
    try { localStorage.setItem('stage-print-view', mode); } catch (e) {}
    var order = stageSelect.value || (lastPayload && lastPayload.stage_order);
    setQuery(order, viewMode, appliedDays);
    syncPaperMode();
    syncViewToggle();
    if (lastPayload) renderPayload(lastPayload);
  }

  /** 加载 stage 后初始化日期勾选（URL / localStorage / 全选） */
  function initDaysForPayload(data) {
    draftDays = {};
    appliedDays = null;
    var list = availableDayList(data);
    var fromUrl = parseDaysParam();
    var fromLs = null;
    try {
      var raw = localStorage.getItem('stage-print-days-' + data.stage_order);
      if (raw) {
        fromLs = {};
        raw.split(',').forEach(function (d) {
          d = d.trim();
          if (d) fromLs[d] = true;
        });
      }
    } catch (e) {}
    var seed = fromUrl || fromLs;
    var valid = {};
    list.forEach(function (d) {
      if (seed && seed[d.date]) valid[d.date] = true;
    });
    if (Object.keys(valid).length) {
      appliedDays = valid;
      draftDays = Object.assign({}, valid);
    } else {
      list.forEach(function (d) { draftDays[d.date] = true; });
      appliedDays = Object.assign({}, draftDays);
    }
    renderDayPicker(data);
  }

  /**
   * 打印前: 按 A4/A3 尺寸缩放 (sprint-26080801: floor 0.95 防 iPad Safari zoom 压内容, 不到溢出 1 页就不缩).
   */
  function preparePrintZoom() {
    var isLs = viewMode === 'table';
    // sprint 26080103 v2: 表格视图 A3 横向 420x297mm, 分组视图 A4 竖向 210x297mm
    var targetH = Math.round((isLs ? 297 : 297) * (96 / 25.4) * 0.98);
    var targetW = Math.round((isLs ? 420 : 210) * (96 / 25.4) * 0.98);
    var contentH = Math.max(paper.scrollHeight, paper.offsetHeight);
    var contentW = Math.max(paper.scrollWidth, paper.offsetWidth);
    var scale = 1;
    if (contentH > targetH) scale = Math.min(scale, targetH / contentH);
    if (contentW > targetW) scale = Math.min(scale, targetW / contentW);
    // sprint-26080801: floor 改 0.95 (从 0.65 / 0.70 改), iPad Safari 上 zoom 压到 65% 内容不可读
    var floor = 0.95;
    if (scale < floor) scale = floor;
    if (scale > 1) scale = 1;
    paper.style.setProperty('--print-zoom', String(scale.toFixed(4)));
    return scale;
  }

  function loadStagesThenDetail() {
    return fetch('/api/practices/stages', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        stagesCache = (res && res.stages) || [];
        stageSelect.innerHTML = '';
        if (!stagesCache.length) {
          stageSelect.innerHTML = '<option value="">无 stage 数据</option>';
          return;
        }
        stagesCache.forEach(function (s) {
          var opt = document.createElement('option');
          opt.value = String(s.stage_order);
          var label = 'Stage ' + s.stage_order + ' · ' + (s.stage_start || '') + ' ~ ' + (s.stage_end || '…');
          if (s.lesson_date) label += ' (课 ' + s.lesson_date + ')';
          opt.textContent = label;
          stageSelect.appendChild(opt);
        });
      });
  }

  function loadDetail(params) {
    statusMsg.textContent = '';
    paper.innerHTML = '<div class="loading">加载明细…</div>';
    var q = new URLSearchParams();
    if (params.stage_order != null && params.stage_order !== '') {
      q.set('stage_order', params.stage_order);
    } else if (params.date) {
      q.set('date', params.date);
    }
    return fetch('/api/practices/stage-detail?' + q.toString(), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) {
          paper.innerHTML = '<div class="err">' + esc((res.j && res.j.error) || '加载失败') + '</div>';
          return;
        }
        if (res.j.stage_order != null) {
          stageSelect.value = String(res.j.stage_order);
        }
        initDaysForPayload(res.j);
        setQuery(res.j.stage_order, viewMode, appliedDays);
        renderPayload(res.j);
      })
      .catch(function () {
        paper.innerHTML = '<div class="err">网络错误</div>';
      });
  }

  stageSelect.addEventListener('change', function () {
    var v = stageSelect.value;
    // 换 stage 清草稿，避免串日
    draftDays = {};
    appliedDays = null;
    if (v) loadDetail({ stage_order: v });
  });

  document.getElementById('viewGroup').addEventListener('click', function () {
    setViewMode('group');
  });
  document.getElementById('viewTable').addEventListener('click', function () {
    setViewMode('table');
  });

  document.getElementById('daySelectAll').addEventListener('click', function () {
    if (!lastPayload) return;
    availableDayList(lastPayload).forEach(function (d) { draftDays[d.date] = true; });
    renderDayPicker(lastPayload);
  });
  document.getElementById('daySelectNone').addEventListener('click', function () {
    if (!lastPayload) return;
    availableDayList(lastPayload).forEach(function (d) { draftDays[d.date] = false; });
    renderDayPicker(lastPayload);
  });
  document.getElementById('dayApply').addEventListener('click', function () {
    applyDaySelection();
  });

  syncViewToggle();
  syncPaperMode();

  document.getElementById('btnPrint').addEventListener('click', function () {
    syncPaperMode();
    // sprint 26080103: 打印前 fillMatrixForPrint (不清行高, 让浏览器自然分页)
    if (viewMode === 'table') fillMatrixForPrint();
    var scale = preparePrintZoom();
    statusMsg.style.color = '';
    statusMsg.textContent = scale < 0.999
      ? '打印缩放 ' + Math.round(scale * 100) + '% · 自然分页'
      : (viewMode === 'table' ? '打印 100% · A3 横向' : '打印 100% · A4 竖向');
    setTimeout(function () { window.print(); }, 120);
  });

  // sprint-26080801: iPad Safari WKWebView 忽略 @page A3 landscape, 实际渲染走 A4 portrait.
  // 兜底: beforeprint 直接改 paper 元素 width/height, 让 iOS 物理渲染时按 paper 实际尺寸出图.
  function applyPrintPaperFix() {
    if (viewMode !== 'table') return;
    var isLs = true;
    var wMm = isLs ? 420 : 210;
    var hMm = isLs ? 297 : 297;
    paper.style.width = wMm + 'mm';
    paper.style.minHeight = hMm + 'mm';
    paper.style.maxWidth = 'none';
    paper.style.maxHeight = 'none';
    paper.style.margin = '0';
    paper.style.overflow = 'visible';
    // 矩阵在 iOS 打印强制走 fixed
    var t = paper.querySelector('table.matrix');
    if (t) {
      t.style.tableLayout = 'fixed';
      t.style.width = '100%';
    }
  }
  function clearPrintPaperFix() {
    paper.style.width = '';
    paper.style.minHeight = '';
    paper.style.maxWidth = '';
    paper.style.maxHeight = '';
    paper.style.margin = '';
    var t = paper.querySelector('table.matrix');
    if (t) {
      t.style.tableLayout = '';
      t.style.width = '';
    }
  }
  if (window.matchMedia) {
    window.addEventListener('beforeprint', applyPrintPaperFix);
    window.addEventListener('afterprint', clearPrintPaperFix);
  }

  // ── 导出图片 (sprint 26080103) ──
  document.getElementById('btnImage').addEventListener('click', function () {
    if (!lastPayload) {
      statusMsg.textContent = '请先加载 stage';
      statusMsg.style.color = '#b23a48';
      return;
    }
    var btn = this;
    var order = stageSelect.value || (lastPayload && lastPayload.stage_order);
    var daysParam = '';
    if (appliedDays) {
      var keys = Object.keys(appliedDays).filter(function (k) { return appliedDays[k]; }).sort();
      if (keys.length) daysParam = '&days=' + encodeURIComponent(keys.join(','));
    }
    var url = '/api/practices/stage-image?stage_order=' + encodeURIComponent(order) + daysParam;
    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = '正在生成…';
    statusMsg.style.color = '';
    statusMsg.textContent = '正在生成图片…';
    fetch(url, { method: 'POST', cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        var reader = r.body.getReader();
        var dec = new TextDecoder();
        var buf = '';
        function pump() {
          return reader.read().then(function (res) {
            if (res.done) return;
            buf += dec.decode(res.value, { stream: true });
            var chunks = buf.split('\n\n');
            buf = chunks.pop() || '';
            chunks.forEach(function (chunk) {
              var m = chunk.match(/^data: (.+)$/m);
              if (!m) return;
              var evt;
              try { evt = JSON.parse(m[1]); } catch (e) { return; }
              if (evt.type === 'status') {
                statusMsg.textContent = evt.message;
                statusMsg.style.color = '';
              } else if (evt.type === 'error') {
                statusMsg.textContent = '图片生成失败: ' + evt.message;
                statusMsg.style.color = '#b23a48';
                btn.disabled = false;
                btn.textContent = oldText;
              } else if (evt.type === 'done') {
                statusMsg.textContent = '图片已存到 ' + evt.data.image_path;
                statusMsg.style.color = '';
                btn.disabled = false;
                btn.textContent = oldText;
                showImageModal(evt.data);
              }
            });
            return pump();
          });
        }
        return pump();
      })
      .catch(function (e) {
        statusMsg.textContent = '图片生成失败: ' + e.message;
        statusMsg.style.color = '#b23a48';
        btn.disabled = false;
        btn.textContent = oldText;
      });
  });

  function showImageModal(data) {
    var modal = document.createElement('div');
    modal.id = 'imageModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;';
    modal.innerHTML = '<div style="background:#fffef9;padding:24px;border-radius:12px;max-width:560px;width:90%;">' +
      '<h3 style="margin:0 0 12px;color:#2c2416;font-size:18px;">图片已生成 ✓</h3>' +
      '<p style="font-size:13px;color:#7a6a5a;margin:0 0 8px;">路径:</p>' +
      '<pre style="background:#f5f0e6;padding:8px;border-radius:6px;font-size:12px;overflow-x:auto;margin:0 0 12px;">' + esc(data.image_path) + '</pre>' +
      '<p style="font-size:13px;color:#7a6a5a;margin:0 0 12px;">Artifact ID: ' + esc(data.report_id) + ' · Stage ' + esc(data.stage_order) + '</p>' +
      '<button type="button" class="btn-apply" id="modalClose" style="margin-right:8px;">好</button>' +
      '<a href="' + esc(data.image_url) + '" target="_blank" rel="noopener" class="btn-apply" style="text-decoration:none;display:inline-block;">在浏览器打开</a>' +
      '</div>';
    document.body.appendChild(modal);
    document.getElementById('modalClose').addEventListener('click', function () { modal.remove(); });
  }

  window.addEventListener('resize', function () {
    if (viewMode === 'table' && paper.querySelector('table.matrix')) {
      fillMatrixToPaper();
    }
  });

  window.addEventListener('afterprint', function () {
    if (lastPayload) updatePreviewStatus();
  });

  // boot
  var initOrder = qs('stage_order');
  var initDate = qs('date');
  loadStagesThenDetail().then(function () {
    if (initOrder) {
      loadDetail({ stage_order: initOrder });
    } else if (initDate) {
      loadDetail({ date: initDate });
    } else if (stagesCache.length) {
      loadDetail({ stage_order: stagesCache[0].stage_order });
    } else {
      paper.innerHTML = '<div class="err">没有可用的 stage</div>';
    }
  });
})();
</script>
</body>
</html>
