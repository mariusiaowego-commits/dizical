<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage 练习明细 · 打印</title>
  <style>
    :root {
      --ink: #2c2416;
      --muted: #7a6a5a;
      --line: #e8dcc8;
      --paper: #fffef9;
      --accent: #c45c26;
      --gold: #8b6914;
      --card: #faf6ee;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "PingFang SC", serif;
      color: var(--ink);
      background: #e8e4dc;
    }

    /* ── 屏上工具条 (打印隐藏) ── */
    .toolbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: rgba(255,253,248,0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }
    .toolbar label { font-size: 13px; color: var(--muted); }
    .toolbar select {
      min-width: 220px; max-width: 360px;
      padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: #fff;
      font-size: 13px; color: var(--ink);
    }
    .toolbar button, .toolbar a.btn {
      appearance: none; border: none; cursor: pointer;
      padding: 7px 14px; border-radius: 8px;
      font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-print { background: var(--accent); color: #fff; font-weight: 600; }
    .btn-back { background: #ede8e0; color: var(--ink); }
    .toolbar .hint { font-size: 12px; color: var(--muted); margin-left: auto; }
    .status { font-size: 12px; color: var(--muted); }
    /* 视图切换: 分组 / 表格 */
    .view-toggle {
      display: inline-flex; border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; background: #fff;
    }
    .view-toggle button {
      appearance: none; border: none; background: transparent; cursor: pointer;
      padding: 6px 12px; font-size: 12px; color: var(--muted);
      border-right: 1px solid var(--line);
    }
    .view-toggle button:last-child { border-right: none; }
    .view-toggle button.active {
      background: #3d2e1e; color: #fffef9; font-weight: 600;
    }
    .view-toggle button:hover:not(.active) { background: #f5f0e8; }

    /* ── 纸张预览：屏上 100% 可读，可增高滚动；缩放仅打印 ── */
    .stage-wrap {
      padding: 18px 12px 40px;
      display: flex; justify-content: center;
    }
    .paper-scale {
      transform: none !important; /* 屏上禁止 scale，避免小纸片 */
      transform-origin: top center;
    }
    .paper {
      width: 210mm;
      min-height: 297mm;
      max-height: none; /* 屏上允许长于 A4，滚动查看 */
      overflow: visible;
      background: var(--paper);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 8mm 9mm 10mm;
      position: relative;
      zoom: 1 !important; /* 屏上禁止 zoom 压缩 */
    }
    /* 表格视图: A4 横向 297×210 */
    .paper.is-table.is-landscape {
      width: 297mm;
      min-height: 210mm;
      padding: 4mm 5mm 5mm;
    }

    /* ── 内容紧凑排版 (A4 单页) ── */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1.5px solid var(--ink); padding-bottom: 3mm; margin-bottom: 2.5mm;
      gap: 8px;
    }
    .ph-title { font-size: 13pt; font-weight: 700; letter-spacing: 0.5px; line-height: 1.2; }
    .ph-sub { font-size: 8pt; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    .ph-stats {
      text-align: right; font-size: 8pt; color: var(--ink); line-height: 1.4;
      white-space: nowrap;
    }
    .ph-stats strong { font-size: 11pt; color: var(--accent); }

    .assign-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2mm 2.5mm;
      margin-bottom: 2.5mm;
    }
    .assign-card h2 {
      margin: 0 0 1.5mm; font-size: 8.5pt; color: var(--gold);
      font-weight: 700; letter-spacing: 0.3px;
    }
    .assign-item {
      margin-bottom: 1.2mm; padding-bottom: 1.2mm;
      border-bottom: 1px dashed #e5d9c4;
      font-size: 7.5pt; line-height: 1.35;
      break-inside: avoid;
    }
    .assign-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .ai-name { font-weight: 700; color: var(--ink); }
    .ai-metro { color: var(--gold); margin-left: 4px; font-weight: 600; }
    .ai-req { color: #4a3f32; white-space: pre-wrap; margin-top: 0.5mm; }

    .overview {
      display: flex; flex-wrap: wrap; gap: 1.5mm 3mm;
      margin-bottom: 2mm; font-size: 7pt; color: var(--muted);
    }
    .overview .ov {
      background: #f3efe6; border-radius: 3px; padding: 0.6mm 1.5mm;
    }
    .overview .ov b { color: var(--ink); font-weight: 600; }

    .days { font-size: 7.2pt; }
    .day-block {
      margin-bottom: 1.8mm;
      break-inside: avoid;
    }
    .day-head {
      display: flex; justify-content: space-between; align-items: baseline;
      background: #3d2e1e; color: #fffef9;
      padding: 0.8mm 1.8mm; border-radius: 2px;
      font-size: 7.5pt; font-weight: 600;
      margin-bottom: 0.8mm;
    }
    .day-head .dh-meta { font-weight: 400; opacity: 0.9; font-size: 7pt; }

    .item-block { margin: 0 0 1mm 0.5mm; }
    .item-head {
      font-weight: 700; font-size: 7.4pt; color: var(--ink);
      border-left: 2px solid var(--accent); padding-left: 1.5mm;
      margin-bottom: 0.4mm;
    }
    .item-head span { font-weight: 500; color: var(--muted); margin-left: 3px; }

    table.sess {
      width: 100%; border-collapse: collapse;
      font-size: 6.8pt;
    }
    table.sess th {
      text-align: left; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--line); padding: 0.3mm 0.8mm;
      font-size: 6.5pt;
    }
    table.sess td {
      padding: 0.35mm 0.8mm; vertical-align: top;
      border-bottom: 1px dotted #efe6d6;
      line-height: 1.3;
    }
    table.sess .c-time { width: 9mm; white-space: nowrap; color: var(--muted); }
    table.sess .c-mins { width: 7mm; white-space: nowrap; font-weight: 600; text-align: right; }
    table.sess .c-tempo { width: 12mm; white-space: nowrap; color: var(--gold); font-weight: 600; }
    table.sess .c-extra {
      width: 8mm; text-align: center;
    }
    .tag-extra {
      display: inline-block; font-size: 6pt; padding: 0 1.2mm;
      border: 1px solid var(--accent); color: var(--accent); border-radius: 2px;
    }
    .empty-content { color: #b0a090; font-style: italic; }

    /* ── 表格视图 · A4 横向 · 科目×日期矩阵 ── */
    .paper.is-table .ph-title { font-size: 10pt; }
    .paper.is-table .ph-sub { font-size: 6.5pt; }
    .paper.is-table .assign-card { padding: 1.2mm 2mm; margin-bottom: 1.2mm; }
    .paper.is-table .assign-card h2 { font-size: 7pt; margin-bottom: 0.8mm; }
    .paper.is-table .assign-item { font-size: 6pt; margin-bottom: 0.5mm; padding-bottom: 0.5mm; }
    .paper.is-table .overview { font-size: 5.8pt; margin-bottom: 1.2mm; gap: 0.8mm 1.5mm; }

    .view-table-wrap { margin-top: 0; overflow-x: auto; }
    table.matrix {
      width: 100%; border-collapse: collapse;
      font-size: 5.8pt;
      table-layout: fixed;
    }
    table.matrix thead th {
      background: #3d2e1e; color: #fffef9;
      font-weight: 600; text-align: center;
      border: 0.25pt solid #2a2015;
      padding: 0.5mm 0.3mm;
      line-height: 1.15;
    }
    table.matrix thead th.th-item {
      background: #2a2015; width: 14mm; font-size: 6pt;
    }
    table.matrix thead th.th-day {
      font-size: 6.2pt; letter-spacing: 0.2px;
      border-left: 1pt solid #c9a030;
    }
    table.matrix thead th.th-sub {
      background: #5c4a36; font-size: 5.2pt; font-weight: 500;
      padding: 0.35mm 0.2mm;
    }
    table.matrix thead th.th-sub.th-first {
      border-left: 1pt solid #c9a030;
    }
    table.matrix tbody td {
      border: 0.25pt solid #e0d4c0;
      padding: 0.35mm 0.35mm;
      vertical-align: middle;
      text-align: center;
      line-height: 1.15;
      word-break: break-word;
    }
    table.matrix tbody tr:nth-child(even) td:not(.m-item) { background: #faf6ee; }
    table.matrix td.m-item {
      background: #f5f0e6; font-weight: 700; font-size: 6pt;
      text-align: center; width: 14mm;
      border-right: 1pt solid #c9a030;
      word-break: break-all;
    }
    table.matrix td.m-total {
      font-weight: 700; color: var(--accent); white-space: nowrap;
      border-left: 1pt solid #c9a030; background: #fff8f0;
    }
    table.matrix td.m-sess { color: var(--muted); white-space: nowrap; font-size: 5.5pt; }
    table.matrix td.m-tempo { color: var(--gold); font-weight: 600; white-space: nowrap; font-size: 5.5pt; }
    table.matrix td.m-once { font-weight: 600; white-space: nowrap; }
    table.matrix td.m-detail {
      text-align: left; padding: 0.35mm 0.6mm;
      font-size: 5.5pt; overflow-wrap: anywhere;
    }
    table.matrix td.m-empty { background: #f7f5f0; color: #ccc; }
    table.matrix .det-extra {
      display: inline-block; font-size: 5pt; margin-left: 1px;
      padding: 0 0.8mm; border: 1px solid var(--accent); color: var(--accent); border-radius: 1px;
    }
    table.matrix tfoot td {
      background: #f3efe6; font-weight: 700; font-size: 5.8pt;
      border: 0.25pt solid #e0d4c0; padding: 0.5mm;
      text-align: center;
    }
    table.matrix tfoot td.m-item { background: #ebe4d6; }

    .pf {
      margin-top: 1.5mm;
      font-size: 5.5pt; color: #a89880;
      display: flex; justify-content: space-between;
      border-top: 1px solid var(--line); padding-top: 0.6mm;
    }

    .loading, .err {
      padding: 40px; text-align: center; color: var(--muted); font-size: 14px;
    }
    .err { color: #b23a48; }

    /* ── 打印 ── */
    @media print {
      html, body { background: #fff; }
      .toolbar { display: none !important; }
      .stage-wrap { padding: 0; }
      .paper-scale { transform: none !important; }
      .paper {
        box-shadow: none !important;
        max-height: none;
        overflow: visible;
        zoom: var(--print-zoom, 1) !important;
      }
      .paper:not(.is-landscape) {
        width: 210mm;
        min-height: 297mm;
        padding: 6mm 7mm 6mm;
      }
      .paper.is-landscape {
        width: 297mm !important;
        min-height: 210mm;
        padding: 4mm 5mm 4mm !important;
      }
    }
  </style>
  <style id="printPageRule">@page { size: A4 portrait; margin: 0; }</style>
</head>
<body>
  <div class="toolbar no-print">
    <a class="btn btn-back" href="/report">← 报告</a>
    <label for="stageSelect">阶段</label>
    <select id="stageSelect" aria-label="选择 Stage"></select>
    <div class="view-toggle" role="group" aria-label="展示样式">
      <button type="button" id="viewGroup" class="active" data-view="group">分组</button>
      <button type="button" id="viewTable" data-view="table">表格</button>
    </div>
    <button type="button" class="btn btn-print" id="btnPrint">打印 / PDF</button>
    <span class="hint">A4 · 老师要求全文 · 可切换 分组 / 表格</span>
    <span class="status" id="statusMsg"></span>
  </div>

  <div class="stage-wrap">
    <div class="paper-scale" id="paperScale">
      <div class="paper" id="paper">
        <div class="loading" id="bootMsg">加载中…</div>
      </div>
    </div>
  </div>

<script>
(function () {
  var stageSelect = document.getElementById('stageSelect');
  var paper = document.getElementById('paper');
  var paperScale = document.getElementById('paperScale');
  var statusMsg = document.getElementById('statusMsg');
  var stagesCache = [];
  var lastPayload = null;

  function qsInit(name) {
    try {
      return new URL(window.location.href).searchParams.get(name);
    } catch (e) { return null; }
  }

  // view: group | table  默认分组；URL ?view= 与 localStorage 可记
  var viewMode = (function () {
    var fromUrl = qsInit('view');
    if (fromUrl === 'table' || fromUrl === 'group') return fromUrl;
    try {
      var ls = localStorage.getItem('stage-print-view');
      if (ls === 'table' || ls === 'group') return ls;
    } catch (e) {}
    return 'group';
  })();

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtCnDate(iso) {
    if (!iso || iso.length < 10) return iso || '';
    var p = iso.substring(0, 10).split('-');
    return parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
  }

  function fmtTime(startedAt) {
    if (!startedAt) return '—';
    var s = String(startedAt);
    var sep = s.indexOf('T') >= 0 ? 'T' : ' ';
    var parts = s.split(sep);
    if (parts.length < 2) return '—';
    return parts[1].substring(0, 5);
  }

  function qs(name) {
    var u = new URL(window.location.href);
    return u.searchParams.get(name);
  }

  function setQuery(stageOrder, view) {
    var u = new URL(window.location.href);
    if (stageOrder != null && stageOrder !== '') {
      u.searchParams.set('stage_order', stageOrder);
      u.searchParams.delete('date');
    }
    if (view) u.searchParams.set('view', view);
    history.replaceState(null, '', u.pathname + u.search);
  }

  function syncViewToggle() {
    var g = document.getElementById('viewGroup');
    var t = document.getElementById('viewTable');
    if (g) g.classList.toggle('active', viewMode === 'group');
    if (t) t.classList.toggle('active', viewMode === 'table');
  }

  /** 分组=竖向；表格=横向矩阵 */
  function syncPaperMode() {
    var isTable = viewMode === 'table';
    paper.classList.toggle('is-table', isTable);
    paper.classList.toggle('is-landscape', isTable);
    var rule = document.getElementById('printPageRule');
    if (rule) {
      rule.textContent = isTable
        ? '@page { size: A4 landscape; margin: 0; }'
        : '@page { size: A4 portrait; margin: 0; }';
    }
    var hint = document.querySelector('.toolbar .hint');
    if (hint) {
      hint.textContent = isTable
        ? '表格 · A4 横向 · 科目×日期矩阵 · 打印一页'
        : '分组 · A4 竖向 · 老师要求全文 · 可切换表格';
    }
  }

  function a4PageHeightPx() {
    // 竖向 297mm；横向 210mm
    var mm = viewMode === 'table' ? 210 : 297;
    return Math.round(mm * (96 / 25.4));
  }

  function updatePreviewStatus() {
    paper.style.setProperty('--print-zoom', '1');
    paperScale.style.transform = '';
    var a4px = a4PageHeightPx();
    var contentH = paper.scrollHeight;
    var modeLabel = viewMode === 'table' ? '表格·横向' : '分组·竖向';
    if (contentH > a4px + 8) {
      var pct = Math.max(40, Math.min(100, Math.round((a4px / contentH) * 100)));
      statusMsg.textContent = modeLabel + ' · 预览 100%（可滚动）· 打印一页约 ' + pct + '%';
    } else {
      statusMsg.textContent = modeLabel + ' · 预览 100% · 已在一页内';
    }
  }

  /** 共用页眉（分组 / 表格） */
  function renderHeader(data) {
    var sum = data.summary || {};
    var title = '竹笛练习明细 · Stage ' + (data.stage_order != null ? data.stage_order : '—');
    var styleLabel = viewMode === 'table' ? '表格 · 科目×日期 · A4 横向' : '分组 · A4 竖向';
    var html = '';
    html += '<div class="ph">';
    html += '<div>';
    html += '<div class="ph-title">' + esc(title) + '</div>';
    html += '<div class="ph-sub">周期 ' + esc(data.stage_start || '') + ' ~ ' + esc(data.stage_end || data.effective_end || '');
    html += ' · 上课日 ' + esc(data.lesson_date || '—');
    html += ' · 截止 ' + esc(data.effective_end || '');
    html += ' · ' + styleLabel;
    html += '</div>';
    if (data.notes) {
      html += '<div class="ph-sub">备注：' + esc(data.notes) + '</div>';
    }
    html += '</div>';
    html += '<div class="ph-stats">';
    html += '<div><strong>' + esc(sum.total_minutes || 0) + '</strong> 分钟</div>';
    html += '<div>' + esc(sum.practice_days || 0) + ' 天 · ' + esc(sum.session_count || 0) + ' 次明细 · ' + esc(sum.item_count || 0) + ' 科</div>';
    html += '</div></div>';

    html += '<div class="assign-card">';
    html += '<h2>老师要求（本阶段全文）</h2>';
    var assigns = data.assignment_items || [];
    if (!assigns.length) {
      html += '<div class="ai-req empty-content">本阶段暂无作业条目</div>';
    } else {
      assigns.forEach(function (a) {
        html += '<div class="assign-item">';
        html += '<span class="ai-name">' + esc(a.item) + '</span>';
        if (a.metronome) html += '<span class="ai-metro">' + esc(a.metronome) + '</span>';
        html += '<div class="ai-req">' + (a.requirements ? esc(a.requirements) : '<span class="empty-content">（无文字要求）</span>') + '</div>';
        html += '</div>';
      });
    }
    html += '</div>';

    var byItem = data.by_item || [];
    if (byItem.length) {
      html += '<div class="overview">';
      byItem.forEach(function (it) {
        var pct = sum.total_minutes ? Math.round(it.minutes / sum.total_minutes * 100) : 0;
        html += '<span class="ov"><b>' + esc(it.item_name) + '</b> ' + esc(it.minutes) + '′/' + esc(it.session_count) + '次 ' + pct + '%</span>';
      });
      html += '</div>';
    }
    return html;
  }

  /** 分组视图：日 → 科目 → session（原样式） */
  function renderBodyGroup(data) {
    var html = '<div class="days">';
    var days = data.days || [];
    if (!days.length) {
      html += '<div class="err" style="padding:12px;">本阶段暂无练习明细 (session)</div>';
    }
    days.forEach(function (day) {
      html += '<div class="day-block">';
      html += '<div class="day-head"><span>' + esc(fmtCnDate(day.date)) + ' · ' + esc(day.date) + '</span>';
      html += '<span class="dh-meta">' + esc(day.total_minutes) + ' 分钟 · ' + esc(day.session_count) + ' 次</span></div>';
      (day.groups || []).forEach(function (g) {
        html += '<div class="item-block">';
        html += '<div class="item-head">' + esc(g.item_name) + '<span>' + esc(g.minutes) + ' 分钟 · ' + esc((g.sessions || []).length) + ' 次</span></div>';
        html += '<table class="sess"><thead><tr>';
        html += '<th class="c-time">时间</th><th class="c-mins">时长</th><th class="c-tempo">速度</th><th>内容</th><th class="c-extra"></th>';
        html += '</tr></thead><tbody>';
        (g.sessions || []).forEach(function (s) {
          var tempo = s.tempo_bpm ? ((s.tempo_note || '') + '=' + s.tempo_bpm) : '—';
          var content = s.content ? esc(s.content) : '<span class="empty-content">（未填写）</span>';
          html += '<tr>';
          html += '<td class="c-time">' + esc(fmtTime(s.started_at)) + '</td>';
          html += '<td class="c-mins">' + esc(s.duration_minutes) + '′</td>';
          html += '<td class="c-tempo">' + esc(tempo) + '</td>';
          html += '<td>' + content + '</td>';
          html += '<td class="c-extra">' + (s.is_extra ? '<span class="tag-extra">额外</span>' : '') + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  /**
   * 表格视图：A4 横向矩阵
   * 行 = 科目；列组 = 每个日期 × (总时长 | session序号 | 速度 | 单次时长 | 明细)
   * 同科目同日多 session → 多行；科目名 rowspan；总时长 rowspan
   */
  function renderBodyTable(data) {
    var sum = data.summary || {};
    var days = data.days || [];
    var html = '<div class="view-table-wrap">';
    if (!days.length) {
      html += '<div class="err" style="padding:12px;">本阶段暂无练习明细 (session)</div>';
      html += '</div>';
      return html;
    }

    // 科目顺序：优先 by_item，再补 days 里出现的
    var itemOrder = [];
    var itemNames = {};
    (data.by_item || []).forEach(function (it) {
      var id = it.item_id;
      if (id == null) return;
      if (itemOrder.indexOf(id) < 0) itemOrder.push(id);
      itemNames[id] = it.item_name || ('科目' + id);
    });
    days.forEach(function (day) {
      (day.groups || []).forEach(function (g) {
        var id = g.item_id;
        if (id == null) return;
        if (itemOrder.indexOf(id) < 0) itemOrder.push(id);
        itemNames[id] = g.item_name || itemNames[id] || ('科目' + id);
      });
    });

    // dayKey -> itemId -> { minutes, sessions[] }
    var grid = {};
    var dateList = [];
    days.forEach(function (day) {
      var d = day.date;
      dateList.push(d);
      grid[d] = {};
      (day.groups || []).forEach(function (g) {
        grid[d][g.item_id] = {
          minutes: g.minutes || 0,
          sessions: (g.sessions && g.sessions.length) ? g.sessions.slice() : []
        };
      });
    });

    var nDays = dateList.length;
    var subLabels = ['总时长', 'session', '速度', '单次', '明细'];
    // 明细列相对更宽：用 colgroup 比例 总:session:速度:单次:明细 ≈ 1:0.7:1:0.8:2.5
    var subWeights = [1, 0.7, 1, 0.8, 2.8];

    html += '<table class="matrix">';
    // 表头行1：科目 + 各日期
    html += '<thead><tr>';
    html += '<th class="th-item" rowspan="2">科目</th>';
    dateList.forEach(function (d) {
      html += '<th class="th-day" colspan="5">' + esc(fmtCnDate(d)) + '</th>';
    });
    html += '</tr><tr>';
    dateList.forEach(function () {
      subLabels.forEach(function (lab, i) {
        html += '<th class="th-sub' + (i === 0 ? ' th-first' : '') + '">' + lab + '</th>';
      });
    });
    html += '</tr></thead><tbody>';

    if (!itemOrder.length) {
      html += '<tr><td colspan="' + (1 + nDays * 5) + '" class="empty-content">无科目</td></tr>';
    }

    itemOrder.forEach(function (itemId) {
      // 该科目在各天 session 数，行数 = max
      var maxS = 1;
      dateList.forEach(function (d) {
        var cell = grid[d][itemId];
        var n = cell && cell.sessions ? cell.sessions.length : 0;
        if (n > maxS) maxS = n;
      });
      if (maxS < 1) maxS = 1;

      for (var ri = 0; ri < maxS; ri++) {
        html += '<tr>';
        if (ri === 0) {
          html += '<td class="m-item" rowspan="' + maxS + '">' + esc(itemNames[itemId] || itemId) + '</td>';
        }
        dateList.forEach(function (d) {
          var cell = grid[d][itemId];
          var sess = (cell && cell.sessions) ? cell.sessions : [];
          var total = cell ? cell.minutes : 0;

          if (!cell || (!sess.length && !total)) {
            // 该天无练习
            if (ri === 0) {
              html += '<td class="m-total m-empty" rowspan="' + maxS + '">—</td>';
              html += '<td class="m-empty" rowspan="' + maxS + '" colspan="4"></td>';
            }
            // ri>0: 已 rowspan，不输出
            return;
          }

          if (sess.length === 0) {
            if (ri === 0) {
              html += '<td class="m-total" rowspan="' + maxS + '">' + esc(total) + '′</td>';
              html += '<td class="m-sess">—</td>';
              html += '<td class="m-tempo">—</td>';
              html += '<td class="m-once">—</td>';
              html += '<td class="m-detail empty-content">—</td>';
            } else {
              html += '<td class="m-empty" colspan="4"></td>';
            }
            return;
          }

          // 有 session：总时长 rowspan = sess.length（相对本科目该天），但表格行是 maxS
          // 用本天 sess.length 作为该天合并高度
          var daySessN = sess.length;
          if (ri === 0) {
            html += '<td class="m-total" rowspan="' + maxS + '">' + esc(total) + '′</td>';
          }
          if (ri < daySessN) {
            var s = sess[ri];
            var tempo = s.tempo_bpm ? ((s.tempo_note || '') + '=' + s.tempo_bpm) : '—';
            var content = s.content ? esc(s.content) : '<span class="empty-content">（未填写）</span>';
            html += '<td class="m-sess">' + (ri + 1) + '/' + daySessN + '</td>';
            html += '<td class="m-tempo">' + esc(tempo) + '</td>';
            html += '<td class="m-once">' + esc(s.duration_minutes || 0) + '′</td>';
            html += '<td class="m-detail">' + content;
            if (s.is_extra) html += '<span class="det-extra">额外</span>';
            html += '</td>';
          } else {
            // 该天 session 数少于 maxS：补空
            html += '<td class="m-empty"></td><td class="m-empty"></td><td class="m-empty"></td><td class="m-empty"></td>';
          }
        });
        html += '</tr>';
      }
    });

    // 表尾：每日合计分钟
    html += '</tbody><tfoot><tr>';
    html += '<td class="m-item">日合计</td>';
    dateList.forEach(function (d) {
      var dayObj = null;
      for (var i = 0; i < days.length; i++) {
        if (days[i].date === d) { dayObj = days[i]; break; }
      }
      var t = dayObj ? dayObj.total_minutes : 0;
      html += '<td class="m-total" colspan="5">' + esc(t) + '′ · ' + esc(dayObj ? dayObj.session_count : 0) + '次</td>';
    });
    html += '</tr><tr>';
    html += '<td class="m-item">阶段</td>';
    html += '<td colspan="' + (nDays * 5) + '">' + esc(sum.total_minutes || 0) + '′ · '
      + esc(sum.session_count || 0) + ' 次 · ' + esc(sum.practice_days || 0) + ' 天 · '
      + esc(sum.item_count || 0) + ' 科 · A4 横向</td>';
    html += '</tr></tfoot></table></div>';
    return html;
  }

  function renderPayload(data) {
    lastPayload = data;
    var title = '竹笛练习明细 · Stage ' + (data.stage_order != null ? data.stage_order : '—');
    document.title = title + (viewMode === 'table' ? ' · 表格' : ' · 分组');

    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var gen = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
      + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

    syncPaperMode();
    var html = renderHeader(data);
    html += viewMode === 'table' ? renderBodyTable(data) : renderBodyGroup(data);
    html += '<div class="pf"><span>数据: practice_sessions · 观摩/家校沟通用</span>';
    html += '<span>生成 ' + esc(gen) + ' · ' + (viewMode === 'table' ? '矩阵表格 · A4 横向一页' : '分组 · A4 竖向') + '</span></div>';

    paper.innerHTML = html;
    syncViewToggle();
    updatePreviewStatus();
  }

  function setViewMode(mode) {
    if (mode !== 'group' && mode !== 'table') return;
    viewMode = mode;
    try { localStorage.setItem('stage-print-view', mode); } catch (e) {}
    var order = stageSelect.value || (lastPayload && lastPayload.stage_order);
    setQuery(order, viewMode);
    syncPaperMode();
    syncViewToggle();
    if (lastPayload) renderPayload(lastPayload);
  }

  /** 打印前：强制缩放到不超过一页（横向用 210mm 高） */
  function preparePrintZoom() {
    var a4px = a4PageHeightPx();
    var contentH = paper.scrollHeight;
    var scale = 1;
    if (contentH > a4px + 4) {
      scale = Math.max(0.40, Math.min(1, (a4px - 6) / contentH));
    }
    // 横向时若内容过宽也压一点（zoom 等比）
    if (viewMode === 'table') {
      var a4w = Math.round(297 * (96 / 25.4));
      var contentW = paper.scrollWidth;
      if (contentW > a4w + 4) {
        var sw = Math.max(0.40, Math.min(1, (a4w - 6) / contentW));
        if (sw < scale) scale = sw;
      }
    }
    paper.style.setProperty('--print-zoom', String(scale.toFixed(4)));
    return scale;
  }

  function loadStagesThenDetail() {
    return fetch('/api/practices/stages', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        stagesCache = (res && res.stages) || [];
        stageSelect.innerHTML = '';
        if (!stagesCache.length) {
          stageSelect.innerHTML = '<option value="">无 stage 数据</option>';
          return;
        }
        stagesCache.forEach(function (s) {
          var opt = document.createElement('option');
          opt.value = String(s.stage_order);
          var label = 'Stage ' + s.stage_order + ' · ' + (s.stage_start || '') + ' ~ ' + (s.stage_end || '…');
          if (s.lesson_date) label += ' (课 ' + s.lesson_date + ')';
          opt.textContent = label;
          stageSelect.appendChild(opt);
        });
      });
  }

  function loadDetail(params) {
    statusMsg.textContent = '';
    paper.innerHTML = '<div class="loading">加载明细…</div>';
    var q = new URLSearchParams();
    if (params.stage_order != null && params.stage_order !== '') {
      q.set('stage_order', params.stage_order);
    } else if (params.date) {
      q.set('date', params.date);
    }
    return fetch('/api/practices/stage-detail?' + q.toString(), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) {
          paper.innerHTML = '<div class="err">' + esc((res.j && res.j.error) || '加载失败') + '</div>';
          return;
        }
        // 同步 select
        if (res.j.stage_order != null) {
          stageSelect.value = String(res.j.stage_order);
          setQuery(res.j.stage_order, viewMode);
        }
        renderPayload(res.j);
      })
      .catch(function () {
        paper.innerHTML = '<div class="err">网络错误</div>';
      });
  }

  stageSelect.addEventListener('change', function () {
    var v = stageSelect.value;
    if (v) loadDetail({ stage_order: v });
  });

  document.getElementById('viewGroup').addEventListener('click', function () {
    setViewMode('group');
  });
  document.getElementById('viewTable').addEventListener('click', function () {
    setViewMode('table');
  });
  syncViewToggle();
  syncPaperMode();

  document.getElementById('btnPrint').addEventListener('click', function () {
    syncPaperMode();
    var scale = preparePrintZoom();
    statusMsg.textContent = scale < 0.999
      ? '打印缩放 ' + Math.round(scale * 100) + '% 塞入一页 · 预览仍 100%'
      : '打印 100% · A4 竖向一页';
    setTimeout(function () { window.print(); }, 80);
  });

  window.addEventListener('afterprint', function () {
    if (lastPayload) updatePreviewStatus();
  });

  // boot
  var initOrder = qs('stage_order');
  var initDate = qs('date');
  loadStagesThenDetail().then(function () {
    if (initOrder) {
      loadDetail({ stage_order: initOrder });
    } else if (initDate) {
      loadDetail({ date: initDate });
    } else if (stagesCache.length) {
      loadDetail({ stage_order: stagesCache[0].stage_order });
    } else {
      paper.innerHTML = '<div class="err">没有可用的 stage</div>';
    }
  });
})();
</script>
</body>
</html>
