<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>练习打卡 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body { padding-bottom: calc(87px + 20px); }

    /* 固定底部导航 - 与 prepare 风格一致 */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 4px;
      padding: 8px 8px calc(env(safe-area-inset-bottom));
      background: var(--card, #fff); box-shadow: 0 -2px 12px rgba(0,0,0,0.1); z-index: 100;
    }
    .nav a {
      flex: 1; min-width: 0; padding: 14px 8px !important; background: transparent; border-radius: 16px;
      text-align: center; text-decoration: none; color: #7F8C8D; font-size: 16px !important;
      box-shadow: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .nav a:active { transform: scale(0.95); }
    .nav a.active { background: #FF6B6B; color: white; }
    .nav-icon { font-size: 20px; }

    /* 计时器保护弹窗 */
    #timerProtectModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    #timerProtectModal.open { display: flex; }
    .modal-box {
      background: white; border-radius: 20px; padding: 28px 24px;
      max-width: 320px; width: 100%; text-align: center;
    }
    .modal-box h3 { font-size: 20px; color: #FF6B6B; margin-bottom: 12px; }
    .modal-box p { font-size: 16px; color: #555; margin-bottom: 20px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; flex-direction: column; }
    .modal-actions button { padding: 14px; border: none; border-radius: 16px; font-size: 17px; font-weight: bold; cursor: pointer; }
    .modal-actions .btn-stay { background: #4ECDC4; color: white; }
    .modal-actions .btn-leave { background: #FF6B6B; color: white; }

    /* 提前结束确认弹窗 */
    #finishEarlyModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    #finishEarlyModal.open { display: flex; }
    .finish-modal-box {
      background: white; border-radius: 24px; padding: 32px 28px;
      max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .finish-modal-box .finish-icon { font-size: 48px; margin-bottom: 12px; }
    .finish-modal-box h3 { font-size: 22px; color: #2E7D32; margin-bottom: 8px; }
    .finish-modal-box .finish-mins {
      font-size: 56px; font-weight: 800; color: #4ECDC4;
      line-height: 1.1; margin: 12px 0;
    }
    .finish-modal-box .finish-mins-label { font-size: 16px; color: #7F8C8D; margin-bottom: 24px; }
    .finish-modal-actions { display: flex; gap: 10px; flex-direction: column; }
    .finish-modal-actions.finish-modal-3btns { flex-direction: row; gap: 8px; }
    .finish-modal-actions button {
      padding: 14px 8px; border: none; border-radius: 16px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      transition: transform 0.15s;
      flex: 1;
      white-space: nowrap;
      min-width: 0;
    }
    .finish-modal-actions button:active { transform: scale(0.96); }
    .finish-modal-actions .btn-confirm,
    .finish-modal-actions .btn-submit { background: linear-gradient(135deg, #4ECDC4, #44B8AC); color: white; }
    .finish-modal-actions .btn-cancel,
    .finish-modal-actions .btn-resume { background: #F0D060; color: #5D4037; }
    .finish-modal-actions .btn-abort { background: #F0F0F0; color: #888; }

    /* 正常结束确认弹窗（修复：正常结束不再自动提交，等待用户点确认/放弃） */
    #finishNormalModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    #finishNormalModal.open { display: flex; }

    /* 顶部状态栏 */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 4px 4px; font-size: 14px; color: #7F8C8D; margin-bottom: 8px;
    }
    .top-bar .today-stat { font-size: 15px; color: #4ECDC4; font-weight: bold; }
    .top-bar .server-clock { font-size: 13px; background: #F8F9FA; border-radius: 12px; padding: 4px 12px; }

    /* ════════════════════════════════════════════════
     *  垂直卡片 3 楼层(三栏换掉)
     *  楼层 1:老师要求 / 楼层 2:计时器 + 主半圆 picker
     *  楼层 3:额外记录 + 副半圆 picker
     * ════════════════════════════════════════════════ */
    .vertical-stack {
      display: flex; flex-direction: column; gap: 14px;
      margin-bottom: 14px; width: 100%; max-width: 100%; box-sizing: border-box;
    }
    .floor {
      background: #FFFDF5;
      border-radius: var(--radius, 16px);
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      border: 2px solid transparent;
      overflow: visible;
    }
    .floor h3 { font-size: 20px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-weight: 700; }

    /* 楼层 1:老师要求 */
    .floor-req { background: #FFFDF5; border-color: #F0D060; }
    .floor-req h3 { color: #FF6B6B; }
    .req-content {
      max-height: 200px; overflow-y: auto;
      padding: 0 4px; min-height: 48px;
      scrollbar-width: thin;
    }
    .req-empty { font-size: 15px; color: #8D6E63; text-align: center; padding: 24px 8px; }
    .req-highlight {
      background: #FFF8E0; border-left: 4px solid #F0D060;
      padding: 12px 14px; border-radius: 4px 12px 12px 4px;
      font-size: 15px; color: #5D4037; line-height: 1.7;
      animation: reqFadeIn 0.35s ease-out;
    }
    @keyframes reqFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* 楼层 2+3:两仪表盘并排(同卡片,grid 1fr 1fr) */
    .floor-pickers { background: #FFFDF5; border-color: #F0D060; }
    .floor-pickers h3 { color: #8B6914; }
    .pickers-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; align-items: stretch;
    }
    .picker-cell {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 12px;
      border: 2px solid transparent;
    }
    .picker-cell-timer { border-color: rgba(255,107,107,0.4); }   /* 珊瑚红 */
    .picker-cell-extra { border-color: rgba(78,205,196,0.4); }    /* 蒂芙尼青 */
    .picker-label {
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      color: #7F8C8D; margin-bottom: 6px; text-transform: uppercase;
    }
    .picker-cell-timer .picker-label { color: #C44545; }
    .picker-cell-extra .picker-label { color: #2A8A82; }

    /* 主半圆(计时) */
    .timer-picker-wrap {
      position: relative; width: 100%; max-width: 320px;
      aspect-ratio: 1.6 / 1; margin: 0 auto;
    }
    .timer-picker-wrap svg { width: 100%; height: 100%; display: block; }
    .timer-center-value {
      position: absolute; left: 50%; top: 72%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      width: 80%;
    }
    .timer-center-value .num {
      font-size: 30px; font-weight: 800; color: #FF6B6B; line-height: 1;
      display: inline-block;
    }
    .timer-center-value .num.idle { font-size: 42px; }
    .timer-center-value .num .digit {
      display: inline-block;
      transform-origin: 50% 50%;
    }
    .timer-center-value .colon {
      display: inline-block; margin: 0 2px;
    }
    .timer-center-value .unit { font-size: 14px; color: #C44545; margin-top: 2px; }
    .timer-center-value .hint { font-size: 11px; color: #A1887F; margin-top: 6px; }

    /* 副半圆(补录)— 等大,跟主半圆同步缩放 */
    .extra-picker-wrap {
      position: relative; width: 100%; max-width: 320px;
      aspect-ratio: 1.6 / 1; margin: 0 auto;
    }
    .extra-picker-wrap svg { width: 100%; height: 100%; display: block; }
    .extra-center-value {
      position: absolute; left: 50%; top: 72%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      width: 80%;
    }
    .extra-center-value .num { font-size: 32px; font-weight: 800; color: #4ECDC4; line-height: 1; }
    .extra-center-value .unit { font-size: 12px; color: #2A8A82; margin-top: 2px; }
    .extra-center-value .hint { font-size: 11px; color: #A1887F; margin-top: 4px; }

    /* 控制按钮区 */
    .action-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px; border: none; border-radius: 24px;
      font-size: 17px; font-family: inherit; cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #4ECDC4, #44B8AC); color: white; }
    .btn-danger { background: #FF6B6B; color: white; }
    .btn-secondary { background: #F0F0F0; color: #555; }
    .btn-ghost { background: transparent; color: #4ECDC4; border: 2px solid #4ECDC4; }

    /* 选中科目气泡 */
    .item-bubble {
      display: none;
      background: linear-gradient(135deg, #FFE066, #FF9F43);
      border-radius: 8px; padding: 4px 10px;
      align-items: center; gap: 6px;
      box-shadow: 0 1px 4px rgba(255,159,67,0.3);
      margin-left: 8px; vertical-align: middle;
    }
    .item-bubble .bubble-name { font-size: 13px; color: #fff; font-weight: bold; white-space: nowrap; }
    @keyframes bubbleFadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .item-bubble.animate { animation: bubbleFadeIn 0.3s ease-out; }

    /* 数字时间显示:已废弃(改用 picker 中央 num 实时变化) */
    .timer-display { display: none; }

    /* 确认打卡区域 */
    .confirm-area {
      display: none; text-align: center;
      background: #EDF7F0; border: 2px solid #A0D8A8;
      border-radius: var(--radius, 16px); padding: 14px;
    }
    .confirm-area.show { display: block; }
    .confirm-area p { font-size: 20px; color: #2E7D32; margin-bottom: 12px; }
    .confirm-area .confirm-mins { font-size: 48px; font-weight: bold; color: #27AE60; display: block; margin: 8px 0; }

    /* 额外记录日志 */
    .extra-log-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.7); border: 1px solid #B0D8B0;
      border-radius: 8px; padding: 8px 12px; font-size: 14px;
      margin-top: 6px;
    }
    .extra-log-item:first-child { margin-top: 10px; }
    .extra-log-item + .extra-log-item { margin-top: 6px; }

    /* Picker knob 拖拽光标 */
    .dizi-picker-knob { cursor: grab; }
    .dizi-picker-knob.dragging { cursor: grabbing; }
    .extra-log-item .extra-mins { color: #2E7D32; font-weight: bold; }
    .extra-log-item .extra-del { background: #FF6B6B; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 13px; cursor: pointer; flex-shrink: 0; }

    /* 练习科目 */
    .item-section { margin-bottom: 12px; }
    .item-section h2 { color: #FF6B6B; font-size: 20px; margin-bottom: 8px; }
    .item-section h2 span { font-size: 14px; color: #7F8C8D; font-weight: normal; }
    .item-filter-wrap { margin-bottom: 10px; }
    .item-filter-wrap input {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 2px solid #E8E8E8; font-size: 16px; box-sizing: border-box;
    }
    .item-filter-wrap input:focus { border-color: #BDBDBD; }

    /* 分类标题 */
    .item-section h3 {
      font-size: 13px !important; color: #9E9E9E !important;
      margin: 22px 0 10px !important; font-weight: 600 !important;
      letter-spacing: 0.5px;
    }
    .item-section h3 .cat-count {
      background: #F0F0F0; color: #999; font-size: 11px;
      padding: 2px 7px; border-radius: 10px; font-weight: 700;
      display: inline-block; margin-left: 4px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px 10px;
      margin-bottom: 16px;
    }

    /* ── 3D 按钮 ── */
    .item-btn {
      position: relative; width: 100%; min-height: 48px;
      border: none; border-radius: 14px;
      font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 10px 10px; overflow: visible;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background 0.15s ease;
      z-index: 1; color: #616161;
    }
    .item-btn::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.15s ease;
    }
    .item-btn:active { filter: brightness(0.95); }

    /* 灰色 — 无老师要求 */
    .item-btn:not(.has-req) {
      background: #E8E8E8; border: 1.5px solid #BDBDBD;
    }
    .item-btn:not(.has-req)::before {
      background: #D5D5D5; box-shadow: 0 3px 0 #9E9E9E;
      transform: translate3d(0, 0.6em, -1em);
    }
    .item-btn:not(.has-req):hover { background: #DCDCDC; transform: translate(0, 0.2em); }
    .item-btn:not(.has-req):hover::before { transform: translate3d(0, 0.4em, -1em); box-shadow: 0 4px 0 #9E9E9E; }
    .item-btn:not(.has-req):active, .item-btn:not(.has-req).selected {
      background: #D0D0D0; transform: translate(0, 0.6em);
    }
    .item-btn:not(.has-req):active::before, .item-btn:not(.has-req).selected::before {
      transform: translate3d(0, 0, -1em); box-shadow: 0 2px 0 #9E9E9E;
    }

    /* 金色 — 有老师要求 */
    .item-btn.has-req {
      background: #FFF3C4; color: #7C4A00; border: 1.5px solid #F59E0B;
    }
    .item-btn.has-req::before {
      background: #FCD34D; box-shadow: 0 3px 0 #B45309;
      transform: translate3d(0, 0.6em, -1em);
    }
    .item-btn.has-req:hover { background: #FDE68A; transform: translate(0, 0.2em); }
    .item-btn.has-req:hover::before { transform: translate3d(0, 0.4em, -1em); box-shadow: 0 4px 0 #B45309; }
    .item-btn.has-req:active, .item-btn.has-req.selected {
      background: #FCD34D; transform: translate(0, 0.6em);
    }
    .item-btn.has-req:active::before, .item-btn.has-req.selected::before {
      transform: translate3d(0, 0, -1em); box-shadow: 0 2px 0 #B45309;
    }

    /* 选中态脉冲环 */
    .item-btn.selected { z-index: 2; }
    .item-btn.selected .sel-ring {
      position: absolute; inset: -3px; border: 2.5px solid #FF6B6B; border-radius: 16px;
      pointer-events: none; animation: ring-pulse 1.5s ease-out 1;
    }
    @keyframes ring-pulse { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15); } }

    /* 老师要求指示点 */
    .item-btn .req-dot {
      position: absolute; top: 5px; right: 5px; width: 8px; height: 8px;
      background: #FF6B6B; border-radius: 50%; box-shadow: 0 0 6px rgba(255,107,107,0.6);
      pointer-events: none;
    }

    /* ── 选中后收拢展示 ── */
    .selected-summary {
      display: none; align-items: center; gap: 12px;
      background: #FAFAFA; border: 1.5px solid #E0E0E0; border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .selected-summary.visible { display: flex; }
    .selected-summary .sum-tag {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 14px;
      min-width: 100px;
    }
    .selected-summary .sum-tag.tag-req { background: #FFF3C4; color: #7C4A00; border: 1.5px solid #F59E0B; }
    .selected-summary .sum-tag.tag-normal { background: #E8E8E8; color: #616161; border: 1.5px solid #BDBDBD; }
    .selected-summary .sum-tag .sum-id { font-size: 10px; opacity: 0.5; font-weight: 500; margin-top: 2px; }
    .selected-summary .sum-info { flex: 1; min-width: 0; }
    .selected-summary .sum-info .sum-name { font-size: 15px; font-weight: 700; color: #333; }
    .selected-summary .sum-info .sum-req { font-size: 13px; color: #666; margin-top: 2px; line-height: 1.6; }
    .resel-btn {
      padding: 8px 14px; border: 1.5px solid #BDBDBD; border-radius: 10px;
      background: #fff; color: #666; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .resel-btn:hover { background: #F5F5F5; border-color: #999; }

    /* 选择区折叠 */
    .selection-area { transition: max-height 0.3s ease, opacity 0.2s ease; overflow: hidden; }
    .selection-area.collapsed { max-height: 0 !important; opacity: 0; pointer-events: none; }
    .selection-area.expanded { opacity: 1; }

    /* ── 摘要流式输出 ── */
    .sum-req-content {
      font-size: 14px; color: #555; line-height: 1.8;
      max-height: 260px; overflow-y: auto;
    }
    .sum-req-content p { margin: 0 0 10px 0; }
    .sum-req-content .section-title {
      font-weight: 700; color: #333; margin: 14px 0 4px; font-size: 14px;
    }
    .sum-req-content .tip-box {
      background: #E3F2FD; border-radius: 10px; padding: 10px 12px;
      margin: 8px 0; font-size: 13px; color: #1565C0;
    }
    .sum-req-content .story-box {
      background: #FFF8E1; border-radius: 10px; padding: 10px 12px;
      margin: 8px 0; font-size: 13px; color: #795548;
    }

    /* braille 旋转加载 */
    @keyframes braille-spin {
      0% { content: '⣾'; }
      8% { content: '⣽'; }
      16% { content: '⣻'; }
      24% { content: '⢿'; }
      32% { content: '⡿'; }
      40% { content: '⣟'; }
      48% { content: '⣯'; }
      56% { content: '⣷'; }
      64% { content: '⣾'; }
    }
    .spinner::before {
      content: '⣾';
      animation: braille-spin 0.8s infinite;
      display: inline-block;
    }
    .spinner { color: #999; font-size: 14px; }

    /* 模型标签 */
    .model-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #F5F5F5; border: 1px solid #E0E0E0; border-radius: 6px;
      padding: 2px 8px; font-size: 11px; color: #999;
      margin-top: 6px;
    }
    .model-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: #4CAF50; }

    /* 归档 */
    .archived-toggle { display: block; width: 100%; padding: 12px; background: #F5F5F5; border: 2px dashed #BDBDBD; border-radius: 12px; font-size: 15px; color: #7F8C8D; cursor: pointer; text-align: center; margin-top: 8px; }
    .archived-section { display: none; margin-top: 10px; }
    .archived-section.open { display: block; }
    .archived-section h4 { font-size: 13px; color: #BDBDBD; margin-bottom: 8px; text-align: center; }
    .archived-item-btn { padding: 10px 8px; background: #E0E0E0; color: #7F8C8D; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; text-align: center; text-decoration: line-through; }
    .archived-item-btn.selected { background: #FF6B6B; color: white; }

    /* 今日记录 */
    .today-records { display: none; margin-top: 8px; margin-bottom: 12px; }
    .today-records.visible { display: block; }
    .today-records h3 { font-size: 18px; color: #4ECDC4; margin-bottom: 10px; }
    .empty-records { text-align: center; color: #BDBDBD; font-size: 14px; padding: 24px 12px; line-height: 1.6; }
    .record-item { display: flex; align-items: center; justify-content: space-between; background: #FFF; border: 2px solid #E0E0E0; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
    .record-item .item-name { font-size: 16px; font-weight: bold; color: #333; }
    .record-item .item-mins { font-size: 14px; color: #7F8C8D; margin-top: 2px; }
    .record-item .delete-btn { background: #FF6B6B; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; flex-shrink: 0; }

    /* 页脚 - 记录卡片下方的励志文案 */
    .practice-footer {
      text-align: center;
      color: #9E9E9E;
      font-size: 15px;
      padding: 9px 12px;
      font-style: italic;
      margin-bottom: 0;
    }

  <script>

    // ── 老师要求数据 ──
    const WEEKLY_ASSIGN = {{assign_json}};
    const SUBJECT_INFO = {{subject_info_json}};

    // Filter practice items by search query
    function filterItems(q) {
      q = q.trim().toLowerCase();
      document.querySelectorAll('.item-btn').forEach(btn => {
        btn.style.display = (q === '' || btn.textContent.toLowerCase().includes(q)) ? '' : 'none';

          prev.style.display = hasVisible ? '' : 'none';
        }
      });
    }

    let selectedItem = null;
    let selectedItemId = null;
    let duration = 10;
    let elapsed = 0;
    let timerInterval = null;
    let started = false;
    let timerRunning = false;
    let paused = false;  // U-4:暂停态(可继续)
    let finishPending = false;  // 提前结束但未打卡
    let submitting = false;  // 防重放：打卡请求进行中
    let pendingExtraMins = 10;  // 副半圆 picker 当前选值
    let timerPicker = null;  // 主半圆 picker 实例
    let extraPicker = null;  // 副半圆 picker 实例
    let todayDate = "{{today_date}}";
    let enterTime = new Date().toISOString();  // 行为日志：进入时间

    // ── 实时时钟 ──
    function updateClock() {
      const now = new Date();
      const y = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const pad = document.getElementById('serverClock');
      if (pad) { pad.textContent = `${y}-${mo}-${d} ${h}:${mi}:${s}`; }
    }
    setInterval(updateClock, 1000);
    updateClock();
    let pendingNav = null;

    // ── 老科目加载 ──
    let archivedLoaded = false;
    async function loadArchivedToggle() {
      try {
        let res = await fetch('/api/items?include_archived=false');
        let data = await res.json();
        let res2 = await fetch('/api/items?include_archived=true');
        let data2 = await res2.json();
        let total = data2.items.length;
        let active = data.items.length;
        if (total > active) {
          document.getElementById('archivedToggleWrap').innerHTML =
            '<button class="archived-toggle" onclick="toggleArchived()">📁 老科目 (' + (total - active) + ')</button>';
        }
      } catch(e) {}
    }
    async function toggleArchived() {
      let wrap = document.getElementById('archivedToggleWrap');
      let existing = document.querySelector('.archived-section');
      if (existing) { existing.classList.toggle('open'); return; }
      try {
        let res = await fetch('/api/items?include_archived=true');
        let data = await res.json();
        let archived = data.items.filter(i => i.is_archived);
        if (archived.length === 0) return;
        let html = '<div class="archived-section open"><h4>📁 老科目</h4>';
        html += '<div class="item-grid">';
        archived.forEach(it => {
          html += '<button class="archived-item-btn" onclick="selectArchivedItem(\'' + it.name.replace(/'/g, "\\'") + '\', ' + it.id + ', this, event)">' + it.name + '</button>';
        });
        html += '</div></div>';
        wrap.insertAdjacentHTML('beforeend', html);
      } catch(e) {}
    }

    // 更新左栏老师要求显示
    function updateReqPanel(reqText) {
      const tip = document.getElementById('reqTip');
      if (reqText) {
        tip.innerHTML = '<div class="req-highlight"><span class="spinner"></span> <span style="color:#aaa">正在加载...</span></div>';
        setTimeout(() => {
          tip.innerHTML = '<div class="req-highlight"><span class="req-text"></span></div>';
          animateReqText(tip.querySelector('.req-text'), reqText);
        }, 200);
      } else {
        tip.innerHTML = '<div class="req-empty">暂无老师要求<br>直接开始练习吧！</div>';
      }
    }

    // 逐字动画渲染老师要求（与 story 同款 GSAP Y 轴动效）
    let _lastReqLen = 0;
    function animateReqText(el, text) {
      _lastReqLen = 0;
      el.textContent = '';
      // 模拟流式：分批追加字符
      const chars = text.split('');
      const batchSize = 3;
      let idx = 0;
      function addBatch() {
        const end = Math.min(idx + batchSize, chars.length);
        const frag = document.createDocumentFragment();
        for (let i = idx; i < end; i++) {
          const span = document.createElement('span');
          span.textContent = chars[i];
          span.style.display = 'inline-block';
          frag.appendChild(span);
        }
        el.appendChild(frag);
        const newSpans = Array.from(el.children).slice(idx);
        if (newSpans.length && typeof gsap !== 'undefined') {
          gsap.from(newSpans, {
            y: '100%', opacity: 0, filter: 'blur(4px)',
            ease: 'power4.out', duration: 0.3, stagger: 0.015,
          });
        }
        idx = end;
        if (idx < chars.length) {
          setTimeout(addBatch, 30);
        } else {
          // 最终态：合并为纯文本
          setTimeout(() => { el.textContent = text; }, 400);
        }
      }
      addBatch();
    }

    // ── 选中摘要 + 收拢/展开 ──
    function updateSelectedSummary(name, id, reqText, btn) {
      const isReq = btn && btn.classList.contains('has-req');
      const info = SUBJECT_INFO[id];

      // sumFullName: 流式生成练习心情
      const sumFullName = document.getElementById('sumFullName');
      sumFullName.innerHTML = '<span class="spinner"></span> 正在生成练习心情...';
      sumFullName.style.color = '#aaa';
      streamMood(id, name, sumFullName);

      // sumTag: 科目名 + ID
      const sumTag = document.getElementById('sumTag');
      document.getElementById('sumName').textContent = name;
      document.getElementById('sumId').textContent = '#' + id;
      sumTag.className = 'sum-tag ' + (isReq ? 'tag-req' : 'tag-normal');

      // sumReq: 流式生成完整摘要
      const sumReq = document.getElementById('sumReq');
      sumReq.innerHTML = '<span class="spinner"></span> <span style="color:#aaa">正在生成摘要...</span>';
      streamSummary(id, name, sumReq);
    }

    // 流式生成练习心情
    async function streamMood(id, name, el) {
      try {
        const resp = await fetch('/api/subject_mood/' + id + '?name=' + encodeURIComponent(name));
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let text = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data.trim() === '[DONE]') break;
              try {
                const chunk = JSON.parse(data);
                if (chunk.text) {
                  text += chunk.text;
                  el.textContent = text;
                  el.style.color = '#333';
                }
              } catch(e) {}
            }
          }
        }
        if (!text) { el.textContent = '练习加油 💪'; el.style.color = '#333'; }
      } catch(e) { el.textContent = '练习加油 💪'; el.style.color = '#333'; }
    }

    // 流式生成完整摘要
    async function streamSummary(id, name, el) {
      try {
        const resp = await fetch('/api/subject_summary/' + id + '?name=' + encodeURIComponent(name));
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let text = '';
        let done = false;
        while (!done) {
          const { done: d, value } = await reader.read();
          if (d) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data.trim() === '[DONE]') { done = true; break; }
              try {
                const chunk = JSON.parse(data);
                if (chunk.text) {
                  text += chunk.text;
                  renderStoryText(el, text);
                }
              } catch(e) {}
            }
          }
        }
        if (!text) {
          el.innerHTML = '<span style="color:#aaa">暂无小故事</span>';
        } else {
          renderStoryText(el, text, true);
        }
      } catch(e) {
        el.innerHTML = '<span style="color:#aaa">暂无小故事</span>';
      }
    }

    // GSAP Y 轴动画渲染流式文字
    let _lastStoryLen = 0;
    function renderStoryText(el, text, isFinal) {
      const clean = text.replace(/^[\s\n]*/, '');
      if (!clean) return;

      // 首次渲染：建结构
      if (!el.querySelector('.story-text')) {
        el.innerHTML = '<div class="sum-req-content"><div class="story-text" style="font-size:15px;line-height:1.9;color:#444;letter-spacing:0.3px;"></div></div><div class="model-tag"><span class="dot"></span> Gemini 2.5 Flash-Lite</div>';
        _lastStoryLen = 0;
      }

      const storyEl = el.querySelector('.story-text');
      const newChars = clean.slice(_lastStoryLen);
      if (!newChars) return;

      // 追加新字符，每个包在 span 里做动画
      const frag = document.createDocumentFragment();
      for (const ch of newChars) {
        const span = document.createElement('span');
        span.textContent = ch;
        span.style.display = 'inline-block';
        frag.appendChild(span);
      }
      storyEl.appendChild(frag);

      // GSAP 动画新字符
      const allSpans = storyEl.querySelectorAll('span');
      const newSpans = Array.from(allSpans).slice(_lastStoryLen);
      if (newSpans.length && typeof gsap !== 'undefined') {
        gsap.from(newSpans, {
          y: '100%',
          opacity: 0,
          filter: 'blur(4px)',
          ease: 'power4.out',
          duration: 0.4,
          stagger: 0.02,
        });
      }

      _lastStoryLen = clean.length;

      // 最终态：合并为纯文本
      if (isFinal) {
        setTimeout(() => {
          storyEl.textContent = clean;
          storyEl.style.opacity = '1';
        }, 600);
      }
    }
    function collapseSelection() {
      const area = document.getElementById('selectionArea');
      const summary = document.getElementById('selectedSummary');
      area.style.maxHeight = area.scrollHeight + 'px';
      requestAnimationFrame(() => { area.classList.remove('expanded'); area.classList.add('collapsed'); });
      summary.classList.add('visible');
      // 滚动到 item-section 可见
      document.querySelector('.item-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function toggleReselect() {
      const area = document.getElementById('selectionArea');
      const summary = document.getElementById('selectedSummary');
      summary.classList.remove('visible');
      area.classList.remove('collapsed');
      area.classList.add('expanded');
      area.style.maxHeight = area.scrollHeight + 'px';
      setTimeout(() => { area.style.maxHeight = ''; }, 350);
    }

    function selectArchivedItem(name, id, btn, e) {
      if (e) e.stopPropagation();
      document.querySelectorAll('.archived-item-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
      selectedItem = name;
      selectedItemId = id;
      resetTimer();
      refreshExtraSection();

      const reqText = btn ? btn.getAttribute('data-req') : null;
      updateReqPanel(reqText || '');

      // 更新选中摘要
      updateSelectedSummary(name, id, reqText, btn);

      // 收拢选择区
      collapseSelection();

      // 更新选中科目气泡
      const bubble = document.getElementById('itemBubble');
      const bubbleName = document.getElementById('bubbleName');
      bubbleName.textContent = name;
      bubble.style.display = 'flex';
      bubble.classList.remove('animate');
      requestAnimationFrame(() => { bubble.classList.add('animate'); });
      document.getElementById('startBtn').disabled = false;
      document.getElementById('addExtraBtn').disabled = false;
      const addBtn = document.getElementById('addExtraBtn');
      if (addBtn) addBtn.disabled = !selectedItemId;
    }

    // 更新左栏老师要求显示

    // ── 计时器防跳出 ──
    function setupTimerProtect() {
      document.querySelectorAll('.nav a').forEach(a => {
        a.addEventListener('click', e => {
          if (!timerRunning && !finishPending) return;
          const href = a.getAttribute('href');
          if (!href || href === window.location.pathname) return;
          e.preventDefault();
          pendingNav = href;
          document.getElementById('timerProtectModal').classList.add('open');
        });
      });
      window.addEventListener('beforeunload', e => {
        if (timerRunning || finishPending) { e.preventDefault(); e.returnValue = ''; }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && (timerRunning || finishPending)) { pendingNav = null; }
      });
    }
    function closeTimerProtect() {
      document.getElementById('timerProtectModal').classList.remove('open');
      pendingNav = null;
    }
    function confirmLeave() {
      timerRunning = false;
      finishPending = false;
      clearInterval(timerInterval);
      started = false;
      document.getElementById('timerProtectModal').classList.remove('open');
      if (pendingNav) window.location.href = pendingNav;
    }

    // ── 计时器主逻辑 ──
    function selectItem(name, id, btn, e) {
      if (e) e.stopPropagation();
      document.querySelectorAll('.archived-item-btn').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
      // 移除旧脉冲环
      document.querySelectorAll('.sel-ring').forEach(r => r.remove());
      if (btn) {
        btn.classList.add('selected');
        // 添加脉冲环
        const ring = document.createElement('div');
        ring.className = 'sel-ring';
        btn.appendChild(ring);
        setTimeout(() => { if (ring.parentNode) ring.remove(); }, 1500);
      }
      selectedItem = name;
      selectedItemId = id;
      resetTimer();
      refreshExtraSection();

      const reqText = btn ? btn.getAttribute('data-req') : null;
      updateReqPanel(reqText || '');

      // 更新选中摘要
      updateSelectedSummary(name, id, reqText, btn);

      // 收拢选择区
      collapseSelection();

      // 更新选中科目气泡
      const bubble = document.getElementById('itemBubble');
      const bubbleName = document.getElementById('bubbleName');
      bubbleName.textContent = name;
      bubble.style.display = 'flex';
      bubble.classList.remove('animate');
      requestAnimationFrame(() => { bubble.classList.add('animate'); });
      document.getElementById('startBtn').disabled = false;
      document.getElementById('addExtraBtn').disabled = false;
      const addBtn = document.getElementById('addExtraBtn');
      if (addBtn) addBtn.disabled = !selectedItemId;
    }

    function setDuration(mins) {
      duration = mins;
      if (typeof timerPicker !== 'undefined' && timerPicker) {
        timerPicker.setValue(mins);
      } else {
        const hint = document.getElementById('timerHint');
        const num = document.querySelector('.timer-center-value .num');
        if (num) num.textContent = mins;
        if (hint) hint.textContent = '默认 ' + mins;
      }
      if (!started) resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      started = false;
      timerRunning = false;
      paused = false;
      finishPending = false;
      elapsed = 0;
      // 恢复中央 num 为 idle 形式("10" 单数字 + 30px 或 42px idle)
      const numEl = document.getElementById('timerNum');
      const unitEl = document.getElementById('timerUnit');
      const hintEl = document.getElementById('timerHint');
      if (numEl) {
        numEl.classList.add('idle');
        numEl.classList.remove('flipping');
        // 用 picker 当前值
        const cur = (typeof timerPicker !== 'undefined' && timerPicker && timerPicker.currentMin) || 10;
        numEl.textContent = String(cur);
      }
      if (unitEl) unitEl.textContent = '分钟';
      if (hintEl) hintEl.textContent = '拖动选择 · 默认 10';
      document.getElementById('timer-display').textContent = '00:00';
      document.getElementById('startBtn').textContent = '开始';
      document.getElementById('startBtn').disabled = !selectedItemId;
      document.getElementById('finishEarlyBtn').style.display = 'none';
      const confirmArea = document.getElementById('confirmArea');
      if (confirmArea) confirmArea.classList.remove('show');
      // 重新显示 picker + 数字,隐藏时间显示
      const pickerWrap = document.getElementById('timerPickerWrap');
      const timeDisp = document.getElementById('timer-display');
      if (pickerWrap) pickerWrap.style.display = '';
      if (timeDisp) timeDisp.style.display = 'none';
      const addBtn = document.getElementById('addExtraBtn');
      if (addBtn) addBtn.disabled = !selectedItemId;
    }

    function toggleTimer() {
      if (!selectedItemId) return;
      if (started && !paused) {
        // 暂停(U-4):停止计时但保留 elapsed
        clearInterval(timerInterval);
        paused = true;
        timerRunning = false;
        document.getElementById('startBtn').textContent = '继续';
        document.getElementById('finishEarlyBtn').textContent = '提前结束';
        renderTimerDisplay();
        return;
      }
      if (started && paused) {
        // 继续
        paused = false;
        timerRunning = true;
        document.getElementById('startBtn').textContent = '暂停';
        document.getElementById('finishEarlyBtn').textContent = '提前结束';
        renderTimerDisplay();
        startTickInterval();
        return;
      }
      // 首次开始 — picker 保留,中央 num 变 mm:ss
      started = true;
      paused = false;
      timerRunning = true;
      elapsed = 0;
      document.getElementById('startBtn').textContent = '暂停';
      document.getElementById('finishEarlyBtn').style.display = 'inline-block';
      document.getElementById('finishEarlyBtn').textContent = '提前结束';
      // 中央 num 切换为 mm:ss 形式
      const numEl = document.getElementById('timerNum');
      if (numEl) {
        numEl.classList.remove('idle');
      }
      const unitEl = document.getElementById('timerUnit');
      if (unitEl) unitEl.textContent = '已练习';
      const hintEl = document.getElementById('timerHint');
      if (hintEl) hintEl.textContent = '加油哦~';
      renderTimerDisplay(true);
      // 首次 start 触发首次 glitch 动效(由 renderTimerDisplay forceRebuild 内部处理)
      startTickInterval();
    }

    // 渲染中央数字 mm:ss,半角冒号,带 GSAP glitch 动效(只对变化的数字触发)
    // 1:1 适配自 React/GSAP TextGlitchPortal(原代码无限循环,我们改为只在数字变化那一刻触发)
    function glitchAnimateDigit(digitEl) {
      if (!digitEl) return;
      // 初始态:大+模糊+透明
      gsap.set(digitEl, { opacity: 0, scale: 3, filter: 'blur(20px)', textShadow: '0 0 0 transparent', x: 0 });
      const tl = gsap.timeline();
      // 段 1:出现(scale 3→1.5, blur 20→10, 出现红/青阴影)
      tl.to(digitEl, {
        opacity: 1, scale: 1.5, filter: 'blur(10px)',
        textShadow: '-5px 0 #ff0000, 5px 0 #00ffff',
        duration: 0.18, ease: 'power2.out'
      });
      // 段 2:阴影抖动(red/cyan 抖动, x 随机)
      tl.to(digitEl, {
        textShadow: '3px 0 #ff0000, -3px 0 #00ffff',
        x: gsap.utils.random(-5, 5),
        duration: 0.04, repeat: 4, yoyo: true, ease: 'none'
      });
      // 段 3:弹性回位(scale 1.5→1, blur 0, 阴影消失, x 0)
      tl.to(digitEl, {
        scale: 1, filter: 'blur(0px)',
        textShadow: '0 0 0 transparent', x: 0,
        duration: 0.25, ease: 'elastic.out(1, 0.5)'
      });
    }

    function renderTimerDisplay(forceRebuild) {
      const numEl = document.getElementById('timerNum');
      if (!numEl) return;
      const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const s = (elapsed % 60).toString().padStart(2, '0');
      if (forceRebuild) {
        // 重建 digit 节点(digit × 4 + colon × 1)
        numEl.innerHTML = '';
        for (let i = 0; i < m.length; i++) {
          const d = document.createElement('span');
          d.className = 'digit';
          d.textContent = m[i];
          d.style.transformOrigin = '50% 50%';
          numEl.appendChild(d);
        }
        const colon = document.createElement('span');
        colon.className = 'colon';
        colon.textContent = ':';
        numEl.appendChild(colon);
        for (let i = 0; i < s.length; i++) {
          const d = document.createElement('span');
          d.className = 'digit';
          d.textContent = s[i];
          d.style.transformOrigin = '50% 50%';
          numEl.appendChild(d);
        }
        // 首次 start 触发全部 4 digit 的 glitch 动效
        if (timerRunning && !paused) {
          const digits = numEl.querySelectorAll('.digit');
          digits.forEach(d => glitchAnimateDigit(d));
        }
        return;
      }
      const digits = numEl.querySelectorAll('.digit');
      if (digits.length === 4) {
        // m1 m2 : s1 s2(digit 只有 4 个,colon 在 numEl.querySelectorAll('.digit') 之外)
        // 实际 digits.length 是 4,colon 是 .colon 不是 .digit
        // 检测哪些数字变了 → 对变化的 digit 触发 glitch 动效
        const oldTexts = [digits[0].textContent, digits[1].textContent, digits[2].textContent, digits[3].textContent];
        if (digits[0].textContent !== m[0]) digits[0].textContent = m[0];
        if (digits[1].textContent !== m[1]) digits[1].textContent = m[1];
        if (digits[2].textContent !== s[0]) digits[2].textContent = s[0];
        if (digits[3].textContent !== s[1]) digits[3].textContent = s[1];
        // 只对变化的 digit 触发 glitch 动效
        if (timerRunning && !paused) {
          if (oldTexts[0] !== digits[0].textContent) glitchAnimateDigit(digits[0]);
          if (oldTexts[1] !== digits[1].textContent) glitchAnimateDigit(digits[1]);
          if (oldTexts[2] !== digits[2].textContent) glitchAnimateDigit(digits[2]);
          if (oldTexts[3] !== digits[3].textContent) glitchAnimateDigit(digits[3]);
        }
      } else {
        // 退化:直接 textContent
        numEl.textContent = m + ':' + s;
      }
    }

    function startTickInterval() {
      timerInterval = setInterval(() => {
        elapsed++;
        renderTimerDisplay();   // 不传 forceRebuild,走保留 DOM 路径,只对变化的 digit 触发
        if (elapsed >= duration * 60) {
          clearInterval(timerInterval);
          timerRunning = false;
          started = false;
          paused = false;
          document.getElementById('finishEarlyBtn').style.display = 'none';
          document.getElementById('startBtn').textContent = '开始';
          // 修复：正常结束不再自动提交，弹 finishNormalModal 让用户点 打卡/放弃
          document.getElementById('finishNormalMinsDisplay').textContent = duration;
          document.getElementById('confirmMins').textContent = duration;
          const normalModal = document.getElementById('finishNormalModal');
          normalModal.classList.add('open');
          gsap.fromTo('#finishNormalModal .finish-modal-box', { scale: 0.5, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2)' });
          playChime();
        }
      }, 1000);
    }

    function confirmFinishNormal() {
      // 正常结束 → 确认打卡
      document.getElementById('finishNormalModal').classList.remove('open');
      submitPractice();
    }

    function cancelFinishNormal() {
      // 正常结束 → 放弃本次练习,清零
      document.getElementById('finishNormalModal').classList.remove('open');
      resetTimer();
    }

    // 全局:弹窗前保存的 elapsed,供 cancelFinishEarly 恢复用
    let finishSavedElapsed = 0;

    function finishEarly() {
      if (finishPending) return;       // 防双击：已提前结束则忽略
      if (elapsed === 0) return;       // 从未计时则忽略(暂停态 elapsed>0,允许提前结束)
      clearInterval(timerInterval);
      timerRunning = false;
      paused = false;
      finishPending = true;  // 标记提前结束但未打卡
      const savedElapsed = elapsed;    // 先保存再清零，防竞态
      finishSavedElapsed = savedElapsed;   // 持久化到全局,供 cancelFinishEarly 用
      const finalMins = Math.max(1, Math.ceil(savedElapsed / 60));
      // 不重置 elapsed,保留以备 cancel 恢复
      started = false;
      document.getElementById('startBtn').textContent = '开始';
      document.getElementById('finishEarlyBtn').style.display = 'none';
      // 显示弹窗确认
      document.getElementById('finishMinsDisplay').textContent = finalMins;
      document.getElementById('finishEarlyModal').classList.add('open');
      // 弹窗入场动效
      gsap.fromTo('.finish-modal-box', { scale: 0.5, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' });
    }

    function confirmFinishEarly() {
      document.getElementById('finishEarlyModal').classList.remove('open');
      document.getElementById('confirmMins').textContent = document.getElementById('finishMinsDisplay').textContent;
      submitPractice();
    }

    function cancelFinishEarly() {
      document.getElementById('finishEarlyModal').classList.remove('open');
      // 恢复计时状态，继续练习
      finishPending = false;
      started = true;
      paused = false;
      timerRunning = true;
      // 恢复 elapsed(从 finishSavedElapsed,不要重置)
      elapsed = finishSavedElapsed;
      document.getElementById('startBtn').textContent = '暂停';
      document.getElementById('finishEarlyBtn').style.display = 'inline-block';
      // 重建中央数字 + 恢复 unit 文案"已练习"
      const numEl = document.getElementById('timerNum');
      const unitEl = document.getElementById('timerUnit');
      if (numEl) numEl.classList.remove('idle');
      if (unitEl) unitEl.textContent = '已练习';
      renderTimerDisplay(true);   // 重建 digit 节点
      startTickInterval();
    }

    function abortFinishEarly() {
      // 不练了: 取消当前计时,回到 idle 状态,不打卡
      document.getElementById('finishEarlyModal').classList.remove('open');
      finishPending = false;
      started = false;
      paused = false;
      timerRunning = false;
      elapsed = 0;
      finishSavedElapsed = 0;
      clearInterval(timerInterval);
      // 中央数字回到 idle "10" / "分钟"
      const numEl = document.getElementById('timerNum');
      const unitEl = document.getElementById('timerUnit');
      const hintEl = document.getElementById('timerHint');
      if (numEl) {
        numEl.classList.remove('flipping');
        numEl.classList.add('idle');
        numEl.textContent = '10';
      }
      if (unitEl) unitEl.textContent = '分钟';
      if (hintEl) hintEl.textContent = '拖动选择 · 默认 10';
      // 按钮恢复
      const startBtn = document.getElementById('startBtn');
      const finishBtn = document.getElementById('finishEarlyBtn');
      startBtn.textContent = '开始';
      finishBtn.style.display = 'none';
      // 重置 timer picker knob 到默认 10 位置
      // 10min 对应角度 = π - ((10-5)/(30-5))*π = π/2 = 90°
      // P_CX=200, P_CY=200, P_R=150 → x=200+150*cos(π/2)=200, y=200-150*sin(π/2)=50
      const timerKnob = document.querySelector('#timerPickerSvg .dizi-picker-knob');
      if (timerKnob) {
        timerKnob.setAttribute('transform', 'translate(200, 50) scale(1)');
      }
      // 重置 timer 进度弧(0 长度)
      const timerProgress = document.querySelectorAll('#timerPickerSvg path')[1];
      if (timerProgress) {
        timerProgress.setAttribute('stroke-dasharray', '20 100');   // 10min = 5/25 = 20%
      }
      // 重置 finishSave 标志
      finishSavedElapsed = 0;
    }

    async function submitPractice() {
      if (submitting) return;  // 防重放
      if (!selectedItem) return;
      let finalMins = parseInt(document.getElementById('confirmMins').textContent) || 0;
      if (finalMins === 0) return;
      submitting = true;
      try {
        let res = await fetch('/api/log', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, item: selectedItem, item_id: selectedItemId, minutes: finalMins, log: '', behavior_log: [{enter_time: enterTime, item: selectedItem, minutes: finalMins}]})
        });
        let json = await res.json();
        if (json.ok) {
          timerRunning = false;
          finishPending = false;
          fireConfetti();
          // 显示成功消息，但保留 confirmMins 元素（后续打卡还需要它）
          const confirmArea4 = document.getElementById('confirmArea');
          if (confirmArea4) {
            const confirmP = confirmArea4.querySelector('p');
            if (confirmP) {
              confirmP.dataset.originalHtml = confirmP.innerHTML;
              confirmP.innerHTML = '🎉 打卡成功！太棒啦！';
            }
            confirmArea4.classList.add('show');
            gsap.fromTo('#confirmArea', { scale: 0.5, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "back.out(2)" });
          }
          loadTodayRecords();
          setTimeout(() => {
            // 恢复 confirmArea 原始 HTML（包含 confirmMins 元素）
            const confirmArea5 = document.getElementById('confirmArea');
            if (confirmArea5) {
              const confirmP2 = confirmArea5.querySelector('p');
              if (confirmP2 && confirmP2.dataset.originalHtml) {
                confirmP2.innerHTML = confirmP2.dataset.originalHtml;
                delete confirmP2.dataset.originalHtml;
              }
            }
            // 只有没开始新计时才重置（防止打卡后立即继续练习被误清零）
            if (!started) {
              resetTimer();
              document.querySelectorAll('.item-btn, .archived-item-btn').forEach(b => b.classList.remove('selected'));
              selectedItem = null;
              updateReqPanel('');
            }
            const confirmArea6 = document.getElementById('confirmArea');
            if (confirmArea6) confirmArea6.classList.remove('show');
          }, 2500);
        } else {
          alert('打卡失败：' + (json.message || json.error));
        }
      } catch (e) {
        console.error('打卡请求失败:', e);
        alert('网络错误，请重试');
      } finally {
        submitting = false;
      }
    }

    // ── 额外练习时间 ──

      try {
        let res = await fetch('/api/practices/' + todayDate);
        let data = await res.json();
        let logList = document.getElementById('extraLogList');
        let extras = (data.items || []).filter(it => it.is_extra);
        if (extras.length === 0) {
          logList.innerHTML = '<div style="font-size:13px;color:#A5D6A7;text-align:center;padding:6px;">暂无额外记录</div>';
        } else {
          logList.innerHTML = extras.map(it => `
            <div class="extra-log-item">
              <span>${it.item}</span>
              <span class="extra-mins">+${it.minutes}分钟</span>
              <button class="extra-del" onclick="deleteExtraRecord('${it.item_id}')">✕</button>
            </div>
          `).join('');
        }
      } catch(e) {}
    }

    async function addExtraMins(mins) {
      if (!selectedItem) return;
      try {
        let res = await fetch('/api/log', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, item: selectedItem, item_id: selectedItemId, minutes: mins, log: '', is_extra: true, behavior_log: [{enter_time: enterTime, item: selectedItem, minutes: mins}]})

    async function addExtraFromPicker() {
      if (!selectedItem) return;
      if (!pendingExtraMins || pendingExtraMins < 1) {
        alert('请先在补录 picker 拖动选择分钟数');
        return;
      }
      await addExtraMins(pendingExtraMins);
    }

    async function deleteExtraRecord(id) {
      if (!confirm('确定要删除这条额外练习记录吗？')) return;
      try {
        let res = await fetch('/api/log', {
          method: 'DELETE',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, id: id})
        });
        let result = await res.json();
        if (result.ok) {
          refreshExtraSection();
          renderTodayRecords(result.items || [], result.total_minutes || 0);
        } else {
          alert('删除失败: ' + (result.error || '未知错误'));
        }
      } catch(e) { console.error(e); }

    // Load today's records from API
    function renderTodayRecords(items, total) {
      let recordsList = document.getElementById('recordsList');
      let card = document.querySelector('.today-records');
      if (!items || items.length === 0) {
        recordsList.innerHTML = '<div class="empty-records">还没有练习记录，开始练习吧！</div>';

      } else {

          <div class="record-item">

        gsap.fromTo('.record-item', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.1, ease: "power3.out" });

    async function loadTodayRecords() {
      try {
        let res = await fetch('/api/practices/' + todayDate);
        let data = await res.json();
        renderTodayRecords(data.items || [], data.total_minutes || 0);
      } catch(e) {
        document.getElementById('recordsList').innerHTML = '<div class="empty-records">加载失败: ' + e.message + '</div>';
      }
    }

    async function deleteRecord(id) {
      if (!confirm('确定要删除这条练习记录吗？')) return;
      try {
        let res = await fetch('/api/log', {
          method: 'DELETE',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, id: id})
        });
        let result = await res.json();
        if (result.ok) {
          renderTodayRecords(result.items || [], result.total_minutes || 0);
        } else {
          alert('删除失败: ' + (result.error || '未知错误'));
        }
      } catch(e) { console.error(e); }
    }

    // ════════════════════════════════════════════════
    // 半圆弧 Picker 工厂(本地版,直接嵌 practice.html,避免额外 HTTP 请求)
    // 改自 uiux-asset-library/dizi-practice-picker v1
    // 5-30min 固定 5min 步长 + GSAP attr.transform 复合 translate+scale
    // ════════════════════════════════════════════════
    const PICKER_MIN = 5, PICKER_MAX = 30, PICKER_STEP = 1;
    // 5/10/15/20/25/30 整数吸附:knob 落定后吸附到这些值附近
    const P_STICK_VALS = [5, 10, 15, 20, 25, 30];
    const P_STICK_RADIUS = 0.6;   // 距整数吸附点 < 0.6 min 时吸附
    function pApplyStick(m) {
      for (const v of P_STICK_VALS) {
        if (Math.abs(m - v) <= P_STICK_RADIUS) return v;
      }
      return Math.round(m);
    }
    const P_W = 400, P_H = 220, P_CX = 200, P_CY = 200, P_R = 150, P_STROKE = 14;
    function pMinToAngle(m) { return Math.PI - ((m - PICKER_MIN) / (PICKER_MAX - PICKER_MIN)) * Math.PI; }
    function pAngleToMin(a) { return PICKER_MIN + ((Math.PI - a) / Math.PI) * (PICKER_MAX - PICKER_MIN); }
    function pClamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function createPicker(opts) {
      const {
        svgEl, valueEl, hintEl, color, colorGlow, trackColor,
        onChange, stateRef, initial = 10
      } = opts;
      const SVG_NS = 'http://www.w3.org/2000/svg';
      svgEl.innerHTML = '';

      const arcStart = { x: P_CX - P_R, y: P_CY };
      const arcEnd   = { x: P_CX + P_R, y: P_CY };
      const arcPath = `M ${arcStart.x} ${arcStart.y} A ${P_R} ${P_R} 0 0 1 ${arcEnd.x} ${arcEnd.y}`;

      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', arcPath);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', trackColor);
      path.setAttribute('stroke-width', P_STROKE);
      path.setAttribute('stroke-linecap', 'round');
      svgEl.appendChild(path);

      const progress = document.createElementNS(SVG_NS, 'path');
      progress.setAttribute('d', arcPath);
      progress.setAttribute('fill', 'none');
      progress.setAttribute('stroke', color);
      progress.setAttribute('stroke-width', P_STROKE);
      progress.setAttribute('stroke-linecap', 'round');
      progress.setAttribute('pathLength', '100');
      progress.setAttribute('stroke-dasharray', '0 100');
      progress.style.filter = `drop-shadow(0 0 8px ${colorGlow})`;
      svgEl.appendChild(progress);

      for (let m = PICKER_MIN; m <= PICKER_MAX; m += PICKER_STEP) {
        const isMajor = (m % 5 === 0);
        const a = pMinToAngle(m);
        const tickInner = P_R - (isMajor ? 10 : 6);
        const tickOuter = P_R + (isMajor ? 14 : 9);
        const inner = { x: P_CX + tickInner * Math.cos(a), y: P_CY - tickInner * Math.sin(a) };
        const outer = { x: P_CX + tickOuter * Math.cos(a), y: P_CY - tickOuter * Math.sin(a) };
        const tick = document.createElementNS(SVG_NS, 'line');
        tick.setAttribute('x1', inner.x); tick.setAttribute('y1', inner.y);
        tick.setAttribute('x2', outer.x); tick.setAttribute('y2', outer.y);
        tick.setAttribute('stroke', color);
        tick.setAttribute('stroke-width', isMajor ? 2.5 : 1.5);
        tick.setAttribute('stroke-linecap', 'round');
        if (!isMajor) tick.setAttribute('opacity', '0.55');
        svgEl.appendChild(tick);

        // 仅 5 倍数显示数字标签
        if (isMajor) {
          const lblX = P_CX + (P_R + 28) * Math.cos(a);
          const lblY = P_CY - (P_R + 28) * Math.sin(a);
          const lbl = document.createElementNS(SVG_NS, 'text');
          lbl.setAttribute('x', lblX);
          lbl.setAttribute('y', lblY);
          lbl.setAttribute('text-anchor', 'middle');
          lbl.setAttribute('dominant-baseline', 'central');
          lbl.setAttribute('fill', color);
          lbl.setAttribute('font-size', '13');
          lbl.setAttribute('font-weight', '700');
          lbl.textContent = m;
          svgEl.appendChild(lbl);
        }
      }

      const knobGroup = document.createElementNS(SVG_NS, 'g');
      knobGroup.setAttribute('class', 'dizi-picker-knob');
      const knobBg = document.createElementNS(SVG_NS, 'circle');
      knobBg.setAttribute('r', 18);
      knobBg.setAttribute('fill', '#FFFFFF');
      knobBg.setAttribute('stroke', color);
      knobBg.setAttribute('stroke-width', 3);
      const knobInner = document.createElementNS(SVG_NS, 'circle');
      knobInner.setAttribute('r', 8);
      knobInner.setAttribute('fill', color);
      knobGroup.appendChild(knobBg);
      knobGroup.appendChild(knobInner);
      svgEl.appendChild(knobGroup);

      let currentMin = initial;
      let isDragging = false;
      let lastAngle = pMinToAngle(currentMin);
      let velocity = 0;
      let lastTs = 0;
      let rafId = null;
      let visualScale = 1;

      function knobPos(min) {
        const a = pMinToAngle(min);
        return { x: P_CX + P_R * Math.cos(a), y: P_CY - P_R * Math.sin(a) };
      }
      function applyTransform(min, scale) {
        const p = knobPos(min);
        knobGroup.setAttribute('transform', `translate(${p.x}, ${p.y}) scale(${scale})`);
      }
      function setKnob(min, animate) {
        const ratio = (min - PICKER_MIN) / (PICKER_MAX - PICKER_MIN);
        progress.setAttribute('stroke-dasharray', `${ratio * 100} 100`);
        if (animate && typeof gsap !== 'undefined') {
          const p = knobPos(min);
          gsap.to(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(${visualScale})` }, duration: 0.3, ease: 'power2.out' });
        } else {
          applyTransform(min, visualScale);
        }
      }
      function updateValue() {
        if (valueEl) valueEl.textContent = currentMin;
        if (onChange) onChange(currentMin);
      }

      function angleFromEvent(e) {
        const rect = svgEl.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const svgX = (clientX - rect.left) * (P_W / rect.width);
        const svgY = (clientY - rect.top)  * (P_H / rect.height);
        const dx = svgX - P_CX;
        const dy = P_CY - svgY;
        return pClamp(Math.atan2(dy, dx), 0, Math.PI);
      }

      function onPointerDown(e) {
        if (stateRef && stateRef.isRunning) return;
        isDragging = true;
        knobGroup.classList.add('dragging');
        e.preventDefault();
        const a = angleFromEvent(e);
        const m = pApplyStick(pAngleToMin(a));
        currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
        setKnob(currentMin);
        updateValue();
        velocity = 0; lastTs = 0;
      }
      function onPointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const a = angleFromEvent(e);
        const newAngle = a;
        const now = performance.now();
        if (lastTs > 0) {
          const dt = now - lastTs;
          velocity = (newAngle - lastAngle) / dt * 1000;
          velocity = pClamp(velocity, -30, 30);
        }
        lastAngle = newAngle;
        lastTs = now;
        const m = pApplyStick(pAngleToMin(newAngle));
        currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
        const targetScale = Math.abs(velocity) > 5 ? 1.15 : 1;
        if (Math.abs(targetScale - visualScale) > 0.01) {
          visualScale = targetScale;
          if (typeof gsap !== 'undefined') {
            const p = knobPos(currentMin);
            gsap.to(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(${visualScale})` }, duration: 0.1, ease: 'power1.out' });
          } else {
            applyTransform(currentMin, visualScale);
          }
        } else {
          applyTransform(currentMin, visualScale);
        }
        setKnob(currentMin);
        updateValue();   // 拖动期间数字实时变(修复 v2.4 bug)
      }
      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        knobGroup.classList.remove('dragging');
        visualScale = 1;
        if (typeof gsap !== 'undefined') {
          const p = knobPos(currentMin);
          gsap.to(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(1)` }, duration: 0.2, ease: 'power2.out' });
        } else {
          applyTransform(currentMin, 1);
        }
        if (Math.abs(velocity) > 1) {
          startMomentum();
        }
      }
      function startMomentum() {
        const FRICTION = 0.92;
        const STOP_VEL = 0.3;
        function tick(ts) {
          const dt = lastTs === 0 ? 16 : (ts - lastTs);
          velocity *= Math.pow(FRICTION, dt / 16.67);
          const curAngle = pMinToAngle(currentMin);
          let newAngle = curAngle + velocity * dt / 1000;
          if (newAngle < 0) { newAngle = 0; velocity = -velocity * 0.25; }
          if (newAngle > Math.PI) { newAngle = Math.PI; velocity = -velocity * 0.25; }
          const m = pApplyStick(pAngleToMin(newAngle));
          currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
          setKnob(currentMin);
          updateValue();
          lastTs = ts;
          if (Math.abs(velocity) <= STOP_VEL) {
            velocity = 0;
            if (typeof gsap !== 'undefined') {
              const p = knobPos(currentMin);
              gsap.fromTo(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(1)` } }, { attr: { transform: `translate(${p.x}, ${p.y}) scale(1.25)` }, duration: 0.15, yoyo: true, repeat: 1, ease: 'power2.out' });
            }
            return;
          }
          rafId = requestAnimationFrame(tick);
        }
        lastTs = 0;
        rafId = requestAnimationFrame(tick);
      }

      svgEl.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      svgEl.style.touchAction = 'none';

      setKnob(currentMin);
      updateValue();

      return {
        getValue: () => currentMin,
        setValue: (m, animate) => {
          currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
          setKnob(currentMin, animate);
          updateValue();
        },
        destroy: () => { if (rafId) cancelAnimationFrame(rafId); svgEl.innerHTML = ''; }
      };
    }

    // ── Init Picker 实例 ──
    function initPickers() {
      const timerSvg = document.getElementById('timerPickerSvg');
      const extraSvg = document.getElementById('extraPickerSvg');
      if (timerSvg) {
        const numEl = document.querySelector('.timer-center-value .num');
        const hintEl = document.getElementById('timerHint');
        timerPicker = createPicker({
          svgEl: timerSvg,
          valueEl: numEl,
          hintEl: hintEl,
          color: '#FF6B6B', colorGlow: '#FF8E8E', trackColor: '#F8D7D0',
          stateRef: { get isRunning() { return timerRunning; } },
          onChange: (m) => { duration = m; if (hintEl) hintEl.textContent = '已选 ' + m + ' 分钟 · 点开始'; },
          initial: 10
        });
      }
      if (extraSvg) {
        const numEl = document.querySelector('.extra-center-value .num');
        const hintEl = document.getElementById('extraHint');
        extraPicker = createPicker({
          svgEl: extraSvg,
          valueEl: numEl,
          hintEl: hintEl,
          color: '#4ECDC4', colorGlow: '#7EDDD5', trackColor: '#CFE9E5',
          onChange: (m) => { pendingExtraMins = m; if (hintEl) hintEl.textContent = '已选 +' + m + ' 分钟 · 点记录'; },
          initial: 10
        });
      }
    }

    // Init
    initPickers();
    loadTodayRecords();
    // 页脚励志文案轮换
    (function(){
      const quotes = [
        '慢慢来，比较快。',
        '坚持练习，让音乐自然流淌。',
        '今天的汗水，明天的旋律。',
        '每一次练习，都是成长的印记。',
        '不怕慢，就怕站。',
        '练笛如练心，功到自然成。',
        '今天也坚持了，真了不起🌟',
        '音乐是时间的艺术，你已经在路了。',
      ];
      const el = document.getElementById('practiceFooter');
      if (el) {
        const idx = Math.floor(Math.random() * quotes.length);
        el.textContent = '「 ' + quotes[idx] + ' 」';
      }
    })();
    loadArchivedToggle();
    setupTimerProtect();

    // ── 页面加载整体弹入动画 ──
    const allCards = document.querySelectorAll('.floor, .card:not(.today-records)');
    gsap.fromTo(allCards, { opacity: 0, scale: 0.88, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, stagger: 0.1, ease: "back.out(2)" });
  </script>
</body>
