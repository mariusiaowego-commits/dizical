<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>练习打卡 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body { padding-bottom: calc(87px + 20px); }

    /* 固定底部导航 - 与 prepare 风格一致 */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 4px;
      padding: 8px 8px calc(env(safe-area-inset-bottom));
      background: var(--card, #fff); box-shadow: 0 -2px 12px rgba(0,0,0,0.1); z-index: 100;
    }
    .nav a {
      flex: 1; min-width: 0; padding: 14px 8px !important; background: transparent; border-radius: 16px;
      text-align: center; text-decoration: none; color: #7F8C8D; font-size: 16px !important;
      box-shadow: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .nav a:active { transform: scale(0.95); }
    .nav a.active { background: #FF6B6B; color: white; }
    .nav-icon { font-size: 20px; }

    /* 计时器保护弹窗 */
    #timerProtectModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    #timerProtectModal.open { display: flex; }
    .modal-box {
      background: white; border-radius: 20px; padding: 28px 24px;
      max-width: 320px; width: 100%; text-align: center;
    }
    .modal-box h3 { font-size: 20px; color: #FF6B6B; margin-bottom: 12px; }
    .modal-box p { font-size: 16px; color: #555; margin-bottom: 20px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; flex-direction: column; }
    .modal-actions button { padding: 14px; border: none; border-radius: 16px; font-size: 17px; font-weight: bold; cursor: pointer; }
    .modal-actions .btn-stay { background: #4ECDC4; color: white; }
    .modal-actions .btn-leave { background: #FF6B6B; color: white; }

    /* 提前结束确认弹窗 */
    #finishEarlyModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    #finishEarlyModal.open { display: flex; }
    .finish-modal-box {
      background: white; border-radius: 24px; padding: 32px 28px;
      max-width: 340px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .finish-modal-box .finish-icon { font-size: 48px; margin-bottom: 12px; }
    .finish-modal-box h3 { font-size: 22px; color: #2E7D32; margin-bottom: 8px; }
    .finish-modal-box .finish-mins {
      font-size: 56px; font-weight: 800; color: #4ECDC4;
      line-height: 1.1; margin: 12px 0;
    }
    .finish-modal-box .finish-mins-label { font-size: 16px; color: #7F8C8D; margin-bottom: 24px; }
    .finish-modal-actions { display: flex; gap: 10px; flex-direction: column; }
    .finish-modal-actions button {
      padding: 16px; border: none; border-radius: 16px;
      font-size: 18px; font-weight: bold; cursor: pointer;
      transition: transform 0.15s;
    }
    .finish-modal-actions button:active { transform: scale(0.96); }
    .finish-modal-actions .btn-confirm { background: linear-gradient(135deg, #4ECDC4, #44B8AC); color: white; }
    .finish-modal-actions .btn-cancel { background: #F0F0F0; color: #666; }

    /* 正常结束确认弹窗（修复：正常结束不再自动提交，等待用户点确认/放弃） */
    #finishNormalModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    #finishNormalModal.open { display: flex; }

    /* 顶部状态栏 */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 4px 4px; font-size: 14px; color: #7F8C8D; margin-bottom: 8px;
    }
    .top-bar .today-stat { font-size: 15px; color: #4ECDC4; font-weight: bold; }
    .top-bar .server-clock { font-size: 13px; background: #F8F9FA; border-radius: 12px; padding: 4px 12px; }

    /* ════════════════════════════════════════════════
     *  垂直卡片 3 楼层(三栏换掉)
     *  楼层 1:老师要求 / 楼层 2:计时器 + 主半圆 picker
     *  楼层 3:额外记录 + 副半圆 picker
     * ════════════════════════════════════════════════ */
    .vertical-stack {
      display: flex; flex-direction: column; gap: 14px;
      margin-bottom: 14px; width: 100%; max-width: 100%; box-sizing: border-box;
    }
    .floor {
      background: #FFFDF5;
      border-radius: var(--radius, 16px);
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      border: 2px solid transparent;
      overflow: hidden;
    }
    .floor h3 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 700; }

    /* 楼层 1:老师要求(莫兰迪米 + 金边) */
    .floor-req { background: #FFFDF5; border-color: #F0D060; }
    .floor-req h3 { color: #8B6914; }
    .req-content {
      max-height: 200px; overflow-y: auto;
      padding: 0 4px;
      scrollbar-width: thin;
    }
    .req-empty { font-size: 15px; color: #A1887F; font-style: italic; text-align: center; padding: 24px 8px; }
    .req-label { font-size: 12px; color: #8B6914; font-weight: bold; margin-bottom: 8px; }
    .req-highlight {
      background: #FFF8E0; border-left: 4px solid #F0D060;
      padding: 12px 14px; border-radius: 0 12px 12px 0;
      font-size: 16px; color: #5D4037; line-height: 1.7;
    }

    /* 楼层 2:计时器(主半圆珊瑚红) */
    .floor-timer { background: #FFFDF5; border-color: #FF6B6B; }
    .floor-timer h3 { color: #C44545; }
    .timer-picker-wrap {
      position: relative; width: 100%; max-width: 360px;
      aspect-ratio: 1.6 / 1; margin: 0 auto;
    }
    .timer-picker-wrap svg { width: 100%; height: 100%; display: block; }
    .timer-center-value {
      position: absolute; left: 50%; top: 62%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .timer-center-value .num {
      font-size: 42px; font-weight: 800; color: #FF6B6B; line-height: 1;
    }
    .timer-center-value .unit { font-size: 14px; color: #C44545; margin-top: 2px; }
    .timer-center-value .hint { font-size: 11px; color: #A1887F; margin-top: 6px; }

    /* 楼层 3:额外记录(副半圆蒂芙尼青) */
    .floor-extra { background: #FFFDF5; border-color: #4ECDC4; }
    .floor-extra h3 { color: #2A8A82; }
    .extra-picker-wrap {
      position: relative; width: 100%; max-width: 280px;
      aspect-ratio: 1.74 / 1; margin: 0 auto;
    }
    .extra-picker-wrap svg { width: 100%; height: 100%; display: block; }
    .extra-center-value {
      position: absolute; left: 50%; top: 65%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .extra-center-value .num { font-size: 32px; font-weight: 800; color: #4ECDC4; line-height: 1; }
    .extra-center-value .unit { font-size: 12px; color: #2A8A82; margin-top: 2px; }
    .extra-center-value .hint { font-size: 11px; color: #A1887F; margin-top: 4px; }

    /* 控制按钮区 */
    .action-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px; border: none; border-radius: 24px;
      font-size: 17px; font-family: inherit; cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #4ECDC4, #44B8AC); color: white; }
    .btn-danger { background: #FF6B6B; color: white; }
    .btn-secondary { background: #F0F0F0; color: #555; }
    .btn-ghost { background: transparent; color: #4ECDC4; border: 2px solid #4ECDC4; }

    /* 选中科目气泡 */
    .item-bubble {
      background: linear-gradient(135deg, #FFE066, #FF9F43);
      border-radius: 20px; padding: 8px 16px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(255,159,67,0.3);
      align-self: center;
    }
    .item-bubble .bubble-label {
      font-size: 11px; color: rgba(255,255,255,0.85);
      font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .item-bubble .bubble-name { font-size: 16px; color: #fff; font-weight: bold; }
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .item-bubble.animate { animation: bubbleFloat 1.8s ease-in-out infinite; }

    /* 数字时间显示(可叠加在 picker 上方/替换) */
    .timer-display {
      font-size: 56px; font-weight: bold; text-align: center;
      color: #FF6B6B; letter-spacing: -2px; line-height: 1;
    }
    .timer-display.running { color: #4ECDC4; }
    .timer-display.paused { color: #F0D060; }

    /* 确认打卡区域 */
    .confirm-area {
      display: none; text-align: center;
      background: #EDF7F0; border: 2px solid #A0D8A8;
      border-radius: var(--radius, 16px); padding: 14px;
    }
    .confirm-area.show { display: block; }
    .confirm-area p { font-size: 20px; color: #2E7D32; margin-bottom: 12px; }
    .confirm-area .confirm-mins { font-size: 48px; font-weight: bold; color: #27AE60; display: block; margin: 8px 0; }

    /* 额外记录日志 */
    .extra-log-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.7); border: 1px solid #B0D8B0;
      border-radius: 8px; padding: 8px 12px; font-size: 14px;
    }
    .extra-log-item + .extra-log-item { margin-top: 6px; }

    /* Picker knob 拖拽光标 */
    .dizi-picker-knob { cursor: grab; }
    .dizi-picker-knob.dragging { cursor: grabbing; }
    .extra-log-item .extra-mins { color: #2E7D32; font-weight: bold; }
    .extra-log-item .extra-del { background: #FF6B6B; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 13px; cursor: pointer; flex-shrink: 0; }

    /* 练习科目 */
    .item-section { margin-bottom: 12px; }
    .item-section h2 { color: #FF6B6B; font-size: 20px; margin-bottom: 8px; }
    .item-section h2 span { font-size: 14px; color: #7F8C8D; font-weight: normal; }
    .item-filter-wrap { margin-bottom: 10px; }
    .item-filter-wrap input {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 2px solid #E0E0E0; font-size: 16px; box-sizing: border-box;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .item-btn {
      width: 100%; min-width: 0; min-height: 60px; height: 60px; border: none;
      border-radius: 16px; font-size: 13px; font-weight: 700;
      font-family: inherit; color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 0 6px; white-space: normal;
      overflow: hidden; text-overflow: ellipsis;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      position: relative; overflow: visible;
      box-sizing: border-box;
    }
    .item-btn:active { transform: scale(0.96); filter: brightness(0.92); }
    .item-btn:nth-child(5n+1) { background: #00CED1; }
    .item-btn:nth-child(5n+2) { background: #FF6B9D; }
    .item-btn:nth-child(5n+3) { background: #A855F7; }
    .item-btn:nth-child(5n+4) { background: #FF9F1C; }
    .item-btn:nth-child(5n+5) { background: #10B981; }
    .item-btn.selected { background: #FF4D6D !important; box-shadow: 0 4px 0 #C41E3A; transform: translateY(-2px); }
    .item-btn.selected:active { transform: scale(0.96) translateY(0); box-shadow: none; }
    .item-btn .req-dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; background: #FFD54F; border-radius: 50%; box-shadow: 0 0 4px #FFD54F; }

    /* 金黄色有老师要求的科目 */
    .item-btn.has-req { background: #FFE066 !important; color: #5D4037; box-shadow: 0 4px 0 #E6A800; transform: translateY(-2px); }
    .item-btn.has-req.selected { background: #FF4D6D !important; color: white; box-shadow: 0 4px 0 #C41E3A; transform: translateY(-2px); }
    .item-btn.has-req.selected:active { transform: scale(0.96) translateY(0); box-shadow: none; }

    /* 老师要求气泡 */
    .item-btn-wrap { position: relative; display: inline-block; }
    .req-tooltip {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: #FFE066; color: #333; font-size: 12px; padding: 6px 10px;
      border-radius: 8px; white-space: normal; max-width: 180px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10; pointer-events: none;
    }
    .req-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #FFE066; }
    .item-btn-wrap .req-tooltip { display: none; }
    .item-btn-wrap:hover .req-tooltip { display: block; }

    /* 归档 */
    .archived-toggle { display: block; width: 100%; padding: 12px; background: #F5F5F5; border: 2px dashed #BDBDBD; border-radius: 12px; font-size: 15px; color: #7F8C8D; cursor: pointer; text-align: center; margin-top: 8px; }
    .archived-section { display: none; margin-top: 10px; }
    .archived-section.open { display: block; }
    .archived-section h4 { font-size: 13px; color: #BDBDBD; margin-bottom: 8px; text-align: center; }
    .archived-item-btn { padding: 10px 8px; background: #E0E0E0; color: #7F8C8D; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; text-align: center; text-decoration: line-through; }
    .archived-item-btn.selected { background: #FF6B6B; color: white; }

    /* 今日记录 */
    .today-records { display: none; margin-top: 8px; margin-bottom: 12px; }
    .today-records.visible { display: block; }
    .today-records h3 { font-size: 18px; color: #4ECDC4; margin-bottom: 10px; }
    .empty-records { text-align: center; color: #BDBDBD; font-size: 14px; padding: 24px 12px; line-height: 1.6; }
    .record-item { display: flex; align-items: center; justify-content: space-between; background: #FFF; border: 2px solid #E0E0E0; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
    .record-item .item-name { font-size: 16px; font-weight: bold; color: #333; }
    .record-item .item-mins { font-size: 14px; color: #7F8C8D; margin-top: 2px; }
    .record-item .delete-btn { background: #FF6B6B; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; flex-shrink: 0; }

    /* 页脚 - 记录卡片下方的励志文案 */
    .practice-footer {
      text-align: center;
      color: #9E9E9E;
      font-size: 15px;
      padding: 9px 12px;
      font-style: italic;
      margin-bottom: 0;
    }

    /* 响应式：iPad竖屏单栏 */
    @media (max-width: 640px) {
      .timer-layout { grid-template-columns: 1fr; }
      .panel-req .req-empty { padding: 20px 0; }
    }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/prepare" class="nav-item"><span class="nav-icon">🏠</span><span>准备</span></a>
    <a href="/practice" class="nav-item active"><span class="nav-icon">🎵</span><span>练习</span></a>
    <a href="/achievements" class="nav-item"><span class="nav-icon">🏆</span><span>成就</span></a>
    <a href="/report" class="nav-item"><span class="nav-icon">📊</span><span>报告</span></a>
    <a href="/config" class="nav-item"><span class="nav-icon">⚙️</span><span>配置</span></a>
  </div>

  <!-- 计时器保护弹窗 -->
  <div id="timerProtectModal">
    <div class="modal-box">
      <h3>⏱️ 计时器还在跑</h3>
      <p>离开这个页面的话，计时会取消哦！</p>
      <div class="modal-actions">
        <button class="btn-stay" onclick="closeTimerProtect()">继续练习</button>
        <button class="btn-leave" onclick="confirmLeave()">确认离开</button>
      </div>
    </div>
  </div>

  <!-- 提前结束确认弹窗 -->
  <div id="finishEarlyModal">
    <div class="finish-modal-box">
      <div class="finish-icon">⏱️</div>
      <h3>提前结束练习</h3>
      <div class="finish-mins" id="finishMinsDisplay">0</div>
      <div class="finish-mins-label">分钟</div>
      <div class="finish-modal-actions">
        <button class="btn-confirm" onclick="confirmFinishEarly()">✅ 确认打卡</button>
        <button class="btn-cancel" onclick="cancelFinishEarly()">继续练习</button>
      </div>
    </div>
  </div>

  <!-- 正常结束确认弹窗（修复：纯计时到点不再自动提交，弹此窗让用户选 打卡/放弃） -->
  <div id="finishNormalModal">
    <div class="finish-modal-box">
      <div class="finish-icon">🎉</div>
      <h3>练习完成!</h3>
      <div class="finish-mins" id="finishNormalMinsDisplay">0</div>
      <div class="finish-mins-label">分钟</div>
      <div class="finish-modal-actions">
        <button class="btn-confirm" onclick="confirmFinishNormal()">✅ 打卡记录</button>
        <button class="btn-cancel" onclick="cancelFinishNormal()">❌ 放弃</button>
      </div>
    </div>
  </div>

  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <div class="today-stat">今日已练习: {{today_mins}} 分钟</div>
    <div class="server-clock" id="serverClock"></div>
  </div>

  <!-- 练习科目选择 -->
  <div class="item-section card">
    <h2>🎵 选择练习项目</h2>
    <div class="item-filter-wrap">
      <input type="text" id="itemFilter" placeholder="🔍 搜索..." oninput="filterItems(this.value)">
    </div>
    {{items_html}}
    <div id="archivedToggleWrap"></div>
  </div>

  <!-- 垂直卡片 3 楼层 -->
  <div class="vertical-stack" id="vertical-stack">

    <!-- 楼层 1:老师要求 -->
    <div class="floor floor-req">
      <h3>🎯 老师要求</h3>
      <div class="req-content" id="reqTip">
        <div class="req-empty">选择一个科目<br>查看老师要求</div>
      </div>
    </div>

    <!-- 楼层 2:计时器(主半圆 picker) -->
    <div class="floor floor-timer">
      <h3>⏱️ 计时器</h3>
      <div class="item-bubble" id="itemBubble" style="display:none">
        <span class="bubble-label">当前练习</span>
        <span class="bubble-name" id="bubbleName"></span>
      </div>
      <!-- 选中前:显示 picker;运行中:切换为数字时间 -->
      <div class="timer-picker-wrap" id="timerPickerWrap">
        <svg id="timerPickerSvg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="timer-center-value" id="timerCenterValue">
          <div class="num">10</div>
          <div class="unit">分钟</div>
          <div class="hint" id="timerHint">拖动选择 · 默认 10</div>
        </div>
      </div>
      <div class="timer-display" id="timer-display" style="display:none">00:00</div>
      <div class="action-btns">
        <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()" disabled>开始</button>
        <button class="btn btn-danger" id="finishEarlyBtn" onclick="finishEarly()" style="display:none">提前结束</button>
      </div>
      <div class="confirm-area" id="confirmArea">
        <p>练习完成！共计 <span class="confirm-mins" id="confirmMins">0</span> 分钟</p>
      </div>
    </div>

    <!-- 楼层 3:额外记录(副半圆 picker) -->
    <div class="floor floor-extra" id="extraSection">
      <h3>⚡ 快速补录</h3>
      <div class="extra-picker-wrap">
        <svg id="extraPickerSvg" viewBox="0 0 400 230" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="extra-center-value" id="extraCenterValue">
          <div class="num">10</div>
          <div class="unit">分钟</div>
          <div class="hint" id="extraHint">拖动 · +N 补录</div>
        </div>
      </div>
      <div class="action-btns">
        <button class="btn btn-ghost" id="addExtraBtn" onclick="addExtraFromPicker()" disabled>📝 记录这次补录</button>
      </div>
      <div id="extraLogList"></div>
    </div>

  </div>

  <!-- 今日练习记录 -->
  <div class="card today-records">
    <h3>📋 今日练习记录</h3>
    <div id="recordsList"></div>
  </div>

  <!-- 页脚励志文案 -->
  <div class="practice-footer" id="practiceFooter"></div>

  <script>
    // Short completion chime
    function playChime() {
      try {
        new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleQYMTYq9n6p7IQQ5jcOyp5mMZEA3YK3b4LyDeEBpp9XjtnVJUJLU4s2zak1ToNXm4qd2UFmn1eXeqHFWYqrc5cClcF5sreDnw5B0YW2s4OPGj3hmcLDl5cB/dGVysujnxH13aHS07enGf3dqdrTu6sR6eGx4tO/qw3l9b3q18OnBdn9xe7bx6sB4gHF9ufLqwHWAdn+69OvAdoF3gL316r53gnmCefTrvneDeoN69e28d4N7g3n17rx3hHyEevXuuneFfIV79u67d4Z9hXv27rt3h3yGfPbuuneHfod99u67d4h+h3z27rt3iH+Hffbuu3eIf4d99u67d4hA').play();
      } catch(e) {}
    }

    // Fire confetti
    function fireConfetti() {
      try {
        const duration = 3000;
        const end = Date.now() + duration;
        const colors = ['#FF6B6B','#4ECDC4','#FFE066','#FF8CC8','#6BCB77'];
        (function frame() {
          confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, colors });
          confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, colors });
          if (Date.now() < end) requestAnimationFrame(frame);
        }());
        confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 }, colors });
      } catch(e) {}
    }

    // ── 老师要求数据 ──
    const WEEKLY_ASSIGN = {{assign_json}};

    // Filter practice items by search query
    function filterItems(q) {
      q = q.trim().toLowerCase();
      document.querySelectorAll('.item-btn').forEach(btn => {
        btn.style.display = (q === '' || btn.textContent.toLowerCase().includes(q)) ? '' : 'none';
      });
      document.querySelectorAll('.item-grid').forEach(grid => {
        const hasVisible = Array.from(grid.querySelectorAll('.item-btn')).some(b => b.style.display !== 'none');
        const prev = grid.previousElementSibling;
        if (prev && prev.tagName === 'H3') {
          prev.style.display = hasVisible ? '' : 'none';
        }
      });
    }

    let selectedItem = null;
    let selectedItemId = null;
    let duration = 10;
    let elapsed = 0;
    let timerInterval = null;
    let started = false;
    let timerRunning = false;
    let paused = false;  // U-4:暂停态(可继续)
    let finishPending = false;  // 提前结束但未打卡
    let submitting = false;  // 防重放：打卡请求进行中
    let pendingExtraMins = 10;  // 副半圆 picker 当前选值
    let timerPicker = null;  // 主半圆 picker 实例
    let extraPicker = null;  // 副半圆 picker 实例
    let todayDate = "{{today_date}}";
    let enterTime = new Date().toISOString();  // 行为日志：进入时间

    // ── 实时时钟 ──
    function updateClock() {
      const now = new Date();
      const y = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const pad = document.getElementById('serverClock');
      if (pad) { pad.textContent = `${y}-${mo}-${d} ${h}:${mi}:${s}`; }
    }
    setInterval(updateClock, 1000);
    updateClock();
    let pendingNav = null;

    // ── 老科目加载 ──
    let archivedLoaded = false;
    async function loadArchivedToggle() {
      try {
        let res = await fetch('/api/items?include_archived=false');
        let data = await res.json();
        let res2 = await fetch('/api/items?include_archived=true');
        let data2 = await res2.json();
        let total = data2.items.length;
        let active = data.items.length;
        if (total > active) {
          document.getElementById('archivedToggleWrap').innerHTML =
            '<button class="archived-toggle" onclick="toggleArchived()">📁 老科目 (' + (total - active) + ')</button>';
        }
      } catch(e) {}
    }
    async function toggleArchived() {
      let wrap = document.getElementById('archivedToggleWrap');
      let existing = document.querySelector('.archived-section');
      if (existing) { existing.classList.toggle('open'); return; }
      try {
        let res = await fetch('/api/items?include_archived=true');
        let data = await res.json();
        let archived = data.items.filter(i => i.is_archived);
        if (archived.length === 0) return;
        let html = '<div class="archived-section open"><h4>📁 老科目</h4>';
        html += '<div class="item-grid">';
        archived.forEach(it => {
          html += '<button class="archived-item-btn" onclick="selectArchivedItem(\'' + it.name.replace(/'/g, "\\'") + '\', ' + it.id + ', this, event)">' + it.name + '</button>';
        });
        html += '</div></div>';
        wrap.insertAdjacentHTML('beforeend', html);
      } catch(e) {}
    }

    // 更新左栏老师要求显示
    function updateReqPanel(reqText) {
      const tip = document.getElementById('reqTip');
      if (reqText) {
        tip.innerHTML = '<div class="req-label"></div><div class="req-highlight">' + reqText + '</div>';
      } else {
        tip.innerHTML = '<div class="req-empty">暂无老师要求<br>直接开始练习吧！</div>';
      }
    }

    function selectArchivedItem(name, id, btn, e) {
      if (e) e.stopPropagation();
      document.querySelectorAll('.archived-item-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
      selectedItem = name;
      selectedItemId = id;
      resetTimer();
      refreshExtraSection();

      const reqText = btn ? btn.getAttribute('data-req') : null;
      updateReqPanel(reqText || '');

      // 更新选中科目气泡
      const bubble = document.getElementById('itemBubble');
      const bubbleName = document.getElementById('bubbleName');
      bubbleName.textContent = name;
      bubble.style.display = 'flex';
      bubble.classList.add('animate');
      bubble.style.animation = 'none';
      bubble.offsetHeight;
      bubble.style.animation = '';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('addExtraBtn').disabled = false;
      const addBtn = document.getElementById('addExtraBtn');
      if (addBtn) addBtn.disabled = !selectedItemId;
    }

    // 更新左栏老师要求显示

    // ── 计时器防跳出 ──
    function setupTimerProtect() {
      document.querySelectorAll('.nav a').forEach(a => {
        a.addEventListener('click', e => {
          if (!timerRunning && !finishPending) return;
          const href = a.getAttribute('href');
          if (!href || href === window.location.pathname) return;
          e.preventDefault();
          pendingNav = href;
          document.getElementById('timerProtectModal').classList.add('open');
        });
      });
      window.addEventListener('beforeunload', e => {
        if (timerRunning || finishPending) { e.preventDefault(); e.returnValue = ''; }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && (timerRunning || finishPending)) { pendingNav = null; }
      });
    }
    function closeTimerProtect() {
      document.getElementById('timerProtectModal').classList.remove('open');
      pendingNav = null;
    }
    function confirmLeave() {
      timerRunning = false;
      finishPending = false;
      clearInterval(timerInterval);
      started = false;
      document.getElementById('timerProtectModal').classList.remove('open');
      if (pendingNav) window.location.href = pendingNav;
    }

    // ── 计时器主逻辑 ──
    function selectItem(name, id, e) {
      if (e) e.stopPropagation();
      document.querySelectorAll('.archived-item-btn').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
      const btn = document.querySelector(`.item-btn[data-id='${id}'], .archived-item-btn[data-id='${id}']`);
      if (btn) btn.classList.add('selected');
      selectedItem = name;
      selectedItemId = id;
      resetTimer();
      refreshExtraSection();

      const reqText = btn ? btn.getAttribute('data-req') : null;
      updateReqPanel(reqText || '');
      document.getElementById('vertical-stack').scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 更新选中科目气泡
      const bubble = document.getElementById('itemBubble');
      const bubbleName = document.getElementById('bubbleName');
      bubbleName.textContent = name;
      bubble.style.display = 'flex';
      bubble.classList.add('animate');
      // 重新触发动画
      bubble.style.animation = 'none';
      bubble.offsetHeight; // reflow
      bubble.style.animation = '';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('addExtraBtn').disabled = false;
      const addBtn = document.getElementById('addExtraBtn');
      if (addBtn) addBtn.disabled = !selectedItemId;
    }

    function setDuration(mins) {
      duration = mins;
      if (typeof timerPicker !== 'undefined' && timerPicker) {
        timerPicker.setValue(mins);
      } else {
        const hint = document.getElementById('timerHint');
        const num = document.querySelector('.timer-center-value .num');
        if (num) num.textContent = mins;
        if (hint) hint.textContent = '默认 ' + mins;
      }
      if (!started) resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      started = false;
      timerRunning = false;
      paused = false;
      finishPending = false;
      elapsed = 0;
      document.getElementById('timer-display').textContent = '00:00';
      document.getElementById('startBtn').textContent = '开始';
      document.getElementById('startBtn').disabled = !selectedItemId;
      document.getElementById('finishEarlyBtn').style.display = 'none';
      const confirmArea = document.getElementById('confirmArea');
      if (confirmArea) confirmArea.classList.remove('show');
      // 重新显示 picker + 数字,隐藏时间显示
      const pickerWrap = document.getElementById('timerPickerWrap');
      const timeDisp = document.getElementById('timer-display');
      if (pickerWrap) pickerWrap.style.display = '';
      if (timeDisp) timeDisp.style.display = 'none';
      const hint = document.getElementById('timerHint');
      if (hint) hint.textContent = '拖动选择 · 点击开始';
      const addBtn = document.getElementById('addExtraBtn');
      if (addBtn) addBtn.disabled = !selectedItemId;
    }

    function toggleTimer() {
      if (!selectedItemId) return;
      if (started && !paused) {
        // 暂停(U-4):停止计时但保留 elapsed
        clearInterval(timerInterval);
        paused = true;
        timerRunning = false;
        document.getElementById('startBtn').textContent = '继续';
        document.getElementById('timer-display').classList.remove('running');
        document.getElementById('timer-display').classList.add('paused');
        return;
      }
      if (started && paused) {
        // 继续
        paused = false;
        timerRunning = true;
        document.getElementById('startBtn').textContent = '暂停';
        document.getElementById('timer-display').classList.add('running');
        document.getElementById('timer-display').classList.remove('paused');
        startTickInterval();
        return;
      }
      // 首次开始
      started = true;
      timerRunning = true;
      // 切换显示:picker → 数字时间
      const pickerWrap = document.getElementById('timerPickerWrap');
      const timeDisp = document.getElementById('timer-display');
      if (pickerWrap) pickerWrap.style.display = 'none';
      if (timeDisp) timeDisp.style.display = '';
      document.getElementById('startBtn').textContent = '暂停';
      document.getElementById('finishEarlyBtn').style.display = 'inline-block';
      document.getElementById('timer-display').classList.add('running');
      startTickInterval();
    }

    function startTickInterval() {
      timerInterval = setInterval(() => {
        elapsed++;
        let m = Math.floor(elapsed / 60).toString().padStart(2,'0');
        let s = (elapsed % 60).toString().padStart(2,'0');
        document.getElementById('timer-display').textContent = m + ':' + s;
        if (elapsed >= duration * 60) {
          clearInterval(timerInterval);
          timerRunning = false;
          started = false;
          paused = false;
          document.getElementById('finishEarlyBtn').style.display = 'none';
          document.getElementById('timer-display').classList.remove('running');
          document.getElementById('timer-display').classList.remove('paused');
          document.getElementById('startBtn').textContent = '开始';
          // 修复：正常结束不再自动提交，弹 finishNormalModal 让用户点 打卡/放弃
          document.getElementById('finishNormalMinsDisplay').textContent = duration;
          document.getElementById('confirmMins').textContent = duration;
          const normalModal = document.getElementById('finishNormalModal');
          normalModal.classList.add('open');
          gsap.fromTo('#finishNormalModal .finish-modal-box', { scale: 0.5, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2)' });
          playChime();
        }
      }, 1000);
    }

    function confirmFinishNormal() {
      // 正常结束 → 确认打卡
      document.getElementById('finishNormalModal').classList.remove('open');
      submitPractice();
    }

    function cancelFinishNormal() {
      // 正常结束 → 放弃本次练习,清零
      document.getElementById('finishNormalModal').classList.remove('open');
      resetTimer();
    }

    function finishEarly() {
      if (finishPending) return;       // 防双击：已提前结束则忽略
      if (elapsed === 0) return;       // 从未计时则忽略(暂停态 elapsed>0,允许提前结束)
      clearInterval(timerInterval);
      timerRunning = false;
      paused = false;
      finishPending = true;  // 标记提前结束但未打卡
      const savedElapsed = elapsed;    // 先保存再清零，防竞态
      const finalMins = Math.max(1, Math.ceil(savedElapsed / 60));
      elapsed = 0;
      started = false;
      document.getElementById('timer-display').textContent = '00:00';
      document.getElementById('timer-display').classList.remove('running');
      document.getElementById('timer-display').classList.remove('paused');
      document.getElementById('startBtn').textContent = '开始';
      document.getElementById('finishEarlyBtn').style.display = 'none';
      // 显示弹窗确认
      document.getElementById('finishMinsDisplay').textContent = finalMins;
      document.getElementById('finishEarlyModal').classList.add('open');
      // 弹窗入场动效
      gsap.fromTo('.finish-modal-box', { scale: 0.5, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' });
    }

    function confirmFinishEarly() {
      document.getElementById('finishEarlyModal').classList.remove('open');
      document.getElementById('confirmMins').textContent = document.getElementById('finishMinsDisplay').textContent;
      submitPractice();
    }

    function cancelFinishEarly() {
      document.getElementById('finishEarlyModal').classList.remove('open');
      // 恢复计时状态，继续练习
      finishPending = false;
      started = true;
      paused = false;
      timerRunning = true;
      document.getElementById('startBtn').textContent = '暂停';
      document.getElementById('finishEarlyBtn').style.display = 'inline-block';
      document.getElementById('timer-display').classList.add('running');
      document.getElementById('timer-display').classList.remove('paused');
      // 恢复 elapsed（从弹窗显示的分钟数反推秒数）
      const mins = parseInt(document.getElementById('finishMinsDisplay').textContent) || 1;
      elapsed = (mins - 1) * 60;  // 退回到上一分钟开始
      startTickInterval();
    }

    async function submitPractice() {
      if (submitting) return;  // 防重放
      if (!selectedItem) return;
      let finalMins = parseInt(document.getElementById('confirmMins').textContent) || 0;
      if (finalMins === 0) return;
      submitting = true;
      try {
        let res = await fetch('/api/log', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, item: selectedItem, item_id: selectedItemId, minutes: finalMins, log: '', behavior_log: [{enter_time: enterTime, item: selectedItem, minutes: finalMins}]})
        });
        let json = await res.json();
        if (json.ok) {
          timerRunning = false;
          finishPending = false;
          fireConfetti();
          // 显示成功消息，但保留 confirmMins 元素（后续打卡还需要它）
          const confirmArea4 = document.getElementById('confirmArea');
          if (confirmArea4) {
            const confirmP = confirmArea4.querySelector('p');
            if (confirmP) {
              confirmP.dataset.originalHtml = confirmP.innerHTML;
              confirmP.innerHTML = '🎉 打卡成功！太棒啦！';
            }
            confirmArea4.classList.add('show');
            gsap.fromTo('#confirmArea', { scale: 0.5, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "back.out(2)" });
          }
          loadTodayRecords();
          setTimeout(() => {
            // 恢复 confirmArea 原始 HTML（包含 confirmMins 元素）
            const confirmArea5 = document.getElementById('confirmArea');
            if (confirmArea5) {
              const confirmP2 = confirmArea5.querySelector('p');
              if (confirmP2 && confirmP2.dataset.originalHtml) {
                confirmP2.innerHTML = confirmP2.dataset.originalHtml;
                delete confirmP2.dataset.originalHtml;
              }
            }
            // 只有没开始新计时才重置（防止打卡后立即继续练习被误清零）
            if (!started) {
              resetTimer();
              document.querySelectorAll('.item-btn, .archived-item-btn').forEach(b => b.classList.remove('selected'));
              selectedItem = null;
              updateReqPanel('');
            }
            const confirmArea6 = document.getElementById('confirmArea');
            if (confirmArea6) confirmArea6.classList.remove('show');
          }, 2500);
        } else {
          alert('打卡失败：' + (json.message || json.error));
        }
      } catch (e) {
        console.error('打卡请求失败:', e);
        alert('网络错误，请重试');
      } finally {
        submitting = false;
      }
    }

    // ── 额外练习时间 ──
    async function refreshExtraSection() {
      try {
        let res = await fetch('/api/practices/' + todayDate);
        let data = await res.json();
        let logList = document.getElementById('extraLogList');
        let extras = (data.items || []).filter(it => it.is_extra);
        if (extras.length === 0) {
          logList.innerHTML = '<div style="font-size:13px;color:#A5D6A7;text-align:center;padding:6px;">暂无额外记录</div>';
        } else {
          logList.innerHTML = extras.map(it => `
            <div class="extra-log-item">
              <span>${it.item}</span>
              <span class="extra-mins">+${it.minutes}分钟</span>
              <button class="extra-del" onclick="deleteExtraRecord('${it.item_id}')">✕</button>
            </div>
          `).join('');
        }
      } catch(e) {}
    }

    async function addExtraMins(mins) {
      if (!selectedItem) return;
      try {
        let res = await fetch('/api/log', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, item: selectedItem, item_id: selectedItemId, minutes: mins, log: '', is_extra: true, behavior_log: [{enter_time: enterTime, item: selectedItem, minutes: mins}]})
        });
        let json = await res.json();
        if (json.ok) {
          fireConfetti();
          refreshExtraSection();
          loadTodayRecords();
        }
      } catch(e) {}
    }

    async function addExtraFromPicker() {
      if (!selectedItem) return;
      if (!pendingExtraMins || pendingExtraMins < 1) {
        alert('请先在补录 picker 拖动选择分钟数');
        return;
      }
      await addExtraMins(pendingExtraMins);
    }

    async function deleteExtraRecord(id) {
      if (!confirm('确定要删除这条额外练习记录吗？')) return;
      try {
        let res = await fetch('/api/log', {
          method: 'DELETE',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, id: id})
        });
        let result = await res.json();
        if (result.ok) {
          refreshExtraSection();
          renderTodayRecords(result.items || [], result.total_minutes || 0);
        } else {
          alert('删除失败: ' + (result.error || '未知错误'));
        }
      } catch(e) { console.error(e); }
    }

    // Load today's records from API
    function renderTodayRecords(items, total) {
      let recordsList = document.getElementById('recordsList');
      let card = document.querySelector('.today-records');
      if (!items || items.length === 0) {
        recordsList.innerHTML = '<div class="empty-records">还没有练习记录，开始练习吧！</div>';
        card.classList.remove('visible');
      } else {
        recordsList.innerHTML = items.map(it => `
          <div class="record-item">
            <div>
              <div class="item-name">${it.item}</div>
              <div class="item-mins">${it.minutes} 分钟</div>
            </div>
            <button class="delete-btn" onclick="deleteRecord(${it.item_id})">✕</button>
          </div>
        `).join('');
        card.classList.add('visible');
        gsap.fromTo(card, { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" });
        gsap.fromTo('.record-item', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.1, ease: "power3.out" });
      }
      document.querySelector('.today-stat').textContent = '今日已练习: ' + total + ' 分钟';
    }

    async function loadTodayRecords() {
      try {
        let res = await fetch('/api/practices/' + todayDate);
        let data = await res.json();
        renderTodayRecords(data.items || [], data.total_minutes || 0);
      } catch(e) {
        document.getElementById('recordsList').innerHTML = '<div class="empty-records">加载失败: ' + e.message + '</div>';
      }
    }

    async function deleteRecord(id) {
      if (!confirm('确定要删除这条练习记录吗？')) return;
      try {
        let res = await fetch('/api/log', {
          method: 'DELETE',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: todayDate, id: id})
        });
        let result = await res.json();
        if (result.ok) {
          renderTodayRecords(result.items || [], result.total_minutes || 0);
        } else {
          alert('删除失败: ' + (result.error || '未知错误'));
        }
      } catch(e) { console.error(e); }
    }

    // ════════════════════════════════════════════════
    // 半圆弧 Picker 工厂(本地版,直接嵌 practice.html,避免额外 HTTP 请求)
    // 改自 uiux-asset-library/dizi-practice-picker v1
    // 5-30min 固定 5min 步长 + GSAP attr.transform 复合 translate+scale
    // ════════════════════════════════════════════════
    const PICKER_MIN = 5, PICKER_MAX = 30, PICKER_STEP = 5;
    const P_W = 400, P_H = 220, P_CX = 200, P_CY = 200, P_R = 150, P_STROKE = 14;
    function pMinToAngle(m) { return Math.PI - ((m - PICKER_MIN) / (PICKER_MAX - PICKER_MIN)) * Math.PI; }
    function pAngleToMin(a) { return PICKER_MIN + ((Math.PI - a) / Math.PI) * (PICKER_MAX - PICKER_MIN); }
    function pClamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function createPicker(opts) {
      const {
        svgEl, valueEl, hintEl, color, colorGlow, trackColor,
        onChange, stateRef, initial = 10
      } = opts;
      const SVG_NS = 'http://www.w3.org/2000/svg';
      svgEl.innerHTML = '';

      const arcStart = { x: P_CX - P_R, y: P_CY };
      const arcEnd   = { x: P_CX + P_R, y: P_CY };
      const arcPath = `M ${arcStart.x} ${arcStart.y} A ${P_R} ${P_R} 0 0 1 ${arcEnd.x} ${arcEnd.y}`;

      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', arcPath);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', trackColor);
      path.setAttribute('stroke-width', P_STROKE);
      path.setAttribute('stroke-linecap', 'round');
      svgEl.appendChild(path);

      const progress = document.createElementNS(SVG_NS, 'path');
      progress.setAttribute('d', arcPath);
      progress.setAttribute('fill', 'none');
      progress.setAttribute('stroke', color);
      progress.setAttribute('stroke-width', P_STROKE);
      progress.setAttribute('stroke-linecap', 'round');
      progress.setAttribute('pathLength', '100');
      progress.setAttribute('stroke-dasharray', '0 100');
      progress.style.filter = `drop-shadow(0 0 8px ${colorGlow})`;
      svgEl.appendChild(progress);

      for (let m = PICKER_MIN; m <= PICKER_MAX; m += PICKER_STEP) {
        const a = pMinToAngle(m);
        const inner = { x: P_CX + (P_R - 10) * Math.cos(a), y: P_CY - (P_R - 10) * Math.sin(a) };
        const outer = { x: P_CX + (P_R + 14) * Math.cos(a), y: P_CY - (P_R + 14) * Math.sin(a) };
        const tick = document.createElementNS(SVG_NS, 'line');
        tick.setAttribute('x1', inner.x); tick.setAttribute('y1', inner.y);
        tick.setAttribute('x2', outer.x); tick.setAttribute('y2', outer.y);
        tick.setAttribute('stroke', color);
        tick.setAttribute('stroke-width', 2.5);
        tick.setAttribute('stroke-linecap', 'round');
        svgEl.appendChild(tick);

        const lblX = P_CX + (P_R + 28) * Math.cos(a);
        const lblY = P_CY - (P_R + 28) * Math.sin(a);
        const lbl = document.createElementNS(SVG_NS, 'text');
        lbl.setAttribute('x', lblX);
        lbl.setAttribute('y', lblY);
        lbl.setAttribute('text-anchor', 'middle');
        lbl.setAttribute('dominant-baseline', 'central');
        lbl.setAttribute('fill', color);
        lbl.setAttribute('font-size', '13');
        lbl.setAttribute('font-weight', '700');
        lbl.textContent = m;
        svgEl.appendChild(lbl);
      }

      const knobGroup = document.createElementNS(SVG_NS, 'g');
      knobGroup.setAttribute('class', 'dizi-picker-knob');
      const knobBg = document.createElementNS(SVG_NS, 'circle');
      knobBg.setAttribute('r', 18);
      knobBg.setAttribute('fill', '#FFFFFF');
      knobBg.setAttribute('stroke', color);
      knobBg.setAttribute('stroke-width', 3);
      const knobInner = document.createElementNS(SVG_NS, 'circle');
      knobInner.setAttribute('r', 8);
      knobInner.setAttribute('fill', color);
      knobGroup.appendChild(knobBg);
      knobGroup.appendChild(knobInner);
      svgEl.appendChild(knobGroup);

      let currentMin = initial;
      let isDragging = false;
      let lastAngle = pMinToAngle(currentMin);
      let velocity = 0;
      let lastTs = 0;
      let rafId = null;
      let visualScale = 1;

      function knobPos(min) {
        const a = pMinToAngle(min);
        return { x: P_CX + P_R * Math.cos(a), y: P_CY - P_R * Math.sin(a) };
      }
      function applyTransform(min, scale) {
        const p = knobPos(min);
        knobGroup.setAttribute('transform', `translate(${p.x}, ${p.y}) scale(${scale})`);
      }
      function setKnob(min, animate) {
        const ratio = (min - PICKER_MIN) / (PICKER_MAX - PICKER_MIN);
        progress.setAttribute('stroke-dasharray', `${ratio * 100} 100`);
        if (animate && typeof gsap !== 'undefined') {
          const p = knobPos(min);
          gsap.to(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(${visualScale})` }, duration: 0.3, ease: 'power2.out' });
        } else {
          applyTransform(min, visualScale);
        }
      }
      function updateValue() {
        if (valueEl) valueEl.textContent = currentMin;
        if (onChange) onChange(currentMin);
      }

      function angleFromEvent(e) {
        const rect = svgEl.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const svgX = (clientX - rect.left) * (P_W / rect.width);
        const svgY = (clientY - rect.top)  * (P_H / rect.height);
        const dx = svgX - P_CX;
        const dy = P_CY - svgY;
        return pClamp(Math.atan2(dy, dx), 0, Math.PI);
      }

      function onPointerDown(e) {
        if (stateRef && stateRef.isRunning) return;
        isDragging = true;
        knobGroup.classList.add('dragging');
        e.preventDefault();
        const a = angleFromEvent(e);
        const m = Math.round(pAngleToMin(a) / PICKER_STEP) * PICKER_STEP;
        currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
        setKnob(currentMin);
        updateValue();
        velocity = 0; lastTs = 0;
      }
      function onPointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const a = angleFromEvent(e);
        const newAngle = a;
        const now = performance.now();
        if (lastTs > 0) {
          const dt = now - lastTs;
          velocity = (newAngle - lastAngle) / dt * 1000;
          velocity = pClamp(velocity, -30, 30);
        }
        lastAngle = newAngle;
        lastTs = now;
        const m = Math.round(pAngleToMin(newAngle) / PICKER_STEP) * PICKER_STEP;
        currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
        const targetScale = Math.abs(velocity) > 5 ? 1.15 : 1;
        if (Math.abs(targetScale - visualScale) > 0.01) {
          visualScale = targetScale;
          if (typeof gsap !== 'undefined') {
            const p = knobPos(currentMin);
            gsap.to(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(${visualScale})` }, duration: 0.1, ease: 'power1.out' });
          } else {
            applyTransform(currentMin, visualScale);
          }
        } else {
          applyTransform(currentMin, visualScale);
        }
        setKnob(currentMin);
      }
      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        knobGroup.classList.remove('dragging');
        visualScale = 1;
        if (typeof gsap !== 'undefined') {
          const p = knobPos(currentMin);
          gsap.to(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(1)` }, duration: 0.2, ease: 'power2.out' });
        } else {
          applyTransform(currentMin, 1);
        }
        if (Math.abs(velocity) > 1) {
          startMomentum();
        }
      }
      function startMomentum() {
        const FRICTION = 0.92;
        const STOP_VEL = 0.3;
        function tick(ts) {
          const dt = lastTs === 0 ? 16 : (ts - lastTs);
          velocity *= Math.pow(FRICTION, dt / 16.67);
          const curAngle = pMinToAngle(currentMin);
          let newAngle = curAngle + velocity * dt / 1000;
          if (newAngle < 0) { newAngle = 0; velocity = -velocity * 0.25; }
          if (newAngle > Math.PI) { newAngle = Math.PI; velocity = -velocity * 0.25; }
          const m = Math.round(pAngleToMin(newAngle) / PICKER_STEP) * PICKER_STEP;
          currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
          setKnob(currentMin);
          lastTs = ts;
          if (Math.abs(velocity) <= STOP_VEL) {
            velocity = 0;
            if (typeof gsap !== 'undefined') {
              const p = knobPos(currentMin);
              gsap.fromTo(knobGroup, { attr: { transform: `translate(${p.x}, ${p.y}) scale(1)` } }, { attr: { transform: `translate(${p.x}, ${p.y}) scale(1.25)` }, duration: 0.15, yoyo: true, repeat: 1, ease: 'power2.out' });
            }
            return;
          }
          rafId = requestAnimationFrame(tick);
        }
        lastTs = 0;
        rafId = requestAnimationFrame(tick);
      }

      svgEl.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      svgEl.style.touchAction = 'none';

      setKnob(currentMin);
      updateValue();

      return {
        getValue: () => currentMin,
        setValue: (m, animate) => {
          currentMin = pClamp(m, PICKER_MIN, PICKER_MAX);
          setKnob(currentMin, animate);
          updateValue();
        },
        destroy: () => { if (rafId) cancelAnimationFrame(rafId); svgEl.innerHTML = ''; }
      };
    }

    // ── Init Picker 实例 ──
    function initPickers() {
      const timerSvg = document.getElementById('timerPickerSvg');
      const extraSvg = document.getElementById('extraPickerSvg');
      if (timerSvg) {
        const numEl = document.querySelector('.timer-center-value .num');
        const hintEl = document.getElementById('timerHint');
        timerPicker = createPicker({
          svgEl: timerSvg,
          valueEl: numEl,
          hintEl: hintEl,
          color: '#FF6B6B', colorGlow: '#FF8E8E', trackColor: '#F8D7D0',
          stateRef: { get isRunning() { return timerRunning; } },
          onChange: (m) => { duration = m; if (hintEl) hintEl.textContent = '已选 ' + m + ' 分钟 · 点开始'; },
          initial: 10
        });
      }
      if (extraSvg) {
        const numEl = document.querySelector('.extra-center-value .num');
        const hintEl = document.getElementById('extraHint');
        extraPicker = createPicker({
          svgEl: extraSvg,
          valueEl: numEl,
          hintEl: hintEl,
          color: '#4ECDC4', colorGlow: '#7EDDD5', trackColor: '#CFE9E5',
          onChange: (m) => { pendingExtraMins = m; if (hintEl) hintEl.textContent = '已选 +' + m + ' 分钟 · 点记录'; },
          initial: 10
        });
      }
    }

    // Init
    initPickers();
    loadTodayRecords();
    // 页脚励志文案轮换
    (function(){
      const quotes = [
        '慢慢来，比较快。',
        '坚持练习，让音乐自然流淌。',
        '今天的汗水，明天的旋律。',
        '每一次练习，都是成长的印记。',
        '不怕慢，就怕站。',
        '练笛如练心，功到自然成。',
        '今天也坚持了，真了不起🌟',
        '音乐是时间的艺术，你已经在路了。',
      ];
      const el = document.getElementById('practiceFooter');
      if (el) {
        const idx = Math.floor(Math.random() * quotes.length);
        el.textContent = '「 ' + quotes[idx] + ' 」';
      }
    })();
    loadArchivedToggle();
    setupTimerProtect();

    // ── 页面加载整体弹入动画 ──
    const allCards = document.querySelectorAll('.floor, .card:not(.today-records)');
    gsap.fromTo(allCards, { opacity: 0, scale: 0.88, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, stagger: 0.1, ease: "back.out(2)" });
  </script>
</body>
