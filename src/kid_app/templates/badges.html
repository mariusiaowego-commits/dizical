<!DOCTYPE html>
<html lang="zh">
<head>
{% include "_favicon.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>呦呦成就殿堂 - 竹笛助手</title>
  <!-- sprint 26091302 B6: CCG 卡面样式 + 主题 token + JS (v1.6.0-dev) -->
  <link rel="stylesheet" href="/static/css/badge-ccg.css">
  <link rel="stylesheet" href="/static/css/badge-ccg-themes.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/static/js/badge-ccg.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 0 80px; background: #FFF8F0; }

    .top-bar {
      display: flex; align-items: center; padding: 14px 16px 12px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      color: #FF6B35; font-size: 15px; font-weight: 700;
      text-decoration: none; padding: 6px 0;
    }
    .back-btn:active { opacity: 0.6; }
    .page-title {
      flex: 1; text-align: center;
      font-size: 22px; font-weight: 900; color: #333;
      letter-spacing: 1px; margin-right: 52px;
    }

    .stats-bar {
      display: flex; justify-content: center; gap: 8px;
      padding: 0 16px 10px;
      font-size: 12px; color: #bbb; font-weight: 600;
    }
    .stats-bar span { background: #f0ebe3; padding: 3px 12px; border-radius: 20px; }

    .section { padding: 10px 16px 6px; }
    .section-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px; font-weight: 800; color: #ccc; letter-spacing: 0.5px;
    }
    .section-count {
      font-size: 11px; color: #ccc; font-weight: 600;
      background: #f5f3f0; padding: 2px 8px; border-radius: 20px;
    }
    .section-line { flex: 1; height: 1px; background: #eee; }

    /* 大网格：2列 */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 520px) {
      .badge-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 800px) {
      .badge-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }

    /* 大卡片 */
    .badge-card {
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 12px 14px;
      border-radius: 18px;
      background: #fffdf8;
      border: 2px solid #f0e8d0;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .badge-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(180,140,20,0.22);
    }
    .badge-card:active { transform: scale(0.97); }

    .badge-card.unlocked::before {
      content: ''; position: absolute; top: -10px; left: -10px;
      width: 52px; height: 52px;
      background: radial-gradient(circle, rgba(255,215,0,0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .badge-card.locked {
      background: #f9f8f6;
      border-color: #e8e4de;
      filter: saturate(0.3) brightness(0.95);
    }
    .badge-card.locked:hover { filter: saturate(0.5) brightness(0.9); }

    .b-img {
      width: 100px; height: 100px; object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(180,140,20,0.35));
    }
    .badge-card.locked .b-img {
      filter: saturate(0.55) brightness(0.85) drop-shadow(0 2px 5px rgba(0,0,0,0.12));
    }

    .b-name {
      font-size: 18px; font-weight: 900; color: #c8860a;
      margin-top: 10px; text-align: center; line-height: 1.3;
      letter-spacing: 0.5px;
    }
    .badge-card.locked .b-name { color: #c0b898; }

    .b-tag {
      font-size: 11px; font-weight: 400;
      color: #aaa;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 5px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(240,235,225,0.5);
    }
    .badge-card[data-tag="突破"]   .b-tag { background: rgba(255,210,210,0.5); border-color: rgba(220,120,120,0.25); }
    .badge-card[data-tag="段位"]   .b-tag { background: rgba(255,240,180,0.5); border-color: rgba(220,180,60,0.30); }
    .badge-card[data-tag="巅峰"]   .b-tag { background: rgba(230,210,255,0.5); border-color: rgba(180,130,230,0.25); }
    .badge-card[data-tag="执着"]   .b-tag { background: rgba(210,230,255,0.5); border-color: rgba(120,170,220,0.25); }
    .badge-card[data-tag="晋级"]   .b-tag { background: rgba(210,250,220,0.5); border-color: rgba(100,200,130,0.25); }

    .b-lock { width: 16px; height: 16px; opacity: 0.3; margin-top: 5px; }

    .empty-tip { text-align: center; color: #bbb; padding: 40px 0; font-size: 15px; }

    /* 页签 */
    #tab-bar {
      display: flex; gap: 6px;
      padding: 12px 16px 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 14px 14px 0 0;
      background: rgba(240,235,225,0.6);
      color: #888;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    /* 2026-08-03 feat/badges-tab-icons: koboyo.com SVG tab icons */
    .tab-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .tab-btn.active {
      background: #fff;
      color: #FF6B35;
      font-weight: 700;
    }
    .tab-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/achievements" class="back-btn">← 返回</a>
    <div class="page-title">呦呦成就殿堂</div>
  </div>

  <div class="stats-bar">
    <span>已获得 11 / 31 枚</span>
  </div>

  <div id="tab-bar"></div>

  <div id="app">加载中...</div>

  <!-- sprint 26091302 B6: 弹窗 (CCG 卡面双栏 — 照 _badge_claim_modal.html 结构).
       卡面可交互 (tilt/holo/翻面); locked 走 CSS 灰化. -->
  <div id="modal-overlay" class="ccg-claim-overlay" onclick="if(event.target===this)closeModal()" style="display:none;">
    <div id="modal-box" class="ccg-claim-dialog" role="dialog" aria-modal="true" aria-labelledby="ccg-claim-name">
      <button type="button" class="ccg-claim-close" aria-label="关闭" onclick="closeModal()">×</button>
      <div class="ccg-claim-layout">
        <div class="ccg-claim-stage" id="ccg-claim-stage"></div>
        <div class="ccg-claim-copy">
          <div class="ccg-claim-tag" id="ccg-claim-tag"></div>
          <h2 class="ccg-claim-name" id="ccg-claim-name"></h2>
          <p class="ccg-claim-cond" id="ccg-claim-cond"></p>
          <p class="ccg-claim-date" id="ccg-claim-date"></p>
          <p class="ccg-claim-story" id="ccg-claim-story"></p>
          <p class="ccg-claim-hint" id="ccg-claim-hint"></p>
        </div>
      </div>
    </div>
  </div>

<script>
const DATA = {{data_json}};

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function cardHTML(d) {
  /* sprint 26091302 B6: 卡面 HTML 容器 (外壳) — 真正的 CCG 卡 mount 到 #stage 占位 div 上.
     外壳保留 .badge-card (locked/unlocked class + 网格布局依赖), 内部 PNG + b-name + b-tag + b-lock
     保留原样作为 mount 前的占位 + 网格尺寸参考 (CSS 已用 grid-template-columns: repeat(2,1fr),
     不依赖内容元素尺寸). */
  return `<div class="badge-card ${d.achieved?'unlocked':'locked'}"
    data-id="${esc(d.id)}"
    data-name="${esc(d.name)}"
    data-tag="${esc(d.typ)}"
    data-cond="${esc(d.condition)}"
    data-cond-text="${esc(d.cond_text)}"
    data-desc="${esc(d.description)}"
    data-img="${esc(d.badge_url)}"
    data-date="${d.achieved_at||''}"
    data-season-info="${esc(d.season_info||'')}"
    data-group="${esc(d.group)}"
    data-locked="${d.achieved?'no':'yes'}"
    data-card-theme="${esc(d.card_theme||'azure')}"
    data-card-stars="${esc(String(d.card_stars||3))}"
    data-no="${esc(d.no||'001')}"
    onclick="openModal(this)">
    <div class="ccg-stage-mount" id="stage-${esc(d.id)}"></div>
  </div>`;
}

/* sprint 26091302 B6: 把 .badge-card 内部 PNG/b-name/b-tag/b-lock 删掉, 挂 CCG stage 到 .ccg-stage-mount 占位 div.
   grid 仍依赖 .badge-card 外壳 (locked/unlocked class 保留做 locked 视觉判别). */
function _swapCardToCCG(bCard, opts) {
  if (!bCard || !window.DizicalCCG) return;
  if (bCard._ccgSwapped) return;
  bCard._ccgSwapped = true;
  var mountEl = bCard.querySelector('.ccg-stage-mount');
  if (!mountEl) return;
  var stage = document.createElement('div');
  mountEl.appendChild(stage);
  // F5: 列表卡不再传 opts.static — 绑 pointer / idle drift / hover / 翻面 全开, 跟 demo 同源
  // F9: 列表卡挂载 idleSkip=2 (第三轮实测 32 卡 skip=1 31fps / skip=2 55fps);
  //     modal/hero 单卡不传 (走默认 1, 全速).
  DizicalCCG.mountCard(stage, 'holo', {
    id:    bCard.dataset.id || '',
    name:  bCard.dataset.name || '',
    tag:   bCard.dataset.tag || '',
    image: bCard.dataset.img || '',
    cond:  bCard.dataset.condText || bCard.dataset.cond || '',
    story: bCard.dataset.desc || '',
    date:  bCard.dataset.date || '',
    stars: parseInt(bCard.dataset.cardStars || '3', 10) || 3,
    no:    bCard.dataset.no || '001',
    card_theme: bCard.dataset.cardTheme || 'azure',
  }, { locked: opts && opts.locked, idleSkip: 2 });
}

function _upgradeAllCards(root) {
  if (!window.DizicalCCG || !DizicalCCG.mountCard) return;
  var list = (root || document).querySelectorAll('.badge-card');
  list.forEach(function (bCard) {
    var locked = bCard.dataset.locked === 'yes';
    // F5: 不传 opts.static — 列表卡现在跟 demo 静止态逐图层一致 (绑 pointer / hover / 翻面 / idle drift)
    _swapCardToCCG(bCard, { locked: locked });
  });
}

const TABS = [
  // 2026-08-03 feat/badges-tab-icons: 用 koboyo.com SVG icons 替代 emoji.
  // License: free commercial use, no attribution. SVG fill="currentColor" 跟随父元素 color.
  { key: 'milestone', label: '成就',  icon: '/static/img/tab-icons/trophy.svg' },
  { key: 'grade',     label: '考级',  icon: '/static/img/tab-icons/treble-clef.svg' },
  { key: 'seasonal',  label: '赛季',  icon: '/static/img/tab-icons/star.svg' },
];

function buildTab(group) {
  // 2026-08-03: 改用 display_group (grade_1..10 走 grade tab, 其他走原 category)
  const unlocked = DATA.filter(d => (d.display_group || d.group) === group && d.achieved);
  const locked   = DATA.filter(d => (d.display_group || d.group) === group && !d.achieved);
  let html = '';

  if (unlocked.length) {
    html += `<div class="section">
      <div class="section-header">
        <span class="section-title">已解锁</span>
        <span class="section-count">${unlocked.length}</span>
        <div class="section-line"></div>
      </div>
      <div class="badge-grid">${unlocked.map(cardHTML).join('')}</div>
    </div>`;
  }
  if (locked.length) {
    html += `<div class="section">
      <div class="section-header">
        <span class="section-title">未解锁</span>
        <span class="section-count">${locked.length}</span>
        <div class="section-line"></div>
      </div>
      <div class="badge-grid">${locked.map(cardHTML).join('')}</div>
    </div>`;
  }
  if (!unlocked.length && !locked.length) {
    html += `<div class="empty-tip">暂无勋章</div>`;
  }
  return html;
}

function buildUI() {
  const tabBar = TABS.map(t =>
    `<button class="tab-btn" id="tab-${t.key}" onclick="switchTab('${t.key}')">
       <img class="tab-icon" src="${t.icon}" alt="" aria-hidden="true">
       <span class="tab-label">${t.label}</span>
     </button>`
  ).join('');
  document.getElementById('tab-bar').innerHTML = tabBar;
  switchTab('milestone');
}

let activeGroup = 'milestone';

function switchTab(group) {
  activeGroup = group;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.id === `tab-${group}`);
  });
  document.getElementById('app').innerHTML = buildTab(group);
  /* sprint 26091302 B6: tab 切换后, 升级新生成的 .badge-card → CCG 静态卡 */
  _upgradeAllCards(document.getElementById('app'));
}

/* sprint 26091302 B6: 弹窗用 CCG 卡面 (可交互 — 不传 opts = 默认行为, 不锁) */
function openModal(card) {
  const locked  = card.dataset.locked === 'yes';
  const overlay = document.getElementById('modal-overlay');
  const box     = document.getElementById('modal-box');

  /* 关弹窗时残留的 CCG 容器先清掉 (避免打开两次时旧 stage 还残留)
     同样适用于「同一 session 内换卡」场景 */
  _unmountClaimStage();

  /* 写右侧字段 (照 _badge_claim_modal.html 结构) */
  document.getElementById('ccg-claim-tag').textContent  = card.dataset.tag || '';
  document.getElementById('ccg-claim-name').textContent  = card.dataset.name || '';
  document.getElementById('ccg-claim-cond').textContent  =
    card.dataset.cond || card.dataset.condText || card.dataset.desc || '';
  document.getElementById('ccg-claim-story').textContent = card.dataset.desc || '';

  const dateEl = document.getElementById('ccg-claim-date');
  if (card.dataset.date) {
    const d = new Date(card.dataset.date);
    dateEl.textContent = d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
    dateEl.style.display = '';
  } else {
    dateEl.style.display = 'none';
  }

  /* season_info 是 seasonal badge 专属字段 (sprint 26080702), 塞到 ccg-claim-story 前缀 */
  var storyEl = document.getElementById('ccg-claim-story');
  if (card.dataset.seasonInfo) {
    storyEl.textContent = '[赛季] ' + card.dataset.seasonInfo + '\n\n' + storyEl.textContent;
  }

  document.getElementById('ccg-claim-hint').textContent =
    locked ? '继续加油，下一个成就在等你！' : '';

  /* 在 #ccg-claim-stage 挂一张 CCG 卡 (可交互, opts.locked 走 CSS 灰化) */
  const claimStage = document.createElement('div');
  document.getElementById('ccg-claim-stage').appendChild(claimStage);
  DizicalCCG.mountCard(claimStage, 'holo', {
    id:    card.dataset.id || '',
    name:  card.dataset.name || '',
    tag:   card.dataset.tag || '',
    image: card.dataset.img || '',
    cond:  card.dataset.condText || card.dataset.cond || '',
    story: card.dataset.desc || '',
    date:  card.dataset.date || '',
    stars: parseInt(card.dataset.cardStars || '3', 10) || 3,
    no:    card.dataset.no || '001',
    card_theme: card.dataset.cardTheme || 'azure',
  }, { locked: locked });

  /* 显示 — inline style.display 切换 (避免改 badge-ccg.css 的 .ccg-claim-overlay 默认值) */
  overlay.style.display = 'flex';

  const cr = card.getBoundingClientRect();
  const mr = box.getBoundingClientRect();
  const fromX = cr.left + cr.width/2  - (mr.left + mr.width/2);
  const fromY = cr.top  + cr.height/2 - (mr.top  + mr.height/2);

  gsap.set(box, { x: fromX*0.6, y: fromY*0.6, scale: 0.5, opacity: 0 });
  gsap.set(overlay, { backgroundColor: 'rgba(0,0,0,0)' });

  const tl = gsap.timeline();
  tl.to(overlay, { backgroundColor: 'rgba(0,0,0,0.30)', duration: 0.15, ease:'power2.out' })
    .to(box, { x:0, y:0, scale:1, opacity:1, duration:0.22, ease:'back.out(1.5)' }, 0)
    .from('#ccg-claim-tag',  { opacity:0, y:4, duration:0.12, ease:'power2.out' }, 0.14)
    .from('#ccg-claim-name',  { opacity:0, y:4, duration:0.12, ease:'power2.out' }, 0.17)
    .from('#ccg-claim-cond',  { opacity:0, y:4, duration:0.12, ease:'power2.out' }, 0.19)
    .from('#ccg-claim-date',  { opacity:0, y:4, duration:0.12, ease:'power2.out' }, 0.21)
    .from('#ccg-claim-story', { opacity:0, y:4, duration:0.12, ease:'power2.out' }, 0.23)
    .from('#ccg-claim-hint',  { opacity:0, y:4, duration:0.12, ease:'power2.out' }, 0.25);
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  const box     = document.getElementById('modal-box');
  gsap.to(box, { scale: 0.8, opacity: 0, duration: 0.15, ease:'power2.in',
    onComplete: () => {
      overlay.style.display = 'none';
      _unmountClaimStage();  /* 卸载 CCG 卡释放 DOM */
    }
  });
  gsap.to(overlay, { backgroundColor: 'rgba(0,0,0,0)', duration: 0.15 });
}

/* sprint 26091302 B6: 关弹窗时卸载单张 CCG 卡 (opts 不传 → 默认是交互卡, 在 cards 数组里;
   unmount() 内部 findIndex 找到 destroy + 清空 innerHTML). */
function _unmountClaimStage() {
  var host = document.getElementById('ccg-claim-stage');
  if (host && window.DizicalCCG && DizicalCCG.unmount) {
    DizicalCCG.unmount(host);
  }
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

buildUI();

// 入场动画：section + badge-card 依次淡入上浮 (CCG 卡版本)
document.addEventListener('DOMContentLoaded', () => {
  /* sprint 26091302 B6: buildUI() 里 switchTab 已调用, 但那时 DOMContentLoaded 还没触发.
     这里再补一次升级, 覆盖 buildTab → switchTab 后的 .badge-card. */
  _upgradeAllCards(document.getElementById('app'));

  // 先让 app（#app）淡入
  const app = document.getElementById('app');
  gsap.set(app, { opacity: 0 });
  gsap.to(app, { opacity: 1, duration: 0.3, ease: 'power2.out' });

  // 逐 section + ccg-stage 入场
  const sections = document.querySelectorAll('.section');
  sections.forEach((section, si) => {
    gsap.fromTo(section,
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)',
        delay: si * 0.12, scrollTrigger: undefined }
    );
    /* sprint 26091302 B6: 入场动效作用在 .ccg-stage (替换原 .badge-card) */
    const stages = section.querySelectorAll('.ccg-stage');
    stages.forEach((stage, ci) => {
      gsap.fromTo(stage,
        { opacity: 0, scale: 0.88, y: 10 },
        { opacity: 1, scale: 1, y: 0,
          duration: 0.32, ease: 'back.out(1.8)',
          delay: si * 0.12 + ci * 0.06 + 0.15 }
      );
    });
  });
});
</script>
</body>
</html>
