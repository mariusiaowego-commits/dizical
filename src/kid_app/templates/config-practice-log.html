<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>练习记录管理 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --cream: #f5e6d3;
      --sage: #a8d5ba;
      --rose: #e8b4bc;
      --lavender: #c5b8d9;
      --text: #3d3d3d;
      --radius: 20px;
      --sidebar-width: 220px;
    }

    body {
      background: var(--cream);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .page-layout {
      display: flex;
      height: 100vh;
    }

    /* ── 左侧边栏 ── */
    .sidebar {
      width: var(--sidebar-width);
      background: white;
      border-right: 1px solid rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: bold;
      color: var(--text);
      margin: 0 0 10px;
    }

    .sidebar-header .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #7F8C8D;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .sidebar-header .back-link:hover {
      background: rgba(0,0,0,0.04);
      color: var(--text);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .tab-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border-radius: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      color: var(--text);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .tab-item:hover { background: rgba(168,213,186,0.15); }

    .tab-item.active {
      background: var(--lavender);
      color: white;
      box-shadow: 0 3px 12px rgba(197,184,217,0.4);
    }

    .tab-item .tab-icon { font-size: 18px; }
    .tab-item .tab-label { font-weight: 500; }

    /* ── 右侧主内容 ── */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-header {
      padding: 20px 28px 14px;
      background: white;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content-header h1 {
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      margin: 0;
    }

    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── 通用组件 ── */
    .card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .card h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--sage);
      color: white;
    }

    .btn-primary:hover { transform: scale(1.03); }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid rgba(0,0,0,0.1);
    }

    .btn-secondary:hover { background: rgba(0,0,0,0.03); }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #7F8C8D;
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      font-size: 14px;
      color: var(--text);
      background: white;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--sage);
    }

    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-green { background: rgba(168,213,186,0.2); color: #2E7D32; }
    .badge-blue { background: rgba(100,181,246,0.2); color: #1565C0; }
    .badge-orange { background: rgba(255,183,77,0.2); color: #E65100; }
    .badge-grey { background: rgba(0,0,0,0.06); color: #7F8C8D; }

    /* ── 周视图 ── */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .week-day {
      background: white;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      min-height: 80px;
      transition: all 0.2s;
    }

    .week-day.today {
      border: 2px solid var(--sage);
    }

    .week-day.future {
      opacity: 0.4;
    }

    .week-day .day-label {
      font-size: 12px;
      color: #7F8C8D;
      margin-bottom: 4px;
    }

    .week-day .day-date {
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 6px;
    }

    .week-day .day-minutes {
      font-size: 20px;
      font-weight: bold;
      color: var(--sage);
    }

    .week-day .day-minutes.zero {
      color: #ccc;
      font-size: 14px;
    }

    /* ── 项目分布条 ── */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .bar-label {
      width: 80px;
      font-size: 13px;
      color: var(--text);
      text-align: right;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 20px;
      background: rgba(0,0,0,0.04);
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--sage);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .bar-value {
      width: 60px;
      font-size: 13px;
      color: #7F8C8D;
      flex-shrink: 0;
    }

    /* ── 老师要求列表 ── */
    .assignment-card {
      background: #fff;
      border-radius: 14px;
      padding: 0;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(44,62,80,0.06), 0 1px 2px rgba(44,62,80,0.04);
      border: 1px solid #eef0f2;
      overflow: hidden;
    }

    .assignment-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 0;
    }

    .assignment-date {
      font-size: 13px;
      color: #7F8C8D;
      font-weight: 500;
    }

    .assignment-stage-pill {
      display: inline-block;
      background: #FF6B6B;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .assignment-card-actions {
      display: flex;
      gap: 2px;
    }

    .assignment-card-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s ease;
      line-height: 1;
    }

    .assignment-card-actions button:hover {
      background: #f5f5f5;
    }

    .assignment-card-body {
      padding: 12px 18px 16px;
    }

    /* ── subject block (在白色背景上) ── */
    .assign-subject {
      margin-bottom: 10px;
      padding: 0 0 10px 14px;
      border-left: 3px solid #FF6B6B;
    }

    .assign-subject:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .assign-subject-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .assign-subject-name {
      font-weight: 700;
      font-size: 14px;
      color: #2C3E50;
    }

    .assign-subject-id {
      font-size: 11px;
      color: #aaa;
      font-family: "SF Mono", "Menlo", monospace;
    }

    .assign-subject-reqs {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: req-num;
    }

    .assign-subject-reqs li {
      font-size: 13px;
      color: #555;
      padding: 1px 0 1px 18px;
      position: relative;
      line-height: 1.6;
    }

    .assign-subject-reqs li::before {
      content: counter(req-num, lower-alpha) ")";
      counter-increment: req-num;
      position: absolute;
      left: 0;
      font-weight: 600;
      color: #FF6B6B;
      font-size: 12px;
    }

    /* ── 图片画廊 ── */
    .assign-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
    }

    .assign-images img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e8e8e8;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .assign-images img:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(44,62,80,0.10);
    }

    .assignment-notes {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
      font-style: normal;
      line-height: 1.5;
    }

    .assignment-card-footer {
      padding: 8px 18px 14px;
    }

    /* ── 录入行 ── */
    .log-entry-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      padding: 12px;
      background: #f9f9fa;
      border-radius: 10px;
    }

    .log-entry-row .entry-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-entry-row .entry-top .item-select {
      flex: 1;
    }

    .log-entry-row .entry-bottom {
      display: flex;
      gap: 8px;
    }

    /* 2026-07-27: 补录 tempo row (紧凑版) */
    .log-tempo-row {
      display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap;
    }
    .log-tempo-row .tempo-note-mini {
      padding: 3px 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px;
      cursor: pointer; background: #fff; color: #8B6914; font-weight: 600;
    }
    .log-tempo-row .tempo-note-mini.selected {
      background: #FF6B6B; color: #fff; border-color: #FF6B6B;
    }
    .log-tempo-row .bpm-stepper {
      display: inline-flex; align-items: center; gap: 2px;
      background: #FFF8F0; border: 1px solid #E8D8B0; border-radius: 8px;
      padding: 1px 4px;
    }
    .log-tempo-row .bpm-step {
      width: 22px; height: 22px; border: none; background: transparent;
      cursor: pointer; font-size: 14px; font-weight: 700; color: #8B6914;
      border-radius: 4px;
    }
    .log-tempo-row .bpm-step:hover { background: #F5E6C8; }
    .log-tempo-row .bpm-value {
      min-width: 30px; text-align: center; font-weight: 600; color: #5D4037;
      font-size: 13px;
    }
    .log-tempo-hint {
      font-size: 11px; color: #8B6914; margin-top: 2px; width: 100%;
    }
    .log-bpm-presets {
      display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; width: 100%;
    }
    .bpm-preset-mini {
      padding: 2px 8px; background: #FFF8F0; border: 1px solid #E8D8B0;
      border-radius: 6px; font-size: 11px; color: #8B6914; cursor: pointer;
      transition: all 0.15s;
    }
    .bpm-preset-mini:hover { background: #FF6B6B; color: #fff; border-color: #FF6B6B; }
    .log-content-tags {
      display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; width: 100%;
    }
    .sp-content-tag-mini {
      padding: 3px 10px; background: #F0E8D0; border: 1px solid #D4B886;
      border-radius: 14px; font-size: 11px; color: #5D4037; cursor: pointer;
      transition: all 0.15s;
    }
    .sp-content-tag-mini:hover { background: #FF6B6B; color: #fff; border-color: #FF6B6B; }
    .apply-default-btn {
      padding: 4px 10px; font-size: 11px; border: 1px solid #a8d5ba;
      background: rgba(168,213,186,0.15); color: #2E7D32;
      border-radius: 6px; cursor: pointer; flex-shrink: 0;
    }
    .apply-default-btn:hover { background: rgba(168,213,186,0.3); }
    .apply-default-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .log-entry-row .entry-bottom textarea {
      flex: 1;
      min-height: 100px;
    }

    .log-entry-row .remove-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,107,107,0.1);
      color: #FF6B6B;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
    }

    .log-entry-row .remove-btn:hover {
      background: rgba(255,107,107,0.2);
    }

    /* ── 月报预览 ── */
    .report-preview {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }

    .report-preview .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .report-preview .stat-box {
      background: var(--cream);
      border-radius: 14px;
      padding: 16px;
    }

    .report-preview .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: var(--text);
    }

    .report-preview .stat-label {
      font-size: 12px;
      color: #7F8C8D;
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #7F8C8D;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #7F8C8D;
    }

    /* ── 响应式 ── */
    @media (max-width: 768px) {
      .page-layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.08); }
      .sidebar-content { padding: 8px; }
      .tab-list { flex-direction: row; overflow-x: auto; gap: 6px; }
      .tab-item { white-space: nowrap; padding: 10px 14px; }
      .week-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .week-day { padding: 8px; min-height: 60px; }
      .content-body { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="page-layout">

  <!-- 左侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>📝 练习记录</h2>
      <a href="/config" class="back-link">← 配置管理台</a>
    </div>
    <div class="sidebar-content">
      <div class="tab-list">
        <button class="tab-item active" data-tab="log">
          <span class="tab-icon">✏️</span>
          <span class="tab-label">录入练习</span>
        </button>
        <button class="tab-item" data-tab="assign">
          <span class="tab-icon">📋</span>
          <span class="tab-label">老师要求</span>
        </button>
        <button class="tab-item" data-tab="week">
          <span class="tab-icon">📅</span>
          <span class="tab-label">本周总览</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- 右侧主内容 -->
  <main class="main-content">
    <div class="content-header">
      <h1 id="panelTitle">✏️ 录入练习</h1>
    </div>
    <div class="content-body">

      <!-- Tab 1: 录入练习 -->
      <section id="tab-log" class="tab-panel active">
        <div class="card">
          <h3>今日练习</h3>
          <div class="form-group">
            <label>日期</label>
            <input type="date" class="form-input" id="logDate">
          </div>
          <div class="form-group">
            <label>练习时间（时分，留空默认当前 CST 时间）</label>
            <input type="time" class="form-input" id="logTime" step="60">
            <span class="form-hint" id="logTimeHint" style="font-size:12px;color:#888;margin-top:4px"></span>
          </div>
          <div id="logEntries">
            <!-- 动态生成 -->
          </div>
          <button class="btn btn-secondary" id="addEntryBtn" style="margin-bottom:14px">+ 添加科目</button>
          <div class="form-group">
            <label>练习备注</label>
            <textarea class="form-textarea" id="logNote" placeholder="今天练习的感受..."></textarea>
          </div>
          <button class="btn btn-primary" id="submitLogBtn">✅ 提交练习</button>
        </div>

        <div class="card" id="todayHistory" style="display:none">
          <h3>今日已录入</h3>
          <div id="todayHistoryContent"></div>
        </div>
      </section>

      <!-- Tab 2: 老师要求 -->
      <section id="tab-assign" class="tab-panel">
        <div class="card">
          <h3>录入老师要求</h3>
          <div class="form-group">
            <label>上课日期（留空自动推算最近已上课）</label>
            <input type="date" class="form-input" id="assignDate">
          </div>
          <div class="form-group" style="display:flex;gap:10px;flex-wrap:wrap">
            <div style="flex:1;min-width:120px">
              <label>阶段开始</label>
              <input type="date" class="form-input" id="assignStageStart">
              <span style="font-size:11px;color:#aaa">留空自动推算</span>
            </div>
            <div style="flex:1;min-width:120px">
              <label>阶段结束</label>
              <input type="date" class="form-input" id="assignStageEnd">
              <span style="font-size:11px;color:#aaa">留空自动推算</span>
            </div>
            <div style="flex:0 0 100px">
              <label>第几期</label>
              <input type="number" class="form-input" id="assignStageOrder" min="1" step="1">
              <span style="font-size:11px;color:#aaa">留空自动</span>
            </div>
          </div>
          <div id="assignEntries">
            <!-- 动态生成 -->
          </div>
          <button class="btn btn-secondary" id="addAssignEntryBtn" style="margin-bottom:14px">+ 添加科目要求</button>
          <div class="form-group">
            <label>老师补充说明</label>
            <textarea class="form-textarea" id="assignNotes" placeholder="老师说的其他注意事项..."></textarea>
          </div>
          <div class="form-group">
            <label>📷 配图（风格化卡片）</label>
            <div id="assignImagePreview" class="image-preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>
            <input type="file" id="assignImageInput" accept="image/jpeg,image/png,image/heic,image/heif" multiple style="display:none">
            <button class="btn btn-secondary" id="addAssignImageBtn">+ 选择图片</button>
            <span style="font-size:11px;color:#aaa;margin-left:8px">选图后自动上传，等待风格化完成</span>
            <div id="assignImageStatus" style="font-size:12px;color:#888;margin-top:4px"></div>
          </div>
          <button class="btn btn-primary" id="submitAssignBtn">✅ 提交要求</button>
        </div>

        <div class="card">
          <h3>历史老师要求</h3>
          <div id="assignmentsList" class="loading">加载中...</div>
        </div>
      </section>

      <!-- Tab 3: 本周总览 -->
      <section id="tab-week" class="tab-panel">
        <div class="card">
          <h3>本周练习日历</h3>
          <div id="weekStats" style="margin-bottom:16px"></div>
          <div id="weekGrid" class="week-grid"></div>
        </div>

        <div class="card">
          <h3>项目分布</h3>
          <div id="itemBars"></div>
        </div>

        <div class="card" id="weekAssignmentCard" style="display:none">
          <h3>本周老师要求</h3>
          <div id="weekAssignment"></div>
        </div>
      </section>


    </div>
  </main>

</div>

<script>
// ── 状态 ──
let practiceItems = [];
let logEntries = [];
let assignEntries = [];
let assignImages = []; // [{url, name}, ...]

// ── Tab 切换 ──
const tabs = document.querySelectorAll('.tab-item');
const panels = document.querySelectorAll('.tab-panel');
const titleMap = {
  'log': '✏️ 录入练习',
  'assign': '📋 老师要求',
  'week': '📅 本周总览',
};

function renderLogEntries() {
  const container = document.getElementById('logEntries');
  container.innerHTML = '';
  logEntries.forEach((entry, i) => {
    if (!entry.tempo_note) entry.tempo_note = '♪';
    if (!entry.tempo_bpm) entry.tempo_bpm = 80;
    if (!entry.content) entry.content = '';
    const row = document.createElement('div');
    row.className = 'log-entry-row';
    row.setAttribute('data-idx', i);
    row.innerHTML = `
      <div class="entry-top">
        <select class="form-select item-select" data-idx="${i}">
          <option value="">选择科目...</option>
          ${practiceItems.map(it => `<option value="${it.item_id}" ${it.item_id == entry.item_id ? 'selected' : ''}>${it.name} (${it.item_id})</option>`).join('')}
        </select>
        <input type="number" class="form-input minutes-input" data-idx="${i}" placeholder="分钟" value="${entry.minutes || ''}" min="1" style="width:80px">
        <button type="button" class="apply-default-btn" data-idx="${i}" ${entry.item_id ? '' : 'disabled'}>应用默认</button>
        <button class="remove-btn" data-idx="${i}">×</button>
      </div>
      <div class="log-tempo-row" data-idx="${i}">
        <button type="button" class="tempo-note-mini${entry.tempo_note === '♪' ? ' selected' : ''}" data-note="♪" data-idx="${i}">♪</button>
        <button type="button" class="tempo-note-mini${entry.tempo_note === '♩' ? ' selected' : ''}" data-note="♩" data-idx="${i}">♩</button>
        <span>=</span>
        <div class="bpm-stepper">
          <button type="button" class="bpm-step" data-idx="${i}" data-delta="-1">−</button>
          <span class="bpm-value" data-idx="${i}">${entry.tempo_bpm}</span>
          <button type="button" class="bpm-step" data-idx="${i}" data-delta="1">+</button>
        </div>
        <input type="hidden" class="tempo-bpm-input" data-idx="${i}" value="${entry.tempo_bpm}">
      </div>
      <div class="log-tempo-hint" data-idx="${i}">♪ = ${entry.tempo_bpm} (默认)</div>
      <div class="log-bpm-presets" data-idx="${i}"></div>
      <div class="log-content-tags" data-idx="${i}"></div>
      <input type="text" class="log-content-input" data-idx="${i}" placeholder="练什么? 例如: 第一分句连吐" value="${entry.content || ''}" maxlength="200" style="width:100%;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
    `;
    container.appendChild(row);
  });

  // 事件: item select (切科目清空 entry.speed, 启用应用默认按钮)
  container.querySelectorAll('.item-select').forEach(sel => {
    sel.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      const itemId = parseInt(e.target.value);
      logEntries[idx].item_id = itemId || null;
      const item = practiceItems.find(it => it.item_id == e.target.value);
      logEntries[idx].item = item ? item.name : '';
      // 切换科目清空 entry 的 tempo/content, 跟 practice 一致
      logEntries[idx].tempo_note = '♪';
      logEntries[idx].tempo_bpm = 80;
      logEntries[idx].content = '';
      // 启用/禁用 应用默认按钮
      const applyBtn = container.querySelector(`.apply-default-btn[data-idx="${idx}"]`);
      if (applyBtn) applyBtn.disabled = !itemId;
      // 重置 DOM 状态
      const row = container.querySelector(`.log-entry-row[data-idx="${idx}"]`);
      if (row) {
        row.querySelectorAll('.tempo-note-mini').forEach(b => b.classList.remove('selected'));
        row.querySelector('.tempo-note-mini[data-note="♪"]')?.classList.add('selected');
        row.querySelector(`.bpm-value[data-idx="${idx}"]`).textContent = '80';
        row.querySelector(`.tempo-bpm-input[data-idx="${idx}"]`).value = '80';
        const hint = row.querySelector('.log-tempo-hint');
        if (hint) hint.textContent = '♪ = 80 (默认)';
        const contentInput = row.querySelector('.log-content-input');
        if (contentInput) contentInput.value = '';
        // 清空 presets/tags (等点了应用默认才渲染)
        const presets = row.querySelector('.log-bpm-presets');
        const tags = row.querySelector('.log-content-tags');
        if (presets) presets.innerHTML = '';
        if (tags) tags.innerHTML = '';
      }
    });
  });
  container.querySelectorAll('.minutes-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      logEntries[idx].minutes = parseInt(e.target.value) || 0;
    });
  });

  // 事件: tempo note 切换
  container.querySelectorAll('.tempo-note-mini').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      const row = container.querySelector(`.log-entry-row[data-idx="${idx}"]`);
      row.querySelectorAll('.tempo-note-mini').forEach(b => b.classList.remove('selected'));
      e.target.classList.add('selected');
      logEntries[idx].tempo_note = e.target.dataset.note;
      // 同步 hint (去掉 source 后缀)
      const bpm = parseInt(row.querySelector('.tempo-bpm-input').value) || 80;
      const hint = row.querySelector('.log-tempo-hint');
      if (hint) hint.textContent = e.target.dataset.note + ' = ' + bpm;
    });
  });
  // 事件: BPM stepper +/−
  container.querySelectorAll('.bpm-step').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      const delta = parseInt(e.target.dataset.delta);
      stepEntryBpm(delta, idx);
    });
  });
  // 事件: content
  container.querySelectorAll('.log-content-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      logEntries[idx].content = e.target.value;
    });
  });
  // 事件: 应用默认按钮
  container.querySelectorAll('.apply-default-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      applyDefaultBtnHandler(idx);
    });
  });
  // 事件: remove
  container.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      logEntries.splice(idx, 1);
      renderLogEntries();
    });
  });
}

// ── 应用默认: 复用 practice 的 3 级 fallback 链 (老师要求 → 上次 → 默认) ──
async function fillEntryDefaults(idx) {
  const entry = logEntries[idx];
  if (!entry || !entry.item_id) return;
  const itemId = entry.item_id;

  // 1. 老师要求
  try {
    let r = await fetch('/api/assignments/latest?item_id=' + itemId);
    let d = await r.json();
    if (d.found && d.tempo_note) {
      applyEntryTempo(idx, d.tempo_note, d.tempo_bpm, '老师要求');
      return;
    }
  } catch(e) {}

  // 2. 上次
  try {
    let r = await fetch('/api/practice-sessions/latest?item_id=' + itemId);
    let d = await r.json();
    if (d.found && d.tempo_note) {
      applyEntryTempo(idx, d.tempo_note, d.tempo_bpm, '上次');
      return;
    }
  } catch(e) {}

  // 3. 默认
  applyEntryTempo(idx, '♪', 80, '默认');
}

function applyEntryTempo(idx, note, bpm, source) {
  const row = document.querySelector(`.log-entry-row[data-idx="${idx}"]`);
  if (!row) return;
  // 音符按钮
  row.querySelectorAll('.tempo-note-mini').forEach(b => b.classList.remove('selected'));
  row.querySelector(`.tempo-note-mini[data-note="${note}"]`)?.classList.add('selected');
  // BPM 显示 + 隐藏 input
  row.querySelector(`.bpm-value[data-idx="${idx}"]`).textContent = bpm;
  row.querySelector(`.tempo-bpm-input[data-idx="${idx}"]`).value = bpm;
  // hint
  row.querySelector('.log-tempo-hint').textContent = note + ' = ' + bpm + ' (' + source + ')';
  // 同步到 logEntries[idx]
  logEntries[idx].tempo_note = note;
  logEntries[idx].tempo_bpm = bpm;
  // 渲染预设 + 标签
  renderEntryBpmPresets(idx);
  renderEntryContentTags(idx);
}

function stepEntryBpm(delta, idx) {
  const input = document.querySelector(`.tempo-bpm-input[data-idx="${idx}"]`);
  let v = parseInt(input.value) || 80;
  v = Math.max(40, Math.min(150, v + delta));
  input.value = v;
  document.querySelector(`.bpm-value[data-idx="${idx}"]`).textContent = v;
  logEntries[idx].tempo_bpm = v;
  // 同步 hint (去掉 source 后缀)
  const note = document.querySelector(`.log-entry-row[data-idx="${idx}"] .tempo-note-mini.selected`)?.dataset?.note || '♪';
  const hint = document.querySelector(`.log-tempo-hint[data-idx="${idx}"]`);
  if (hint) hint.textContent = note + ' = ' + v;
}

function setEntryBpm(bpm, idx) {
  bpm = Math.max(40, Math.min(150, parseInt(bpm) || 80));
  document.querySelector(`.tempo-bpm-input[data-idx="${idx}"]`).value = bpm;
  document.querySelector(`.bpm-value[data-idx="${idx}"]`).textContent = bpm;
  logEntries[idx].tempo_bpm = bpm;
  // 同步 hint (去掉 source)
  const note = document.querySelector(`.log-entry-row[data-idx="${idx}"] .tempo-note-mini.selected`)?.dataset?.note || '♪';
  const hint = document.querySelector(`.log-tempo-hint[data-idx="${idx}"]`);
  if (hint) hint.textContent = note + ' = ' + bpm;
}

function renderEntryBpmPresets(idx) {
  const entry = logEntries[idx];
  if (!entry || !entry.item_id) return;
  const container = document.querySelector(`.log-bpm-presets[data-idx="${idx}"]`);
  if (!container) return;
  const presets = [60, 80, 100, 120];
  // 当前 BPM 提前
  const cur = parseInt(entry.tempo_bpm) || 80;
  const list = [cur, ...presets.filter(p => p !== cur)];
  // 去重 + 限制 5 个
  const uniq = [...new Set(list)].slice(0, 5);
  container.innerHTML = uniq.map(p =>
    `<span class="bpm-preset-mini" data-bpm="${p}">${p}</span>`
  ).join('');
  // 事件 (render 时再绑, 避免多次 bind)
  container.querySelectorAll('.bpm-preset-mini').forEach(btn => {
    btn.addEventListener('click', () => setEntryBpm(btn.dataset.bpm, idx));
  });
}

function renderEntryContentTags(idx) {
  const entry = logEntries[idx];
  if (!entry || !entry.item_id) return;
  const container = document.querySelector(`.log-content-tags[data-idx="${idx}"]`);
  if (!container) return;
  const item = practiceItems.find(it => it.item_id == entry.item_id);
  let options = [];
  if (item && item.content_options) {
    options = String(item.content_options).split(/[,，]/).map(s => s.trim()).filter(Boolean);
  }
  if (!options.length) options = ['长音练习', '吐音练习', '连吐练习', '换气练习'];
  container.innerHTML = options.map(opt => {
    const safe = opt.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    return `<span class="sp-content-tag-mini" data-content="${safe}">${opt}</span>`;
  }).join('');
  // 事件
  container.querySelectorAll('.sp-content-tag-mini').forEach(btn => {
    btn.addEventListener('click', () => setEntryContent(btn.dataset.content, idx));
  });
}

function setEntryContent(text, idx) {
  const input = document.querySelector(`.log-content-input[data-idx="${idx}"]`);
  if (input) {
    input.value = text;
    logEntries[idx].content = text;
  }
}

function applyDefaultBtnHandler(idx) {
  const entry = logEntries[idx];
  if (!entry || !entry.item_id) {
    alert('请先选择科目');
    return;
  }
  // R4: 防误覆盖 — 只在 content 已填时确认
  if (entry.content && entry.content.trim()) {
    if (!confirm('已填写练习内容, 应用默认将保留你填的速度但重置内容标签, 继续?')) {
      return;
    }
  }
  fillEntryDefaults(idx);
}

document.getElementById('submitLogBtn').addEventListener('click', async () => {
  const date = document.getElementById('logDate').value;
  const timeStr = document.getElementById('logTime').value; // 'HH:MM' 或 ''
  const note = document.getElementById('logNote').value;
  const validEntries = logEntries.filter(e => e.item_id && e.minutes > 0);

  if (!validEntries.length) {
    alert('请添加至少一个练习科目');
    return;
  }

  // 构造 practice_at (CST ISO 'YYYY-MM-DD HH:MM:SS')
  // 时分留空 → 用当前 CST 时间
  let practiceAt;
  if (timeStr) {
    practiceAt = `${date} ${timeStr}:00`;
  } else {
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    practiceAt = `${date} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  for (const entry of validEntries) {
    const body = {
      date, item: entry.item, item_id: entry.item_id,
      minutes: entry.minutes, log: note, practice_at: practiceAt,
    };
    if (entry.content && entry.content.trim()) {
      body.tempo_note = entry.tempo_note || '♪';
      body.tempo_bpm = entry.tempo_bpm || 80;
      body.content = entry.content.trim();
    }
    await fetch('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  }

  logEntries = [];
  renderLogEntries();
  document.getElementById('logNote').value = '';
  loadTodayHistory();
  alert('✅ 练习已录入');
});

async function loadTodayHistory() {
  const date = document.getElementById('logDate').value;
  if (!date) return;
  try {
    const res = await fetch(`/api/practices/${date}`);
    const data = await res.json();
    const card = document.getElementById('todayHistory');
    const content = document.getElementById('todayHistoryContent');
    let html = '';
    if (data.sessions && data.sessions.length) {
      // 2026-07-27: 优先 sessions[] 展示细节
      let lastItem = '';
      data.sessions.forEach(s => {
        if (s.item_name !== lastItem) {
          if (lastItem) html += '</div>';
          html += `<div style="margin-bottom:8px;padding:8px;background:#fdfdfb;border-radius:8px;border:1px solid #f0e8d0">
            <div style="font-weight:700;color:#5D4037;margin-bottom:4px">${s.item_name}</div>`;
          lastItem = s.item_name;
        }
        html += `<div style="display:flex;gap:8px;align-items:center;padding:2px 0 2px 8px;border-left:2px solid #e8d8b0;margin:2px 0;font-size:13px">
          <span style="color:#8B6914;font-weight:600">${s.tempo_note}=${s.tempo_bpm}</span>
          <span style="color:#5D4037;flex:1">${s.content || ''}</span>
          <span style="color:#A88B5C;font-size:12px">${s.duration_minutes}min</span>
        </div>`;
      });
      if (lastItem) html += '</div>';
      if (data.log) html += `<p style="color:#7F8C8D;font-size:13px;margin-top:8px">📝 ${data.log}</p>`;
      card.style.display = 'block';
      content.innerHTML = html || '<p style="color:#aaa">无今日练习</p>';
    } else if (data.items && data.items.length) {
      card.style.display = 'block';
      content.innerHTML = data.items.map(it =>
        `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04)">
          <span>${it.item}</span>
          <span class="badge badge-green">${it.minutes} 分钟</span>
        </div>`
      ).join('') + (data.log ? `<p style="color:#7F8C8D;font-size:13px;margin-top:8px">📝 ${data.log}</p>` : '');
    } else {
      card.style.display = 'none';
    }
  } catch(e) {
    // 静默失败
  }
}

document.getElementById('assignImageInput').addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files.length) return;
  const statusEl = document.getElementById('assignImageStatus');
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    statusEl.textContent = `⏳ 上传中 (${i+1}/${files.length})...`;
    const formData = new FormData();
    formData.append('file', f);
    try {
      const res = await fetch('/config/api/assignments/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.ok) {
        assignImages.push({ url: data.url, name: f.name });
        renderAssignImagePreview();
        statusEl.textContent = `✅ ${f.name} 已上传`;
      } else {
        statusEl.textContent = `❌ ${f.name}: ${data.error || '上传失败'}`;
      }
    } catch (err) {
      statusEl.textContent = `❌ ${f.name}: 网络错误`;
    }
  }
  e.target.value = ''; // 允许重复选同一文件
});

function renderAssignImagePreview() {

  container.innerHTML = assignImages.map((img, i) => `

}

document.getElementById('submitAssignBtn').addEventListener('click', async () => {
  const lessonDate = document.getElementById('assignDate').value || null;
  const notes = document.getElementById('assignNotes').value;
  const stageStart = document.getElementById('assignStageStart').value || null;
  const stageEnd = document.getElementById('assignStageEnd').value || null;
  const stageOrder = document.getElementById('assignStageOrder').value || null;
  const validEntries = assignEntries.filter(e => e.item_id && e.requirement);

  if (!validEntries.length) {
    alert('请添加至少一个科目要求');
    return;
  }

  const body = {
    lesson_date: lessonDate,
    items: validEntries.map(e => ({ item: e.item, item_id: e.item_id, metronome: e.metronome, requirement: e.requirement })),
    notes,
  };
  if (assignImages.length) body.images = assignImages.map(i => i.url);
  if (stageStart) body.stage_start = stageStart;
  if (stageEnd) body.stage_end = stageEnd;
  if (stageOrder) body.stage_order = parseInt(stageOrder);

  const res = await fetch('/config/api/assignments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.ok) {
    assignEntries = [];
    assignImages = [];
    renderAssignEntries();
    renderAssignImagePreview();
    document.getElementById('assignNotes').value = '';
    document.getElementById('assignStageStart').value = '';
    document.getElementById('assignStageEnd').value = '';
    document.getElementById('assignStageOrder').value = '';
    loadAssignments();
    alert('✅ 老师要求已录入');
  } else {
    alert('❌ ' + (data.error || '录入失败'));
  }
});

async function loadAssignments() {
  const container = document.getElementById('assignmentsList');
  container.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch('/config/api/assignments?weeks=16');
    const data = await res.json();
    if (!data.assignments || !data.assignments.length) {
      container.innerHTML = '<div class="empty-state">暂无老师要求记录</div>';
      return;
    }
    container.innerHTML = data.assignments.map((a, aidx) => {
      const stageLabel = a.stage_order ? `<span class="assignment-stage-pill">第 ${a.stage_order} 期</span>` : '';
      const itemsHtml = a.items.map(it => {
        const reqs = (it.requirements || it.requirement || '').split('\n').filter(Boolean);
        const reqLines = reqs.map(r => `<li>${r}</li>`).join('');
        const metro = it.metronome ? `<span class="assign-subject-metronome" style="display:inline-block;background:#FF6B6B;color:#fff;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;margin-left:6px">${it.metronome}</span>` : '';
        return `<div class="assign-subject">
          <div class="assign-subject-header">
            <span class="assign-subject-name">${it.item}</span>
            ${metro}
            <span class="assign-subject-id">(item_id: ${it.item_id || '?'})</span>
          </div>
          <ul class="assign-subject-reqs">${reqLines || '<li style="opacity:0.5">无具体要求</li>'}</ul>
        </div>`;
      }).join('');
      const imagesHtml = (a.images && a.images.length) ? `<div class="assign-images">${a.images.map(img => `<img src="${img}" alt="配图" onclick="window.open('${img}','_blank')">`).join('')}</div>` : '';
      const notesHtml = a.notes ? `<div class="assignment-notes">${a.notes}</div>` : '';
      return `<div class="assignment-card" data-lesson="${a.lesson_date}">
        <div class="assignment-card-header">
          <div>
            <span class="assignment-date">${a.lesson_date}</span>
            ${stageLabel ? ' ' + stageLabel : ''}
          </div>
          <div class="assignment-card-actions">
            <button class="edit-assign-btn" data-lesson="${a.lesson_date}" title="编辑">✎</button>
            <button class="del-assign-btn" data-lesson="${a.lesson_date}" title="删除">✕</button>
          </div>
        </div>
        <div class="assignment-card-body">
          <div class="assign-subject-container">${itemsHtml}</div>
          ${imagesHtml}
          ${notesHtml}
        </div>
      </div>`;
    }).join('');

    // Bind edit/delete
    container.querySelectorAll('.edit-assign-btn').forEach(btn => {
      btn.addEventListener('click', () => startEditAssignment(btn.dataset.lesson));
    });
    container.querySelectorAll('.del-assign-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteAssignment(btn.dataset.lesson));
    });
  } catch(e) {
    container.innerHTML = '<div class="empty-state">加载失败</div>';
  }
}

async function deleteAssignment(lessonDate) {
  if (!confirm(`真的要删除 ${lessonDate} 的老师要求？`)) return;
  const res = await fetch(`/config/api/assignments/${lessonDate}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.ok) {
    loadAssignments();
  } else {
    alert('❌ ' + (data.error || '删除失败'));
  }
}

function startEditAssignment(lessonDate) {
  const card = document.querySelector(`.assignment-card[data-lesson="${lessonDate}"]`);
  if (!card) return;
  // Toggle: if already editing, close
  if (card.classList.contains('editing')) {
    card.classList.remove('editing');
    card.querySelector('.edit-form')?.remove();
    return;
  }
  // Find the assignment data from API
  fetch('/config/api/assignments?weeks=16').then(r => r.json()).then(data => {
    const a = data.assignments.find(x => x.lesson_date === lessonDate);
    if (!a) return;
    card.classList.add('editing');
    const form = document.createElement('div');
    form.className = 'edit-form';
    form.style.cssText = 'margin-top:12px;padding:12px;background:#f9f9f9;border-radius:10px';
    // Build subject rows
    let itemsRows = '';
    (a.items || []).forEach((it, i) => {
      itemsRows += `<div class="edit-item-row" style="display:flex;gap:6px;margin-bottom:6px">
        <input class="edit-item-name" value="${it.item}" placeholder="科目名" style="flex:1;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
        <input class="edit-item-metro" value="${it.metronome || ''}" placeholder="速度 e.g. ♩=82" style="width:120px;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
        <input class="edit-item-req" value="${it.requirements || it.requirement || ''}" placeholder="要求" style="flex:2;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
      </div>`;
    });
    form.innerHTML = `
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">✏️ 编辑 ${lessonDate}</div>
      <div style="margin-bottom:8px">
        <input id="editNotes" value="${a.notes || ''}" placeholder="老师补充说明" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
      </div>
      ${itemsRows}
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="save-edit-btn" style="background:#4CAF50;color:white;border:none;padding:6px 16px;border-radius:6px;cursor:pointer">💾 保存</button>
        <button class="cancel-edit-btn" style="background:#999;color:white;border:none;padding:6px 16px;border-radius:6px;cursor:pointer">取消</button>
      </div>
    `;
    card.appendChild(form);

    form.querySelector('.save-edit-btn').addEventListener('click', async () => {
      const items = Array.from(form.querySelectorAll('.edit-item-row')).map(row => ({
        item: row.querySelector('.edit-item-name').value,
        metronome: row.querySelector('.edit-item-metro').value,
        requirement: row.querySelector('.edit-item-req').value,
      }));
      const notes = form.querySelector('#editNotes').value;
      const res = await fetch(`/config/api/assignments/${lessonDate}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, notes }),
      });
      const d = await res.json();
      if (d.ok) {
        loadAssignments();
      } else {
        alert('❌ ' + (d.error || '保存失败'));
      }
    });
    form.querySelector('.cancel-edit-btn').addEventListener('click', () => {
      card.classList.remove('editing');
      form.remove();
    });
  });
}

// Tab 3: 本周总览
// ══════════════════════════════════════════════════

async function loadWeek() {
  try {
    const res = await fetch('/config/api/practice-week');
    const data = await res.json();

    // 统计
    document.getElementById('weekStats').innerHTML = `
      <span class="badge badge-green">练习 ${data.practice_days}/7 天</span>
      <span class="badge badge-blue">总计 ${data.total_minutes} 分钟</span>
      <span class="badge badge-orange">日均 ${data.practice_days ? Math.round(data.total_minutes / data.practice_days) : 0} 分钟</span>
    `;

    // 日历网格
    const dayNames = ['一', '二', '三', '四', '五', '六', '日'];
    const grid = document.getElementById('weekGrid');
    grid.innerHTML = '';
    const startDate = new Date(data.week_start);

    for (let i = 0; i < 7; i++) {
      const d = new Date(startDate);
      d.setDate(d.getDate() + i);
      const key = d.toISOString().split('T')[0];
      const day = data.days[key] || {};
      const isToday = day.is_today;
      const isFuture = day.is_future;
      const mins = day.total_minutes || 0;

      const cell = document.createElement('div');
      cell.className = `week-day ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}`;
      cell.innerHTML = `
        <div class="day-label">${dayNames[i]}</div>
        <div class="day-date">${d.getMonth()+1}/${d.getDate()}</div>
        <div class="day-minutes ${mins === 0 ? 'zero' : ''}">${isFuture ? '-' : (mins ? mins + "'" : '—')}</div>
      `;
      grid.appendChild(cell);
    }

    // 项目分布
    const bars = document.getElementById('itemBars');
    if (data.item_totals && Object.keys(data.item_totals).length) {
      const total = Object.values(data.item_totals).reduce((a, b) => a + b, 0);
      const sorted = Object.entries(data.item_totals).sort((a, b) => b[1] - a[1]);
      bars.innerHTML = sorted.map(([name, mins]) => {
        const pct = total > 0 ? (mins / total * 100) : 0;
        return `
          <div class="bar-row">
            <span class="bar-label">${name}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bar-value">${mins}' (${pct.toFixed(0)}%)</span>
          </div>
        `;
      }).join('');
    } else {
      bars.innerHTML = '<div class="empty-state">本周暂无练习数据</div>';
    }

    // 老师要求
    const assignCard = document.getElementById('weekAssignmentCard');
    const assignDiv = document.getElementById('weekAssignment');
    if (data.assignment && data.assignment.items && data.assignment.items.length) {
      assignCard.style.display = 'block';
      const a = data.assignment;
      assignDiv.innerHTML = a.items.map(it => {
        const reqs = (it.requirements || it.requirement || '').split('\n').filter(Boolean);
        const reqLines = reqs.map(r => `<li>${r}</li>`).join('');
        const metro = it.metronome ? `<span class="assign-subject-metronome" style="display:inline-block;background:#FF6B6B;color:#fff;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;margin-left:6px">${it.metronome}</span>` : '';
        return `<div class="assign-subject">
          <div class="assign-subject-header">
            <span class="assign-subject-name">${it.item}</span>
            ${metro}
            <span class="assign-subject-id">(item_id: ${it.item_id || '?'})</span>
          </div>
          <ul class="assign-subject-reqs">${reqLines || '<li style="opacity:0.5">无具体要求</li>'}</ul>
        </div>`;
      }).join('') + (
        (a.images && a.images.length) ? `<div class="assign-images">${a.images.map(img => `<img src="${img}" alt="配图" onclick="window.open('${img}','_blank')">`).join('')}</div>` : ''
      ) + (
        a.notes ? `<div class="assignment-notes" style="margin-top:10px">💬 ${a.notes}</div>` : ''
      );
    } else {
      assignCard.style.display = 'none';
    }
  } catch(e) {
    document.getElementById('weekGrid').innerHTML = '<div class="empty-state">加载失败</div>';
  }
}
