<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>练习记录管理 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --cream: #f5e6d3;
      --sage: #a8d5ba;
      --rose: #e8b4bc;
      --lavender: #c5b8d9;
      --text: #3d3d3d;
      --radius: 20px;
      --sidebar-width: 220px;
    }

    body {
      background: var(--cream);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .page-layout {
      display: flex;
      height: 100vh;
    }

    /* ── 左侧边栏 ── */
    .sidebar {
      width: var(--sidebar-width);
      background: white;
      border-right: 1px solid rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: bold;
      color: var(--text);
      margin: 0 0 10px;
    }

    .sidebar-header .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #7F8C8D;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .sidebar-header .back-link:hover {
      background: rgba(0,0,0,0.04);
      color: var(--text);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .tab-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border-radius: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      color: var(--text);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .tab-item:hover { background: rgba(168,213,186,0.15); }

    .tab-item.active {
      background: var(--lavender);
      color: white;
      box-shadow: 0 3px 12px rgba(197,184,217,0.4);
    }

    .tab-item .tab-icon { font-size: 18px; }
    .tab-item .tab-label { font-weight: 500; }

    /* ── 右侧主内容 ── */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-header {
      padding: 20px 28px 14px;
      background: white;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content-header h1 {
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      margin: 0;
    }

    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── 通用组件 ── */
    .card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .card h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--sage);
      color: white;
    }

    .btn-primary:hover { transform: scale(1.03); }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid rgba(0,0,0,0.1);
    }

    .btn-secondary:hover { background: rgba(0,0,0,0.03); }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #7F8C8D;
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      font-size: 14px;
      color: var(--text);
      background: white;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--sage);
    }

    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-green { background: rgba(168,213,186,0.2); color: #2E7D32; }
    .badge-blue { background: rgba(100,181,246,0.2); color: #1565C0; }
    .badge-orange { background: rgba(255,183,77,0.2); color: #E65100; }
    .badge-grey { background: rgba(0,0,0,0.06); color: #7F8C8D; }

    /* ── 周视图 ── */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .week-day {
      background: white;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      min-height: 80px;
      transition: all 0.2s;
    }

    .week-day.today {
      border: 2px solid var(--sage);
    }

    .week-day.future {
      opacity: 0.4;
    }

    .week-day .day-label {
      font-size: 12px;
      color: #7F8C8D;
      margin-bottom: 4px;
    }

    .week-day .day-date {
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 6px;
    }

    .week-day .day-minutes {
      font-size: 20px;
      font-weight: bold;
      color: var(--sage);
    }

    .week-day .day-minutes.zero {
      color: #ccc;
      font-size: 14px;
    }

    /* ── 项目分布条 ── */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .bar-label {
      width: 80px;
      font-size: 13px;
      color: var(--text);
      text-align: right;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 20px;
      background: rgba(0,0,0,0.04);
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--sage);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .bar-value {
      width: 60px;
      font-size: 13px;
      color: #7F8C8D;
      flex-shrink: 0;
    }

    /* ── 老师要求列表 ── */
    .assignment-card {
      background: #fff;
      border-radius: 14px;
      padding: 0;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(44,62,80,0.06), 0 1px 2px rgba(44,62,80,0.04);
      border: 1px solid #eef0f2;
      overflow: hidden;
    }

    .assignment-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 0;
    }

    .assignment-date {
      font-size: 13px;
      color: #7F8C8D;
      font-weight: 500;
    }

    .assignment-stage-pill {
      display: inline-block;
      background: #FF6B6B;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .assignment-card-actions {
      display: flex;
      gap: 2px;
    }

    .assignment-card-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s ease;
      line-height: 1;
    }

    .assignment-card-actions button:hover {
      background: #f5f5f5;
    }

    .assignment-card-body {
      padding: 12px 18px 16px;
    }

    /* ── subject block (在白色背景上) ── */
    .assign-subject {
      margin-bottom: 10px;
      padding: 0 0 10px 14px;
      border-left: 3px solid #FF6B6B;
    }

    .assign-subject:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .assign-subject-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .assign-subject-name {
      font-weight: 700;
      font-size: 14px;
      color: #2C3E50;
    }

    .assign-subject-id {
      font-size: 11px;
      color: #aaa;
      font-family: "SF Mono", "Menlo", monospace;
    }

    .assign-subject-reqs {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: req-num;
    }

    .assign-subject-reqs li {
      font-size: 13px;
      color: #555;
      padding: 1px 0 1px 18px;
      position: relative;
      line-height: 1.6;
    }

    .assign-subject-reqs li::before {
      content: counter(req-num, lower-alpha) ")";
      counter-increment: req-num;
      position: absolute;
      left: 0;
      font-weight: 600;
      color: #FF6B6B;
      font-size: 12px;
    }

    /* ── 图片画廊 ── */
    .assign-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
    }

    .assign-images img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e8e8e8;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .assign-images img:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(44,62,80,0.10);
    }

    .assignment-notes {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
      font-style: normal;
      line-height: 1.5;
    }

    .assignment-card-footer {
      padding: 8px 18px 14px;
    }

    /* ── 录入行 ── */
    .log-entry-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      padding: 12px;
      background: #f9f9fa;
      border-radius: 10px;
    }

    .log-entry-row .entry-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-entry-row .entry-top .item-select {
      flex: 1;
    }

    /* sprint 26080101 v2: 录入行 父行 + 子 session 结构 */
    .log-entry-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      padding: 12px;
      background: #f9f9fa;
      border-radius: 10px;
      border-left: 3px solid #FF6B6B;
    }

    .log-entry-row .entry-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-entry-row .entry-top .item-select {
      flex: 1;
    }

    .log-entry-row .entry-total {
      font-size: 16px; color: #7F8C8D; font-weight: 600;
      padding: 2px 8px; background: #fff; border-radius: 6px;
      border: 1px solid #e0e0e0;
    }

/* 老师要求 hint (Q2=C 小字) */
    .entry-assign-hint {
      font-size: 14px; color: #8B6914; background: #FFF8F0;
      padding: 6px 10px; border-radius: 6px;
      border-left: 2px solid #FF6B6B;
      margin-top: 2px;
    }
    .entry-assign-hint .assign-detail {
      font-weight: 600;
    }
    .entry-assign-hint .assign-req {
      color: #5D4037; margin-top: 2px;
      white-space: pre-wrap;
    }

    /* 子 session 行 */
    .session-sub-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 14px;
      border-left: 2px dashed #d0d5dd;
      margin-top: 4px;
    }

    .session-sub-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e8e0d0;
    }

    .session-sub-row .sub-line-1 {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }

    .session-sub-row .sub-line-2 {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }

    .session-sub-row .sub-minutes-input {
      width: 56px; padding: 2px 4px; font-size: 16px;
      border-radius: 6px; border: 1px solid #ddd; text-align: center;
    }

    .session-sub-row .sub-content-input {
      width: 100%; padding: 4px 8px; font-size: 16px;
      border-radius: 6px; border: 1px solid #ddd;
    }

    .session-sub-row .sub-remove-btn {
      width: 22px; height: 22px; border-radius: 50%; border: none;
      background: rgba(255,107,107,0.1); color: #FF6B6B;
      cursor: pointer; font-size: 18px; flex-shrink: 0;
    }
    .session-sub-row .sub-remove-btn:hover { background: rgba(255,107,107,0.2); }

    .session-sub-row .sub-add-mini-btn,
    .session-sub-rows .sub-add-mini-btn {
      padding: 6px 14px; font-size: 14px;
      border: 1px dashed #a8d5ba; background: transparent;
      color: #2E7D32; border-radius: 6px; cursor: pointer;
      align-self: flex-start;
      margin-top: 4px;
    }
    .session-sub-row .sub-add-mini-btn:hover,
    .session-sub-rows .sub-add-mini-btn:hover { background: rgba(168,213,186,0.15); }

    /* 子 session 内 BPM / 音符 / 标签 */
    .session-sub-row .tempo-note-mini {
      width: 32px; height: 26px; padding: 0; border-radius: 6px;
      border: 1px solid #ddd; font-size: 17px; cursor: pointer;
      background: #fff; color: #8B6914; font-weight: 600;
    }
    .session-sub-row .tempo-note-mini.selected {
      background: #FF6B6B; color: #fff; border-color: #FF6B6B;
    }
    .session-sub-row .bpm-stepper {
      display: inline-flex; align-items: center; gap: 2px;
      background: #FFF8F0; border: 1px solid #E8D8B0; border-radius: 8px;
      padding: 1px 4px;
    }
    .session-sub-row .bpm-step {
      width: 22px; height: 22px; border: none; background: transparent;
      cursor: pointer; font-size: 18px; font-weight: 700; color: #8B6914;
      border-radius: 4px;
    }
    .session-sub-row .bpm-step:hover { background: #F5E6C8; }
    .session-sub-row .bpm-value {
      min-width: 30px; text-align: center; font-weight: 600; color: #5D4037;
      font-size: 17px;
    }
    .session-sub-row .bpm-preset-mini {
      padding: 2px 6px; background: #FFF8F0; border: 1px solid #E8D8B0;
      border-radius: 6px; font-size: 13px; color: #8B6914; cursor: pointer;
    }
    .session-sub-row .bpm-preset-mini:hover { background: #FF6B6B; color: #fff; border-color: #FF6B6B; }
    .session-sub-row .sp-content-tag-mini {
      padding: 2px 8px; background: #F0E8D0; border: 1px solid #D4B886;
      border-radius: 12px; font-size: 13px; color: #5D4037; cursor: pointer;
    }
    .session-sub-row .sp-content-tag-mini:hover { background: #FF6B6B; color: #fff; border-color: #FF6B6B; }


.log-entry-row .remove-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,107,107,0.1);
      color: #FF6B6B;
      cursor: pointer;
      font-size: 21px;
      flex-shrink: 0;
    }

    .log-entry-row .remove-btn:hover {
      background: rgba(255,107,107,0.2);
    }

    /* ── 月报预览 ── */
    .report-preview {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }

    .report-preview .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .report-preview .stat-box {
      background: var(--cream);
      border-radius: 14px;
      padding: 16px;
    }

    .report-preview .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: var(--text);
    }

    .report-preview .stat-label {
      font-size: 12px;
      color: #7F8C8D;
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #7F8C8D;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #7F8C8D;
    }

    /* ── 响应式 ── */
    @media (max-width: 768px) {
      .page-layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.08); }
      .sidebar-content { padding: 8px; }
      .tab-list { flex-direction: row; overflow-x: auto; gap: 6px; }
      .tab-item { white-space: nowrap; padding: 10px 14px; }
      .week-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .week-day { padding: 8px; min-height: 60px; }
      .content-body { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="page-layout">

  <!-- 左侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>📝 练习记录</h2>
      <a href="/config" class="back-link">← 配置管理台</a>
    </div>
    <div class="sidebar-content">
      <div class="tab-list">
        <button class="tab-item active" data-tab="log">
          <span class="tab-icon">✏️</span>
          <span class="tab-label">录入练习</span>
        </button>
        <button class="tab-item" data-tab="assign">
          <span class="tab-icon">📋</span>
          <span class="tab-label">老师要求</span>
        </button>
        <button class="tab-item" data-tab="week">
          <span class="tab-icon">📅</span>
          <span class="tab-label">本周总览</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- 右侧主内容 -->
  <main class="main-content">
    <div class="content-header">
      <h1 id="panelTitle">✏️ 录入练习</h1>
    </div>
    <div class="content-body">

      <!-- Tab 1: 录入练习 -->
      <section id="tab-log" class="tab-panel active">
        <div class="card">
          <h3>今日练习</h3>
          <div class="form-group">
            <label>日期</label>
            <input type="date" class="form-input" id="logDate">
          </div>
          <div class="form-group">
            <label>练习时间（时分，留空默认当前 CST 时间）</label>
            <input type="time" class="form-input" id="logTime" step="60">
            <span class="form-hint" id="logTimeHint" style="font-size:12px;color:#888;margin-top:4px"></span>
          </div>
          <div id="logEntries">
            <!-- 动态生成 -->
          </div>
          <button class="btn btn-secondary" id="addEntryBtn" style="margin-bottom:14px">+ 添加科目</button>
          <div class="form-group">
            <label>练习备注</label>
            <textarea class="form-textarea" id="logNote" placeholder="今天练习的感受..."></textarea>
          </div>
          <button class="btn btn-primary" id="submitLogBtn">✅ 提交练习</button>
        </div>

        <div class="card" id="todayHistory" style="display:none">
          <h3>今日已录入</h3>
          <div id="todayHistoryContent"></div>
        </div>
      </section>

      <!-- Tab 2: 老师要求 -->
      <section id="tab-assign" class="tab-panel">
        <div class="card">
          <h3>录入老师要求</h3>
          <div class="form-group">
            <label>上课日期（留空自动推算最近已上课）</label>
            <input type="date" class="form-input" id="assignDate">
          </div>
          <div class="form-group" style="display:flex;gap:10px;flex-wrap:wrap">
            <div style="flex:1;min-width:120px">
              <label>阶段开始</label>
              <input type="date" class="form-input" id="assignStageStart">
              <span style="font-size:11px;color:#aaa">留空自动推算</span>
            </div>
            <div style="flex:1;min-width:120px">
              <label>阶段结束</label>
              <input type="date" class="form-input" id="assignStageEnd">
              <span style="font-size:11px;color:#aaa">留空自动推算</span>
            </div>
            <div style="flex:0 0 100px">
              <label>第几期</label>
              <input type="number" class="form-input" id="assignStageOrder" min="1" step="1">
              <span style="font-size:11px;color:#aaa">留空自动</span>
            </div>
          </div>
          <div id="assignEntries">
            <!-- 动态生成 -->
          </div>
          <button class="btn btn-secondary" id="addAssignEntryBtn" style="margin-bottom:14px">+ 添加科目要求</button>
          <div class="form-group">
            <label>老师补充说明</label>
            <textarea class="form-textarea" id="assignNotes" placeholder="老师说的其他注意事项..."></textarea>

let logEntries = []; // 每个 entry: { item_id, item, sessions: [{ minutes, tempo_note, tempo_bpm, content, is_subfetched }] }
let assignEntries = []; // 老师要求录入条目 (声明必须放这: id=assignEntries 的 div 会污染全局变量名)

// Tab 1: 录入练习 (sprint 26080101 v2: 父行 + 子 session 行)
// ══════════════════════════════════════════════════

function renderLogEntries() {
  const container = document.getElementById('logEntries');
  container.innerHTML = '';
  logEntries.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'log-entry-row';
    row.setAttribute('data-idx', i);
    row.innerHTML = `
      <div class="entry-top">
        <select class="form-select item-select" data-idx="${i}">
          <option value="">选择科目...</option>
          ${practiceItems.map(it => `<option value="${it.item_id}" ${it.item_id == entry.item_id ? 'selected' : ''}>${it.name} (${it.item_id})</option>`).join('')}
        </select>
        <span class="entry-total" data-idx="${i}">${calcEntryTotal(entry)} 分钟</span>
        <button class="remove-btn" data-idx="${i}">×</button>
      </div>
      <div class="entry-assign-hint" data-idx="${i}" style="display:none"></div>
      <div class="session-sub-rows" data-idx="${i}">
        ${entry.sessions.map((s, si) => renderSubRowHtml(i, si, s, entry)).join('')}
        <button type="button" class="sub-add-mini-btn" data-idx="${i}">+ 加一次练习</button>
      </div>
    `;
    container.appendChild(row);
  });

  // 事件: item select
  container.querySelectorAll('.item-select').forEach(sel => {
    sel.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      const itemId = parseInt(e.target.value);
      const item = practiceItems.find(it => it.item_id == itemId);
      logEntries[idx].item_id = itemId || null;
      logEntries[idx].item = item ? item.name : '';
      logEntries[idx].sessions = [];
      if (itemId) {
        logEntries[idx].sessions.push({ minutes: 0, tempo_note: '♪', tempo_bpm: 80, content: '', is_subfetched: false });
      }
      renderLogEntries();
      if (itemId) {
        autoFillEntryDefaults(idx);
      }
    });
  });

  // 事件: 父行 remove
  container.querySelectorAll('.log-entry-row > .entry-top > .remove-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      logEntries.splice(idx, 1);
      renderLogEntries();
    });
  });

  // 事件: 子行 分钟
  container.querySelectorAll('.sub-minutes-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const [i, si] = e.target.dataset.idsx.split('-').map(Number);
      logEntries[i].sessions[si].minutes = parseInt(e.target.value) || 0;
      const total = calcEntryTotal(logEntries[i]);
      const totalEl = container.querySelector(`.entry-total[data-idx="${i}"]`);
      if (totalEl) totalEl.textContent = total + ' 分钟';
    });
  });

  // 事件: 子行 音符切换
  container.querySelectorAll('.session-sub-row .tempo-note-mini').forEach(btn => {
    btn.addEventListener('click', e => {
      const [i, si] = e.target.dataset.idsx.split('-').map(Number);
      const subRow = e.target.closest('.session-sub-row');
      subRow.querySelectorAll('.tempo-note-mini').forEach(b => b.classList.remove('selected'));
      e.target.classList.add('selected');
      logEntries[i].sessions[si].tempo_note = e.target.dataset.note;
    });
  });

  // 事件: 子行 BPM stepper
  container.querySelectorAll('.session-sub-row .bpm-step').forEach(btn => {
    btn.addEventListener('click', e => {
      const [i, si] = e.target.dataset.idsx.split('-').map(Number);
      const delta = parseInt(e.target.dataset.delta);
      const subRow = e.target.closest('.session-sub-row');
      const bpmVal = subRow.querySelector('.bpm-value');
      const bpmInput = subRow.querySelector('.sub-bpm-input');
      let v = parseInt(bpmInput.value) || 80;
      v = Math.max(40, Math.min(150, v + delta));
      bpmVal.textContent = v;
      bpmInput.value = v;
      logEntries[i].sessions[si].tempo_bpm = v;
    });
  });

  // 事件: 子行 BPM preset
  container.querySelectorAll('.session-sub-row .bpm-preset-mini').forEach(btn => {
    btn.addEventListener('click', e => {
      const [i, si] = e.target.dataset.idsx.split('-').map(Number);
      const subRow = e.target.closest('.session-sub-row');
      const bpm = parseInt(e.target.dataset.bpm);
      const bpmVal = subRow.querySelector('.bpm-value');
      const bpmInput = subRow.querySelector('.sub-bpm-input');
      bpmVal.textContent = bpm;
      bpmInput.value = bpm;
      logEntries[i].sessions[si].tempo_bpm = bpm;
    });
  });

  // 事件: 子行 content 输入
  container.querySelectorAll('.sub-content-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const [i, si] = e.target.dataset.idsx.split('-').map(Number);
      logEntries[i].sessions[si].content = e.target.value;
    });
  });

  // 事件: 子行 content 标签点击
  container.querySelectorAll('.session-sub-row .sp-content-tag-mini').forEach(btn => {
    btn.addEventListener('click', e => {
      const [i, si] = e.target.dataset.idsx.split('-').map(Number);
      const subRow = e.target.closest('.session-sub-row');
      const contentInput = subRow.querySelector('.sub-content-input');
      if (contentInput) {
        contentInput.value = e.target.dataset.content;
        logEntries[i].sessions[si].content = e.target.dataset.content;
      }
    });
  });

  // 事件: 子行 remove
  container.querySelectorAll('.session-sub-row .sub-remove-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const [i, si] = e.target.dataset.idsx.split('-').map(Number);
      logEntries[i].sessions.splice(si, 1);
      renderLogEntries();
    });
  });

  // 事件: 父行 '添加练习' 按钮
  container.querySelectorAll('.sub-add-mini-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      const entry = logEntries[idx];
      const last = entry.sessions[entry.sessions.length - 1];
      const newSession = last
        ? { minutes: 0, tempo_note: last.tempo_note, tempo_bpm: last.tempo_bpm, content: '', is_subfetched: false }
        : { minutes: 0, tempo_note: '♪', tempo_bpm: 80, content: '', is_subfetched: false };
      entry.sessions.push(newSession);
      renderLogEntries();
    });
  });
}

function renderSubRowHtml(parentIdx, subIdx, s, entry) {
  const presets = [s.tempo_bpm, 60, 80, 100, 120].filter((v, i, a) => a.indexOf(v) === i).slice(0, 5);
  const item = practiceItems.find(it => it.item_id == entry.item_id);
  let options = [];
  if (item && item.content_options) {
    options = String(item.content_options).split(/[,，]/).map(x => x.trim()).filter(Boolean);
  }
  if (!options.length) options = ['长音练习', '吐音练习', '连吐练习', '换气练习'];
  const idsx = parentIdx + '-' + subIdx;
  const safeContent = (s.content || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  return `
    <div class="session-sub-row" data-idx="${parentIdx}" data-sub="${subIdx}">
      <div class="sub-line-1">
        <input type="number" class="sub-minutes-input" data-idsx="${idsx}" placeholder="分" min="1" value="${s.minutes || ''}">
        <button type="button" class="tempo-note-mini${s.tempo_note === '♪' ? ' selected' : ''}" data-note="♪" data-idsx="${idsx}">♪</button>
        <button type="button" class="tempo-note-mini${s.tempo_note === '♩' ? ' selected' : ''}" data-note="♩" data-idsx="${idsx}">♩</button>
        <div class="bpm-stepper">
          <button type="button" class="bpm-step" data-idsx="${idsx}" data-delta="-1">−</button>
          <span class="bpm-value">${s.tempo_bpm}</span>
          <button type="button" class="bpm-step" data-idsx="${idsx}" data-delta="1">+</button>
        </div>
        <input type="hidden" class="sub-bpm-input" value="${s.tempo_bpm}">
        <button type="button" class="sub-remove-btn" data-idsx="${idsx}">×</button>
      </div>
      <div class="sub-line-2">
        ${presets.map(p => `<span class="bpm-preset-mini" data-idsx="${idsx}" data-bpm="${p}">${p}</span>`).join('')}
      </div>
      <div class="sub-line-2">
        ${options.map(o => `<span class="sp-content-tag-mini" data-idsx="${idsx}" data-content="${o.replace(/"/g, '&quot;').replace(/'/g, '&#39;')}">${o}</span>`).join('')}
      </div>
      <input type="text" class="sub-content-input" data-idsx="${idsx}" placeholder="练什么? 例如: 第一分句连吐" value="${safeContent}" maxlength="200">
    </div>
  `;
}

function calcEntryTotal(entry) {
  return (entry.sessions || []).reduce((sum, s) => sum + (parseInt(s.minutes) || 0), 0);
}

document.getElementById('addEntryBtn').addEventListener('click', () => {
  logEntries.push({ item_id: null, item: '', sessions: [] });
  renderLogEntries();
});

// ── 自动填默认 (Q3=A 选中科目后立刻填) ──
async function autoFillEntryDefaults(idx) {
  const entry = logEntries[idx];
  if (!entry || !entry.item_id) return;
  const itemId = entry.item_id;

  let tempoNote = null, tempoBpm = 80, source = '默认', lastReq = null, lastLessonDate = null;
  // 1. 老师要求 (优先)
  try {
    let r = await fetch('/api/assignments/latest?item_id=' + itemId);
    let d = await r.json();
    if (d.found && d.tempo_note) {
      tempoNote = d.tempo_note;
      tempoBpm = d.tempo_bpm;
      source = '上次老师要求';
      lastReq = d.requirements || '';
      lastLessonDate = d.lesson_date || '';
    }
  } catch(e) {}

  // 2. 上次 session (fallback)
  if (!tempoNote) {
    try {
      let r = await fetch('/api/practice-sessions/latest?item_id=' + itemId);
      let d = await r.json();
      if (d.found && d.tempo_note) {
        tempoNote = d.tempo_note;
        tempoBpm = d.tempo_bpm;
        source = '上次';
      }
    } catch(e) {}
  }

  // 3. 默认
  if (!tempoNote) {
    tempoNote = '♪';
    tempoBpm = 80;
    source = '默认';
  }

  // 应用到 sessions (只改第一个 session, 其他保持)
  if (entry.sessions.length === 0) {
    entry.sessions.push({ minutes: 0, tempo_note: tempoNote, tempo_bpm: tempoBpm, content: '', is_subfetched: true });
  } else {
    entry.sessions[0].tempo_note = tempoNote;
    entry.sessions[0].tempo_bpm = tempoBpm;
    entry.sessions[0].is_subfetched = true;
  }
  renderLogEntries();

  // 展示老师要求 hint (Q2=C 小字)
  const hintEl = document.querySelector('.entry-assign-hint[data-idx="' + idx + '"]');
  if (hintEl) {
    if (lastReq) {
      hintEl.innerHTML = '<div class="assign-detail">📋 ' + lastLessonDate + ' ' + tempoNote + '=' + tempoBpm + ' · ' + source + '</div><div class="assign-req">' + lastReq.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
      hintEl.style.display = 'block';
    } else {
      hintEl.style.display = 'none';
    }
  }
}


document.getElementById('submitLogBtn').addEventListener('click', async () => {
  const date = document.getElementById('logDate').value;
  const timeStr = document.getElementById('logTime').value;
  const note = document.getElementById('logNote').value;
  const validEntries = logEntries.filter(e => e.item_id && (e.sessions || []).some(s => s.minutes > 0));
  if (!validEntries.length) {
    alert('请添加至少 1 个练习科目 + 1 个练习细节');
    return;
  }

  let practiceAt;
  if (timeStr) {
    practiceAt = date + ' ' + timeStr + ':00';
  } else {
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    practiceAt = date + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }

  const submitBtn = document.getElementById('submitLogBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ 提交中...';

  let okCount = 0, failCount = 0;
  for (const entry of validEntries) {
    for (const s of entry.sessions) {
      if (!s.minutes || s.minutes <= 0) continue;
      const body = {
        date, item: entry.item, item_id: entry.item_id,
        minutes: s.minutes, log: note, practice_at: practiceAt,
        tempo_note: s.tempo_note || '♪',
        tempo_bpm: s.tempo_bpm || 80,
        content: s.content || (s.tempo_note || '♪') + '=' + (s.tempo_bpm || 80),
      };
      try {
        const r = await fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (r.ok) {
          okCount++;
          await new Promise(r => setTimeout(r, 100));
        } else {
          failCount++;
          const err = await r.json().catch(() => ({}));
          console.error('submit failed', entry.item, s, err);
        }
      } catch (e) {
        failCount++;
        console.error('submit exception', e);
      }
    }
  }

  submitBtn.disabled = false;
  submitBtn.textContent = '✅ 提交练习';

  logEntries = [];
  renderLogEntries();
  document.getElementById('logNote').value = '';
  loadTodayHistory();
  if (failCount === 0) {
    alert('✅ 已录入 ' + okCount + ' 个练习细节');
  } else {
    alert('⚠️ 成功 ' + okCount + ' / 失败 ' + failCount + ' 个');
  }
});

async function loadTodayHistory() {
  const date = document.getElementById('logDate').value;
  if (!date) return;
  try {
    const res = await fetch(`/api/practices/${date}`);
    const data = await res.json();
    const card = document.getElementById('todayHistory');
    const content = document.getElementById('todayHistoryContent');
    let html = '';
    if (data.sessions && data.sessions.length) {
      // 2026-07-27: 优先 sessions[] 展示细节
      let lastItem = '';
      data.sessions.forEach(s => {
        if (s.item_name !== lastItem) {
          if (lastItem) html += '</div>';
          html += `<div style="margin-bottom:8px;padding:8px;background:#fdfdfb;border-radius:8px;border:1px solid #f0e8d0">
            <div style="font-weight:700;color:#5D4037;margin-bottom:4px">${s.item_name}</div>`;
          lastItem = s.item_name;
        }
        html += `<div style="display:flex;gap:8px;align-items:center;padding:2px 0 2px 8px;border-left:2px solid #e8d8b0;margin:2px 0;font-size:13px">
          <span style="color:#8B6914;font-weight:600">${s.tempo_note}=${s.tempo_bpm}</span>
          <span style="color:#5D4037;flex:1">${s.content || ''}</span>
          <span style="color:#A88B5C;font-size:12px">${s.duration_minutes}min</span>
        </div>`;
      });
      if (lastItem) html += '</div>';
      if (data.log) html += `<p style="color:#7F8C8D;font-size:13px;margin-top:8px">📝 ${data.log}</p>`;
      card.style.display = 'block';
      content.innerHTML = html || '<p style="color:#aaa">无今日练习</p>';
    } else if (data.items && data.items.length) {
      card.style.display = 'block';
      content.innerHTML = data.items.map(it =>
        `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04)">
          <span>${it.item}</span>
          <span class="badge badge-green">${it.minutes} 分钟</span>
        </div>`
      ).join('') + (data.log ? `<p style="color:#7F8C8D;font-size:13px;margin-top:8px">📝 ${data.log}</p>` : '');
    } else {
      card.style.display = 'none';
    }
  } catch(e) {
    // 静默失败
  }
}

function renderAssignEntries() {
  const container = document.getElementById('assignEntries');
  container.innerHTML = '';
  assignEntries.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'log-entry-row';
    row.innerHTML = `
      <div class="entry-top">
        <select class="form-select item-select" data-idx="${i}">
          <option value="">选择科目...</option>
          ${practiceItems.map(it => `<option value="${it.item_id}" ${it.item_id == entry.item_id ? 'selected' : ''}>${it.name} (${it.item_id})</option>`).join('')}
        </select>
        <input class="form-input metronome-input" data-idx="${i}" value="${entry.metronome || ''}" placeholder="速度 e.g. ♩=82" style="width:120px;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
        <button class="remove-btn" data-idx="${i}">×</button>
      </div>
      <div class="entry-preset-hint" data-idx="${i}" style="display:none;font-size:12px;color:#8B6914;margin:2px 0 4px"></div>
      <div class="entry-bottom">
        <textarea class="form-textarea" data-idx="${i}" placeholder="每行一条要求，如：
注意口风不要漏气
倒序分句练习">${entry.requirement || ''}</textarea>
      </div>`;
    container.appendChild(row);
  });

  container.querySelectorAll('.item-select').forEach(sel => {
    sel.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      const newId = parseInt(e.target.value);
      const oldId = assignEntries[idx].item_id;
      if (newId) {
        // 防呆: 同科目加两条 → 后端按科目名去重, 提交后只保留最后一条. 提示用户避免误操作丢内容
        const dup = assignEntries.find((en, i) => i !== idx && en.item_id === newId);
        if (dup) {
          const ok = confirm(`「${dup.item}」已添加过，重复添加提交时会覆盖之前的内容（只保留最后一次）。确定要继续吗？`);
          if (!ok) {
            sel.value = oldId ? String(oldId) : '';
            return;
          }
        }
      }
      assignEntries[idx].item_id = newId;
      const item = practiceItems.find(it => it.item_id == e.target.value);
      assignEntries[idx].item = item ? item.name : '';
      // 预设 (B1, 2026-08-09): 选中科目且内容未编辑时, 预填该科目最近一次非空要求
      // 填 requirements + metronome + 标注来源日期
      if (newId && latestRequirements[newId]) {
        const prevPreset = oldId && latestRequirements[oldId] ? (latestRequirements[oldId].requirements || '') : null;
        const prevMetro = oldId && latestRequirements[oldId] ? (latestRequirements[oldId].metronome || '') : null;
        const rowEl = sel.closest('.log-entry-row');
        const ta = rowEl ? rowEl.querySelector('textarea') : null;
        const metroInput = rowEl ? rowEl.querySelector('.metronome-input') : null;
        const hintEl = rowEl ? rowEl.querySelector('.entry-preset-hint') : null;
        const isUntouchedPreset = prevPreset !== null && ta && ta.value === prevPreset;
        const isUntouchedMetro = prevMetro !== null && metroInput && metroInput.value === prevMetro;
        if (ta && (!assignEntries[idx].requirement || isUntouchedPreset)) {
          assignEntries[idx].requirement = latestRequirements[newId].requirements || '';
          ta.value = assignEntries[idx].requirement;
        }
        // 速度预填: 若速度框未手动改过则一并填入
        if (metroInput && (!assignEntries[idx].metronome || isUntouchedMetro)) {
          assignEntries[idx].metronome = latestRequirements[newId].metronome || '';
          metroInput.value = assignEntries[idx].metronome;
        }
        // 来源日期标注
        if (hintEl) {
          const ld = latestRequirements[newId].lesson_date || '';
          const metro = latestRequirements[newId].metronome || '';
          if (ld) {
            hintEl.textContent = '📌 上次 ' + ld + (metro ? ' · ' + metro : '') + ' 已预填';
            hintEl.style.display = 'block';
          } else {
            hintEl.style.display = 'none';
          }
        }
      } else {
        // 无预填数据 → 隐藏 hint
        const rowEl = sel.closest('.log-entry-row');
        const hintEl = rowEl ? rowEl.querySelector('.entry-preset-hint') : null;
        if (hintEl) hintEl.style.display = 'none';
      }
    });
  });
  container.querySelectorAll('.metronome-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      assignEntries[idx].metronome = e.target.value;
    });
  });
  container.querySelectorAll('textarea').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      assignEntries[idx].requirement = e.target.value;
    });
  });
  container.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      assignEntries.splice(idx, 1);
      renderAssignEntries();
    });
  });
}

document.getElementById('addAssignEntryBtn').addEventListener('click', () => {
  assignEntries.push({ item_id: null, item: '', metronome: '', requirement: '' });
  renderAssignEntries();
});

// ── 配图上传 ──
document.getElementById('addAssignImageBtn').addEventListener('click', () => {
  document.getElementById('assignImageInput').click();
});

document.getElementById('assignImageInput').addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files.length) return;
  const statusEl = document.getElementById('assignImageStatus');
  // 前端预检: HEIC/HEIF 直接拦截 (后端同样拒绝; 提前提示省一次请求)
  const unsupported = Array.from(files).filter(f => /\.(heic|heif)$/i.test(f.name || ''));
  if (unsupported.length) {
    statusEl.textContent = `❌ ${unsupported.map(f => f.name).join(', ')}: 不支持 HEIC/HEIF 格式, 请先转为 jpg 或 png 后再上传`;
    e.target.value = '';
    return;
  }
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    statusEl.textContent = `⏳ 上传中 (${i+1}/${files.length})...`;
    const formData = new FormData();
    formData.append('file', f);
    try {
      const res = await fetch('/config/api/assignments/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.ok) {
        assignImages.push({ url: data.url, name: f.name });
        renderAssignImagePreview();
        statusEl.textContent = `✅ ${f.name} 已上传`;
      } else {
        statusEl.textContent = `❌ ${f.name}: ${data.error || '上传失败'}`;
      }
    } catch (err) {
      statusEl.textContent = `❌ ${f.name}: ${err && err.message ? err.message : '网络错误'}`;
    }
  }
  e.target.value = ''; // 允许重复选同一文件
});

function renderAssignImagePreview() {
  const container = document.getElementById('assignImagePreview');
  container.innerHTML = assignImages.map((img, i) => `
    <div style="position:relative;display:inline-block">
      <img src="${img.url}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid #ddd" alt="${img.name}">
      <button onclick="assignImages.splice(${i},1);renderAssignImagePreview()" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:#FF6B6B;color:white;cursor:pointer;font-size:14px;line-height:22px;text-align:center">×</button>
    </div>
  `).join('');
}

// ── 提交老师要求 ──
document.getElementById('submitAssignBtn').addEventListener('click', async () => {
  const lessonDate = document.getElementById('assignDate').value || null;
  const notes = document.getElementById('assignNotes').value;
  const stageStart = document.getElementById('assignStageStart').value || null;
  const stageEnd = document.getElementById('assignStageEnd').value || null;
  const stageOrder = document.getElementById('assignStageOrder').value || null;
  const validEntries = assignEntries.filter(e => e.item_id && e.requirement);

  if (!validEntries.length) {
    alert('请添加至少一个科目要求');
    return;
  }

  const body = {
    lesson_date: lessonDate,
    items: validEntries.map(e => ({ item: e.item, item_id: e.item_id, metronome: e.metronome, requirement: e.requirement })),
    notes,
  };
  if (assignImages.length) body.images = assignImages.map(i => i.url);
  if (stageStart) body.stage_start = stageStart;
  if (stageEnd) body.stage_end = stageEnd;
  if (stageOrder) body.stage_order = parseInt(stageOrder);

  const res = await fetch('/config/api/assignments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.ok) {
    assignEntries = [];
    assignImages = [];
    renderAssignEntries();
    renderAssignImagePreview();
    document.getElementById('assignNotes').value = '';
    document.getElementById('assignStageStart').value = '';
    document.getElementById('assignStageEnd').value = '';
    document.getElementById('assignStageOrder').value = '';
    loadAssignments();
    alert('✅ 老师要求已录入');
  } else {
    alert('❌ ' + (data.error || '录入失败'));
  }
});

async function loadAssignments() {
  const container = document.getElementById('assignmentsList');
  container.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch('/config/api/assignments?weeks=16');
    const data = await res.json();
    if (!data.assignments || !data.assignments.length) {
      container.innerHTML = '<div class="empty-state">暂无老师要求记录</div>';
      return;
    }
    container.innerHTML = data.assignments.map((a, aidx) => {
      const stageLabel = a.stage_order ? `<span class="assignment-stage-pill">第 ${a.stage_order} 期</span>` : '';
      const itemsHtml = a.items.map(it => {
        const reqs = (it.requirements || it.requirement || '').split('\n').filter(Boolean);
        const reqLines = reqs.map(r => `<li>${r}</li>`).join('');
        const metro = it.metronome ? `<span class="assign-subject-metronome" style="display:inline-block;background:#FF6B6B;color:#fff;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;margin-left:6px">${it.metronome}</span>` : '';
        return `<div class="assign-subject">
          <div class="assign-subject-header">
            <span class="assign-subject-name">${it.item}</span>
            ${metro}
            <span class="assign-subject-id">(item_id: ${it.item_id || '?'})</span>
          </div>
          <ul class="assign-subject-reqs">${reqLines || '<li style="opacity:0.5">无具体要求</li>'}</ul>
        </div>`;
      }).join('');
      const imagesHtml = (a.images && a.images.length) ? `<div class="assign-images">${a.images.map(img => `<img src="${img}" alt="配图" style="cursor:pointer" onclick="openImagePreview('${img}')">`).join('')}</div>` : '';
      const notesHtml = a.notes ? `<div class="assignment-notes">${a.notes}</div>` : '';
      return `<div class="assignment-card" data-lesson="${a.lesson_date}">
        <div class="assignment-card-header">
          <div>
            <span class="assignment-date">${a.lesson_date}</span>
            ${stageLabel ? ' ' + stageLabel : ''}
          </div>
          <div class="assignment-card-actions">
            <button class="edit-assign-btn" data-lesson="${a.lesson_date}" title="编辑">✎</button>
            <button class="del-assign-btn" data-lesson="${a.lesson_date}" title="删除">✕</button>
          </div>
        </div>
        <div class="assignment-card-body">
          <div class="assign-subject-container">${itemsHtml}</div>
          ${imagesHtml}
          ${notesHtml}
        </div>
      </div>`;
    }).join('');

    // Bind edit/delete
    container.querySelectorAll('.edit-assign-btn').forEach(btn => {
      btn.addEventListener('click', () => startEditAssignment(btn.dataset.lesson));
    });
    container.querySelectorAll('.del-assign-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteAssignment(btn.dataset.lesson));
    });
  } catch(e) {
    container.innerHTML = '<div class="empty-state">加载失败</div>';
  }
}

async function deleteAssignment(lessonDate) {
  if (!confirm(`真的要删除 ${lessonDate} 的老师要求？`)) return;
  const res = await fetch(`/config/api/assignments/${lessonDate}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.ok) {
    loadAssignments();
  } else {
    alert('❌ ' + (data.error || '删除失败'));
  }
}

function startEditAssignment(lessonDate) {
  const card = document.querySelector(`.assignment-card[data-lesson="${lessonDate}"]`);
  if (!card) return;
  // Toggle: if already editing, close
  if (card.classList.contains('editing')) {
    card.classList.remove('editing');
    card.querySelector('.edit-form')?.remove();
    return;
  }
  // Find the assignment data from API
  fetch('/config/api/assignments?weeks=16').then(r => r.json()).then(data => {
    const a = data.assignments.find(x => x.lesson_date === lessonDate);
    if (!a) return;
    card.classList.add('editing');
    const form = document.createElement('div');
    form.className = 'edit-form';
    form.style.cssText = 'margin-top:12px;padding:12px;background:#f9f9f9;border-radius:10px';
    // Build subject rows
    let itemsRows = '';
    (a.items || []).forEach((it, i) => {
      itemsRows += `<div class="edit-item-row" style="display:flex;gap:6px;margin-bottom:6px">
        <input class="edit-item-name" value="${it.item}" placeholder="科目名" style="flex:1;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
        <input class="edit-item-metro" value="${it.metronome || ''}" placeholder="速度 e.g. ♩=82" style="width:120px;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
        <input class="edit-item-req" value="${it.requirements || it.requirement || ''}" placeholder="要求" style="flex:2;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
      </div>`;
    });
    form.innerHTML = `
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">✏️ 编辑 ${lessonDate}</div>
      <div style="margin-bottom:8px">
        <input id="editNotes" value="${a.notes || ''}" placeholder="老师补充说明" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px">
      </div>
      ${itemsRows}
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="save-edit-btn" style="background:#4CAF50;color:white;border:none;padding:6px 16px;border-radius:6px;cursor:pointer">💾 保存</button>
        <button class="cancel-edit-btn" style="background:#999;color:white;border:none;padding:6px 16px;border-radius:6px;cursor:pointer">取消</button>
      </div>
    `;
    card.appendChild(form);

    form.querySelector('.save-edit-btn').addEventListener('click', async () => {
      const items = Array.from(form.querySelectorAll('.edit-item-row')).map(row => ({
        item: row.querySelector('.edit-item-name').value,
        metronome: row.querySelector('.edit-item-metro').value,
        requirement: row.querySelector('.edit-item-req').value,
      }));
      const notes = form.querySelector('#editNotes').value;
      const res = await fetch(`/config/api/assignments/${lessonDate}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, notes }),
      });
      const d = await res.json();
      if (d.ok) {
        loadAssignments();
      } else {
        alert('❌ ' + (d.error || '保存失败'));
      }
    });
    form.querySelector('.cancel-edit-btn').addEventListener('click', () => {
      card.classList.remove('editing');
      form.remove();
    });
  });
}

// Tab 3: 本周总览
// ══════════════════════════════════════════════════

async function loadWeek() {
  try {
    const res = await fetch('/config/api/practice-week');
    const data = await res.json();

    // 统计
    document.getElementById('weekStats').innerHTML = `
      <span class="badge badge-green">练习 ${data.practice_days}/7 天</span>
      <span class="badge badge-blue">总计 ${data.total_minutes} 分钟</span>
      <span class="badge badge-orange">日均 ${data.practice_days ? Math.round(data.total_minutes / data.practice_days) : 0} 分钟</span>
    `;

    // 日历网格
    const dayNames = ['一', '二', '三', '四', '五', '六', '日'];
    const grid = document.getElementById('weekGrid');
    grid.innerHTML = '';
    const startDate = new Date(data.week_start);

    for (let i = 0; i < 7; i++) {
      const d = new Date(startDate);
      d.setDate(d.getDate() + i);
      const key = d.toISOString().split('T')[0];
      const day = data.days[key] || {};
      const isToday = day.is_today;
      const isFuture = day.is_future;
      const mins = day.total_minutes || 0;

      const cell = document.createElement('div');
      cell.className = `week-day ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}`;
      cell.innerHTML = `
        <div class="day-label">${dayNames[i]}</div>
        <div class="day-date">${d.getMonth()+1}/${d.getDate()}</div>
        <div class="day-minutes ${mins === 0 ? 'zero' : ''}">${isFuture ? '-' : (mins ? mins + "'" : '—')}</div>
      `;
      grid.appendChild(cell);
    }

    // 项目分布
    const bars = document.getElementById('itemBars');
    if (data.item_totals && Object.keys(data.item_totals).length) {
      const total = Object.values(data.item_totals).reduce((a, b) => a + b, 0);
      const sorted = Object.entries(data.item_totals).sort((a, b) => b[1] - a[1]);
      bars.innerHTML = sorted.map(([name, mins]) => {
        const pct = total > 0 ? (mins / total * 100) : 0;
        return `
          <div class="bar-row">
            <span class="bar-label">${name}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bar-value">${mins}' (${pct.toFixed(0)}%)</span>
          </div>
        `;
      }).join('');
    } else {
      bars.innerHTML = '<div class="empty-state">本周暂无练习数据</div>';
    }

    // 老师要求
    const assignCard = document.getElementById('weekAssignmentCard');
    const assignDiv = document.getElementById('weekAssignment');
    if (data.assignment && data.assignment.items && data.assignment.items.length) {
      assignCard.style.display = 'block';
      const a = data.assignment;
      assignDiv.innerHTML = a.items.map(it => {
        const reqs = (it.requirements || it.requirement || '').split('\n').filter(Boolean);
        const reqLines = reqs.map(r => `<li>${r}</li>`).join('');
        const metro = it.metronome ? `<span class="assign-subject-metronome" style="display:inline-block;background:#FF6B6B;color:#fff;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;margin-left:6px">${it.metronome}</span>` : '';
        return `<div class="assign-subject">
          <div class="assign-subject-header">
            <span class="assign-subject-name">${it.item}</span>
            ${metro}
            <span class="assign-subject-id">(item_id: ${it.item_id || '?'})</span>
          </div>
          <ul class="assign-subject-reqs">${reqLines || '<li style="opacity:0.5">无具体要求</li>'}</ul>
        </div>`;
      }).join('') + (
        (a.images && a.images.length) ? `<div class="assign-images">${a.images.map(img => `<img src="${img}" alt="配图" style="cursor:pointer" onclick="openImagePreview('${img}')">`).join('')}</div>` : ''
      ) + (
        a.notes ? `<div class="assignment-notes" style="margin-top:10px">💬 ${a.notes}</div>` : ''
      );
    } else {
      assignCard.style.display = 'none';
    }
  } catch(e) {
    document.getElementById('weekGrid').innerHTML = '<div class="empty-state">加载失败</div>';
  }
}
