<!DOCTYPE html>
<html lang="zh">
<head>
{% include "_favicon.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>盲盒主题 - 竹笛助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --cream: #f5e6d3;
      --sage: #a8d5ba;
      --rose: #e8b4bc;
      --lavender: #c5b8d9;
      --text: #3d3d3d;
      --radius: 20px;
    }

    body {
      background: var(--cream);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .config-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.6);
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: rgba(255,255,255,0.9);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title .icon { font-size: 32px; }

    /* ── 主题卡片网格 ── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .theme-card {
      background: white;
      border-radius: var(--radius);
      padding: 0;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid transparent;
      overflow: hidden;
      position: relative;
    }

    .theme-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.10);
    }

    .theme-card.selected {
      border-color: var(--rose);
      box-shadow: 0 12px 40px rgba(232, 180, 188, 0.35);
    }

    .theme-card.selected::after {
      content: '✓';
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      background: var(--rose);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(232, 180, 188, 0.5);
    }

    .theme-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #f0ebe3;
    }

    .theme-info {
      padding: 20px 22px 22px;
    }

    .theme-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 6px;
    }

    .theme-tag {
      display: inline-block;
      font-size: 12px;
      color: var(--rose);
      background: rgba(232, 180, 188, 0.18);
      padding: 2px 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .theme-desc {
      font-size: 14px;
      color: #7F8C8D;
      line-height: 1.55;
      margin: 0;
    }

    /* ── 保存按钮 ── */
    .save-bar {
      position: sticky;
      bottom: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }

    .save-btn {
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      background: var(--rose);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232, 180, 188, 0.5);
    }

    .save-btn:active { transform: scale(0.97); }

    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { background: var(--sage); }
    .toast.error   { background: #FF6B6B; }

    /* ── 提示信息 ── */
    .info-banner {
      background: rgba(255,255,255,0.6);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #7F8C8D;
      line-height: 1.6;
    }
  </style>
</head>
<body class="has-sidebar">
  {% include "_sidebar.html" %}

  <div class="config-container">
    <!-- 顶部导航 -->
    <div class="top-bar">
      <a href="/config" class="back-link">
        <span>←</span>
        <span>返回配置</span>
      </a>
      <div class="page-title">
        <span class="icon">🎁</span>
        <span>盲盒主题</span>
      </div>
    </div>

    <!-- 说明 -->
    <div class="info-banner">
      选择每周打卡盲盒的故事主题。保存后立即生效，孩子下次进入"成就"页面就会看到新主题。
      所有主题共享同一套 7 天打卡机制（每日 1 块 + 满 7 撒花），仅图片、名称、剧情描述不同。
    </div>

    <!-- 主题网格 -->
    <div class="theme-grid">
      {% for t in themes %}
      <div class="theme-card {% if t.slug == current_theme %}selected{% endif %}"
           data-slug="{{ t.slug }}"
           onclick="selectTheme('{{ t.slug }}')">
        <img class="theme-cover" src="{{ t.cover }}" alt="{{ t.title }}">
        <div class="theme-info">
          <div class="theme-title">{{ t.title }}</div>
          <div class="theme-tag">{{ t.tag }}</div>
          <p class="theme-desc">{{ t.desc }}</p>
        </div>
      </div>
      {% endfor %}
    </div>

    <!-- 保存栏 -->
    <div class="save-bar">
      <button class="save-btn" id="saveBtn" onclick="saveTheme()">保存</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let selectedSlug = '{{ current_theme }}';

    function selectTheme(slug) {
      selectedSlug = slug;
      document.querySelectorAll('.theme-card').forEach(card => {
        card.classList.toggle('selected', card.dataset.slug === slug);
      });
    }

    async function saveTheme() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '保存中…';

      try {
        const pin = localStorage.getItem('config_pin') || '';
        const res = await fetch('/config/api/blindbox/theme', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin, theme: selectedSlug })
        });
        const data = await res.json();
        if (data.ok) {
          showToast('success', '已切换到「' + selectedSlug + '」');
        } else {
          showToast('error', data.error || '保存失败');
        }
      } catch (err) {
        showToast('error', '保存失败');
      } finally {
        btn.disabled = false;
        btn.textContent = '保存';
      }
    }

    function showToast(type, message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // PIN 验证检查
    const savedPin = localStorage.getItem('config_pin');
    const needsPin = '{{ pin_locked | default("false") }}' === 'true';
    if (needsPin && !savedPin) {
      window.location.href = '/config';
    }

    // 入场动画
    gsap.fromTo('.theme-card',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.45, stagger: 0.08, ease: 'back.out(1.6)' }
    );
    gsap.fromTo('.top-bar',
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }
    );
  </script>
</body>
</html>
