[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dizical"
version = "0.1.0"
authors = [
  { name="mariusiaowego" }
]
description = "dizi + cal = dizical (笛卡尔) 竹笛课程管理助手"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "typer>=0.9.0",
  "rich>=13.0.0",
  "chinese-calendar>=1.8.0",
  "python-dateutil>=2.8.2",
  "python-dotenv>=1.0.0",
  "cos-python-sdk-v5>=1.9.44",
]

[dependency-groups]
# Sprint 09 (2026-08-05): 测试依赖锁进 group, uv sync --group dev 一次装齐.
# 之前靠 `uv run --with ...` 临时带, 导致 cli_ux_review 等 8 个测试因缺 uvicorn/textual 等依赖 collection ERROR.
dev = [
  "pytest>=8.0.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "pymysql>=1.1.0",
  "httpx>=0.24.0",
  "python-multipart>=0.0.6",
  "DBUtils>=3.0.0",
  "jinja2>=3.1.0",
  "textual>=0.60.0",
  "Pillow>=10.0.0",
  "requests>=2.31.0",
  "wcwidth>=0.2.0",
  "holidays>=0.40",
]

[project.scripts]
dizical = "src.cli:app"
dizical-kid = "src.kid_app.__main__:kid_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
